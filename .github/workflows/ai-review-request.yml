name: AI review round

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      operation:
        description: Request, reconcile a response/UI request, close, or adopt existing history
        required: true
        default: request
        type: choice
        options: [request, reconcile, close, adopt]
      expected_round:
        description: Next round for request; current round otherwise; prior count for adopt
        required: true
        type: number
      reason:
        description: Risk rationale or evidence-backed reconciliation/closure assessment
        required: true
        type: string
      evidence:
        description: GitHub URL of reconciliation, failure, actual effort, or closure evidence
        type: string
      finding_severity:
        description: Verified severity justifying another review (required from round 3)
        default: none
        type: choice
        options: [none, medium, high, critical]
      finding_url:
        description: GitHub URL of the remaining finding or material uncertainty
        type: string
      outcome:
        description: Reconcile/adopt outcome; missing responses are never completed
        default: completed
        type: choice
        options: [completed, failed, not_sent]
      review_id:
        description: Native provider review ID; omit for a clean Codex reaction or response comment
        type: string
      observed_effort:
        description: Actual Copilot effort observed in the linked overview/timeline evidence
        default: none
        type: choice
        options: [none, lite, balanced]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Irrelevant labels must not displace a queued managed request.
  group: >-
    ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{
      github.event.action == 'labeled' && github.event.label.name != 'workflow:managed' &&
      github.event.label.name != 'review:copilot-lite' &&
      github.event.label.name != 'review:copilot-balanced' &&
      github.event.label.name != 'review:codex' && github.run_id || 'managed' }}
  cancel-in-progress: false

jobs:
  review:
    name: Manage one provider and numbered review rounds
    if: >-
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event.action != 'labeled' || github.event.label.name == 'workflow:managed' ||
       github.event.label.name == 'review:copilot-lite' ||
       github.event.label.name == 'review:copilot-balanced' ||
       github.event.label.name == 'review:codex')
    runs-on: ubuntu-latest
    steps:
      # No checkout: PR code never executes with this job's write token.
      - uses: actions/github-script@v7
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const explicit = context.eventName === 'workflow_dispatch';
            const input = explicit ? context.payload.inputs : {};
            const number = Number(explicit ? input.pr_number : context.payload.pull_request.number);
            const operation = explicit ? input.operation : 'request';
            const expected = Number(input.expected_round);
            const actor = process.env.TRIGGERING_ACTOR || context.actor;
            const fail = message => { throw new Error(message); };
            const note = message => core.notice(message);
            const knownProfiles = ['copilot-lite', 'copilot-balanced', 'codex'];
            const states = ['reserved', 'awaiting_ui', 'requested', 'uncertain', 'completed', 'failed', 'closed'];
            const isCodex = user => user?.type === 'Bot' &&
              user.login === 'chatgpt-codex-connector[bot]';
            const isCopilot = user => user?.type === 'Bot' &&
              user.login === 'copilot-pull-request-reviewer[bot]';
            const isAI = user => isCodex(user) || isCopilot(user);
            const isWorkflow = user => user?.type === 'Bot' && user.login === 'github-actions[bot]';
            const safeText = value => String(value || '').replace(/@/g, '@\u200b').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const validURL = value => {
              try {
                const url = new URL(value);
                return url.protocol === 'https:' && url.hostname === 'github.com' &&
                  !url.username && !url.password &&
                  url.pathname.startsWith(`/${owner}/${repo}/`);
              } catch { return false; }
            };
            if (!Number.isSafeInteger(number) || number < 1) fail('Invalid PR number.');
            if (!['request', 'reconcile', 'close', 'adopt'].includes(operation)) fail('Invalid operation.');
            if (explicit) {
              if (!Number.isSafeInteger(expected) || expected < 1) fail('expected_round must be positive.');
              for (const username of new Set([context.actor, actor])) {
                const {data} = await github.rest.repos.getCollaboratorPermissionLevel({owner, repo, username});
                if (!['write', 'maintain', 'admin'].includes(data.permission)) fail('A repository writer must dispatch or rerun this operation.');
              }
            }
            const getPR = async () => (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            const pr = await getPR();
            const labels = pr.labels.map(label => label.name);
            if (pr.state !== 'open' || pr.draft || !labels.includes('workflow:managed')) {
              if (explicit) fail('PR must be open, ready, and workflow:managed.');
              return note('No managed ready PR; no review requested.');
            }
            const selected = knownProfiles.filter(profile => labels.includes(`review:${profile}`));
            if (selected.length !== 1) {
              if (!explicit && selected.length === 0) return note('Select exactly one review provider before requesting.');
              fail('Exactly one review:copilot-lite, review:copilot-balanced, or review:codex label is required.');
            }
            const profile = selected[0];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const ledger = [];
            for (const comment of comments.filter(comment => isWorkflow(comment.user))) {
              if (!comment.body?.includes('<!-- ai-review-state:v1:')) continue;
              const match = comment.body.match(/^<!-- ai-review-state:v1:([A-Za-z0-9+/=]+) -->$/m);
              if (!match) fail('Malformed review state; reconcile the record before requesting.');
              let state;
              try { state = JSON.parse(Buffer.from(match[1], 'base64').toString('utf8')); }
              catch { fail('Unreadable review state; do not reset review history.'); }
              if (state.version !== 1 || state.pr !== number ||
                  !Number.isSafeInteger(state.round) || state.round < 1 ||
                  !Number.isSafeInteger(state.attempt) || state.attempt < 1 ||
                  !knownProfiles.includes(state.profile) || !states.includes(state.status)) {
                fail('Invalid review state; do not reset review history.');
              }
              ledger.push({...state, comment_id: comment.id});
            }
            ledger.sort((a, b) => a.comment_id - b.comment_id);
            for (let i = 1; i < ledger.length; i++) {
              if (ledger[i].round < ledger[i - 1].round) fail('Review round history moved backwards.');
            }
            const last = ledger.at(-1);
            if (last && !explicit) return note(`Round ${last.round} is ${last.status}; automatic events never start another round.`);
            // Reconciliation may append newer records; a rerun must remain inert across the entire ledger.
            if (ledger.some(row => row.run_id === String(context.runId) && row.operation === operation)) {
              return note('This workflow run already recorded this operation; use a fresh dispatch if another operation is justified.');
            }
            const nativeHistory = reviews.some(review => isAI(review.user)) || comments.some(comment =>
              isAI(comment.user) || /@codex\s+review\b/.test(comment.body || '') ||
              /<!-- ai-review-(?:round|copilot|codex)-/.test(comment.body || ''));
            if (!last && nativeHistory && operation !== 'adopt') {
              if (!explicit) return note('Existing AI review history requires adoption; no initial review replayed.');
              fail('Adopt the existing review history before requesting or closing.');
            }
            const reason = String(input.reason || pr.body?.match(/^\*\*Review rationale:\*\*\s*(.+)$/m)?.[1] || '').trim();
            if (reason.length < 20 || /\{\{|\}\}/.test(reason)) fail('Record a concrete review rationale or reconciliation assessment (20+ characters).');
            const evidence = String(input.evidence || '').trim();
            if (explicit && (operation !== 'request' || last) && !validURL(evidence)) {
              fail('Link the reconciliation evidence in this GitHub repository.');
            }
            const pending = pr.requested_reviewers?.some(isAI);
            const write = async state => {
              const record = {...state, version: 1, pr: number, actor, operation,
                run_id: String(context.runId), recorded_at: new Date().toISOString(), reason, evidence};
              delete record.comment_id;
              const marker = Buffer.from(JSON.stringify(record)).toString('base64');
              const guidance = record.status === 'awaiting_ui'
                ? record.profile === 'codex'
                  ? 'A personal GitHub account with repository write access must post the Codex review trigger once for this reserved round/attempt and base/head. Follow GITHUB_WORKFLOW.md; bots only record state. Reconcile the response before requesting again.'
                  : `Request **${record.profile}** once in the Reviewers UI, then reconcile the provider response and actual effort. Do not request another provider.`
                : record.status === 'uncertain'
                ? 'Delivery is uncertain. Inspect the request and provider before explicitly reconciling; do not resend.'
                : record.status === 'closed'
                ? 'Root recorded verified closure. Required current checks, approvals, and the final merge audit still apply.'
                : record.round >= 3 ? 'Defect-only phase: only confirmed High/Critical findings justify further work.'
                : 'Medium findings and small in-scope improvements are optional.';
              const {data} = await github.rest.issues.createComment({owner, repo, issue_number: number,
                body: `AI review round **${record.round}**, attempt **${record.attempt}**: **${record.status}** (${record.profile}).\n\n${guidance}\n\nReviewed/requested base: \`${record.base_sha || 'legacy: not established'}\`; head: \`${record.head_sha || 'legacy: not established'}\`.\n\nReason: ${safeText(reason)}\n\nEvidence: ${safeText(evidence || 'initial risk rationale')}\n\n<!-- ai-review-state:v1:${marker} -->`});
              return {...record, comment_id: data.id};
            };
            const assertSnapshot = async () => {
              const fresh = await getPR();
              const selectors = fresh.labels.filter(label => knownProfiles.some(p => label.name === `review:${p}`));
              if (fresh.state !== 'open' || fresh.draft ||
                  !fresh.labels.some(label => label.name === 'workflow:managed') ||
                  selectors.length !== 1 || selectors[0].name !== `review:${profile}` ||
                  fresh.head.sha !== pr.head.sha || fresh.base.sha !== pr.base.sha) {
                fail('PR state, selection, base, or head changed. Reinspect before another operation.');
              }
              return fresh;
            };
            const verifyResponse = async (state, adopting = false) => {
              let request;
              let requestInfo = {};
              if (profile === 'codex' && state.request_mode === 'personal') {
                const matches = comments.filter(comment =>
                  comment.body?.split(/\r?\n/).includes(state.request_marker) &&
                  /^@codex review(?:\r?\n|$)/.test(comment.body));
                if (matches.length !== 1) fail('Exactly one personal Codex request must match this reserved attempt.');
                request = matches[0];
                const prompt = `Review round ${state.round}; base ${state.base_sha}, head ${state.head_sha}.`;
                const constraints = state.round >= 3
                  ? 'Only confirmed High/Critical bugs, missing or incorrect agreed requirements, and material defects. Exclude enhancements, Medium feedback, and minor improvements.'
                  : 'Prioritize confirmed defects. Medium feedback is optional and never blocks completion.';
                if (request.user?.type !== 'User' ||
                    !request.body.includes(prompt) || !request.body.includes(constraints) ||
                    !request.body.includes('Follow GITHUB_WORKFLOW.md for severity and verified closure.') ||
                    !Number.isFinite(Date.parse(request.created_at)) ||
                    !Number.isFinite(Date.parse(request.updated_at || request.created_at)) ||
                    !Number.isFinite(Date.parse(state.opened_at)) || request.id <= state.comment_id ||
                    Date.parse(request.created_at) < Math.floor(Date.parse(state.opened_at) / 1000) * 1000) {
                  fail('Codex request must be personal, timely, and bound to the reserved base/head.');
                }
                const {data: permission} = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: request.user.login,
                });
                if (!['write', 'maintain', 'admin'].includes(permission.permission)) {
                  fail('Codex request author must have repository write access.');
                }
                requestInfo = {request_comment_id: request.id, request_author: request.user.login,
                  request_url: request.html_url};
              }
              if (input.review_id) {
                const id = Number(input.review_id);
                if (!Number.isSafeInteger(id) || id < 1) fail('Invalid provider review ID.');
                const review = reviews.find(candidate => candidate.id === id);
                const providerMatches = profile === 'codex' ? isCodex(review?.user) : isCopilot(review?.user);
                const earliest = request ? (request.updated_at || request.created_at) : state.opened_at;
                if (!review || !providerMatches || !review.submitted_at || review.state === 'PENDING' ||
                    (!adopting && (review.commit_id !== state.head_sha ||
                     !Number.isFinite(Date.parse(review.submitted_at)) ||
                     Date.parse(review.submitted_at) < Date.parse(earliest)))) {
                  fail('Review author, submission time, or commit does not match this round/head.');
                }
                if (ledger.some(row => row.review_id === id && row.round !== state.round)) {
                  fail('Provider review already belongs to another round.');
                }
                if (profile.startsWith('copilot-') && input.observed_effort !== profile.slice('copilot-'.length)) {
                  fail('Record actual Copilot effort from the overview/timeline; mismatches require diagnosis.');
                }
                return {...requestInfo, review_id: id, head_sha: review.commit_id,
                  reviewed_head_sha: review.commit_id,
                  observed_effort: profile === 'codex' ? null : input.observed_effort,
                  response_url: review.html_url};
              }
              if (profile !== 'codex') fail('Copilot completion requires review_id and observed_effort.');
              if (!request) request = comments.find(comment => isWorkflow(comment.user) &&
                comment.body?.includes(state.request_marker || '\u0000'));
              if (adopting) {
                const id = Number(new URL(evidence).hash.match(/^#issuecomment-(\d+)$/)?.[1]);
                request = comments.find(comment => comment.id === id && /@codex\s+review\b/.test(comment.body || ''));
              }
              if (!request) fail('A matching Codex request is needed to verify its response.');
              const responseId = Number(new URL(evidence).hash.match(/^#issuecomment-(\d+)$/)?.[1]);
              const response = comments.find(comment => comment.id === responseId && isCodex(comment.user));
              const reportedCommit = response?.body?.match(/\*\*Reviewed commit:\*\*\s*`([a-f0-9]{10,40})`/)?.[1];
              const requestTime = Date.parse(request.updated_at || request.created_at);
              if (!Number.isFinite(requestTime)) fail('Codex request timestamp is invalid.');
              if (state.head_sha && response?.body?.startsWith("Codex Review: Didn't find any major issues.") &&
                  reportedCommit && state.head_sha.startsWith(reportedCommit) &&
                  Number.isFinite(Date.parse(response.created_at)) &&
                  Date.parse(response.created_at) >= requestTime) {
                return {...requestInfo, response_comment_id: response.id, response_url: response.html_url,
                  clean_response_comment: true, reported_commit: reportedCommit,
                  reviewed_head_sha: state.head_sha};
              }
              if (evidence !== request.html_url) fail('Link the matched Codex request as clean-reaction evidence.');
              const reactions = await github.paginate(github.rest.reactions.listForIssueComment, {
                owner, repo, comment_id: request.id, per_page: 100,
              });
              if (!adopting && (pr.head.sha !== state.head_sha || pr.base.sha !== state.base_sha)) {
                fail('A clean reaction cannot establish review of a changed base/head; use a commit-bound response.');
              }
              if (!reactions.some(reaction => isCodex(reaction.user) && reaction.content === '+1' &&
                  Number.isFinite(Date.parse(reaction.created_at)) &&
                  Date.parse(reaction.created_at) >= requestTime)) {
                fail('No matching clean Codex response; missing/eyes reactions are not completion.');
              }
              return {...requestInfo, response_url: request.html_url, clean_reaction: true};
            };
            if (operation === 'adopt') {
              if (last || !nativeHistory || pending) fail('Adoption needs existing unadopted history and no outstanding native review request.');
              const minimum = Math.max(2, new Set(reviews.filter(review => isAI(review.user)).map(review => review.commit_id)).size);
              if (expected < minimum) fail(`Adoption must preserve at least ${minimum} prior rounds; count actual request cycles in the evidence.`);
              if (!['completed', 'failed', 'not_sent'].includes(input.outcome)) fail('Invalid adoption outcome.');
              const state = {round: expected, attempt: 1, profile, base_sha: null,
                head_sha: null, opened_at: new Date().toISOString(), adopted: true};
              const response = input.outcome === 'completed' ? await verifyResponse(state, true) : {};
              await assertSnapshot();
              await write({...state, ...response, status: input.outcome === 'completed' ? 'completed' : 'failed',
                adoption_base_sha: pr.base.sha, outcome: input.outcome});
              return;
            }
            if (operation === 'close' || operation === 'reconcile') {
              if (!last || expected !== last.round) fail('expected_round must match the existing current round.');
              if (profile !== last.profile) fail('Reconcile/close the original provider before changing selection.');
              if (operation === 'close') {
                if (!['completed', 'closed'].includes(last.status) || pending) fail('Closure requires a completed review, no outstanding native request, and root verification.');
                await assertSnapshot();
                await write({...last, status: 'closed', closure_base_sha: pr.base.sha, closure_head_sha: pr.head.sha});
                return;
              }
              if (['completed', 'closed'].includes(last.status)) return note('Response already reconciled; request another round only if justified, or close.');
              if (!['completed', 'failed', 'not_sent'].includes(input.outcome)) fail('Invalid reconciliation outcome.');
              if (pending && input.outcome !== 'completed') fail('A native review request is still outstanding; reconcile its terminal outcome first.');
              if (input.outcome === 'not_sent' && comments.some(comment =>
                  /@codex\s+review\b/.test(comment.body || '') &&
                  comment.body?.includes(last.request_marker || '\u0000'))) {
                fail('A Codex request was posted; reconcile its actual terminal outcome instead of not_sent.');
              }
              const response = input.outcome === 'completed' ? await verifyResponse(last) : {};
              await assertSnapshot();
              await write({...last, ...response, status: input.outcome === 'completed' ? 'completed' : 'failed', outcome: input.outcome});
              return;
            }
            if (last && !['completed', 'failed', 'closed'].includes(last.status)) {
              fail('An outstanding/uncertain request must be reconciled before either provider is requested.');
            }
            if (pending) fail('A native AI review is already pending; do not issue another request.');
            const retry = last?.status === 'failed' && !last.adopted;
            const round = last ? last.round + (retry ? 0 : 1) : 1;
            if (explicit && expected !== round) fail(`expected_round must be ${round}; another operation may have advanced the PR.`);
            const severity = input.finding_severity || 'none';
            const finding = String(input.finding_url || '').trim();
            if (round >= 3) {
              if (!['high', 'critical'].includes(severity) || !validURL(finding)) {
                fail('Round 3 onward requires a confirmed High/Critical finding or material uncertainty, linked with its reconciliation evidence.');
              }
              if (!retry && ledger.some(row => row.finding_url === finding && row.evidence === evidence && row.head_sha === pr.head.sha)) {
                fail('Repeated finding without changed evidence or code requires diagnosis, not another review.');
              }
            }
            const attempt = retry ? last.attempt + 1 : 1;
            const priorCopilot = [...ledger].reverse().find(row => row.profile.startsWith('copilot-'));
            const needsUI = profile === 'codex' || profile === 'copilot-balanced' ||
              (profile === 'copilot-lite' && priorCopilot && priorCopilot.profile !== profile);
            const marker = `<!-- ai-review-request:v1:${number}:${round}:${attempt} -->`;
            await assertSnapshot();
            let state = await write({round, attempt, profile, status: needsUI ? 'awaiting_ui' : 'reserved',
              base_sha: pr.base.sha, head_sha: pr.head.sha, opened_at: new Date().toISOString(),
              request_mode: profile === 'codex' ? 'personal' : 'native',
              finding_severity: severity, finding_url: finding, request_marker: marker});
            if (needsUI) return;
            try {
              const fresh = await assertSnapshot();
              if (fresh.requested_reviewers?.some(isAI)) fail('A native AI request appeared before dispatch.');
              const {data: bot} = await github.rest.users.getByUsername({username: 'copilot-pull-request-reviewer[bot]'});
              if (!isCopilot(bot) || !bot.node_id) fail('Copilot identity is unavailable.');
              await github.graphql(`mutation($pr: ID!, $bot: ID!) {
                requestReviews(input: {pullRequestId: $pr, botIds: [$bot], union: true}) { pullRequest { id } }
              }`, {pr: pr.node_id, bot: bot.node_id});
              await write({...state, status: 'requested'});
            } catch (error) {
              // A network error can occur after a remote send. Never retry it blindly.
              await write({...state, status: 'uncertain'});
              throw error;
            }
