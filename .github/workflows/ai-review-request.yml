name: AI review milestone

on:
  pull_request_target:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      milestone:
        description: Review milestone
        required: true
        default: final
        type: choice
        options: [initial, final]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

# Keep the repository Copilot review default at Lite. Select Balanced in the
# Reviewers UI only for security-sensitive or cross-subsystem milestones.
jobs:
  resolve:
    name: Resolve managed milestone
    runs-on: ubuntu-latest
    outputs:
      request: ${{ steps.resolve.outputs.request }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      milestone: ${{ steps.resolve.outputs.milestone }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const dispatched = context.eventName === "workflow_dispatch";
            const number = dispatched
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number;
            const milestone = dispatched ? context.payload.inputs.milestone : "initial";
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: number,
            });
            const labels = pr.labels.map(label => label.name);
            const triggerIsManaged = dispatched ||
              context.payload.action === "ready_for_review" ||
              context.payload.label?.name === "workflow:managed";
            let request = triggerIsManaged && labels.includes("workflow:managed") &&
              pr.state === "open" && !pr.draft;

            if (request) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              const marker = `<!-- ai-review-milestone:${milestone}:${pr.head.sha} -->`;
              request = !comments.some(comment => comment.body?.includes(marker));
            }

            core.setOutput("request", String(request));
            core.setOutput("pr_number", String(number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("milestone", milestone);

  mark:
    name: Mark current-head milestone
    needs: resolve
    if: needs.resolve.outputs.request == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          MILESTONE: ${{ needs.resolve.outputs.milestone }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const short = process.env.HEAD_SHA.slice(0, 12);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `AI review milestone **${process.env.MILESTONE}** opened for \`${short}\`.\n\n<!-- ai-review-milestone:${process.env.MILESTONE}:${process.env.HEAD_SHA} -->`,
            });

  request-copilot:
    name: Request Copilot review
    needs: [resolve, mark]
    if: needs.resolve.outputs.request == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
              reviewers: ["copilot-pull-request-reviewer[bot]"],
            });

  request-codex:
    name: Request Codex review
    needs: [resolve, mark]
    if: needs.resolve.outputs.request == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          MILESTONE: ${{ needs.resolve.outputs.milestone }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `@codex review\n\nMilestone: ${process.env.MILESTONE}.`,
            });
