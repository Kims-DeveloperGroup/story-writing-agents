    "affected": {
      "name": "Affected existing canonical IDs",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONPATH": "src",
        "SOURCE_SHA": "086c1ede699ebeda766cf260721b6548d3a1688d",
        "SELECTED_IDS": "[\"tests.test_lead_orchestration.LeadOutcomeAndProposalTests.test_front_schema_is_minimal_closed_and_provider_strict\"]"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "086c1ede699ebeda766cf260721b6548d3a1688d"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Verify source and hardware; run exact IDs",
          "shell": "bash",
          "run": "git config --global user.name 'Story Tests'\ngit config --global user.email 'story-tests@example.invalid'\n.venv/bin/python - <<'CHECKS'\nimport gc,hashlib,json,os,platform,resource,subprocess,sys,time\nfrom pathlib import Path\nout=Path(os.environ['RUNNER_TEMP'])/'issue874-affected';out.mkdir()\nsource=os.environ['SOURCE_SHA']\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source\nassert platform.system()=='Linux' and platform.machine()=='aarch64'\nassert len(os.sched_getaffinity(0))==4 and sys.version_info[:2]==(3,11)\nassert gc.isenabled() and gc.get_threshold()==(700,10,10) and not gc.callbacks and sys.getprofile() is None\npaths=subprocess.check_output(['git','ls-files','-z']).split(bytes([0]))\ndef manifest():\n    return {os.fsdecode(p):hashlib.sha256(Path(os.fsdecode(p)).read_bytes()).hexdigest() for p in paths if p and Path(os.fsdecode(p)).is_file()}\nbefore=manifest();(out/'source-before.json').write_text(json.dumps(before,sort_keys=True))\n(out/'hardware.json').write_text(json.dumps(dict(source_sha=source,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],python=platform.python_version(),system=platform.system(),machine=platform.machine(),affinity=sorted(os.sched_getaffinity(0)),gc_thresholds=gc.get_threshold()),indent=2))\nids=json.loads(os.environ['SELECTED_IDS']);(out/'selected-ids.json').write_text(json.dumps(ids,indent=2))\ncommand=[sys.executable,'-c','import json,runpy,sys,traceback\\nfrom story_writing_agents.agent_context.service import context_provider_failure_facts\\ntarget=context_provider_failure_facts.__code__\\nprevious=sys.getprofile()\\ndef observe(frame,event,result):\\n    if event==\"call\" and frame.f_code is target:\\n        failure=frame.f_locals[\"failure\"];chain=[];seen=set()\\n        while failure is not None and id(failure) not in seen and len(chain)<6:\\n            seen.add(id(failure));chain.append(dict(type=type(failure).__name__,message=str(failure)[:800],frames=[dict(file=x.filename.rsplit(\"/\",1)[-1],function=x.name,line=x.lineno) for x in traceback.extract_tb(failure.__traceback__)]))\\n            failure=failure.__cause__ or failure.__context__\\n        print(\"BOOTSTRAP_EXCEPTION \"+json.dumps(chain),flush=True)\\nsys.argv=[\"tests.runner\",*sys.argv[1:]]\\nsys.setprofile(observe)\\ntry:runpy.run_module(\"tests.runner\",run_name=\"__main__\")\\nfinally:sys.setprofile(previous)\\n','run']\nfor identifier in ids:command.extend(['--id',identifier])\ncommand.extend(['--json',str(out/'affected.json')])\nstart=time.monotonic();usage=resource.getrusage(resource.RUSAGE_CHILDREN)\nwith (out/'affected.log').open('w') as log:\n    try: status=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=2700).returncode\n    except subprocess.TimeoutExpired: status=124\nwall=time.monotonic()-start;end=resource.getrusage(resource.RUSAGE_CHILDREN);after=manifest()\n(out/'source-after.json').write_text(json.dumps(after,sort_keys=True))\nreceipt=dict(command=command,exit_code=status,wall_seconds=wall,cpu_seconds=end.ru_utime+end.ru_stime-usage.ru_utime-usage.ru_stime,source_unchanged=before==after)\n(out/'execution.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))\nprint((out/'affected.log').read_text()[-20000:])\nassert before==after,'Tracked source changed during verification'\nsys.exit(status)\nCHECKS\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "timeout-minutes": 1,
          "with": {
            "name": "issue874-affected",
            "path": "${{ runner.temp }}/issue874-affected/"
          }
        }
      ]
    }
