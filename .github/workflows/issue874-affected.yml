          "name": "Verify source and hardware; run exact IDs",
          "shell": "bash",
          "run": "git config --global user.name 'Story Tests'\ngit config --global user.email 'story-tests@example.invalid'\n.venv/bin/python - <<'CHECKS'\nimport gc,hashlib,json,os,platform,resource,subprocess,sys,time\nfrom pathlib import Path\nout=Path(os.environ['RUNNER_TEMP'])/'issue874-affected';out.mkdir()\nsource=os.environ['SOURCE_SHA']\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source\nassert platform.system()=='Linux' and platform.machine()=='aarch64'\nassert len(os.sched_getaffinity(0))==4 and sys.version_info[:2]==(3,11)\nassert gc.isenabled() and gc.get_threshold()==(700,10,10) and not gc.callbacks and sys.getprofile() is None\npaths=subprocess.check_output(['git','ls-files','-z']).split(bytes([0]))\ndef manifest():\n    return {os.fsdecode(p):hashlib.sha256(Path(os.fsdecode(p)).read_bytes()).hexdigest() for p in paths if p and Path(os.fsdecode(p)).is_file()}\nbefore=manifest();(out/'source-before.json').write_text(json.dumps(before,sort_keys=True))\n(out/'hardware.json').write_text(json.dumps(dict(source_sha=source,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],python=platform.python_version(),system=platform.system(),machine=platform.machine(),affinity=sorted(os.sched_getaffinity(0)),gc_thresholds=gc.get_threshold()),indent=2))\nids=json.loads(os.environ['SELECTED_IDS']);(out/'selected-ids.json').write_text(json.dumps(ids,indent=2))\ncommand=[sys.executable,'-m','tests.runner','run']\nfor identifier in ids:command.extend(['--id',identifier])\ncommand.extend(['--json',str(out/'affected.json')])\nstart=time.monotonic();usage=resource.getrusage(resource.RUSAGE_CHILDREN)\nwith (out/'affected.log').open('w') as log:\n    try: status=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=2700).returncode\n    except subprocess.TimeoutExpired: status=124\nwall=time.monotonic()-start;end=resource.getrusage(resource.RUSAGE_CHILDREN);after=manifest()\n(out/'source-after.json').write_text(json.dumps(after,sort_keys=True))\nreceipt=dict(command=command,exit_code=status,wall_seconds=wall,cpu_seconds=end.ru_utime+end.ru_stime-usage.ru_utime-usage.ru_stime,source_unchanged=before==after)\n(out/'execution.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))\nprint((out/'affected.log').read_text()[-20000:])\nassert before==after,'Tracked source changed during verification'\nsys.exit(status)\nCHECKS\n"
        },
