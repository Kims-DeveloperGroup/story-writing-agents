          }
        },
        {
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Verify source and hardware; run exact IDs",
          "shell": "bash",
          "run": "git config --global user.name 'Story Tests'\ngit config --global user.email 'story-tests@example.invalid'\n.venv/bin/python - <<'CHECKS'\nimport gc,hashlib,json,os,platform,resource,subprocess,sys,time\nfrom pathlib import Path\nout=Path(os.environ['RUNNER_TEMP'])/'issue874-affected';out.mkdir()\nsource=os.environ['SOURCE_SHA']\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source\nassert platform.system()=='Linux' and platform.machine()=='aarch64'\nassert len(os.sched_getaffinity(0))==4 and sys.version_info[:2]==(3,11)\nassert gc.isenabled() and gc.get_threshold()==(700,10,10) and not gc.callbacks and sys.getprofile() is None\npaths=subprocess.check_output(['git','ls-files','-z']).split(bytes([0]))\ndef manifest():\n    return {os.fsdecode(p):hashlib.sha256(Path(os.fsdecode(p)).read_bytes()).hexdigest() for p in paths if p and Path(os.fsdecode(p)).is_file()}\nbefore=manifest();(out/'source-before.json').write_text(json.dumps(before,sort_keys=True))\n(out/'hardware.json').write_text(json.dumps(dict(source_sha=source,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],python=platform.python_version(),system=platform.system(),machine=platform.machine(),affinity=sorted(os.sched_getaffinity(0)),gc_thresholds=gc.get_threshold()),indent=2))\nids=json.loads(os.environ['SELECTED_IDS']);(out/'selected-ids.json').write_text(json.dumps(ids,indent=2))\ncommand=[sys.executable,'-c',\"import json,os,runpy,sys,traceback,threading\\nfrom pathlib import Path\\nfrom story_writing_agents.agent_context.service import BoundCallContract,context_provider_failure_facts\\nfrom story_writing_agents.orchestrator import StoryRuntime\\nfrom tests.test_lead_orchestration import LeadOrchestrationTestCase\\nbind_target=getattr(BoundCallContract.bind,'__func__',BoundCallContract.bind).__code__\\nhelper_target=LeadOrchestrationTestCase._require_fixture_field_neighbors.__code__\\nfailure_targets=(context_provider_failure_facts.__code__,StoryRuntime._close_failed_lead_attempt.__code__)\\nprevious=sys.getprofile();previous_thread=threading.getprofile();captured=0\\nout=Path(os.environ['RUNNER_TEMP'])/'issue874-affected'\\ndef save(name,value):\\n    (out/name).write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':')))\\ndef error(failure):\\n    return dict(type=type(failure).__name__,message=str(failure),frames=[dict(file=x.filename.rsplit('/',1)[-1],function=x.name,line=x.lineno) for x in traceback.extract_tb(failure.__traceback__)])\\ndef observe(frame,event,result):\\n    global captured\\n    try:\\n        if event=='return' and frame.f_code is bind_target and isinstance(result,BoundCallContract) and captured<2:\\n            captured+=1;stem='bootstrap-call-'+str(captured)\\n            save(stem+'-entry.json',dict(capture=captured,owner_type=type(result.semantic_index).__name__))\\n            rows=[]\\n            for member,owner in zip(result.semantic_index.contracts,result.semantic_index.owners,strict=True):\\n                variant=getattr(owner,'variant',None)\\n                row=dict(schema_id=member.schema_id,owner_type=type(owner).__name__,branch_key=getattr(variant,'branch_key',None),variant_contract_id=getattr(variant,'contract_id',None),logical_schema=json.loads(member.rule_graph.canonical_bytes))\\n                try: row['native_schema']=member.rule_graph.provider_projection().schema_value()\\n                except Exception as failure: row['native_capture_error']=error(failure)\\n                rows.append(row);save(stem+'-members.json',rows)\\n            save(stem+'-logical.json',json.loads(result.rule_graph.canonical_bytes))\\n            save(stem+'-semantic.json',json.loads(result.semantic_index.rule_graph.canonical_bytes))\\n            try: save(stem+'-native.json',result.rule_graph.provider_projection().schema_value())\\n            except Exception as failure:save(stem+'-native-capture-error.json',error(failure))\\n            print('BOUNDED_SCHEMA_CAPTURE '+json.dumps(dict(capture=captured,members=len(rows),logical_bytes=len(result.rule_graph.canonical_bytes),semantic_bytes=len(result.semantic_index.rule_graph.canonical_bytes))),flush=True)\\n        if event=='call' and frame.f_code in failure_targets and isinstance(frame.f_locals.get('failure'),BaseException):\\n            failure=frame.f_locals['failure'];save('bootstrap-exception.json',error(failure));print('BOOTSTRAP_EXCEPTION '+json.dumps(error(failure)),flush=True)\\n    except Exception as failure:\\n        save('inspection-error.json',error(failure));print('INSPECTION_ERROR '+json.dumps(error(failure)),flush=True)\\n    if event=='call' and frame.f_code is helper_target and captured:\\n        save('inspection-stop.json',dict(reason='Stop before mutation matrix',captures=captured,performance_evidence=False))\\n        raise SystemExit('bounded schema inspection complete before mutation matrix')\\nsys.argv=['tests.runner',*sys.argv[1:]]\\nsys.setprofile(observe);threading.setprofile(observe)\\ntry:runpy.run_module('tests.runner',run_name='__main__')\\nfinally:sys.setprofile(previous);threading.setprofile(previous_thread)\\n\",'run']\nfor identifier in ids:command.extend(['--id',identifier])\ncommand.extend(['--json',str(out/'affected.json')])\nstart=time.monotonic();usage=resource.getrusage(resource.RUSAGE_CHILDREN)\nwith (out/'affected.log').open('w') as log:\n    try: status=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=180).returncode\n    except subprocess.TimeoutExpired: status=124\nwall=time.monotonic()-start;end=resource.getrusage(resource.RUSAGE_CHILDREN);after=manifest()\n(out/'source-after.json').write_text(json.dumps(after,sort_keys=True))\nreceipt=dict(command=command,exit_code=status,wall_seconds=wall,cpu_seconds=end.ru_utime+end.ru_stime-usage.ru_utime-usage.ru_stime,source_unchanged=before==after)\n(out/'execution.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))\nprint((out/'affected.log').read_text()[-20000:])\nassert before==after,'Tracked source changed during verification'\nsys.exit(status)\nCHECKS\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "timeout-minutes": 1,
          "with": {
            "name": "issue874-affected",
            "path": "${{ runner.temp }}/issue874-affected/"
          }
        }
      ]
