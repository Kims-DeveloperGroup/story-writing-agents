      "timeout-minutes": 60,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONPATH": "src",
        "SOURCE_SHA": "8b9f7dcc1bdeb592a5660adfb01aea24e8280553",
        "SELECTED_IDS": "[\"tests.test_lead_orchestration.LeadOutcomeAndProposalTests.test_front_schema_is_minimal_closed_and_provider_strict\"]"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "8b9f7dcc1bdeb592a5660adfb01aea24e8280553"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
