name: AI review gate

on:
  pull_request_target:
    types: [synchronize, reopened, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [PR validation]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write
  statuses: write

jobs:
  resolve:
    name: Resolve managed pull requests
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base != null) &&
       (github.event.action == 'unlabeled' && github.event.label.name == 'workflow:managed' ||
        contains(github.event.pull_request.labels.*.name, 'workflow:managed'))) ||
      (github.event_name != 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'workflow:managed')) ||
      contains(github.event.issue.labels.*.name, 'workflow:managed')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let numbers = [];
            if (context.eventName === "schedule") {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100,
              });
              numbers = pulls
                .filter(pr => pr.labels.some(label => label.name === "workflow:managed"))
                .map(pr => pr.number);
            } else if (context.eventName === "workflow_dispatch") {
              numbers = [Number(context.payload.inputs.pr_number)];
            } else if (context.eventName === "workflow_run") {
              numbers = (context.payload.workflow_run.pull_requests || [])
                .map(pr => pr.number);
            } else if (context.payload.pull_request) {
              numbers = [context.payload.pull_request.number];
            } else if (context.payload.issue?.pull_request) {
              numbers = [context.payload.issue.number];
            }
            core.setOutput("matrix", JSON.stringify({pr: numbers.length ? numbers : [0]}));

  evaluate:
    name: Current-head AI review (${{ matrix.pr }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: ai-review-gate-${{ matrix.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Publish current-head gate status
        if: matrix.pr != 0
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ matrix.pr }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber,
            });

            const disableAutoMerge = async reason => {
              const {data: currentPr} = await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber,
              });
              if (!currentPr.auto_merge) return;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.graphql(`
                    mutation($pullRequestId: ID!) {
                      disablePullRequestAutoMerge(input: {
                        pullRequestId: $pullRequestId
                      }) { pullRequest { number } }
                    }
                  `, {pullRequestId: currentPr.node_id});
                  core.notice(`Auto-merge disabled: ${reason}`);
                  return;
                } catch (error) {
                  if (attempt === 3) {
                    core.setFailed(`Auto-merge could not be disabled: ${error.message}`);
                    throw error;
                  }
                  core.warning(`Auto-merge disable attempt ${attempt} failed: ${error.message}`);
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            };
            const managed = pr.labels.some(label => label.name === "workflow:managed");
            const managedLabelRemoved =
              context.eventName === "pull_request_target" &&
              context.payload.action === "unlabeled" &&
              context.payload.label?.name === "workflow:managed";
            if (!managed && !managedLabelRemoved) {
              core.notice("PR is not workflow:managed; no status or merge state changed.");
              return;
            }
            if (pr.state !== "open" || pr.draft || !managed) {
              await disableAutoMerge("PR is closed, draft, or outside workflow:managed scope");
              core.notice("PR is closed, draft, or not workflow:managed; no status published.");
              return;
            }

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pullNumber, per_page: 100,
            });
            const marker = issueComments
              .filter(comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(`:${pr.base.sha}:${pr.head.sha} -->`) &&
                comment.body?.includes("<!-- ai-review-milestone-open:"))
              .sort((left, right) =>
                new Date(right.created_at) - new Date(left.created_at))[0];
            if (!marker) {
              await github.rest.repos.createCommitStatus({
                owner, repo, ref: pr.head.sha, state: "failure",
                context: "ai-review-gate",
                description: "Current-head review milestone missing",
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              await disableAutoMerge("current head has no review milestone");
              core.notice("No AI review milestone exists for the current head.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pullNumber, per_page: 100,
            });
            const current = reviews.filter(review =>
              review.commit_id === pr.head.sha &&
              review.state !== "DISMISSED" &&
              new Date(review.submitted_at) >= new Date(marker.created_at));
            const copilotLogin = "copilot-pull-request-reviewer[bot]";
            const codexLogin = "chatgpt-codex-connector[bot]";
            const copilot = current.filter(review => review.user?.login === copilotLogin);
            const codex = current.filter(review => review.user?.login === codexLogin);

            const updatedAtByReview = new Map();
            const botReviews = [...copilot, ...codex];
            for (let offset = 0; offset < botReviews.length; offset += 100) {
              const batch = botReviews.slice(offset, offset + 100);
              const response = await github.graphql(`
                query($ids: [ID!]!) {
                  nodes(ids: $ids) {
                    ... on PullRequestReview { databaseId updatedAt }
                  }
                }
              `, {ids: batch.map(review => review.node_id)});
              for (const review of response.nodes) {
                if (review?.databaseId) {
                  updatedAtByReview.set(review.databaseId, review.updatedAt);
                }
              }
            }

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: pullNumber, per_page: 100,
            });
            const fullLabelAddedAt = pr.labels.some(label => label.name === "test:full")
              ? (await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: pullNumber, per_page: 100,
                }))
                  .filter(event => event.event === "labeled" &&
                    event.label?.name === "test:full")
                  .sort((left, right) =>
                    new Date(right.created_at) - new Date(left.created_at))[0]?.created_at
              : null;
            if (pr.labels.some(label => label.name === "test:full") &&
                !fullLabelAddedAt) {
              await github.rest.repos.createCommitStatus({
                owner, repo, ref: pr.head.sha, state: "failure",
                context: "ai-review-gate",
                description: "Cannot establish test:full label history",
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              core.setFailed("Cannot establish when test:full was added");
              await disableAutoMerge("test:full label history unavailable");
              return;
            }
            const validationRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: "pr-validation.yml",
                head_sha: pr.head.sha,
                per_page: 100,
              },
            );
            const validation = validationRuns
              .filter(run => (run.pull_requests || []).some(
                linked => linked.number === pullNumber &&
                  linked.base?.sha === pr.base.sha) &&
                (!fullLabelAddedAt ||
                  new Date(run.created_at) >= new Date(fullLabelAddedAt)))
              .sort((left, right) =>
                new Date(right.created_at) - new Date(left.created_at))[0];
            const addressedByComment = new Map();
            let cursor = null;
            do {
              const response = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                        comments(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { databaseId body createdAt updatedAt authorAssociation author { login } }
                        }
                        }
                      }
                    }
                  }
                }
              `, {owner, repo, number: pullNumber, cursor});
              const threads = response.repository.pullRequest.reviewThreads;
              for (const thread of threads.nodes) {
                const comments = thread.comments.nodes;
                const author = comments[0]?.author?.login;
                const answered = !thread.comments.pageInfo.hasNextPage &&
                  comments.slice(1).some(comment =>
                    comment.author?.login !== author &&
                    new Date(comment.createdAt) > new Date(comments[0].updatedAt) &&
                    ["OWNER", "MEMBER", "COLLABORATOR"].includes(
                      comment.authorAssociation) &&
                    /^Decision: (Applied|Rejected)$/im.test(comment.body || "") &&
                    /^Reason: \S.{39,}$/im.test(comment.body || "") &&
                    /^Evidence: https:\/\/github\.com\/\S+$/im.test(
                      comment.body || ""));
                for (const comment of thread.comments.nodes) {
                  addressedByComment.set(comment.databaseId, thread.isResolved && answered);
                }
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);

            const textsFor = selected => {
              const ids = new Set(selected.map(review => review.id));
              const comments = reviewComments.filter(comment =>
                ids.has(comment.pull_request_review_id));
              // Copilot mirrors inline findings in a details list; resolved thread text
              // must not remain a blocker through that stale review-body summary.
              const bodies = selected
                .filter(review => !issueComments.some(comment =>
                  comment.user?.type === "User" &&
                  ["OWNER", "MEMBER", "COLLABORATOR"].includes(
                    comment.author_association) &&
                  new Date(comment.created_at) >
                    new Date(updatedAtByReview.get(review.id)) &&
                  comment.body?.includes(`<!-- ai-review-body-disposition:${review.id} -->`) &&
                  /^Decision: (Applied|Rejected)$/im.test(comment.body) &&
                  /^Reason: \S.{39,}$/im.test(comment.body) &&
                  /^Evidence: https:\/\/github\.com\/\S+$/im.test(comment.body)))
                .map(review => (review.body || "").replace(
                  /<details\b[^>]*>[\s\S]*?<\/details>/gi,
                  section => /#discussion_r\d+/.test(section) ? "" : section));
              return [
                ...bodies,
                ...comments
                  .filter(comment => !addressedByComment.get(comment.id))
                  .map(comment => comment.body || ""),
              ];
            };
            const copilotHigh = /\bseverity\s*[:=-]\s*(?:\*\*)?high\b|\[(?:severity\s*:\s*)?high\]|(?:^|\n)\s*(?:#{1,6}\s*)?(?:\*\*)?high(?:\*\*)?\s*(?:severity)?\s*[:—-]/im;
            const codexBlocking = /\[(?:P0|P1)(?:\s+Badge)?\]/i;
            const blockers = [];
            if (textsFor(copilot).some(text => copilotHigh.test(text))) blockers.push("Copilot High");
            if (textsFor(codex).some(text => codexBlocking.test(text))) blockers.push("Codex P0/P1");

            let state;
            let description;
            if (!copilot.length || !codex.length) {
              state = "pending";
              const missing = [
                !copilot.length && "Copilot",
                !codex.length && "Codex",
              ].filter(Boolean).join(" and ");
              description = `Waiting for current-head ${missing} review`;
            } else if (blockers.length) {
              state = "failure";
              description = `Unresolved ${blockers.join(" and ")} finding`;
            } else if (!validation || validation.status !== "completed") {
              state = "pending";
              description = "Waiting for current-head PR validation";
            } else if (validation.conclusion !== "success") {
              state = "failure";
              description = `Current-head PR validation is ${validation.conclusion}`;
            } else {
              state = "success";
              description = "Current-head Copilot and Codex gates passed";
            }

            const {data: latestPr} = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber,
            });
            if (latestPr.head.sha !== pr.head.sha ||
                latestPr.base.sha !== pr.base.sha) {
              state = "failure";
              description = "PR base or head changed during review evaluation";
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              ref: pr.head.sha,
              state,
              context: "ai-review-gate",
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            const stillManaged = latestPr.labels.some(
              label => label.name === "workflow:managed");
            const mergeGatesReady = state === "success" &&
              stillManaged && latestPr.head.sha === pr.head.sha &&
              latestPr.base.sha === pr.base.sha &&
              latestPr.mergeable_state === "clean";
            if (!mergeGatesReady) {
              await disableAutoMerge(
                "AI, human-review, or required-check gates are not all current and clean");
            } else {
              core.notice("Review gate passed; auto-merge requires a separate authorized action.");
            }
            core.summary
              .addHeading("AI review gate")
              .addTable([
                [{data: "Head", header: true}, pr.head.sha],
                [{data: "Copilot current-head review", header: true}, copilot.length ? "present" : "pending"],
                [{data: "Codex current-head review", header: true}, codex.length ? "present" : "pending"],
                [{data: "PR validation", header: true}, validation ? `${validation.status}/${validation.conclusion || "pending"}` : "pending"],
                [{data: "Merge gates", header: true}, mergeGatesReady ? "clean" : latestPr.mergeable_state],
                [{data: "Gate", header: true}, `${state}: ${description}`],
              ])
              .addRaw("\nBranch rulesets enforce required reviews and checks; this gate never enables auto-merge.\n")
              .write();
