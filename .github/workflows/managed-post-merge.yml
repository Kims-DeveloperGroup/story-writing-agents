name: Managed post-merge verification

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Optional: PROJECT_STATUS_TOKEN may be a fine-grained token with read access
# to the organization Project when the repository token cannot read ProjectV2.
jobs:
  verify:
    name: Verify managed status and cleanup
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'workflow:managed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_STATUS_TOKEN || github.token }}
          script: |
            const {owner, repo} = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const failures = [];
            const warnings = [];

            const response = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  defaultBranchRef { name }
                  pullRequest(number: $number) {
                    body
                    headRefName
                    headRepository { nameWithOwner }
                    allClosingIssues: closingIssuesReferences(first: 50) {
                      nodes {
                        id
                        number
                        state
                        url
                        linkedBranches(first: 50) {
                          nodes {
                            ref { name repository { nameWithOwner } }
                          }
                        }
                      }
                    }
                    manuallyLinkedIssues: closingIssuesReferences(
                      first: 50
                      userLinkedOnly: true
                    ) {
                      nodes {
                        id
                        number
                        state
                        url
                        linkedBranches(first: 50) {
                          nodes {
                            ref { name repository { nameWithOwner } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {owner, repo, number: pullNumber});
            const repository = response.repository;
            const pr = repository.pullRequest;
            const completingIssues = pr.allClosingIssues.nodes;
            const completingIssueIds = new Set(completingIssues.map(issue => issue.id));
            const issuesByNumber = new Map([
              ...pr.allClosingIssues.nodes,
              ...pr.manuallyLinkedIssues.nodes,
            ].map(issue => [issue.number, issue]));
            const referencedNumbers = [...(pr.body || "").matchAll(/\bRefs\s*:?\s*#(\d+)\b/gim)]
              .map(match => Number(match[1]));
            for (const issueNumber of referencedNumbers) {
              if (issuesByNumber.has(issueNumber)) continue;
              const issueResponse = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id
                      number
                      state
                      url
                      linkedBranches(first: 50) {
                        nodes {
                          ref { name repository { nameWithOwner } }
                        }
                      }
                    }
                  }
                }
              `, {owner, repo, number: issueNumber});
              const issue = issueResponse.repository.issue;
              if (issue) {
                issuesByNumber.set(issue.number, issue);
              } else {
                failures.push(`Refs #${issueNumber} does not resolve to an Issue`);
              }
            }
            const issues = [...issuesByNumber.values()];

            // Capture Development links before native branch deletion can remove
            // them, then allow Issue/Project and remote-branch automation to settle.
            const linkedIssues = new Set(issues
              .filter(issue => issue.linkedBranches.nodes.some(link =>
                link.ref?.name === pr.headRefName &&
                link.ref?.repository?.nameWithOwner === `${owner}/${repo}`))
              .map(issue => issue.id));
            await new Promise(resolve => setTimeout(resolve, 10000));

            for (const issue of issues) {
              try {
                const projectResponse = await github.graphql(`
                  query($id: ID!) {
                    node(id: $id) {
                      ... on Issue {
                        state
                        projectItems(first: 20) {
                        nodes {
                          project {
                            title
                            number
                            owner {
                              ... on Organization { login }
                              ... on User { login }
                            }
                          }
                            fieldValues(first: 50) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  name
                                  field {
                                    ... on ProjectV2SingleSelectField { name }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, {id: issue.id});
                const completing = completingIssueIds.has(issue.id);
                if (completing && projectResponse.node.state !== "CLOSED") {
                  failures.push(
                    `#${issue.number} is ${projectResponse.node.state}, not CLOSED`);
                }
                if (!linkedIssues.has(issue.id)) {
                  failures.push(
                    `#${issue.number} has no Development-linked branch ${pr.headRefName}`);
                }

                const items = projectResponse.node.projectItems.nodes.filter(item =>
                  item.project.number === 1 && item.project.owner?.login === owner);
                if (!items.length) {
                  failures.push(`#${issue.number} has no readable ${owner} Project #1 item`);
                }
                for (const item of items) {
                  const status = item.fieldValues.nodes.find(value => value.field?.name === "Status");
                  if (!status) {
                    failures.push(`#${issue.number} has no readable Project Status`);
                  } else if (completing && status.name !== "Done") {
                    failures.push(`#${issue.number} Project Status is ${status.name}, not Done`);
                  }
                }
              } catch (error) {
                failures.push(`#${issue.number} Project status unreadable: ${error.message}`);
              }
            }
            if (!issues.length) {
              failures.push("PR has no verifiable owning Issue reference");
            }

            const sameRepository = pr.headRepository?.nameWithOwner === `${owner}/${repo}`;
            const protectedHead = pr.headRefName === repository.defaultBranchRef.name;
            if (sameRepository && !protectedHead) {
              try {
                await github.rest.git.getRef({
                  owner, repo, ref: `heads/${pr.headRefName}`,
                });
                failures.push(`remote branch ${pr.headRefName} still exists`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            } else if (!sameRepository) {
              warnings.push("fork head branch cleanup belongs to the fork owner");
            }

            core.summary.addHeading("Managed post-merge verification");
            core.summary.addList([
              `${issues.length} owning Issue candidate(s) inspected`,
              `${completingIssueIds.size} completing Issue(s) expected CLOSED and Done`,
              sameRepository ? `remote head checked: ${pr.headRefName}` : "fork head not mutated",
            ]);
            if (warnings.length) core.summary.addHeading("Warnings", 3).addList(warnings);
            if (failures.length) core.summary.addHeading("Required follow-up", 3).addList(failures);
            await core.summary.write();
            for (const warning of warnings) core.warning(warning);
            if (failures.length) core.setFailed(failures.join("; "));
