name: PR validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired-whole-front:
    name: 동일 호스트 whole-front 전후 비교
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: 1
            order: before after
          - pair: 2
            order: after before
          - pair: 3
            order: before after
    steps:
      - name: 기준 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: 4d35c49182a6d77e59a45951b24ff86aa0e0aad6
          path: source0
          submodules: recursive
          persist-credentials: false
      - name: 변경 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: 30811bc44cde864212404b2f629ff55e643004ba
          path: source1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: 정규 실행과 동일한 의존성과 Git 설정
        working-directory: source1
        run: |
          uv sync --locked --all-extras --python 3.11.18 --no-progress
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: 같은 호스트에서 기존 5번 샤드 전후 측정
        env:
          ORDER: ${{ matrix.order }}
          PAIR: ${{ matrix.pair }}
        run: |
          source1/.venv/bin/python - <<'PYTHON'
          import gc
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          import time
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "paired-whole-front-artifacts"
          out.mkdir()
          sources = {"before": ("source0", "4d35c49182a6d77e59a45951b24ff86aa0e0aad6", "360b4585588d936e895b0d27efd378de17f2d1ed"),
                     "after": ("source1", "30811bc44cde864212404b2f629ff55e643004ba", "bd82f3933298cb047fcbe40ccdd519e147a56337")}
          case = "tests.test_lead_orchestration.LeadOutcomeAndProposalTests.test_front_schema_is_minimal_closed_and_provider_strict"
          assert platform.machine() == "aarch64" and platform.python_version() == "3.11.18"
          assert len(os.sched_getaffinity(0)) == 4 and gc.isenabled() and sys.getprofile() is None
          environment = {**os.environ, "PYTHONPATH": "src"}
          order = os.environ["ORDER"].split()
          assert set(order) == set(sources) and len(order) == 2
          absolute_cutoff = time.time() + 4000
          records = []
          for role in order:
              subdir, commit, tree = sources[role]
              src = root / subdir
              report = out / f"{role}.json"
              command = ["git", "-C", str(src)]
              assert subprocess.check_output([*command, "rev-parse", "HEAD", "HEAD^{tree}"], text=True).split() == [commit, tree]
              deadline = min(time.time() + 3600, absolute_cutoff)
              args = [sys.executable, "-m", "tests.runner", "run", "--shard", "5/5",
                      "--hosted-methods", "audited-163-v11", "--hosted-deadline-epoch", str(deadline),
                      "--json", str(report)]
              with (out / f"{role}.log").open("wb") as log:
                  result = subprocess.run(args, cwd=src, env=environment, stdout=log,
                                          stderr=subprocess.STDOUT,
                                          timeout=max(1, deadline - time.time() + 30))
              (out / f"{role}-exit-code.txt").write_text(f"{result.returncode}\n")
              if result.returncode != 0:
                  raise RuntimeError(f"{role} canonical runner exited {result.returncode}; see retained raw log")
              data = json.loads(report.read_text())
              assert result.returncode == 0 and data["outcome"] == "success"
              assert data["environment_valid"] and not data["unexecuted_ids"] and data["totals"]["passed"] == 1
              method, = data["tests"]
              assert method["canonical_id"] == case and method["status"] == "passed"
              binding = data["source_binding"]
              assert binding["checkout_sha"] == commit and binding["checkout_tree"] == tree
              assert binding["source_valid"] and binding["before_digest"] == binding["after_digest"]
              assert not subprocess.check_output([*command, "status", "--porcelain", "--untracked-files=no"]).strip()
              records.append({"role": role, "head": commit, "tree": tree,
                              "report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
                              "duration": data["durations"], "method_subtests": method["subtest_count"]})
              print(role, "complete", data["durations"], flush=True)
          provenance = {"order": order, "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                        "workflow_sha": os.environ["GITHUB_SHA"], "runner": platform.machine(),
                        "affinity": len(os.sched_getaffinity(0)), "python": platform.python_version(),
                        "gc_thresholds": gc.get_threshold(), "observations": records}
          (out / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-whole-front-${{ matrix.pair }}
          path: paired-whole-front-artifacts
          if-no-files-found: error
