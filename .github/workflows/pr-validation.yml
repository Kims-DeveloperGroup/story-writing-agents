          class OriginalFailureObserver:
              """One bounded, source-pinned exception observation around an existing run."""

              ROOT_REQUIREMENTS = {
                  689: "expected strict JSON schema rules",
                  691: "schema byte limit exceeded",
                  694: "invalid local definitions",
              }

              def __init__(self, root, path, selected_id, pins, seam):
                  self.root, self.path, self.selected_id = root, path, selected_id
                  self.pins, self.seam = dict(pins), seam
                  self.errors, self.capture = [], None
                  self.attempted = False
                  self.trace_restored = self.profile_unchanged = False
                  self.before = self.hashes()
                  self.paths = {str((root / name).resolve()): name for name in pins if name.endswith('.py')}
                  self.trace_hook = self.trace_calls
                  self.prepare_readers()
                  if self.before != self.pins:
                      self.errors.append('source_before_mismatch')

              def hashes(self):
                  return {name: hashlib.sha256((self.root / name).read_bytes()).hexdigest() for name in self.pins}

              @staticmethod
              def descriptor(owner, name):
                  value = type.__getattribute__(owner, '__dict__')[name]
                  if type(value) not in (types.MemberDescriptorType, types.GetSetDescriptorType):
                      raise TypeError('unsupported builtin reader')
                  return value

              @staticmethod
              def read(descriptor, value, owner):
                  return descriptor.__get__(value, owner)

              def loaded(self, module_name, name):
                  module = sys.modules.get(module_name)
                  if type(module) is not types.ModuleType:
                      raise TypeError('required normal import unavailable')
                  values = self.read(self.module_dict, module, types.ModuleType)
                  if type(values) is not dict:
                      raise TypeError('unsupported module dictionary')
                  return values[name]

              def function_code(self, function):
                  if type(function) is not types.FunctionType:
                      raise TypeError('unsupported function identity')
                  return self.read(self.function_code_reader, function, types.FunctionType)

              def prepare_readers(self):
                  self.module_dict = self.descriptor(types.ModuleType, '__dict__')
                  self.function_code_reader = self.descriptor(types.FunctionType, '__code__')
                  self.exception_readers = {name: self.descriptor(BaseException, name) for name in (
                      '__dict__', '__traceback__', '__cause__', '__context__')}
                  self.traceback_readers = {name: self.descriptor(types.TracebackType, name) for name in (
                      'tb_frame', 'tb_lineno', 'tb_next')}
                  self.finding_class = self.loaded(
                      'story_writing_agents.structured_output_validation', 'ValidationFinding')
                  if type(self.finding_class) is not type:
                      raise TypeError('unsupported finding identity')
                  self.finding_readers = {name: self.descriptor(self.finding_class, name) for name in (
                      'path', 'requirement')}
                  runtime_class = self.loaded('story_writing_agents.orchestrator', 'StoryRuntime')
                  if type(runtime_class) is not type:
                      raise TypeError('unsupported runtime identity')
                  methods = type.__getattribute__(runtime_class, '__dict__')
                  self.close_code = self.function_code(methods['_close_failed_lead_attempt'])
                  self.guarded_code = self.function_code(methods['_run_collaboration_invocation_guarded'])
                  self.facts_code = self.function_code(self.loaded(
                      'story_writing_agents.orchestrator', 'context_provider_failure_facts'))
                  self.canonical_code = self.function_code(self.loaded(
                      'story_writing_agents.structured_output_validation', 'canonical_schema_rules'))
                  expected = (
                      (self.close_code, 'src/story_writing_agents/orchestrator.py', 14247),
                      (self.guarded_code, 'src/story_writing_agents/orchestrator.py', 8529),
                      (self.canonical_code, 'src/story_writing_agents/structured_output_validation.py', 677),
                  )
                  for code, name, line in expected:
                      if self.paths.get(code.co_filename) != name or code.co_firstlineno != line:
                          raise TypeError('unsupported pinned code location')
                  if self.paths.get(self.facts_code.co_filename) != 'src/story_writing_agents/agent_context/service.py':
                      raise TypeError('unsupported facts location')
                  self.labels = {value: ('builtins', value.__name__) for value in (
                      ValueError, TypeError, AttributeError, KeyError, IndexError, RuntimeError,
                      UnicodeError, UnicodeEncodeError, UnicodeDecodeError, OverflowError,
                  )}
                  self.labels[json.JSONDecodeError] = ('json.decoder', 'JSONDecodeError')
                  for module_name, name in (
                      ('story_writing_agents.agent_context.service', 'ContextExecutionError'),
                      ('story_writing_agents.writing_artifacts.references', 'ArtifactReferenceDirectiveError'),
                      ('story_writing_agents.writing_artifacts.authorization', 'ReferenceAuthorizationError'),
                      ('story_writing_agents.writing_artifacts.authorization', 'ReferenceOperationFailure'),
                  ):
                      value = self.loaded(module_name, name)
                      if type(value) is not type or BaseException not in type.__getattribute__(value, '__mro__'):
                          raise TypeError('unsupported exception identity')
                      self.labels[value] = (module_name, name)

              def trace_calls(self, frame, event, arg):
                  if event != 'call' or self.attempted:
                      return None
                  code = frame.f_code
                  if self.seam == 'lead':
                      if code is not self.close_code:
                          return None
                  elif self.seam == 'specialist':
                      if (code is not self.facts_code or frame.f_back is None
                              or frame.f_back.f_code is not self.guarded_code
                              or frame.f_back.f_lineno != 8913):
                          return None
                  else:
                      return None
                  try:
                      values = frame.f_locals
                      if type(values) is not dict or 'failure' not in values:
                          self.attempted = True
                          self.errors.append('failure_argument_unavailable')
                      elif values['failure'] is not None:
                          self.attempted = True
                          self.capture = self.snapshot(values['failure'])
                  except Exception:
                      self.errors.append('capture_read_failed')
                  return None

              def snapshot(self, failure):
                  chain, coordinates, roots = [], [], []
                  held, nodes, current = [], 0, failure
                  while current is not None:
                      if len(held) == 4 or any(current is item for item in held):
                          raise ValueError('unsupported exception chain')
                      error_type = type(current)
                      if error_type not in self.labels:
                          raise TypeError('unsupported exception identity')
                      held.append(current)
                      module_name, name = self.labels[error_type]
                      chain.append({'module': module_name, 'type': name})
                      requirement = None
                      if self.seam == 'lead':
                          values = self.read(self.exception_readers['__dict__'], current, BaseException)
                          if type(values) is not dict:
                              raise TypeError('unsupported exception dictionary')
                          if 'provider_validation_findings' in values:
                              findings = values['provider_validation_findings']
                              if (type(findings) is not tuple or len(findings) != 1
                                      or type(findings[0]) is not self.finding_class):
                                  raise TypeError('unsupported finding shape')
                              path = self.read(self.finding_readers['path'], findings[0], self.finding_class)
                              text = self.read(self.finding_readers['requirement'], findings[0], self.finding_class)
                              if (type(path) is not str or path != '$' or type(text) is not str
                                      or text not in self.ROOT_REQUIREMENTS.values()):
                                  raise ValueError('unsupported trusted requirement')
                              requirement = text
                      traceback = self.read(self.exception_readers['__traceback__'], current, BaseException)
                      while traceback is not None:
                          if type(traceback) is not types.TracebackType or nodes == 16:
                              raise ValueError('unsupported traceback bound')
                          nodes += 1
                          frame = self.read(self.traceback_readers['tb_frame'], traceback, types.TracebackType)
                          line = self.read(self.traceback_readers['tb_lineno'], traceback, types.TracebackType)
                          if type(frame) is not types.FrameType or type(line) is not int or not 0 < line < 2**31:
                              raise TypeError('unsupported frame shape')
                          code = frame.f_code
                          relative = self.paths.get(code.co_filename)
                          if relative is not None:
                              function = code.co_qualname
                              if type(function) is not str or len(function) > 256:
                                  raise TypeError('unsupported function coordinate')
                              coordinates.append({'path': relative, 'line': line, 'function': function})
                          if self.seam == 'lead' and code is self.canonical_code and line in self.ROOT_REQUIREMENTS:
                              if requirement != self.ROOT_REQUIREMENTS[line]:
                                  raise ValueError('uncorrelated canonical requirement')
                              values = frame.f_locals
                              if type(values) is not dict:
                                  raise TypeError('unsupported canonical locals')
                              encoded, maximum = values.get('encoded'), values.get('maximum_bytes')
                              if type(maximum) is not int or not 0 < maximum < 2**31:
                                  raise TypeError('unsupported maximum count')
                              if line == 691 and type(encoded) is not bytes:
                                  raise TypeError('unavailable schema byte count')
                              roots.append({'path': '$', 'requirement': requirement, 'raise_line': line,
                                            'encoded_bytes': len(encoded) if type(encoded) is bytes else None,
                                            'maximum_bytes': maximum})
                          traceback = self.read(self.traceback_readers['tb_next'], traceback, types.TracebackType)
                      cause = self.read(self.exception_readers['__cause__'], current, BaseException)
                      current = cause if cause is not None else self.read(
                          self.exception_readers['__context__'], current, BaseException)
                  if self.seam == 'lead' and len(roots) != 1:
                      raise ValueError('canonical rejection not uniquely observed')
                  return {'exception_chain': chain, 'traceback_coordinates': coordinates,
                          'canonical_schema_rejection': roots[0] if roots else None,
                          'mode': 'canonical_schema_root' if self.seam == 'lead' else 'exception_coordinates'}

              def run(self, run_original):
                  prior_trace, prior_profile = sys.gettrace(), sys.getprofile()
                  armed = False
                  if prior_trace is not None:
                      self.errors.append('preexisting_trace_hook')
                  elif not self.errors:
                      try:
                          sys.settrace(self.trace_hook)
                          armed = True
                      except Exception:
                          self.errors.append('trace_install_failed')
                  try:
                      return run_original()
                  finally:
                      if armed:
                          try:
                              if sys.gettrace() is not self.trace_hook:
                                  self.errors.append('trace_hook_changed')
                              sys.settrace(prior_trace)
                          except Exception:
                              self.errors.append('trace_restore_failed')
                      self.trace_restored = sys.gettrace() is prior_trace
                      self.profile_unchanged = sys.getprofile() is prior_profile
                      if not self.trace_restored or not self.profile_unchanged:
                          self.errors.append('runtime_hook_state_changed')

              def finalize(self, *, runner_returned):
                  after = self.hashes()
                  source_matches = self.before == after == self.pins
                  if not source_matches:
                      self.errors.append('source_after_mismatch')
                  record = {
                      'schema_version': 1, 'diagnostic_only': True, 'canonical_id': self.selected_id,
                      'source_pins': self.pins, 'source_before': self.before, 'source_after': after,
                      'source_matches': source_matches, 'runner_returned': runner_returned,
                      'finalized': True, 'incomplete': not runner_returned,
                      'attempted': self.attempted, 'maximum_failures': 1,
                      'observations': [self.capture] if self.capture is not None else [],
                      'errors': self.errors[:16], 'trace_restored': self.trace_restored,
                      'profile_unchanged': self.profile_unchanged,
                      'qualification': 'Source-pinned call tracing adds unmeasured overhead. No extra original invocation or outcome change.',
                  }
                  record['valid'] = (runner_returned and source_matches and not self.errors
                                     and self.trace_restored and self.profile_unchanged)
                  encoded = json.dumps(record, sort_keys=True, indent=2).encode()
                  if len(encoded) > 131072:
                      raise ValueError('bounded observation overflow')
                  self.path.write_bytes(encoded + b'\n')

          class FailureLocalObserver:
              """Private, failure-local metadata; never changes a test result."""

              def __init__(self, root, destination, selected_id, pins, target):
                  self.root, self.destination = root, destination
                  self.selected_id, self.pins = selected_id, pins
                  self.target = target
                  self.originals, self.wrappers, self.frames, self.errors = {}, {}, [], []
                  self.checked = {
                      path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                      for path in pins
                  }
                  self.source_matches = self.checked == pins
                  self.result_class = None

              def install(self, result_class):
                  if not self.source_matches:
                      self.errors.append("source_pin_mismatch")
                      return
                  self.result_class = result_class
                  for name in ("addError", "addFailure"):
                      original = getattr(result_class, name)
                      self.originals[name] = original

                      def wrapper(result, test, error, _original=original, _name=name):
                          returned = _original(result, test, error)
                          try:
                              self.observe(test, error, _name)
                          except BaseException as exc:
                              self.errors.append(type(exc).__name__)
                          return returned

                      self.wrappers[name] = wrapper
                      setattr(result_class, name, wrapper)

              @staticmethod
              def text(value):
                  if value is None or isinstance(value, (bool, int)):
                      return value
                  if isinstance(value, str):
                      return value[:2048]
                  return {"type": type(value).__name__}

              def observe(self, test, error, method):
                  if test.id() != self.selected_id:
                      return
                  traceback = error[2]
                  while traceback is not None:
                      frame = traceback.tb_frame
                      matches = (
                          frame.f_code.co_qualname == self.target[1]
                          and Path(frame.f_code.co_filename).resolve()
                          == (self.root / self.target[0]).resolve()
                      )
                      if matches and self.target[2] in frame.f_locals and len(self.frames) < 2:
                          offered = frame.f_locals[self.target[2]]
                          if type(offered).__name__ != "LeadTurnResult":
                              self.errors.append("unexpected_result_type")
                              return
                          record = {
                              "method": method,
                              "line": traceback.tb_lineno,
                              "frame": frame.f_code.co_qualname,
                              "exception_type": error[0].__name__,
                              "result": {
                                  name: self.text(getattr(offered, name, None))
                                  for name in ("kind", "state", "next_action")
                              },
                              "present": {
                                  name: getattr(offered, name, None) is not None
                                  for name in ("recommendation_request", "proposal",
                                               "artifact_proposal", "artifact_application_request",
                                               "story_commit_request", "provider_invocation_id")
                              },
                          }
                          details = offered.validation_details
                          record["validation_details"] = [self.text(item) for item in details[:16]]
                          record["validation_details_truncated"] = (
                              len(details) > 16 or any(len(item) > 2048 for item in details[:16])
                          )
                          trace = offered.trace
                          record["trace_origin"] = self.text(getattr(trace, "origin", None))
                          message = offered.message
                          record["message_utf8_bytes"] = len(message.encode("utf-8"))
                          record["message_sha256"] = hashlib.sha256(message.encode("utf-8")).hexdigest()
                          try:
                              notice = json.loads(message)
                          except (ValueError, TypeError):
                              notice = None
                          if isinstance(notice, dict):
                              record["notice"] = {
                                  key: notice[key] for key in ("code", "language", "state", "task_revisions")
                                  if key in notice
                              }
                          case = frame.f_locals.get("self")
                          backend = getattr(case, "backend", None)
                          record["counts"] = {
                              name: len(value) for name in ("calls", "reference_records")
                              if isinstance(value := getattr(backend, name, None), (list, tuple))
                          }
                          self.frames.append(record)
                      traceback = traceback.tb_next

              def finalize(self, *, runner_returned):
                  if self.result_class is not None:
                      for name, original in self.originals.items():
                          if getattr(self.result_class, name) is self.wrappers[name]:
                              setattr(self.result_class, name, original)
                          else:
                              self.errors.append("hook_changed_" + name)
                  after = {
                      path: hashlib.sha256((self.root / path).read_bytes()).hexdigest()
                      for path in self.pins
                  }
                  payload = {
                      "schema_version": 1, "diagnostic_only": True,
                      "canonical_id": self.selected_id, "source_pins": self.pins,
                      "source_before": self.checked, "source_after": after,
                      "source_matches": self.source_matches and after == self.pins,
                      "runner_returned": runner_returned, "finalized": True,
                      "incomplete": not runner_returned, "errors": self.errors,
                      "observations": self.frames,
                      "valid": self.source_matches and after == self.pins
                               and runner_returned and not self.errors,
                  }
                  self.destination.write_text(json.dumps(payload, indent=2), encoding="utf-8")

          def hashes():
              return {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths if path}
          before = hashes()
          counts = collections.defaultdict(lambda: {"calls": 0, "seconds": 0.0})
          def record(key, elapsed):
              counts[key]["calls"] += 1
              counts[key]["seconds"] += elapsed
          original_git = process.GitProcessRunner.run
          @functools.wraps(original_git)
          def git(self, args, **kwargs):
              started = time.perf_counter()
              try:
                  return original_git(self, args, **kwargs)
              finally:
                  record("git:" + args[0], time.perf_counter() - started)
          process.GitProcessRunner.run = git
          original_refs = session_resources._Repository._loose_ref_output
          samples = []
          @functools.wraps(original_refs)
          def refs(self):
              started = time.perf_counter()
              value = original_refs(self)
              record("loose_refs:" + ("fallback" if value is None else "bytes"), time.perf_counter() - started)
              if len(samples) < 8:
                  with (self.common_git / "config").open("rb") as source:
                      config = source.read(65536)
                  safe = re.findall(rb"(?m)^\s*(?:repositoryformatversion|filemode|bare|logallrefupdates|objectformat|submodulepathconfig|relativeworktrees|worktreeconfig)\s*=\s*(?:true|false|0|1|sha1|sha256)\s*$", config)
                  samples.append({"fallback": value is None, "config_sha256": hashlib.sha256(config).hexdigest(), "format_lines": [line.decode("ascii").strip() for line in safe], "packed_refs": (self.common_git / "packed-refs").exists(), "reftable": (self.common_git / "reftable").exists()})
              return value
          session_resources._Repository._loose_ref_output = refs
          profile_mode = os.environ["DIAGNOSTIC_PROFILE_MODE"]
          if profile_mode not in {"cprofile", "none"}:
              raise SystemExit("invalid diagnostic profile mode")
          profile = cProfile.Profile()
          started = time.perf_counter()
          if profile_mode == "cprofile":
              profile.enable()
          failure_observer = None
          original_failure_observer = None
          observer_errors = []
          runner_returned = False
          try:
              if os.environ["DIAGNOSTIC_TEST_ID"] in FAILURE_LOCAL_TARGETS:
                  try:
                      failure_observer = FailureLocalObserver(
                          Path.cwd(), output / "failure-local-observation.private.json",
                          os.environ["DIAGNOSTIC_TEST_ID"], FAILURE_LOCAL_PINS,
                          FAILURE_LOCAL_TARGETS[os.environ["DIAGNOSTIC_TEST_ID"]])
                      failure_observer.install(runner.TimedTextTestResult)
                  except BaseException as exc:
                      observer_errors.append("initialize:" + type(exc).__name__)
              if os.environ["DIAGNOSTIC_TEST_ID"] in ORIGINAL_FAILURE_TARGETS:
                  try:
                      original_failure_observer = OriginalFailureObserver(
                          Path.cwd(), output / "original-failure-observation.private.json",
                          os.environ["DIAGNOSTIC_TEST_ID"], FAILURE_LOCAL_PINS,
                          ORIGINAL_FAILURE_TARGETS[os.environ["DIAGNOSTIC_TEST_ID"]])
                  except Exception as exc:
                      observer_errors.append("original_initialize:" + type(exc).__name__)
              selected_argv = ["run", "--id", os.environ["DIAGNOSTIC_TEST_ID"], "--json", str(output / "instrumented-run.json")]
              if original_failure_observer is not None:
                  code = original_failure_observer.run(lambda: runner.main(selected_argv))
              else:
                  code = runner.main(selected_argv)
              runner_returned = True
          finally:
              if failure_observer is not None:
                  try:
                      failure_observer.finalize(runner_returned=runner_returned)
                  except BaseException as exc:
                      observer_errors.append("finalize:" + type(exc).__name__)
              if original_failure_observer is not None:
                  try:
                      original_failure_observer.finalize(runner_returned=runner_returned)
                  except Exception as exc:
                      observer_errors.append("original_finalize:" + type(exc).__name__)
              if profile_mode == "cprofile":
                  profile.disable()
                  profile.dump_stats(str(output / "profile.pstats"))
                  with (output / "profile.txt").open("w") as stream:
                      pstats.Stats(profile, stream=stream).strip_dirs().sort_stats("cumulative").print_stats(100)
              else:
                  (output / "profile.txt").write_text("cProfile disabled by diagnostic input profile_mode=none.\n")
              after = hashes()
              evidence = {"diagnostic_only": True, "source_valid": before == after, "source_before": before, "source_after": after, "instrumented_seconds": time.perf_counter() - started, "counts": dict(counts), "fixture_samples": samples, "platform": platform.platform(), "python": platform.python_version(), "cpu_count": os.cpu_count(), "git": subprocess.check_output(["git", "--version"], text=True).strip()}
              evidence.update(python_compiler=platform.python_compiler(), python_enable_optimizations_flag="--enable-optimizations" in (sysconfig.get_config_var("CONFIG_ARGS") or ""), temporary_filesystem=subprocess.check_output(["stat", "-f", "-c", "%T", tempfile.gettempdir()], text=True).strip())
              evidence["profiling_mode"] = profile_mode
              evidence["failure_observer_errors"] = observer_errors
              observation_path = output / "failure-local-observation.private.json"
              if observation_path.is_file():
                  evidence["failure_local_observation_sha256"] = hashlib.sha256(observation_path.read_bytes()).hexdigest()
              evidence["capture_checkout_head"] = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip()
              evidence["diagnostic_workflow_sha256"] = hashlib.sha256(
                  Path(".github/workflows/pr-validation.yml").read_bytes()).hexdigest()
              original_path = output / "original-failure-observation.private.json"
              if original_path.is_file():
                  evidence["original_failure_observation_sha256"] = hashlib.sha256(original_path.read_bytes()).hexdigest()
              (output / "counters.json").write_text(json.dumps(evidence, indent=2))
          raise SystemExit(code if before == after else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('timing-diagnostic-{0}-{1}', inputs.arch, inputs.scratch) || 'timing-diagnostic' }}
          path: ${{ runner.temp }}/timing-diagnostic
          if-no-files-found: error
      - name: Remove diagnostic scratch storage
        if: always() && steps.scratch.outputs.directory != ''
        env:
          SCRATCH: ${{ steps.scratch.outputs.directory }}
          MEMORY: ${{ inputs.scratch == 'memory' }}
        run: |
          if [[ "$MEMORY" == "true" ]] && mountpoint -q "$SCRATCH"; then
            sudo umount "$SCRATCH"
          fi
          rmdir "$SCRATCH"
