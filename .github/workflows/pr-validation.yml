          assert platform.python_version()=="3.11.18" and platform.machine()=="aarch64"
          assert gc.isenabled() and sys.getprofile() is None and len(os.sched_getaffinity(0))==4
          runs=[]
          for pair in range(1,3+1):
              order=("before","after") if pair%2 else ("after","before")
              for role in order:
                  work,head,tree=sources[role]
                  folder=root/work
                  dest=destination/f"pair-{pair}-{role}.json"
                  identity=subprocess.check_output(["git","rev-parse","HEAD","HEAD^{tree}"],cwd=folder,text=True).splitlines()
                  assert identity==[head,tree]
                  args=[sys.executable,"-m","tests.runner","run","--json",str(dest)]
                  for cid in cases:
                      args.extend(("--id",cid))
                  with dest.with_suffix(".log").open("wb") as log:
                      result=subprocess.run(args,cwd=folder,env={**os.environ,"PYTHONPATH":"src"},
                                            stdout=log,stderr=subprocess.STDOUT,timeout=780)
                  assert result.returncode==0
                  report=json.loads(dest.read_text())
                  assert report["outcome"]=="success" and not report["unexecuted_ids"] and report["environment_valid"]
                  source=report["source_binding"]
                  assert source["checkout_tree"]==tree and source["checkout_sha"]==head and source["source_valid"]
                  rows={r["canonical_id"]:r for r in report["tests"]}
                  assert rows.keys()==set(cases) and all(r["status"]=="passed" and r["subtest_count"]<=caps[cid] for cid,r in rows.items())
                  runs.append({"pair":pair,"role":role,"report":dest.name,"sha256":hashlib.sha256(dest.read_bytes()).hexdigest()})
          (destination/"provenance.json").write_text(json.dumps({
              "run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"workflow":os.environ["GITHUB_SHA"],
              "runner":platform.machine(),"python":platform.python_version(),"affinity":len(os.sched_getaffinity(0)),
              "gc_thresholds":gc.get_threshold(),"runs":runs},indent=2)+"\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-affected-timing
          path: paired-artifacts
          if-no-files-found: error
