name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      policy_only: ${{ steps.paths.outputs.policy_only }}
      full: ${{ steps.paths.outputs.full }}
      affected_matrix: ${{ steps.paths.outputs.affected_matrix }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
    steps:
      - name: Classify paths and select runtime evidence
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let files = [];
            let labels = [];
            let baseSha;
            let headSha;
            let truncated = false;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
              labels = pr.labels.map(label => label.name);
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              truncated = files.length >= 3000;
            } else {
              const group = context.payload.merge_group;
              baseSha = group.base_sha;
              headSha = group.head_sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,
              });
              files = comparison.data.files || [];
              truncated = files.length >= 300;
              for (const candidate of group.pull_requests || []) {
                if (!candidate.number) continue;
                const response = await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.number,
                });
                labels.push(...response.data.labels.map(label => label.name));
              }
            }

            const paths = files.map(file => file.filename);
            const isRuntime = path =>
              path.startsWith("src/") ||
              path.startsWith("config/") ||
              path === "pyproject.toml";
            const runtime = truncated || paths.some(isRuntime);
            const groups = new Set();
            const add = group => groups.add(group);

            for (const path of paths.filter(isRuntime)) {
              if (path.includes("/git/") || path.includes("session_")) add("git-storage");
              if (path.includes("workspace/") || path.includes("conversation_storage/") || path.includes("conversations/")) {
                add("workspace-session");
                add("workspace-core");
              }
              if (path.includes("writing_artifacts/") || path.endsWith("artifact_proposals.py")) add("artifact-storage");
              if (/provider|codex_adapter|antigravity_adapter|backend\.py/.test(path)) add("provider-process");
              if (/interactive|\/cli\.py|\/cli_context\.py/.test(path)) add("interactive-terminal");
            }

            const full = runtime && (truncated || labels.includes("test:full"));
            const matrix = {include: [...groups].sort().map(group => ({group}))};
            core.setOutput("runtime", String(runtime));
            core.setOutput("policy_only", String(!runtime));
            core.setOutput("full", String(full));
            core.setOutput("affected_matrix", JSON.stringify(matrix));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            core.summary
              .addHeading("Validation selection")
              .addTable([
                [{data: "Runtime paths", header: true}, String(runtime)],
                [{data: "Policy/config only", header: true}, String(!runtime)],
                [{data: "Full suite", header: true}, String(full)],
                [{data: "Affected groups", header: true}, [...groups].sort().join(", ") || "none"],
              ])
              .write();

  static:
    name: Static validation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob("**/*.toml"):
              if ".git" not in path.parts:
                  tomllib.loads(path.read_text(encoding="utf-8"))
          for path in pathlib.Path(".").glob("**/*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'

  fast:
    name: Runtime fast tier
    needs: classify
    if: needs.classify.outputs.runtime == 'true' && needs.classify.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fast runtime tests
        run: PYTHONPATH=src python -m tests.runner run --tier fast --json "$RUNNER_TEMP/fast.json"

  affected:
    name: Affected runtime (${{ matrix.group }})
    needs: classify
    if: needs.classify.outputs.runtime == 'true' && needs.classify.outputs.full != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.affected_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run affected runtime group
        run: PYTHONPATH=src python -m tests.runner run --group "${{ matrix.group }}" --json "$RUNNER_TEMP/affected-${{ matrix.group }}.json"

  full:
    name: Full runtime shard ${{ matrix.shard }}/2
    needs: classify
    if: needs.classify.outputs.runtime == 'true' && needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full runtime shard
        run: PYTHONPATH=src python -m tests.runner run --shard "${{ matrix.shard }}/2" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: ${{ runner.temp }}/full-${{ matrix.shard }}.json
          if-no-files-found: error

  reconcile-full:
    name: Reconcile full runtime suite
    needs: [classify, full]
    if: always() && needs.classify.outputs.full == 'true' && needs.full.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: full-reports
      - name: Reconcile shard evidence
        run: >-
          PYTHONPATH=src python -m tests.runner reconcile
          full-reports/full-1/full-1.json
          full-reports/full-2/full-2.json
          --json "$RUNNER_TEMP/full-reconciled.json"
