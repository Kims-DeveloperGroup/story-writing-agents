name: PR validation
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-host-timing:
    name: 동일 러너에서 전후 비교
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 49
    steps:
      - name: 변경 전 트리 체크아웃
        uses: actions/checkout@v4
        with:
          ref: 4d35c49182a6d77e59a45951b24ff86aa0e0aad6
          path: before
          submodules: recursive
          persist-credentials: false
      - name: 변경 후 트리 체크아웃
        uses: actions/checkout@v4
        with:
          ref: eba278a12b7073522cc09bc35338809c0359c279
          path: after_
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: 동일한 잠금 파일로 의존성 설치
        working-directory: after_
        run: uv sync --locked --all-extras --python "3.11.18" --no-progress
      - name: 정규 검증과 같은 Git 식별 설정
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: 같은 호스트에서 전후 순서를 번갈아 기존 사례 실행
        run: |
          after_/.venv/bin/python - <<'PYTHON'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "paired-artifacts"
          out.mkdir()
          configurations = {'before': {'sha': '4d35c49182a6d77e59a45951b24ff86aa0e0aad6', 'tree': '360b4585588d936e895b0d27efd378de17f2d1ed'}, 'after_': {'sha': 'eba278a12b7073522cc09bc35338809c0359c279', 'tree': '749ee79e59607477ba3faa5817d9b7aec05a7e1c'}}
          case_ids = ['tests.test_artifact_application_contracts.ArtifactApplicationBoundaryTests.test_module_graph_matches_accepted_delta', 'tests.test_artifact_application_store_recovery.ArtifactApplicationBoundaryTests.test_store_is_sole_persistence_interpreter_and_matches_boundary', 'tests.test_artifact_relationship_policy.ArtifactRelationshipBoundaryTests.test_ast_graph_counts_and_cycles_match_accepted_brief', 'tests.test_git_external_operation_inspection.GitExternalOperationInspectionTests.test_contract_adapter_exports_and_dependencies_are_exact', 'tests.test_interactive_controller.ControllerContractTests.test_direct_import_is_clean_and_package_graph_is_acyclic', 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_inventory_edges_cycles_and_sole_dual_importer_match_the_brief', 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_supported_module_surfaces_do_not_expand_the_root_facade', 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_clean_base_wheel_editable_and_compatibility_extra_installs', 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_temporary_base_and_optional_artifacts_exclude_vendored_source', 'tests.test_session_lifecycle.SessionLifecycleContractTests.test_lifecycle_module_is_leaf_and_clean_imports_work', 'tests.test_session_recovery_contracts.SessionRecoveryBoundaryTests.test_clean_import_and_exact_dependencies_match_accepted_delta', 'tests.test_suite_budget.SuiteBudgetTests.test_new_id_increased_subtests_and_relaxed_time_are_rejected', 'tests.test_workspace_session_history.WorkspaceSessionHistoryCompositionTests.test_internal_wrapper_uses_main_root_manifest_and_noncreating_snapshot']
          expected_subtests = {'tests.test_artifact_application_contracts.ArtifactApplicationBoundaryTests.test_module_graph_matches_accepted_delta': 0, 'tests.test_artifact_application_store_recovery.ArtifactApplicationBoundaryTests.test_store_is_sole_persistence_interpreter_and_matches_boundary': 0, 'tests.test_artifact_relationship_policy.ArtifactRelationshipBoundaryTests.test_ast_graph_counts_and_cycles_match_accepted_brief': 0, 'tests.test_git_external_operation_inspection.GitExternalOperationInspectionTests.test_contract_adapter_exports_and_dependencies_are_exact': 0, 'tests.test_interactive_controller.ControllerContractTests.test_direct_import_is_clean_and_package_graph_is_acyclic': 0, 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_inventory_edges_cycles_and_sole_dual_importer_match_the_brief': 22, 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_supported_module_surfaces_do_not_expand_the_root_facade': 0, 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_clean_base_wheel_editable_and_compatibility_extra_installs': 0, 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_temporary_base_and_optional_artifacts_exclude_vendored_source': 0, 'tests.test_session_lifecycle.SessionLifecycleContractTests.test_lifecycle_module_is_leaf_and_clean_imports_work': 0, 'tests.test_session_recovery_contracts.SessionRecoveryBoundaryTests.test_clean_import_and_exact_dependencies_match_accepted_delta': 0, 'tests.test_suite_budget.SuiteBudgetTests.test_new_id_increased_subtests_and_relaxed_time_are_rejected': 4, 'tests.test_workspace_session_history.WorkspaceSessionHistoryCompositionTests.test_internal_wrapper_uses_main_root_manifest_and_noncreating_snapshot': 0}
          assert len(case_ids) == len(set(case_ids)) == len(expected_subtests)
          assert platform.machine() == "aarch64" and platform.python_version() == "3.11.18"
          for label, identity in configurations.items():
              folder = root / label
              expected = [identity["sha"], identity["tree"]]
              obtained = subprocess.check_output(
                  ["git", "rev-parse", "HEAD", "HEAD^{tree}"], cwd=folder, text=True
              ).splitlines()
              assert obtained == expected
          for name in ("uv.lock", "pyproject.toml", ".gitmodules"):
              assert (root / "before" / name).read_bytes() == (root / "after_" / name).read_bytes()
          arguments = [value for cid in case_ids for value in ("--id", cid)]
          observations = []
          for pair in range(3):
              order = ("before", "after_") if pair % 2 == 0 else ("after_", "before")
              for label in order:
                  filename = f"{pair + 1}-{label}"
                  folder = root / label
                  dest = out / (filename + ".json")
                  with (out / (filename + ".log")).open("wb") as log:
                      subprocess.run(
                          [sys.executable, "-m", "tests.runner", "run", *arguments, "--json", str(dest)],
                          env={**os.environ, "PYTHONPATH": "src"},
                          cwd=folder, stdout=log, stderr=subprocess.STDOUT, timeout=460, check=True,
                      )
                  report = json.loads(dest.read_text())
                  actual = {item["canonical_id"]: item for item in report["tests"]}
                  assert set(actual) == set(case_ids) and len(report["tests"]) == len(case_ids)
                  assert all(r["status"] == "passed" and r["subtest_count"] == expected_subtests[cid] for cid, r in actual.items())
                  assert report["canonical_manifest"]["count"] == 2544
                  assert subprocess.check_output(
                      ["git", "rev-parse", "HEAD", "HEAD^{tree}"], cwd=folder, text=True
                  ).splitlines() == [configurations[label]["sha"], configurations[label]["tree"]]
                  assert not subprocess.check_output(["git", "diff", "--name-only"], cwd=folder).strip()
                  assert not subprocess.check_output(["git", "diff", "--cached", "--name-only"], cwd=folder).strip()
                  observations.append({"pair": pair + 1, "source": label, "report": dest.name,
                                       "sha256": hashlib.sha256(dest.read_bytes()).hexdigest()})
          provenance = {
              "source": configurations, "case_ids": case_ids, "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "runner": platform.machine(),
              "python": platform.python_version(), "system": platform.system(),
              "available_cores": len(os.sched_getaffinity(0)), "observations": observations,
          }
          (out / "paired-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print("Matched pairs:", len(observations) // 2)
          PYTHON
      - name: 동일 호스트 측정 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-host-timing
          path: paired-artifacts
          if-no-files-found: error
