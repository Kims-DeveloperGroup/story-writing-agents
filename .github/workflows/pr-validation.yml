              return report, {'identity': {'workflow_actor_sha': OLD_ACTOR, 'actual_checkout_sha': OLD_ACTOR, 'actual_checkout_tree': OLD_TREE, 'accepted_code_source_sha': SOURCE, 'accepted_code_source_tree': SOURCE_TREE, 'run_id': str(OLD_RUN), 'run_attempt': 1}, 'totals': report['totals'], 'durations': report['durations'], 'source_binding': report['source_binding'], 'original_run_conclusion': 'failure', 'original_GREEN_step_conclusion': 'success', 'raw_member_hashes': {k: sha(v) for k, v in raw.items()}, 'immutable_inputs': inputs, 'CRC_all_members': True}

          def check_hardware(hardware, actor, run, attempt, environment):
              need(hardware['status'] == 'passed' and hardware['cpu_count'] == hardware['available_cpu_count'] == 4, 'hardware gate mismatch')
              need(hardware['hardware_process_gc'] == GC_DEFAULT and not hardware['diagnostic_gc_requested'] and not hardware['diagnostic_profile_requested'], 'GC/profile controls differ')
              need(hardware['native_workflow_sha'] == actor and hardware['run_id'] == run and hardware['run_attempt'] == attempt, 'hardware native identity mismatch')
              need(hardware['python_executable'] == environment['executable'] == sys.executable and hardware['python_version'] == environment['python_version'] == '3.11.18', 'execution interpreter differs')
              need(environment['python_implementation'] == 'CPython' and environment['machine'] == 'aarch64', 'execution runtime differs')

          def identity(repo):
              actor = os.environ['GITHUB_SHA']; head = git(repo, 'rev-parse', 'HEAD').decode().strip()
              need(head == actor and actor not in (SOURCE, OLD_ACTOR), 'new actor/actual checkout identity mismatch')
              headers = git(repo, 'cat-file', '-p', head).split(b'\n\n', 1)[0].splitlines()
              parents = [line.split()[1].decode() for line in headers if line.startswith(b'parent ')]
              need(parents == [SOURCE], 'new raw commit must have sole parent S')
              need(git(repo, 'rev-parse', SOURCE + '^{tree}').decode().strip() == SOURCE_TREE, 'source S object/tree unavailable or different; checkout depth2 required')
              need(git(repo, 'diff', '--name-only', SOURCE, actor).decode().splitlines() == [WORKFLOW] and not tracked_diff(repo), 'new actor contains non-WF or working-source changes')
              need(sha(git(repo, 'show', SOURCE + ':' + WORKFLOW)) == WORKFLOW_SHA, 'original WF pin mismatch')
              return {'workflow_actor_sha': actor, 'actual_checkout_sha': head, 'actual_checkout_tree': git(repo, 'rev-parse', 'HEAD^{tree}').decode().strip(), 'accepted_code_source_sha': SOURCE, 'accepted_code_source_tree': SOURCE_TREE, 'actor_only_diff': [WORKFLOW], 'parent_proof': 'raw git cat-file commit headers, not shallow git-show traversal', 'workflow_actor_sha256': sha((repo / WORKFLOW).read_bytes()), 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}

          def main():
              p = argparse.ArgumentParser(description=__doc__)
              for name in ('green-zip', 'green-native-run', 'green-native-jobs', 'green-native-artifact', 'green-native-commit', 'green-native-compare', 'current-hardware', 'output-dir'):
                  p.add_argument('--' + name, type=Path, required=True)
              args = p.parse_args(); repo = Path.cwd().resolve(); out = args.output_dir.resolve(); out.mkdir(parents=True, exist_ok=True)
              summary_path = out / 'feedback-probe-premise-summary-v2.json'; need(not summary_path.exists(), 'refuse earlier V2 result overwrite')
              result = {'schema_version': 2, 'issue': 1046, 'kind': 'before_shared_premise_witness_recovery', 'qualified': False, 'performance_PASS': None, 'new_scenarios': 0, 'new_GREEN_invocations': 0, 'mutant_runner_invocations': 0, 'same_existing_case': CASE}
              original = None; mutant = None; target = repo / PRODUCER; modified = False; pgid = None; tee = None
              try:
                  need(os.environ.get('GITHUB_ACTIONS') == 'true', 'execute only in official Actions')
                  need(os.environ.get('OBSERVE_GC') != 'true' and os.environ.get('PROFILE_SELECTION') != 'true', 'diagnostic controls forbidden')
                  ident = identity(repo); result['identity'] = ident
                  original = target.read_bytes(); need(sha(original) == PRODUCER_SHA, 'current producer pin mismatch')
                  green, reused = reused_green(args, out); result['reused_green'] = reused
                  need(green['environment']['dependency_lock_sha256'] == sha(git(repo, 'show', SOURCE + ':uv.lock')), 'original runtime lock differs from S')
                  hardware_path = args.current_hardware.resolve(); need(hardware_path.is_relative_to(out), 'current hardware must be archived')
                  check_hardware(load(hardware_path), ident['workflow_actor_sha'], ident['run_id'], ident['run_attempt'], green['environment'])
                  current_control_path = hardware_path.parent / 'fast-control.json'; current_argv_path = hardware_path.parent / 'fast-selection-argv.txt'
                  current_control = load(current_control_path)
                  need(all(current_control[k] == v for k, v in FIXED.items()) and 0 < current_control['worker_limit_seconds'] <= 3150, 'current fixed control mismatch')
                  need(current_argv_path.read_text().splitlines() == ['--id', CASE], 'current selector differs from reused GREEN')
                  need(not (hardware_path.parent / 'fast.json').exists(), 'recovery must not execute or manufacture a new GREEN report')
                  result['current_header_inputs'] = {key: {'relative_path': str(path.relative_to(out)), 'sha256': sha(path.read_bytes())} for key, path in [('hardware', hardware_path), ('control', current_control_path), ('selection_argv', current_argv_path)]}
                  write_new(out / 'feedback-probe-program-v2.py', Path(__file__).read_bytes())
                  write_new(out / 'feedback-probe-source-before-v2.py', original)
                  mutant, spec = mutation(original); result['mutation'] = spec
                  write_new(out / 'feedback-probe-source-mutant-v2.py', mutant)
                  epoch = int(time.time()); deadline = int(os.environ['TEST_JOB_DEADLINE']); run_deadline = int(os.environ['TEST_RUN_DEADLINE'])
                  need(deadline <= run_deadline, 'current job deadline exceeds original run deadline')
                  seconds = min(3150, deadline - epoch - 450); need(seconds > 0, 'original recovery job window exhausted; do not reset')
                  red_report = out / 'feedback-probe-mutant-v2.json'; red_log = out / 'feedback-probe-mutant-v2.log'
                  command = ['timeout', '--signal=INT', '--kill-after=30s', str(seconds) + 's', 'env', 'PYTHONPATH=src', sys.executable, '-m', 'tests.runner', 'run', '--json', str(red_report), '--id', CASE]
                  need(shutil.which('timeout') and shutil.which('tee'), 'native timeout/tee unavailable')
                  control_red = {**current_control, 'worker_limit_seconds': seconds, 'budget_computed_epoch': epoch, 'original_TEST_JOB_DEADLINE': deadline, 'original_TEST_RUN_DEADLINE': run_deadline, 'budget_formula': 'min(3150, original current-job TEST_JOB_DEADLINE - now - 450)', 'argv': command, 'recovery_window': 'new authorized job original cutoff; no in-job reset; not old expired job window'}
                  json_new(out / 'feedback-probe-mutant-control-v2.json', control_red)
                  write_new(out / 'feedback-probe-mutant-selection-argv-v2.txt', ('--id\n' + CASE + '\n').encode())
                  target.write_bytes(mutant); modified = True
                  need(target.read_bytes() == mutant and git(repo, 'diff', '--name-only').decode().splitlines() == [PRODUCER], 'mutation changed unexpected source')
                  proc = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, cwd=repo, start_new_session=True)
                  pgid = proc.pid; result['mutant_runner_invocations'] = 1
                  tee = subprocess.Popen(['tee', str(red_log)], stdin=proc.stdout); proc.stdout.close()
                  result['mutant_exit_code'] = proc.wait(); result['process_cleanup'] = reap_group(pgid, 30); pgid = None
                  result['tee_exit_code'] = tee.wait(timeout=30)
                  write_new(out / 'feedback-probe-mutant-exit-code-v2.txt', (str(result['mutant_exit_code']) + '\n').encode())
                  need(result['mutant_exit_code'] == 1 and result['tee_exit_code'] == 0, 'unexpected mutant/pipeline exit')
                  need(result['process_cleanup']['process_group_absent'] and not result['process_cleanup']['actions'], 'outer process group required forced cleanup')
                  red = load(red_report); need(red['schema_version'] == 2, 'mutant schema differs'); check_report(red, True, ident)
                  need(red['environment'] == green['environment'], 'actual reused-GREEN/mutant execution environments differ')
                  need(git(repo, 'diff', '--name-only').decode().splitlines() == [PRODUCER], 'mutant left unrelated tracked changes')
                  result['mutant_totals'] = red['totals']; result['mutant_durations'] = red['durations']; result['mutant_source_binding'] = red['source_binding']
                  result['domain_RED_validated'] = True
              except BaseException as error:
                  result['error'] = {'type': type(error).__name__, 'message': str(error), 'traceback': traceback.format_exc()}
              finally:
                  result['cleanup_proof_scope'] = 'canonical completed1/detail1 and raw log; outer timeout process-group absence only, not enumeration of all nested children'
                  if tee is not None and tee.poll() is None:
                      try:
                          result['tee_final_exit_code'] = tee.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          tee.kill(); result['tee_final_exit_code'] = tee.wait(timeout=30); result['error'] = {'type': 'CleanupError', 'message': 'tee required forced cleanup'}
                  if pgid is not None:
                      result['interrupted_process_cleanup'] = reap_group(pgid, 30)
                  if modified:
                      try:
                          need(target.read_bytes() == mutant, 'unexpected current source; refuse overwriting another edit')
                          target.write_bytes(original); need(target.read_bytes() == original and sha(target.read_bytes()) == PRODUCER_SHA, 'source restoration failed')
                          write_new(out / 'feedback-probe-source-restored-v2.py', target.read_bytes())
                          result['restoration'] = {'verified': True, 'sha256': sha(target.read_bytes()), 'tracked_diff_after': tracked_diff(repo)}
                          need(not result['restoration']['tracked_diff_after'], 'tracked diff remains after restoration')
                      except BaseException as error:
                          result['restoration'] = {'verified': False, 'error': str(error)}
                  else:
                      result['restoration'] = {'verified': original is not None and target.read_bytes() == original, 'mutation_not_started': True}
                  result['artifacts'] = {path.name: pin(path) for path in out.glob('feedback-probe-*') if path.is_file() and path != summary_path}
                  result['qualified'] = bool(result.get('domain_RED_validated') and result['restoration'].get('verified') and not result.get('error'))
                  json_new(summary_path, result)
              print(json.dumps({'summary': str(summary_path), 'qualified': result['qualified'], 'performance_PASS': None}))
              return 0 if result['qualified'] else 1

          if __name__ == '__main__':
              def interrupted(signum, _frame):
                  raise InterruptedError('official witness interrupted by signal ' + str(signum))
              signal.signal(signal.SIGTERM, interrupted); signal.signal(signal.SIGINT, interrupted)
              raise SystemExit(main())
          PY_1046_RED_V2
          .venv/bin/python "$RUNNER_TEMP/feedback-probe-before-premise-witness-program-v2.py" \
            --green-zip "$RUNNER_TEMP/feedback-probe-v1-inputs/original-v1.zip" \
            --green-native-run "$RUNNER_TEMP/feedback-probe-v1-inputs/native-run.json" \
            --green-native-jobs "$RUNNER_TEMP/feedback-probe-v1-inputs/native-jobs.json" \
            --green-native-artifact "$RUNNER_TEMP/feedback-probe-v1-inputs/native-artifact.json" \
            --green-native-commit "$RUNNER_TEMP/feedback-probe-v1-inputs/native-commit.json" \
            --green-native-compare "$RUNNER_TEMP/feedback-probe-v1-inputs/native-compare.json" \
            --current-hardware "$RUNNER_TEMP/runner-hardware-fast.json" \
            --output-dir "$RUNNER_TEMP"
      - name: 수정 전 피드백 소스 준비
        if: inputs.compare_feedback_baseline == true && needs.classify.outputs.affected_only == 'true'
        uses: actions/checkout@v4
        with:
          ref: 45cf084f0d28eb5926863e90509e5f14bbd3497e
          submodules: recursive
          path: .feedback-baseline
      - name: 같은 환경에서 수정 전 RED와 GREEN 측정
        if: inputs.compare_feedback_baseline == true && needs.classify.outputs.affected_only == 'true'
        run: |
          set -e
          cmp pyproject.toml .feedback-baseline/pyproject.toml
          cmp uv.lock .feedback-baseline/uv.lock
          cmp .gitmodules .feedback-baseline/.gitmodules
          test "$(git ls-tree HEAD vendor/)" = "$(git -C .feedback-baseline ls-tree HEAD vendor/)"
          cd .feedback-baseline
          baseline_ids=()
          while IFS= read -r identifier; do
            baseline_ids+=(--id "$identifier")
          done <<< "$AFFECTED_IDS"
          baseline_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( baseline_seconds > 3150 )); then baseline_seconds=3150; fi
          if (( baseline_seconds <= 0 )); then exit 124; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$baseline_seconds" > "$RUNNER_TEMP/feedback-probe-baseline-affected-control.json"
          baseline_runner=("$GITHUB_WORKSPACE/.venv/bin/python" -m tests.runner run "${baseline_ids[@]}" --json "$RUNNER_TEMP/feedback-probe-baseline-affected.json")
          if [[ "$PROFILE_SELECTION" == "true" ]]; then
            baseline_runner=("$GITHUB_WORKSPACE/.venv/bin/python" -m cProfile -o "$RUNNER_TEMP/case-profile-baseline.prof" -m tests.runner run "${baseline_ids[@]}" --json "$RUNNER_TEMP/case-profile-baseline.json")
          fi
          set +e
          timeout --signal=INT --kill-after=30s "${baseline_seconds}s" env PYTHONPATH=src "${baseline_runner[@]}" 2>&1 | tee "$RUNNER_TEMP/feedback-probe-baseline-affected.log"
          baseline_statuses=("${PIPESTATUS[@]}")
          set -e
          baseline_status=${baseline_statuses[0]}
          if (( baseline_status == 0 && baseline_statuses[1] != 0 )); then baseline_status=${baseline_statuses[1]}; fi
          if (( baseline_status != 0 )); then exit "$baseline_status"; fi
          if [[ "$PROFILE_SELECTION" != "true" ]]; then
            PYTHONPATH=src "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tests/feedback_probe.py" \
              --repository-root "$PWD" --witness "$FEEDBACK_WITNESS" --json "$RUNNER_TEMP/feedback-probe-baseline.json"
          fi
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: ${{ needs.classify.outputs.affected_only == 'true' && 'runtime-affected' || 'runtime-fast' }}
          path: |
            ${{ runner.temp }}/fast.json
            ${{ runner.temp }}/fast.log
            ${{ runner.temp }}/fast-control.json
            ${{ runner.temp }}/feedback-probe*
            ${{ runner.temp }}/gc-diagnostic*
            ${{ runner.temp }}/case-profile-*
            ${{ runner.temp }}/fast-exit-code.txt
            ${{ runner.temp }}/fast-selection-argv.txt
            ${{ runner.temp }}/runner-hardware-fast.json
          if-no-files-found: warn

  full:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only full-suite notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial full-suite notice (not run)' || needs.classify.outputs.manual_mode == 'true' && 'Manual partial full-suite notice (not run)' || format('Full runtime shard {0}/5', matrix.shard) }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: '75'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    timeout-minutes: 75
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.RUNTIME_TEST_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python "$RUNTIME_TEST_PYTHON_VERSION" --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json"
          TEST_HARDWARE_SELECTION: "shard:${{ matrix.shard }}/5"
          TEST_HARDWARE_SHARD: "${{ matrix.shard }}/5"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Run full runtime shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3600 )); then test_seconds=3600; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json"
          if (( test_seconds < 3600 )); then
            printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\n' "$test_seconds" >&2
            printf '124\n' > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
            exit 124
          fi
          test_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ["TEST_JOB_DEADLINE"]),int(os.environ["TEST_RUN_DEADLINE"]))-450; sys.exit("Insufficient remaining time for a full test hour") if w > cutoff else print(w)')
          .venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile="audited-163-v9",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+"\n")' "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json" "$test_work_deadline"
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/5" --hosted-methods audited-163-v9 --hosted-deadline-epoch "$test_work_deadline" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.shard }}.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.shard }}.json
            ${{ runner.temp }}/full-${{ matrix.shard }}.json.methods/
            ${{ runner.temp }}/full-${{ matrix.shard }}.log
            ${{ runner.temp }}/full-${{ matrix.shard }}-control.json
            ${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json
          if-no-files-found: error

  whole-front:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only whole-front notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial whole-front notice (not run)' || needs.classify.outputs.affected_only == 'true' && 'Affected-only whole-front notice (not run)' || 'Whole-front runtime shard 5/5' }}
    needs: [classify, static]
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.whole_front_only == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: '75'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    timeout-minutes: 75
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.RUNTIME_TEST_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python "$RUNTIME_TEST_PYTHON_VERSION" --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-full-5.json"
          TEST_HARDWARE_SELECTION: "shard:5/5"
          TEST_HARDWARE_SHARD: "5/5"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Verify five-shard policy before the whole-front window
        timeout-minutes: 3
        run: |
          policy_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 - 3600 ))
          if (( policy_seconds > 120 )); then policy_seconds=120; fi
          if (( policy_seconds <= 0 )); then
            echo "Insufficient shared time for policy checks and the complete whole-front hour." >&2
            exit 124
          fi
          timeout --signal=INT --kill-after=30s "${policy_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --module tests.test_suite_budget --json "$RUNNER_TEMP/whole-front-policy.json" 2>&1 | tee "$RUNNER_TEMP/whole-front-policy.log"
          policy_statuses=("${PIPESTATUS[@]}")
          policy_status=${policy_statuses[0]}
          if (( policy_status == 0 && policy_statuses[1] != 0 )); then policy_status=${policy_statuses[1]}; fi
          printf '%s\n' "$policy_status" > "$RUNNER_TEMP/whole-front-policy-exit-code.txt"
          exit "$policy_status"
      - name: Run dedicated whole-front shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3600 )); then test_seconds=3600; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/full-5-control.json"
          if (( test_seconds < 3600 )); then
            printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\n' "$test_seconds" >&2
            printf '124\n' > "$RUNNER_TEMP/full-5-exit-code.txt"
            exit 124
          fi
          test_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ["TEST_JOB_DEADLINE"]),int(os.environ["TEST_RUN_DEADLINE"]))-450; sys.exit("Insufficient remaining time for a full test hour") if w > cutoff else print(w)')
          .venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile="audited-163-v9",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+"\n")' "$RUNNER_TEMP/full-5-control.json" "$test_work_deadline"
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "5/5" --hosted-methods audited-163-v9 --hosted-deadline-epoch "$test_work_deadline" --json "$RUNNER_TEMP/full-5.json" 2>&1 | tee "$RUNNER_TEMP/full-5.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-5-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-5
          path: |
            ${{ runner.temp }}/full-5.json
            ${{ runner.temp }}/full-5.json.methods/
            ${{ runner.temp }}/full-5.log
            ${{ runner.temp }}/full-5-control.json
            ${{ runner.temp }}/full-5-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-5.json
            ${{ runner.temp }}/whole-front-policy.json
            ${{ runner.temp }}/whole-front-policy.log
            ${{ runner.temp }}/whole-front-policy-exit-code.txt
          if-no-files-found: error

  reconcile-full:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only reconciliation notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial reconciliation notice (not run)' || needs.classify.outputs.manual_mode == 'true' && 'Manual partial reconciliation notice (not run)' || 'Reconcile full runtime suite' }}
    needs: [classify, full, whole-front]
    if: >-
      !cancelled() && needs.classify.outputs.full == 'true' &&
      (needs.full.result == 'success' || needs.full.result == 'failure') &&
      (needs.whole-front.result == 'success' || needs.whole-front.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TEST_JOB_MINUTES: '60'
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: ${{ runner.temp }}/full-reports
      - name: Reconcile shard evidence
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds <= 0 )); then
            echo "Reconciliation deadline exhausted; preserve 30s termination, 60s upload, and 360s cancellation reserve."
            exit 124
          fi
          PYTHONPATH=src timeout --signal=INT --kill-after=30s "${test_seconds}s" \
            python -m tests.runner reconcile \
            "$RUNNER_TEMP/full-reports/full-1/full-1.json" "$RUNNER_TEMP/full-reports/full-2/full-2.json" \
            "$RUNNER_TEMP/full-reports/full-3/full-3.json" "$RUNNER_TEMP/full-reports/full-4/full-4.json" \
            "$RUNNER_TEMP/full-reports/full-5/full-5.json" \
            --json "$RUNNER_TEMP/full-reconciled.json"
      - name: Enforce frozen suite inventory and wall-time budget
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          WALL_TIME_EXCEPTION: ${{ needs.classify.outputs.wall_time_exception }}
        run: |
          budget_args=(--base-ref "$BASE_SHA"
            --report "$RUNNER_TEMP/full-reports/full-1/full-1.json"
            --report "$RUNNER_TEMP/full-reports/full-2/full-2.json"
            --report "$RUNNER_TEMP/full-reports/full-3/full-3.json"
            --report "$RUNNER_TEMP/full-reports/full-4/full-4.json"
            --report "$RUNNER_TEMP/full-reports/full-5/full-5.json")
          if [[ "$WALL_TIME_EXCEPTION" == "true" ]]; then
            echo "Maintainer-authorized wall-time exception: measured durations remain visible."
            budget_args+=(--allow-wall-time-overage)
          fi
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds <= 0 )); then
            echo "Reconciliation deadline exhausted before inventory and wall-time checks."
            exit 124
          fi
          PYTHONPATH=src timeout --signal=INT --kill-after=30s "${test_seconds}s" \
            python -m tests.suite_budget "${budget_args[@]}"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: runtime-full-reconciled
          path: ${{ runner.temp }}/full-reconciled.json
          if-no-files-found: warn
