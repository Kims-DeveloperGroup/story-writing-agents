          caps={'tests.test_antigravity_adapter.AntigravityAdapterTests.test_backend_routes_and_persists_antigravity_conversation_id': 0, 'tests.test_antigravity_command.AntigravityCommandTests.test_command_stdin_paths_and_fresh_resume_results_are_exact': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_all_phases_direct_and_retrieval_conversation_are_correlated': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_cancellation_and_timeout_terminate_without_orphans': 2, 'tests.test_antigravity_parity.AntigravityParityTests.test_completed_rejection_artifacts_match_codex_for_debate_and_conversation': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_missing_executable_preserves_compatible_thread': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_mixed_provider_dispatch_and_thread_locks_are_independent': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_only_provider_known_same_state_conversations_can_resume': 2, 'tests.test_antigravity_parity.AntigravityParityTests.test_protocol_failures_are_fixed_taint_once_and_restart_fresh': 16, 'tests.test_antigravity_parity.AntigravityParityTests.test_reference_read_mixed_batch_preserves_sequence_and_privacy': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_retrieval_failure_after_observation_taints_and_restarts': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_schema_failure_repairs_then_falls_back_with_runtime_identity': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_timeout_escalates_to_kill_when_terminate_is_ignored': 0, 'tests.test_antigravity_parity.AntigravityParityTests.test_v2_lifecycle_partitions_threads_and_retains_exact_resume': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_a_to_b_to_a_route_generation_never_resumes_old_a_threads_after_restart': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_backend_defaults_snapshot_refresh_and_thread_identity_are_exact': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_completed_rejections_report_each_attempt_and_repaired_success': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_configured_provider_rejection_is_typed_stderr_free_and_safe': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_context_sink_records_prepared_submitted_and_cancellation_once': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_conversation_cancellation_taints_then_restarts_cleanly': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_conversation_nonzero_exit_uses_fixed_stderr_free_error': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_conversation_output_repairs_once_then_returns_safe_fallback': 10, 'tests.test_codex_backend.CodexBackendTestCase.test_conversation_request_snapshots_derived_event_content': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_conversation_thread_spans_subjects_and_restarts_on_fingerprint': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_debate_and_conversation_capture_order_scope_and_exact_bodies': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_debate_and_conversation_rejections_repair_then_fall_back_and_capture': 2, 'tests.test_codex_backend.CodexBackendTestCase.test_debate_context_is_the_only_additive_payload_field': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_debate_nonzero_exit_uses_fixed_stderr_free_error': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_diagnostic_failure_does_not_replace_provider_failure_or_taint': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_every_sink_control_failure_is_observational_only': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_hot_same_provider_profile_applies_now_and_reuses_thread': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_invalid_utf8_provider_stderr_is_never_decoded_or_persisted': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_invoke_and_converse_share_one_serialized_thread': 0, 'tests.test_codex_backend.CodexBackendTestCase.test_local_reference_drift_stops_before_provider': 