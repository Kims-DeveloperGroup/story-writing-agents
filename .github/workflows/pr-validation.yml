            "path": "${{ runner.temp }}/full-5.json\n${{ runner.temp }}/full-5.json.methods/\n${{ runner.temp }}/full-5.log\n${{ runner.temp }}/full-5-control.json\n${{ runner.temp }}/full-5-exit-code.txt\n${{ runner.temp }}/runner-hardware-full-5.json\n${{ runner.temp }}/whole-front-policy.json\n${{ runner.temp }}/whole-front-policy.log\n${{ runner.temp }}/whole-front-policy-exit-code.txt\n${{ runner.temp }}/whole-front-v52/\n${{ runner.temp }}/whole-front-py-spy-help.txt\n",
            "if-no-files-found": "error"
