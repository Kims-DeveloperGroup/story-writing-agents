    "reconcile-full": {
      "name": "Reconcile full runtime suite",
      "needs": [
        "classify",
        "full",
        "whole-front"
      ],
      "if": "!cancelled() && needs.classify.outputs.full == 'true' && (needs.full.result == 'success' || needs.full.result == 'failure') && (needs.whole-front.result == 'success' || needs.whole-front.result == 'failure')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "TEST_JOB_MINUTES": "60",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "full-*",
            "path": "full-reports"
          }
        },
        {
          "name": "Reconcile shard evidence",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds <= 0 )); then\n  echo \"Reconciliation deadline exhausted; preserve 30s termination, 60s upload, and 360s cancellation reserve.\"\n  exit 124\nfi\nPYTHONPATH=src timeout --signal=INT --kill-after=30s \"${test_seconds}s\" \\\n  python -m tests.runner reconcile \\\n  full-reports/full-1/full-1.json full-reports/full-2/full-2.json \\\n  full-reports/full-3/full-3.json full-reports/full-4/full-4.json \\\n  full-reports/full-5/full-5.json \\\n  --json \"$RUNNER_TEMP/full-reconciled.json\"\n"
        },
        {
          "name": "Enforce frozen suite inventory and wall-time budget",
          "env": {
            "BASE_SHA": "${{ needs.classify.outputs.base_sha }}",
            "WALL_TIME_EXCEPTION": "${{ needs.classify.outputs.wall_time_exception }}"
          },
          "run": "budget_args=(--base-ref \"$BASE_SHA\"\n  --report full-reports/full-1/full-1.json\n  --report full-reports/full-2/full-2.json\n  --report full-reports/full-3/full-3.json\n  --report full-reports/full-4/full-4.json\n  --report full-reports/full-5/full-5.json)\nif [[ \"$WALL_TIME_EXCEPTION\" == \"true\" ]]; then\n  echo \"Maintainer-authorized wall-time exception: measured durations remain visible.\"\n  budget_args+=(--allow-wall-time-overage)\nfi\ntest_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds <= 0 )); then\n  echo \"Reconciliation deadline exhausted before inventory and wall-time checks.\"\n  exit 124\nfi\nPYTHONPATH=src timeout --signal=INT --kill-after=30s \"${test_seconds}s\" \\\n  python -m tests.suite_budget \"${budget_args[@]}\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "runtime-full-reconciled",
            "path": "${{ runner.temp }}/full-reconciled.json",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {}
  }
}
