ons\", wrong_type, json.dumps(wrong_type)),\n        )\n        REPORT[\"fixture\"] = {\n            \"profile\": {\"intent\": intent, \"activity\": activity, \"domains\": domains, \"roles\": roles},\n            \"active_specialists\": active,\n            \"family\": family,\n            \"outer_schema_id\": packet[\"agent_action\"][\"schema_id\"],\n            \"inner_schema_id\": packet[\"agent_action\"][\"task_result\"][\"schema_id\"],\n            \"mutation_path\": \"$.\" + \".\".join(assignment_path) + \".task_instructions\",\n            \"input_summaries\": [\n                {\"name\": name, \"bytes\": len(encoded.encode(\"utf-8\")),\n                 \"sha256\": hashlib.sha256(encoded.encode(\"utf-8\")).hexdigest()}\n                for name, _value, encoded in inputs\n            ],\n            \"original_profile_case_reference\": \"tests/test_lead_orchestration.py:3403-3586\",\n            \"not_a_canonical_execution_id\": True,\n        }\n        finish_stage(\"actual_profile_packet\", started)\n\n        def full_findings(name, value):\n            findings = profile_binding.rule_graph.findings(value)\n            assert bool(findings) == (name != \"positive\"), (name, findings)\n            return {\"findings\": list(findings)}\n\n        def decode(name, encoded):\n            if name == \"positive\":\n                decoded = profile_binding.decode_response(encoded)\n                assert json.loads(decoded.answer_json) == expected_answer\n                return {\"semantic_answer_matches_original_oracle\": True}\n            try:\n                profile_binding.decode_response(encoded)\n            except ValueError as error:\n                assert re.fullmatch(\n                    r\"LEAD_(ACTION_ENVELOPE|SCHEMA_ID|PAIRED_SCHEMA_ID|SCHEMA_RULE)_REJECTED\", str(error)\n                ), (type(error).__name__, str(error))\n                return {\"rejection_type\": type(error).__name__, \"rejection\": str(error)}\n            raise Assert