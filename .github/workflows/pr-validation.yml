{
  "name": "Issue 873 whole-front external 60-minute sampling v52",
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "concurrency": {
    "group": "issue873-whole-front-v52",
    "cancel-in-progress": false
  },
  "jobs": {
    "workflow-deadline": {
      "name": "Enforce 75-minute workflow limit",
      "if": "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 75,
      "permissions": {
        "actions": "write"
      },
      "steps": [
        {
          "name": "Enforce total workflow deadline",
          "uses": "actions/github-script@v7",
          "with": {
            "retries": 0,
            "script": "const parameters = () => ({\n  ...context.repo,\n  run_id: context.runId,\n  request: {signal: AbortSignal.timeout(5000)},\n});\nconst attempt = Number(process.env.GITHUB_RUN_ATTEMPT);\nif (!Number.isSafeInteger(attempt) || attempt < 1) {\n  core.setFailed(\"Missing workflow attempt identity.\");\n  return;\n}\n// Metadata retries never grant a new test budget.\nconst metadataDeadline = Date.now() + 30_000;\nlet deadline;\nlet cancellationRequested = false;\nasync function currentRun() {\n  const {data: run} = await github.rest.actions.getWorkflowRun(parameters());\n  if (run.id !== context.runId || run.run_attempt !== attempt) {\n    core.setFailed(\"Workflow attempt changed; the stale guard cannot cancel it.\");\n    return null;\n  }\n  if (run.status === \"completed\") return null;\n  const created = Date.parse(run.created_at);\n  if (!Number.isFinite(created)) throw new Error(\"Missing workflow creation time.\");\n  const runDeadline = created + 75 * 60 * 1000;\n  deadline = deadline === undefined ? runDeadline : Math.min(deadline, runDeadline);\n  if (Date.now() >= deadline - 30_000) {\n    core.setFailed(\"Workflow guard shutdown margin reached; no safe control window remains.\");\n    return null;\n  }\n  return run;\n}\nwhile (Date.now() < (deadline === undefined ? metadataDeadline : deadline - 30_000)) {\n  try {\n    if (!await currentRun()) return;\n    let complete;\n    try {\n      const {data: page} = await github.rest.actions.listJobsForWorkflowRunAttempt({\n        ...parameters(), attempt_number: attempt, per_page: 100,\n      });\n      if (!Number.isSafeInteger(page.total_count) || page.total_count > 100 ||\n          !Array.isArray(page.jobs) || page.total_count !== page.jobs.length) {\n        throw new Error(\"Cannot establish the complete validation job list.\");\n      }\n      // A marker covers downstream jobs absent from an earlier API snapshot.\n      complete = page.jobs.find(job => job.name === \"Validation jobs complete\");\n    } catch (error) {\n      // Job-list failures cannot prevent cancellation at the deadline.\n      core.warning(`Completion lookup failed: ${error.message}`);\n    }\n    if (Date.now() < deadline && complete?.status === \"completed\" &&\n        [\"success\", \"failure\"].includes(complete.conclusion)) {\n      core.info(\"All validation jobs finished within the workflow deadline.\");\n      return;\n    }\n    if (Date.now() >= deadline - 330_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; force-cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.request(\"POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel\", parameters());\n      return;\n    }\n    if (!cancellationRequested && Date.now() >= deadline - 360_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.rest.actions.cancelWorkflowRun(parameters());\n      cancellationRequested = true;\n    }\n  } catch (error) {\n    core.warning(`Deadline control request failed: ${error.message}`);\n  }\n  const remaining = (deadline === undefined ? metadataDeadline : deadline - 30_000) - Date.now();\n  const poll = deadline !== undefined && deadline - Date.now() > 390_000 ? 30_000 : 5000;\n  if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(poll, remaining)));\n}\ncore.setFailed(\"Workflow deadline enforcement could not complete within its bounded window.\");\n"
          }
        }
      ]
    },
    "validation-complete": {
      "name": "Validation jobs complete",
      "needs": [
        "classify",
        "static",
        "fast",
        "full",
        "whole-front",
        "reconcile-full"
      ],
      "if": "${{ !cancelled() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {},
      "steps": [
        {
          "name": "Mark validation jobs terminal",
          "timeout-minutes": 1,
          "env": {
            "WHOLE_FRONT_ONLY": "${{ needs.classify.outputs.whole_front_only }}"
          },
          "run": "echo \"Validation jobs are terminal; their individual results remain authoritative.\"\nif [[ \"$WHOLE_FRONT_ONLY\" == \"true\" ]]; then\n  echo \"Partial validation: whole-front shard 5/5 only; no complete-suite credit.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\nfi\n"
        }
      ]
    },
    "classify": {
      "name": "Pin external whole-front diagnostic source",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read",
        "pull-requests": "read",
        "actions": "read"
      },
      "outputs": {
        "whole_front_only": "${{ steps.paths.outputs.whole_front_only }}",
        "test_run_deadline": "${{ steps.paths.outputs.test_run_deadline }}",
        "runtime": "${{ steps.paths.outputs.runtime }}",
        "policy_only": "${{ steps.paths.outputs.policy_only }}",
        "full": "${{ steps.paths.outputs.full }}",
        "wall_time_exception": "${{ steps.paths.outputs.wall_time_exception }}",
        "base_sha": "${{ steps.paths.outputs.base_sha }}",
        "head_sha": "${{ steps.paths.outputs.head_sha }}",
        "checkout_sha": "${{ steps.paths.outputs.checkout_sha }}"
      },
      "steps": [
        {
          "name": "Classify paths and select runtime evidence",
          "id": "paths",
          "uses": "actions/github-script@v7",
          "timeout-minutes": 2,
          "with": {
            "script": "const {owner, repo} = context.repo;\nconst {data: run} = await github.rest.actions.getWorkflowRun({\n  owner, repo, run_id: context.runId, request: {signal: AbortSignal.timeout(5000)},\n});\nconst created = Date.parse(run.created_at);\nif (run.id !== context.runId || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||\n    !Number.isFinite(created)) {\n  core.setFailed(\"Cannot establish this workflow attempt's creation time.\");\n  return;\n}\nconst deadline = Math.floor(created / 1000) + 75 * 60;\ncore.setOutput(\"test_run_deadline\", String(deadline));\nif (Date.now() >= deadline * 1000) {\n  core.setFailed(\"Shared workflow deadline exhausted before classification.\");\n  return;\n}\nconst source = \"526801caa5f66914c79e9833e6fde4f3cfc99a4a\";\nif (context.eventName !== \"workflow_dispatch\" || run.head_sha !== context.sha) {\n  core.setFailed(\"Invalid complete validation transport identity.\"); return;\n}\nconst {data: carrier} = await github.rest.repos.getCommit({owner,repo,ref:context.sha,request:{signal:AbortSignal.timeout(5000)}});\nif (carrier.parents.length !== 1 || carrier.parents[0].sha !== source) {\n  core.setFailed(\"Validation carrier is not an immediate child of the accepted source.\"); return;\n}\nconst defaultBranch = context.payload.repository.default_branch;\nconst {data: branch} = await github.rest.repos.getBranch({owner,repo,branch:defaultBranch,request:{signal:AbortSignal.timeout(5000)}});\nconst base = branch.commit.sha;\nif (!/^[0-9a-f]{40}$/.test(base) || !/^[0-9a-f]{40}$/.test(source) || base === source) {\n  core.setFailed(\"Cannot bind source/base for complete validation.\"); return;\n}\nfor (const [name,value] of Object.entries({whole_front_only:\"true\",runtime:\"false\",policy_only:\"false\",full:\"false\",wall_time_exception:\"false\",base_sha:base,head_sha:source,checkout_sha:source})) core.setOutput(name,value);\nawait core.summary.addHeading(\"Complete final-source validation\").addRaw(`Source ${source}; transport ${context.sha}; default-branch base ${base}. Static, fast, all five full shards, frozen budget and reconciliation are required.`).write();\n"
          }
        }
      ]
    },
    "static": {
      "name": "Static validation",
      "needs": "classify",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Check shared deadline before static work",
          "run": "[[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\nif (( TEST_RUN_DEADLINE <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before static work.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Check patch whitespace",
          "env": {
            "BASE_SHA": "${{ needs.classify.outputs.base_sha }}",
            "HEAD_SHA": "${{ needs.classify.outputs.head_sha }}"
          },
          "run": "git diff --check \"$BASE_SHA...$HEAD_SHA\""
        },
        {
          "name": "Parse repository configuration",
          "run": "python - <<'PY'\nimport json\nimport pathlib\nimport tomllib\n\nfor path in pathlib.Path(\".\").glob(\"**/*.toml\"):\n    if \".git\" not in path.parts:\n        data = tomllib.loads(path.read_text(encoding=\"utf-8\"))\n        if path.parent == pathlib.Path(\".codex/agents\"):\n            if data.get(\"name\") != path.stem:\n                raise SystemExit(f\"{path}: agent name must match filename\")\n            for field in (\"description\", \"developer_instructions\"):\n                value = data.get(field)\n                if not isinstance(value, str) or not value.strip():\n                    raise SystemExit(f\"{path}: missing {field}\")\nfor path in pathlib.Path(\".\").glob(\"**/*.json\"):\n    if \".git\" not in path.parts:\n        json.loads(path.read_text(encoding=\"utf-8\"))\nfor path in (*pathlib.Path(\"src\").rglob(\"*.py\"), *pathlib.Path(\"tests\").rglob(\"*.py\")):\n    compile(path.read_text(encoding=\"utf-8\"), str(path), \"exec\", dont_inherit=True)\nPY\nruby -e 'require \"yaml\"; Dir[\".github/workflows/*.{yml,yaml}\"].each { |path| YAML.parse_file(path) }'\nruby -ryaml -ropen3 <<'RB'\nDir[\".agents/skills/*/SKILL.md\"].each do |path|\n  source = File.read(path)\n  match = source.match(/\\A---\\r?\\n(.*?)\\r?\\n---(?:\\r?\\n|\\z)/m)\n  abort \"#{path}: missing YAML frontmatter\" unless match\n  data = YAML.safe_load(match[1], aliases: false)\n  abort \"#{path}: name must match directory and description must be nonempty\" unless\n    data.is_a?(Hash) && data[\"name\"] == File.basename(File.dirname(path)) &&\n    data[\"description\"].is_a?(String) && !data[\"description\"].strip.empty?\nend\nissue_path = \".github/ISSUE_TEMPLATE/work_item.md\"\nissue_source = File.read(issue_path)\nissue_match = issue_source.match(/\\A---\\r?\\n(.*?)\\r?\\n---(?:\\r?\\n|\\z)/m)\nabort \"#{issue_path}: missing YAML frontmatter\" unless issue_match\nissue = YAML.safe_load(issue_match[1], aliases: false)\nabort \"#{issue_path}: invalid frontmatter mapping\" unless issue.is_a?(Hash)\n%w[name about title labels assignees].each do |field|\n  value = issue[field]\n  abort \"#{issue_path}: missing or non-string #{field}\" unless value.is_a?(String)\nend\n%w[name about].each do |field|\n  abort \"#{issue_path}: empty #{field}\" if issue[field].strip.empty?\nend\nDir[\".github/workflows/*.{yml,yaml}\"].each do |path|\n  document = YAML.safe_load(File.read(path), aliases: false)\n  document.fetch(\"jobs\").each do |job_name, job|\n    job.fetch(\"steps\", []).each do |step|\n      script = step[\"with\"]&.fetch(\"script\", nil)\n      next unless script\n      _, error, status = Open3.capture3(\n        \"node\", \"--input-type=module\", \"--check\",\n        stdin_data: \"async function main() {\\n#{script}\\n}\")\n      abort \"#{path} #{job_name}: #{error}\" unless status.success?\n    end\n  end\nend\nRB\n"
        },
        {
          "name": "Validate runner metadata",
          "run": "python -B - <<'PY'\nfrom tests import suite_policy\n\nsuite_policy.load_timing_weights()\nids = suite_policy.FAST_TEST_IDS\nif not ids or len(ids) != len(set(ids)):\n    raise SystemExit(\"fast tier must contain unique test IDs\")\nif any(not identifier.rsplit(\".\", 1)[-1].startswith(\"test\") for identifier in ids):\n    raise SystemExit(\"fast tier contains a non-test method ID\")\nPY\n"
        },
        {
          "name": "Validate locked vendor pins",
          "run": "python - <<'PY'\nimport subprocess\nimport tomllib\nfrom pathlib import Path\n\nif Path(\"MANIFEST.in\").read_text(encoding=\"utf-8\") != \"prune vendor/jsonl-viewer\\n\":\n    raise SystemExit(\"MANIFEST.in must exclude vendored jsonl-viewer source\")\n\nwith open(\"uv.lock\", \"rb\") as source:\n    packages = {package[\"name\"]: package for package in tomllib.load(source)[\"package\"]}\nfor name in (\"generic-rag\", \"jsonl-viewer\"):\n    pinned = packages[name][\"source\"][\"git\"].rsplit(\"#\", 1)[-1]\n    gitlink = subprocess.check_output(\n        [\"git\", \"rev-parse\", f\"HEAD:vendor/{name}\"], text=True\n    ).strip()\n    if pinned != gitlink:\n        raise SystemExit(f\"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}\")\nPY\n"
        },
        {
          "name": "Validate policy artifacts",
          "run": "python - <<'PY'\nimport pathlib\n\nroot = pathlib.Path.cwd()\ntemplates = {\n    \".github/ISSUE_TEMPLATE/work_item.md\": [\n        \"## Objective\", \"## Use cases and expected results\",\n        \"## Implementation summary\", \"## Acceptance criteria\",\n        \"## Boundaries and dependencies\",\n        \"## Related work and verification plan\", \"## Implementation plan\",\n    ],\n    \".github/pull_request_template.md\": [\n        \"## What changed\", \"## Before and after\", \"## Implementation\",\n        \"## Verification\", \"## Limitations and follow-ups\",\n        \"## Related Issue\",\n    ],\n    \".github/templates/evidence.md\": [\n        \"## What this demonstrates\", \"## Scenario results\",\n        \"## Reproduction and environment\", \"## Failures and coverage gaps\",\n        \"## Technical provenance and artifacts\", \"## Assessment\",\n    ],\n    \".github/templates/working-status-comment.md\": [\n        \"## Current status\", \"## What works now\", \"## What remains\",\n        \"## Blocker or decision\", \"## Next step\", \"## Evidence links\",\n    ],\n}\nfor relative, expected in templates.items():\n    text = (root / relative).read_text(encoding=\"utf-8\")\n    actual = [line for line in text.splitlines() if line.startswith(\"## \")]\n    if actual != expected:\n        raise SystemExit(f\"{relative}: template headings changed: {actual!r}\")\n\nagents = {path.name for path in (root / \".codex/agents\").glob(\"*.toml\")}\nif agents != {\"runtime_implementer.toml\", \"test_engineer.toml\"}:\n    raise SystemExit(f\"unexpected development agents: {sorted(agents)!r}\")\nrequired = [\n    root / \".agents/skills/project-workflow/SKILL.md\",\n    root / \".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md\",\n]\nif any(not path.is_file() for path in required):\n    raise SystemExit(\"required simplified workflow artifact is missing\")\nforbidden = [\n    root / \".agents/skills/adaptive-verification/SKILL.md\",\n    root / \".agents/skills/subagent-model-selection/SKILL.md\",\n    root / \"tests/test_repository_agent_policy.py\",\n]\nif any(path.exists() for path in forbidden):\n    raise SystemExit(\"retired policy artifact still exists\")\nif len((root / \"PYTHON_MODULE_INDEX.md\").read_text(encoding=\"utf-8\").splitlines()) > 300:\n    raise SystemExit(\"PYTHON_MODULE_INDEX.md exceeds 300 lines\")\nPY\n"
        }
      ]
    },
    "fast": {
      "name": "Runtime fast tier",
      "needs": "classify",
      "if": "needs.classify.outputs.runtime == 'true'",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "env": {
        "TEST_JOB_MINUTES": "60",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "name": "Install runtime test dependencies",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure deterministic test Git identity",
          "env": {
            "TEST_HARDWARE_ARCH": "arm64",
            "TEST_HARDWARE_PATH": "${{ runner.temp }}/runner-hardware-fast.json",
            "TEST_HARDWARE_SELECTION": "tier:fast"
          },
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n.venv/bin/python - <<'PY_HARDWARE'\nimport datetime, gc, hashlib, json, os, platform, sys\nfrom pathlib import Path\n\noutput = Path(os.environ['TEST_HARDWARE_PATH'])\nroot = Path(os.environ['GITHUB_WORKSPACE'])\narch = os.environ['TEST_HARDWARE_ARCH']\nexpected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}\ndata = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,\n        'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],\n        'selection': os.environ['TEST_HARDWARE_SELECTION'],\n        'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,\n        'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}\ntry:\n    assert arch in expected, 'unsupported selected runner architecture'\n    affinity = sorted(os.sched_getaffinity(0))\n    data.update(system=platform.system(), machine=platform.machine(),\n                cpu_count=os.cpu_count(), cpu_affinity=affinity,\n                available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],\n                runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],\n                python_version=platform.python_version(), python_implementation=platform.python_implementation(),\n                python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],\n                run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),\n                native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],\n                native_ref=os.environ['GITHUB_REF'],\n                source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()\n                                   for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},\n                hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),\n                                     'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})\n    assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'\n    assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'\n    assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'\n    assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)\n    assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'\n    assert data['run_id'].isdigit() and data['run_attempt'] > 0\n    assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])\n    assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}\n    data['status'] = 'passed'\nexcept BaseException as error:\n    data['error'] = {'type': type(error).__name__, 'message': str(error)}\n    raise\nfinally:\n    output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n    with output.open('x', encoding='utf-8') as stream:\n        stream.write(json.dumps(data, indent=2, allow_nan=False) + '\\n')\n    print(json.dumps(data, sort_keys=True, allow_nan=False))\nPY_HARDWARE\n"
        },
        {
          "name": "Run fast runtime tests",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 3150 )); then test_seconds=3150; fi\nprintf '{\"worker_limit_seconds\":%s,\"kill_grace_seconds\":30,\"cleanup_reserve_seconds\":60,\"cancellation_reserve_seconds\":360}\\n' \"$test_seconds\" > \"$RUNNER_TEMP/fast-control.json\"\nif (( test_seconds <= 0 )); then exit 124; fi\nset +e\ntimeout --signal=INT --kill-after=30s \"${test_seconds}s\" env PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json \"$RUNNER_TEMP/fast.json\" 2>&1 | tee \"$RUNNER_TEMP/fast.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\ntest_status=${test_statuses[0]}\nif (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi\nprintf '%s\\n' \"$test_status\" > \"$RUNNER_TEMP/fast-exit-code.txt\"\nexit \"$test_status\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "runtime-fast",
            "path": "${{ runner.temp }}/fast.json\n${{ runner.temp }}/fast.log\n${{ runner.temp }}/fast-control.json\n${{ runner.temp }}/fast-exit-code.txt\n${{ runner.temp }}/runner-hardware-fast.json\n",
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "full": {
      "name": "${{ format('Full runtime shard {0}/5', matrix.shard) }}",
      "needs": "classify",
      "if": "needs.classify.outputs.full == 'true'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3,
            4
          ]
        }
      },
      "runs-on": "ubuntu-24.04-arm",
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "TEST_JOB_MINUTES": "75",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "timeout-minutes": 75,
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "name": "Install runtime test dependencies",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure deterministic test Git identity",
          "env": {
            "TEST_HARDWARE_ARCH": "arm64",
            "TEST_HARDWARE_PATH": "${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json",
            "TEST_HARDWARE_SELECTION": "shard:${{ matrix.shard }}/5",
            "TEST_HARDWARE_SHARD": "${{ matrix.shard }}/5"
          },
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n.venv/bin/python - <<'PY_HARDWARE'\nimport datetime, gc, hashlib, json, os, platform, sys\nfrom pathlib import Path\n\noutput = Path(os.environ['TEST_HARDWARE_PATH'])\nroot = Path(os.environ['GITHUB_WORKSPACE'])\narch = os.environ['TEST_HARDWARE_ARCH']\nexpected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}\ndata = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,\n        'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],\n        'selection': os.environ['TEST_HARDWARE_SELECTION'],\n        'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,\n        'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}\ntry:\n    assert arch in expected, 'unsupported selected runner architecture'\n    affinity = sorted(os.sched_getaffinity(0))\n    data.update(system=platform.system(), machine=platform.machine(),\n                cpu_count=os.cpu_count(), cpu_affinity=affinity,\n                available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],\n                runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],\n                python_version=platform.python_version(), python_implementation=platform.python_implementation(),\n                python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],\n                run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),\n                native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],\n                native_ref=os.environ['GITHUB_REF'],\n                source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()\n                                   for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},\n                hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),\n                                     'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})\n    assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'\n    assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'\n    assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'\n    assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)\n    assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'\n    assert data['run_id'].isdigit() and data['run_attempt'] > 0\n    assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])\n    assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}\n    data['status'] = 'passed'\nexcept BaseException as error:\n    data['error'] = {'type': type(error).__name__, 'message': str(error)}\n    raise\nfinally:\n    output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n    with output.open('x', encoding='utf-8') as stream:\n        stream.write(json.dumps(data, indent=2, allow_nan=False) + '\\n')\n    print(json.dumps(data, sort_keys=True, allow_nan=False))\nPY_HARDWARE\n"
        },
        {
          "name": "Run full runtime shard",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 3600 )); then test_seconds=3600; fi\nprintf '{\"worker_limit_seconds\":%s,\"kill_grace_seconds\":30,\"cleanup_reserve_seconds\":60,\"cancellation_reserve_seconds\":360}\\n' \"$test_seconds\" > \"$RUNNER_TEMP/full-${{ matrix.shard }}-control.json\"\nif (( test_seconds < 3600 )); then\n  printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\\n' \"$test_seconds\" >&2\n  printf '124\\n' > \"$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt\"\n  exit 124\nfi\ntest_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ[\"TEST_JOB_DEADLINE\"]),int(os.environ[\"TEST_RUN_DEADLINE\"]))-450; sys.exit(\"Insufficient remaining time for a full test hour\") if w > cutoff else print(w)')\n.venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile=\"audited-147-v3\",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+\"\\n\")' \"$RUNNER_TEMP/full-${{ matrix.shard }}-control.json\" \"$test_work_deadline\"\nset +e\ntimeout --signal=INT --kill-after=30s \"${test_seconds}s\" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard \"${{ matrix.shard }}/5\" --hosted-methods audited-147-v3 --hosted-deadline-epoch \"$test_work_deadline\" --json \"$RUNNER_TEMP/full-${{ matrix.shard }}.json\" 2>&1 | tee \"$RUNNER_TEMP/full-${{ matrix.shard }}.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\ntest_status=${test_statuses[0]}\nif (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi\nprintf '%s\\n' \"$test_status\" > \"$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt\"\nexit \"$test_status\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "full-${{ matrix.shard }}",
            "path": "${{ runner.temp }}/full-${{ matrix.shard }}.json\n${{ runner.temp }}/full-${{ matrix.shard }}.json.methods/\n${{ runner.temp }}/full-${{ matrix.shard }}.log\n${{ runner.temp }}/full-${{ matrix.shard }}-control.json\n${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt\n${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json\n",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "whole-front": {
      "name": "Whole-front external 60-minute stack sampling",
      "needs": [
        "classify",
        "static"
      ],
      "if": "needs.classify.outputs.full == 'true' || needs.classify.outputs.whole_front_only == 'true'",
      "runs-on": "ubuntu-24.04-arm",
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "TEST_JOB_MINUTES": "75",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
