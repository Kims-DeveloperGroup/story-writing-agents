              probe_source = "\"\"\"External diagnostic-only draft. Root review/hosted execution only.\n\nUses one existing fixture-backed profile and two existing field-neighbor forms.\nIt does not execute a canonical test, prove its coverage, or claim a timing fit.\nA parent supervisor must enforce the independent 35-minute execution deadline.\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport copy\nimport cProfile\nimport hashlib\nimport io\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport pstats\nimport re\nimport subprocess\nimport sys\nimport time\nimport traceback\nfrom dataclasses import replace\nfrom types import SimpleNamespace\n\nREFERENCE_SOURCE = \"fa3fb79ad11b5f1c2b1af0793fdb4a8f94ff8755\"\nEXPECTED_SOURCE_HASHES = {\n    \"tests/test_lead_orchestration.py\": \"98920986a8711c41f0a49c5bfd20c98a1510e09d59b9dfefc9b7c581ce85a53b\",\n    \"tests/provider_wire_fixture.py\": \"3cf85cf8a106b12b2b34261db8090fc769118233a332efd683e0a51b24163070\",\n    \"src/story_writing_agents/structured_output_validation.py\": \"a5a8be6521c3740f115e4b7d4f08dc411dd3f306d7994bf657477c5dc8a4172c\",\n    \"src/story_writing_agents/agent_context/service.py\": \"55dc619f42485a040b2aaa9f3b0897a662ab16554e0e2b7c86b5f667a0fc4265\",\n    \"src/story_writing_agents/lead_provider_contracts.py\": \"4a96bf04fbc8c10a8835962396fc8e08d8a810d0b81fb4e1742e2ab902c880f0\",\n    \"src/story_writing_agents/specialist_routing.py\": \"c8bdb06ca71122be3c4ca5de1eb1bb1431407f5a5fff3dbbb10cf1b9876dbb20\",\n    \"src/story_writing_agents/orchestrator.py\": \"42a44ce6136d641bf4535daa8a560c8b7982992ba945702cec968fb72c4c6972\",\n    \"src/story_writing_agents/conversations/events.py\": \"8f5929d26f98b840591ff6a65a59787f06533fdc2ff12bbfb8823721a301af42\",\n    \"uv.lock\": \"f8d3ebb4bc7b069d2669907e82d93a5a0d3b55d4056897944a51e32315030b91\"\n}\nOUTPUT = Path(os.environ.get(\"PROBE_OUTPUT\", \"front-neighbor-probe.json\")).resolve()\nPROFILE_DIR = Path(os.environ.get(\"PROBE_PROFILE_DIRECTORY\", str(OUTPUT.parent / \"front-neighbor-profiles\")))\nSTART = time.perf_counter()\nREPORT = {\n    \"diagnostic_only\": True,\n    \"kind\": \"front-neighbor-validation-probe\",\n    \"reference_source\": REFERENCE_SOURCE,\n    \"canonical_test_executed\": False,\n    \"canonical_pass_credit\": False,\n    \"target_seconds\": 600,\n    \"independent_parent_deadline_seconds\": 2100,\n    \"complete\": False,\n    \"outcome\": \"running\",\n    \"setup\": [],\n    \"lanes\": [],\n    \"limitations\": [\n        \"A dependency-closed fixture slice, not the canonical front method or a full-suite run.\",\n        \"cProfile is enabled separately around validation operations only; measured times include its overhead.\",\n        \"No whole-front, whole-class, six-hour or forty-minute fit claim.\",\n        \"Parent deadline, termination handling and partial-artifact retention are external requirements.\",\n    ],\n}\n\n\ndef flush():\n    OUTPUT.parent.mkdir(parents=True, exist_ok=True)\n    temporary = OUTPUT.with_name(OUTPUT.name + \".partial\")\n    with temporary.open(\"w\", encoding=\"utf-8\") as stream:\n        json.dump(REPORT, stream, indent=2, ensure_ascii=True, allow_nan=False)\n        stream.write(\"\\n\")\n        stream.flush()\n        os.fsync(stream.fileno())\n    os.replace(temporary, OUTPUT)\n    print(json.dumps({\"diagnostic_only\": True, \"active_stage\": REPORT.get(\"active_stage\", \"not_started\"),\n                      \"elapsed_seconds\": time.perf_counter() - START, \"lanes_recorded\": len(REPORT[\"lanes\"])}),\n          flush=True)\n\n\ndef start_stage(name):\n    REPORT[\"active_stage\"] = name\n    started = time.perf_counter()\n    REPORT[\"setup\"].append({\"name\": name, \"state\": \"started\", \"since_start_seconds\": started - START})\n    flush()\n    return started\n\n\ndef finish_stage(name, started, **details):\n    REPORT[\"setup\"].append({\n        \"name\": name, \"state\": \"completed\", \"seconds\": time.perf_counter() - started, **details\n    })\n    flush()\n\n\ndef describe_error(error):\n    return {\n        \"type\": type(error).__name__,\n        \"message\": str(error)[:1600],\n        \"frames\": [\n            {\"file\": item.filename, \"line\": item.lineno, \"function\": item.name}\n            for item in traceback.extract_tb(error.__traceback__)[-4:]\n        ],\n    }\n\n\ndef run_lane(lane, input_name, operation):\n    row = {\"lane\": lane, \"input\": input_name, \"state\": \"started\"}\n    REPORT[\"lanes\"].append(row)\n    REPORT[\"active_stage\"] = lane + \":\" + input_name\n    flush()\n    profiler = cProfile.Profile()\n    wall_started, cpu_started = time.perf_counter(), time.process_time()\n    result = None\n    try:\n        profiler.enable()\n        result = operation()\n        row.update(state=\"completed\", outcome=\"expected\")\n    except Exception as error:\n        row.update(state=\"completed\", outcome=\"unexpected\", error=describe_error(error))\n    finally:\n        profiler.disable()\n        row[\"wall_seconds\"] = time.perf_counter() - wall_started\n        row[\"cpu_seconds\"] = time.process_time() - cpu_started\n        PROFILE_DIR.mkdir(parents=True, exist_ok=True)\n        stem = lane + \"-\" + input_name\n        binary = PROFILE_DIR / (stem + \".pstats\")\n        text = PROFILE_DIR / (stem + \".txt\")\n        profiler.dump_stats(str(binary))\n        stream = io.StringIO()\n        stats = pstats.Stats(profiler, stream=stream).sort_stats(\"cumulative\")\n        stats.print_stats(60)\n        text.write_text(stream.getvalue(), encoding=\"utf-8\")\n        row[\"profile\"] = {\"pstats\": str(binary), \"text\": str(text), \"total_calls\": stats.total_calls,\n                          \"primitive_calls\": stats.prim_calls, \"total_internal_seconds\": stats.total_tt}\n        if result is not None:\n            row[\"observation\"] = result\n        flush()\n    return row[\"outcome\"] == \"expected\"\n\n\nasync def probe():\n    started = start_stage(\"source_and_imports\")\n    checkout = Path(os.environ.get(\"GITHUB_WORKSPACE\", os.getcwd())).resolve()\n    observed = {name: hashlib.sha256((checkout / name).read_bytes()).hexdigest()\n                for name in EXPECTED_SOURCE_HASHES}\n    if observed != EXPECTED_SOURCE_HASHES:\n        raise AssertionError(\"probe setup dependencies differ from frozen runtime/test source\")\n    REPORT[\"source\"] = {\n        \"checkout\": str(checkout),\n        \"checkout_sha\": subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], cwd=checkout, text=True).strip(),\n        \"checkout_tree\": subprocess.check_output([\"git\", \"rev-parse\", \"HEAD^{tree}\"], cwd=checkout, text=True).strip(),\n        \"verified_dependency_hashes\": observed,\n        \"workflow_only_tag_allowed\": True,\n    }\n    REPORT[\"environment\"] = {\n        \"python\": platform.python_version(), \"implementation\": platform.python_implementation(),\n        \"platform\": platform.platform(), \"machine\": platform.machine(),\n    }\n    sys.path[:0] = [str(checkout / \"src\"), str(checkout)]\n    from tests.test_lead_orchestration import LeadOutcomeAndProposalTests, _live_material, _visible_outcome\n    from tests.provider_wire_fixture import (\n        finite_fixture_selection, lead_fixture_assessment, lead_fixture_response, lead_fixture_scope_record,\n    )\n    from story_writing_agents import orchestrator as orchestrator_module\n    from story_writing_agents.antigravity_adapter import AntigravityAdapter\n    from story_writing_agents.conversations import authoring_scope_from_dict\n    from story_writing_agents.structured_output_validation import diagnose_json_text\n\n    finish_stage(\"source_and_imports\", started)\n    case = LeadOutcomeAndProposalTests(\"test_front_schema_is_minimal_closed_and_provider_strict\")\n    try:\n        started = start_stage(\"existing_fixture_setup\")\n        case.setUp()\n        finish_stage(\"existing_fixture_setup\", started)\n        started = start_stage(\"initial_lead_turn\")\n        conversation_id = case.conversation(\"Minimal schema\")\n        case.backend.enqueue(_visible_outcome(\"answer\"))\n        outcome = await case.runtime.lead_turn(\n            case.session_id, conversation_id, \"Explain collaboration workflow.\"\n        )\n        assert case.backend.calls, outcome\n        call = case.backend.calls[-1]\n        task = _live_material(call)[\"authoring_tasks\"][0]\n        finish_stage(\"initial_lead_turn\", started, provider_calls=len(case.backend.calls),\n                     task_id=task[\"task_id\"])\n        started = start_stage(\"free_owner_construction\")\n        factory = call.contract.factory\n        declared = replace(factory.constraints, input_ids=('user_input',), premise_question_id=None,\n            required_input_ids=('user_input',), per_assignment_input_ids=('user_input',),\n            reviewer_inputs=(), source_ids=('user_input',), objective_ids=(), scope=None,\n            scope_rule=None, preparation_kind=None, preparation_targets=(),\n            preparation_specialists=(), task_revisions=((task['task_id'], 1),))\n        profile_record = { 'schema_version': 3, 'activity': 'review', 'intent': 'authoring',\n            'target_paths': [], 'domains': ['tone_execution'],\n            'interpretation': 'Assess the supplied editorial constraint.',\n            'task_id': task['task_id'], 'task_revision': 1,\n            'contributions': [{'domain': 'tone_execution', 'role': 'constraint_assessor'}], 'dependency_slots': []}\n        profile_scope = authoring_scope_from_dict(profile_record)\n        profile_facts = replace(declared, scope=profile_scope, source_ids=('user_input',),\n                                objective_ids=('fixture-objective',))\n        workflow_record = {**profile_record, 'activity': 'workflow', 'domains': [],\n                           'contributions': [], 'interpretation': 'Track the pending request.'}\n        workflow_value = authoring_scope_from_dict(workflow_record)\n        workflow_facts = replace(profile_facts, scope=workflow_value)\n        free_facts = replace(workflow_facts, scope=None, scope_rule=None)\n        free_seed = orchestrator_module._lead_front_result_contract(\n            orchestrator_module.LeadProposalRelation.NEW_STEP, ('user_input',), constraints=free_facts)\n        profile_binding = replace(factory, rule_seed=free_seed, constraints=free_facts).for_offer(call.contract.offers)\n        profile_schema = profile_binding.schema_value()\n        profile_projections = (('codex', profile_schema),\n            ('antigravity', AntigravityAdapter.native_output_schema(profile_schema)))\n        stem = free_seed.contract_id\n        free_reads = profile_binding.offers.completed_read_facts + profile_binding.offers.delivery_read_facts\n        free_inputs = tuple(dict.fromkeys(free_facts.input_ids + tuple(row.evidence_id for row in free_reads)))\n        free_choices = dict(profile_binding.semantic_index.policy.choices)\n        required_reviewers = {item.split(':', 1)[0] for item in free_choices['reviewer_inputs']}\n        preparation_specialists = free_choices['preparation_specialists']\n        finish_stage(\"free_owner_construction\", started,\n                     semantic_members=len(profile_binding.semantic_index.contracts),\n                     schema_bytes=len(json.dumps(profile_schema, ensure_ascii=True).encode(\"utf-8\")),\n                     maximum_bytes=profile_binding.rule_graph.maximum_bytes,\n                     input_count=len(free_inputs))\n        started = start_stage(\"actual_profile_packet\")\n        incomplete_assessment = {\n            'status': 'needs_information', 'foundations': [{'requirement': 'Retain supplied workflow request.',\n                'source_ids': ['user_input'], 'justification': 'Only the supplied USER instruction is used.'}],\n            'direction': None, 'creative_scope': None, 'allowed_creative_actions': [],\n            'protected_constraints': ['No execution authority.'], 'decisions': [{\n                'decision': 'Authoring direction', 'coverage': 'missing', 'source_ids': [],\n                'explanation': 'No substantive writing decision was supplied.'}],\n            'missing_information': ['Authoring direction and creative scope are not supplied.'],\n            'rationale': 'The workflow request grants no creative delegation.'}\n        native_assessment = lead_fixture_assessment(incomplete_assessment, source_choices=free_inputs)\n        native_modes = {'draft': 'draft_content', 'review': 'review_content',\n                            'constraint_assessment': 'assess_constraints'}\n        domain_order = ('plot_structure', 'character_world', 'tone_execution')\n        role_order = ('draft_owner', 'constraint_assessor')\n        profile_roster = {'plot_structure': 'plot_architect', 'character_world': 'character_custodian',\n                          'tone_execution': 'execution_specialist'}\n        intent, activity = 'authoring', 'draft'\n        domains = domain_order\n        roles = (role_order[0], role_order[1], role_order[1])\n        duties = [{'domain': domain, 'role': role} for domain, role in zip(domains, roles)]\n        supplied_scope = {'schema_version': 3, 'activity': activity, 'intent': intent,\n            'target_paths': [], 'domains': list(domains),\n            'interpretation': 'Use the explicit current duty profile.',\n            'task_id': task['task_id'], 'task_revision': 1,\n            'contributions': duties, 'dependency_slots': []}\n        native_scope = lead_fixture_scope_record(supplied_scope)\n        base = {'response_type': 'clarification_question',\n                'response_text': 'Current free-scope profile.',\n                'response_details': {'task_scope': native_scope}}\n        fixture_call = SimpleNamespace(contract=profile_binding)\n        expected_scope = {'intent': intent, 'activity': activity, 'target_paths': [],\n            'domains': list(domains), 'task': task['task_id'] + '@1',\n            'contributions': duties, 'dependency_slots': []}\n        required_agents = tuple(agent for domain, agent in profile_roster.items() if domain in domains)\n        selected_agents = tuple(agent for agent in profile_roster.values()\n                                if agent == 'execution_specialist' or agent in required_agents)\n        active = required_agents\n        assert active == required_agents\n        assert required_reviewers.issubset(active)\n        assert not preparation_specialists or active == preparation_specialists\n        family, response_kind, semantic_kind = 6, \"specialist_consultation_proposal\", \"proposal\"\n        modes = {profile_roster[domain]: ('draft' if role == 'draft_owner'\n            else 'constraint_assessment') for domain, role in zip(domains, roles)}\n        assignments = [{'agent_id': agent, 'instruction': 'Assess supplied concern.',\n            'mode': 'review' if activity == 'review' else modes[agent],\n            'input_ids': list(free_inputs),\n            **({'review_basis': {'candidate_input_ids': list(free_inputs),\n                'criteria': 'Assess supplied concern.'}}\n               if activity == 'review' else {})} for agent in active]\n        native_proposal = {'assignments': {row['agent_id']: {\n            'task_instructions': row['instruction'], 'assignment_type': native_modes[row['mode']],\n            'input_anchor_id': 'user_input', 'optional_inputs': dict.fromkeys(free_inputs, True),\n            'review_basis': ({ 'candidate_input_ids': finite_fixture_selection(\n                    free_choices['review_candidate_ids'], tuple(free_inputs)),\n                'criteria': 'Assess supplied concern.'} if activity == 'review' else None)}\n            for row in assignments}, 'required_input_recipients': (\n                {identity: active[0] for identity in free_choices['required_input_ids']\n                 if intent == 'authoring' or identity != 'user_input'}), 'shared_premises': []}\n        extra = {'specialist_consultation_proposal': native_proposal}\n        semantic_extra = {'proposal': {'assignments': assignments, 'shared_premises': []}}\n        if intent == 'authoring':\n            extra['authoring_assessment'] = native_assessment\n            semantic_extra['authoring_assessment'] = incomplete_assessment\n        packet = json.loads(lead_fixture_response(fixture_call,\n            {**base, 'response_type': response_kind,\n             'response_details': {'task_scope': native_scope, **extra}},\n            family=0, branch_key=stem + ':family:' + str(family)))\n        assert (packet[\"agent_action\"][\"schema_id\"], packet[\"agent_action\"][\"task_result\"][\"schema_id\"]) in (\n            profile_binding.outer_inner_schema_ids\n        )\n        expected_answer = {\n            \"kind\": semantic_kind, \"message\": base[\"response_text\"],\n            \"authoring_scope\": expected_scope, **semantic_extra,\n        }\n        assignment_path = (\n            \"agent_action\", \"task_result\", \"response_details\", \"specialist_consultation_proposal\",\n            \"assignments\", \"plot_architect\",\n        )\n\n        def assignment(value):\n            for key in assignment_path:\n                value = value[key]\n            return value\n\n        assert isinstance(assignment(packet)[\"task_instructions\"], str)\n        missing, wrong_type = copy.deepcopy(packet), copy.deepcopy(packet)\n        del assignment(missing)[\"task_instructions\"]\n        assignment(wrong_type)[\"task_instructions\"] = {}\n        inputs = (\n            (\"positive\", packet, json.dumps(packet)),\n            (\"missing_task_instructions\", missing, json.dumps(missing)),\n            (\"wrong_type_task_instructions\", wrong_type, json.dumps(wrong_type)),\n        )\n        REPORT[\"fixture\"] = {\n            \"profile\": {\"intent\": intent, \"activity\": activity, \"domains\": domains, \"roles\": roles},\n            \"active_specialists\": active,\n            \"family\": family,\n            \"outer_schema_id\": packet[\"agent_action\"][\"schema_id\"],\n            \"inner_schema_id\": packet[\"agent_action\"][\"task_result\"][\"schema_id\"],\n            \"mutation_path\": \"$.\" + \".\".join(assignment_path) + \".task_instructions\",\n            \"input_summaries\": [\n                {\"name\": name, \"bytes\": len(encoded.encode(\"utf-8\")),\n                 \"sha256\": hashlib.sha256(encoded.encode(\"utf-8\")).hexdigest()}\n                for name, _value, encoded in inputs\n            ],\n            \"original_profile_case_reference\": \"tests/test_lead_orchestration.py:3403-3586\",\n            \"not_a_canonical_execution_id\": True,\n        }\n        finish_stage(\"actual_profile_packet\", started)\n\n        def full_findings(name, value):\n            findings = profile_binding.rule_graph.findings(value)\n            assert bool(findings) == (name != \"positive\"), (name, findings)\n            return {\"findings\": list(findings)}\n\n        def decode(name, encoded):\n            if name == \"positive\":\n                decoded = profile_binding.decode_response(encoded)\n                assert json.loads(decoded.answer_json) == expected_answer\n                return {\"semantic_answer_matches_original_oracle\": True}\n            try:\n                profile_binding.decode_response(encoded)\n            except ValueError as error:\n                assert re.fullmatch(\n                    r\"LEAD_(ACTION_ENVELOPE|SCHEMA_ID|PAIRED_SCHEMA_ID|SCHEMA_RULE)_REJECTED\", str(error)\n                ), (type(error).__name__, str(error))\n                return {\"rejection_type\": type(error).__name__, \"rejection\": str(error)}\n            raise AssertionError(\"existing negative field neighbor was accepted\")\n\n        # Preserve the source order: positive findings -> decode; each invalid\n        # neighbor decode -> findings; then Codex and Antigravity native phases.\n        good = True\n        for name, value, encoded in inputs:\n            if name == \"positive\":\n                good = run_lane(\"full_rule_graph\", name, lambda: full_findings(name, value)) and good\n                good = run_lane(\"decode\", name, lambda: decode(name, encoded)) and good\n            else:\n                good = run_lane(\"decode\", name, lambda: decode(name, encoded)) and good\n                good = run_lane(\"full_rule_graph\", name, lambda: full_findings(name, value)) and good\n\n        for provider, schema in profile_projections:\n            lowering = \"integer_singleton_bounds\" if provider == \"antigravity\" else \"identity\"\n\n            def attest():\n                profile_binding.require_projection(schema, declared_lowering=lowering)\n                return {\"projection_attested\": True}\n\n            good = run_lane(provider + \"_native\", \"projection_attestation\", attest) and good\n            for name, _value, encoded in inputs:\n                def native():\n                    findings = diagnose_json_text(encoded, schema)\n                    assert bool(findings) == (name != \"positive\"), (provider, name, findings)\n                    return {\"findings\": list(findings)}\n                good = run_lane(provider + \"_native\", name, native) and good\n        REPORT.update(complete=True, outcome=\"expected_observations\" if good else \"unexpected_observation\")\n    finally:\n        started = start_stage(\"fixture_cleanup\")\n        case.doCleanups()\n        finish_stage(\"fixture_cleanup\", started)\n\n\ndef main():\n    flush()\n    exit_code = 1\n    try:\n        asyncio.run(probe())\n        exit_code = 0 if REPORT[\"complete\"] and REPORT[\"outcome\"] == \"expected_observations\" else 1\n    except BaseException as error:\n        REPORT.update(outcome=\"setup_or_probe_error\", error=describe_error(error))\n    finally:\n        REPORT[\"