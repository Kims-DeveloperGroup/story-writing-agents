          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.shard }}.json
            ${{ runner.temp }}/full-${{ matrix.shard }}.json.methods/
            ${{ runner.temp }}/full-${{ matrix.shard }}.log
            ${{ runner.temp }}/full-${{ matrix.shard }}-control.json
            ${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json
          if-no-files-found: error

  whole-front:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only whole-front notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial whole-front notice (not run)' || needs.classify.outputs.affected_only == 'true' && 'Affected-only whole-front notice (not run)' || 'Whole-front runtime shard 5/5' }}
    needs: [classify, static]
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.whole_front_only == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: '75'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    timeout-minutes: 75
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.RUNTIME_TEST_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python "$RUNTIME_TEST_PYTHON_VERSION" --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-full-5.json"
          TEST_HARDWARE_SELECTION: "shard:5/5"
          TEST_HARDWARE_SHARD: "5/5"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Verify five-shard policy before the whole-front window
        timeout-minutes: 3
        run: |
          policy_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 - 3600 ))
          if (( policy_seconds > 120 )); then policy_seconds=120; fi
          if (( policy_seconds <= 0 )); then
            echo "Insufficient shared time for policy checks and the complete whole-front hour." >&2
            exit 124
          fi
          timeout --signal=INT --kill-after=30s "${policy_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --module tests.test_suite_budget --json "$RUNNER_TEMP/whole-front-policy.json" 2>&1 | tee "$RUNNER_TEMP/whole-front-policy.log"
          policy_statuses=("${PIPESTATUS[@]}")
          policy_status=${policy_statuses[0]}
          if (( policy_status == 0 && policy_statuses[1] != 0 )); then policy_status=${policy_statuses[1]}; fi
          printf '%s\n' "$policy_status" > "$RUNNER_TEMP/whole-front-policy-exit-code.txt"
          exit "$policy_status"
      - name: Run dedicated whole-front shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3600 )); then test_seconds=3600; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/full-5-control.json"
          if (( test_seconds < 3600 )); then
            printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\n' "$test_seconds" >&2
            printf '124\n' > "$RUNNER_TEMP/full-5-exit-code.txt"
            exit 124
          fi
          test_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ["TEST_JOB_DEADLINE"]),int(os.environ["TEST_RUN_DEADLINE"]))-450; sys.exit("Insufficient remaining time for a full test hour") if w > cutoff else print(w)')
          .venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile="audited-163-v10",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+"\n")' "$RUNNER_TEMP/full-5-control.json" "$test_work_deadline"
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "5/5" --hosted-methods audited-163-v10 --hosted-deadline-epoch "$test_work_deadline" --json "$RUNNER_TEMP/full-5.json" 2>&1 | tee "$RUNNER_TEMP/full-5.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-5-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-5
          path: |
            ${{ runner.temp }}/full-5.json
            ${{ runner.temp }}/full-5.json.methods/
            ${{ runner.temp }}/full-5.log
            ${{ runner.temp }}/full-5-control.json
            ${{ runner.temp }}/full-5-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-5.json
            ${{ runner.temp }}/whole-front-policy.json
            ${{ runner.temp }}/whole-front-policy.log
            ${{ runner.temp }}/whole-front-policy-exit-code.txt
          if-no-files-found: error

  reconcile-full:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only reconciliation notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial reconciliation notice (not run)' || needs.classify.outputs.manual_mode == 'true' && 'Manual partial reconciliation notice (not run)' || 'Reconcile full runtime suite' }}
    needs: [classify, full, whole-front]
    if: >-
      !cancelled() && needs.classify.outputs.full == 'true' &&
      (needs.full.result == 'success' || needs.full.result == 'failure') &&
      (needs.whole-front.result == 'success' || needs.whole-front.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TEST_JOB_MINUTES: '60'
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: ${{ runner.temp }}/full-reports
      - name: Reconcile shard evidence
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds <= 0 )); then
            echo "Reconciliation deadline exhausted; preserve 30s termination, 60s upload, and 360s cancellation reserve."
            exit 124
          fi
          PYTHONPATH=src timeout --signal=INT --kill-after=30s "${test_seconds}s" \
            python -m tests.runner reconcile \
            "$RUNNER_TEMP/full-reports/full-1/full-1.json" "$RUNNER_TEMP/full-reports/full-2/full-2.json" \
            "$RUNNER_TEMP/full-reports/full-3/full-3.json" "$RUNNER_TEMP/full-reports/full-4/full-4.json" \
            "$RUNNER_TEMP/full-reports/full-5/full-5.json" \
            --json "$RUNNER_TEMP/full-reconciled.json"
      - name: Enforce frozen suite inventory and wall-time budget
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          WALL_TIME_EXCEPTION: ${{ needs.classify.outputs.wall_time_exception }}
        run: |
          budget_args=(--base-ref "$BASE_SHA"
            --report "$RUNNER_TEMP/full-reports/full-1/full-1.json"
            --report "$RUNNER_TEMP/full-reports/full-2/full-2.json"
            --report "$RUNNER_TEMP/full-reports/full-3/full-3.json"
            --report "$RUNNER_TEMP/full-reports/full-4/full-4.json"
            --report "$RUNNER_TEMP/full-reports/full-5/full-5.json")
          if [[ "$WALL_TIME_EXCEPTION" == "true" ]]; then
            echo "Maintainer-authorized wall-time exception: measured durations remain visible."
            budget_args+=(--allow-wall-time-overage)
          fi
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds <= 0 )); then
            echo "Reconciliation deadline exhausted before inventory and wall-time checks."
            exit 124
          fi
          PYTHONPATH=src timeout --signal=INT --kill-after=30s "${test_seconds}s" \
            python -m tests.suite_budget "${budget_args[@]}"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: runtime-full-reconciled
          path: ${{ runner.temp }}/full-reconciled.json
          if-no-files-found: warn
