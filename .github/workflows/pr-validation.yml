name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      policy_only: ${{ steps.paths.outputs.policy_only }}
      full: ${{ steps.paths.outputs.full }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      checkout_sha: ${{ steps.paths.outputs.checkout_sha }}
    steps:
      - name: Classify paths and select runtime evidence
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let files = [];
            let labels = [];
            let baseSha;
            let headSha;
            let truncated = false;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
              labels = pr.labels.map(label => label.name);
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              truncated = files.length >= 3000;
            } else {
              const group = context.payload.merge_group;
              baseSha = group.base_sha;
              headSha = group.head_sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,
              });
              files = comparison.data.files || [];
              // A full page may hide later files. Fail closed rather than infer a partial diff.
              truncated = !Array.isArray(comparison.data.files) || files.length >= 100;
            }

            const paths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean));
            const isRuntime = path =>
              path.startsWith("src/") ||
              path.startsWith("config/") ||
              path === "pyproject.toml" ||
              path === "uv.lock" ||
              path === ".gitmodules" ||
              path === "vendor/generic-rag" ||
              path === "vendor/jsonl-viewer";
            const runtime = truncated || paths.some(isRuntime);
            // Merge-group payloads do not reliably identify constituent PR labels.
            const full = runtime && (
              truncated || context.eventName === "merge_group" || labels.includes("test:full"));
            core.setOutput("runtime", String(runtime));
            core.setOutput("policy_only", String(!runtime));
            core.setOutput("full", String(full));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            // Event SHA is the PR test merge or merge-group commit, pinned across jobs.
            core.setOutput("checkout_sha", context.sha);
            core.summary
              .addHeading("Validation selection")
              .addTable([
                [{data: "Runtime paths", header: true}, String(runtime)],
                [{data: "Policy/config only", header: true}, String(!runtime)],
                [{data: "Full suite", header: true}, String(full)],
              ])
              .write();

  static:
    name: Static validation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob("**/*.toml"):
              if ".git" not in path.parts:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
                  if path.parent == pathlib.Path(".codex/agents"):
                      if data.get("name") != path.stem:
                          raise SystemExit(f"{path}: agent name must match filename")
                      for field in ("description", "developer_instructions"):
                          value = data.get(field)
                          if not isinstance(value, str) or not value.strip():
                              raise SystemExit(f"{path}: missing {field}")
          for path in pathlib.Path(".").glob("**/*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in (*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tests").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec", dont_inherit=True)
          PY
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
          ruby -ryaml -ropen3 <<'RB'
          Dir[".agents/skills/*/SKILL.md"].each do |path|
            source = File.read(path)
            match = source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
            abort "#{path}: missing YAML frontmatter" unless match
            data = YAML.safe_load(match[1], aliases: false)
            abort "#{path}: missing name or description" unless
              data.is_a?(Hash) && data["name"].is_a?(String) && !data["name"].empty? &&
              data["description"].is_a?(String) && !data["description"].empty?
          end
          issue_path = ".github/ISSUE_TEMPLATE/work_item.md"
          issue_source = File.read(issue_path)
          issue_match = issue_source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
          abort "#{issue_path}: missing YAML frontmatter" unless issue_match
          issue = YAML.safe_load(issue_match[1], aliases: false)
          abort "#{issue_path}: invalid frontmatter mapping" unless issue.is_a?(Hash)
          %w[name about title labels assignees].each do |field|
            value = issue[field]
            abort "#{issue_path}: missing or non-string #{field}" unless value.is_a?(String)
          end
          %w[name about].each do |field|
            abort "#{issue_path}: empty #{field}" if issue[field].strip.empty?
          end
          Dir[".github/workflows/*.{yml,yaml}"].each do |path|
            document = YAML.safe_load(File.read(path), aliases: false)
            document.fetch("jobs").each do |job_name, job|
              job.fetch("steps", []).each do |step|
                script = step["with"]&.fetch("script", nil)
                next unless script
                _, error, status = Open3.capture3(
                  "node", "--input-type=module", "--check",
                  stdin_data: "async function main() {\n#{script}\n}")
                abort "#{path} #{job_name}: #{error}" unless status.success?
              end
            end
          end
          RB
      - name: Validate runner metadata
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          from tests import suite_policy

          weights = suite_policy.load_timing_weights()
          classes = {}
          imports = {}
          for path in Path("tests").glob("*.py"):
              module = f"tests.{path.stem}"
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imports[module] = {
                  alias.asname or alias.name: f"{node.module}.{alias.name}"
                  for node in tree.body
                  if isinstance(node, ast.ImportFrom) and node.level == 0
                  and node.module and node.module.startswith("tests.")
                  for alias in node.names
              }
              classes.update({
                  f"{module}.{node.name}": node
                  for node in tree.body if isinstance(node, ast.ClassDef)
              })

          def has_test_method(group, seen):
              if group in seen or group not in classes:
                  return False
              node = classes[group]
              if any(isinstance(method, (ast.FunctionDef, ast.AsyncFunctionDef))
                     and method.name.startswith("test") for method in node.body):
                  return True
              module = group.rsplit(".", 1)[0]
              for base in node.bases:
                  if isinstance(base, ast.Name):
                      parent = imports[module].get(base.id, f"{module}.{base.id}")
                      if has_test_method(parent, seen | {group}):
                          return True
              return False

          stale_groups = sorted(group for group in weights.group_weights_microseconds
                                if not has_test_method(group, set()))
          if stale_groups:
              raise SystemExit("timing manifest stale test groups: " + ", ".join(stale_groups))
          for identifier in suite_policy.FAST_TEST_IDS:
              module, class_name, method_name = identifier.rsplit(".", 2)
              path = Path(*module.split(".")).with_suffix(".py")
              if not module.startswith("tests.") or not path.is_file():
                  raise SystemExit(f"fast-tier module missing: {identifier}")
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              if not any(
                  isinstance(node, ast.ClassDef) and node.name == class_name and
                  any(isinstance(method, (ast.FunctionDef, ast.AsyncFunctionDef)) and
                      method.name == method_name for method in node.body)
                  for node in tree.body
              ):
                  raise SystemExit(f"fast-tier test missing: {identifier}")
          PY
      - name: Validate locked vendor pins
        run: |
          python - <<'PY'
          import subprocess
          import tomllib

          with open("uv.lock", "rb") as source:
              packages = {package["name"]: package for package in tomllib.load(source)["package"]}
          for name in ("generic-rag", "jsonl-viewer"):
              pinned = packages[name]["source"]["git"].rsplit("#", 1)[-1]
              gitlink = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:vendor/{name}"], text=True
              ).strip()
              if pinned != gitlink:
                  raise SystemExit(f"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}")
          PY
      - name: Validate policy artifacts
        run: |
          python - <<'PY'
          import functools
          import pathlib
          import re
          from urllib.parse import unquote

          root = pathlib.Path.cwd()
          templates = {
              ".github/ISSUE_TEMPLATE/work_item.md": [
                  "## Objective", "## Use cases and expected results",
                  "## Implementation summary", "## Acceptance criteria",
                  "## Boundaries and dependencies",
                  "## Related work and verification plan", "## Implementation plan",
              ],
              ".github/pull_request_template.md": [
                  "## What changed", "## Before and after", "## Implementation",
                  "## Verification", "## Limitations and follow-ups",
                  "## Related Issue",
              ],
              ".github/templates/evidence.md": [
                  "## What this demonstrates", "## Scenario results",
                  "## Reproduction and environment", "## Failures and coverage gaps",
                  "## Technical provenance and artifacts", "## Assessment",
              ],
              ".github/templates/working-status-comment.md": [
                  "## Current status", "## What works now", "## What remains",
                  "## Blocker or decision", "## Next step", "## Evidence links",
              ],
          }
          for relative, expected in templates.items():
              text = (root / relative).read_text(encoding="utf-8")
              actual = list(dict.fromkeys(
                  line for line in text.splitlines() if line.startswith("## ")))
              if actual != expected:
                  raise SystemExit(f"{relative}: template headings changed: {actual!r}")

          @functools.lru_cache(maxsize=None)
          def anchors(path):
              text = path.read_text(encoding="utf-8")
              found = set(re.findall(
                  r'<(?:a|span)\s+(?:name|id)=["\']([^"\']+)["\']', text))
              occurrences = {}
              fenced = False
              for line in text.splitlines():
                  if re.match(r"^\s*(```|~~~)", line):
                      fenced = not fenced
                      continue
                  if fenced:
                      continue
                  heading = re.match(r"^ {0,3}#{1,6}\s+(.+?)\s*#*\s*$", line)
                  if heading is None:
                      continue
                  name = heading.group(1)
                  name = re.sub(r"!\[([^\]]*)\]\([^)]*\)", r"\1", name)
                  name = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", name)
                  name = re.sub(r"<[^>]+>", "", name)
                  name = re.sub(r"[^\w\- ]", "", name.lower().replace("`", "").replace("*", ""))
                  name = re.sub(r"\s", "-", name)
                  duplicate = occurrences.get(name, 0)
                  occurrences[name] = duplicate + 1
                  found.add(name if duplicate == 0 else f"{name}-{duplicate}")
              return found

          markdown = [path for path in root.rglob("*.md")
                      if ".git" not in path.parts and "vendor" not in path.parts]
          for source in markdown:
              text = source.read_text(encoding="utf-8")
              text = re.sub(r"```.*?```|~~~.*?~~~", "", text, flags=re.DOTALL)
              for raw in re.findall(r"\[[^\]]+\]\(([^)]+)\)", text):
                  target = raw.strip().strip("<>").split()[0]
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  path, _, fragment = target.partition("#")
                  destination = (source.parent / unquote(path)).resolve() if path else source
                  try:
                      destination.relative_to(root)
                  except ValueError:
                      raise SystemExit(f"{source}: link leaves repository {target}")
                  if not destination.exists():
                      raise SystemExit(f"{source}: missing local link target {target}")
                  if fragment and destination.suffix.lower() == ".md":
                      if unquote(fragment) not in anchors(destination):
                          raise SystemExit(f"{source}: missing Markdown anchor {target}")

          agents = {path.name for path in (root / ".codex/agents").glob("*.toml")}
          if agents != {"runtime_implementer.toml", "test_engineer.toml"}:
              raise SystemExit(f"unexpected development agents: {sorted(agents)!r}")
          required = [
              root / ".agents/skills/project-workflow/SKILL.md",
              root / ".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md",
          ]
          if any(not path.is_file() for path in required):
              raise SystemExit("required simplified workflow artifact is missing")
          forbidden = [
              root / ".agents/skills/adaptive-verification/SKILL.md",
              root / ".agents/skills/subagent-model-selection/SKILL.md",
              root / "tests/test_repository_agent_policy.py",
          ]
          if any(path.exists() for path in forbidden):
              raise SystemExit("retired policy artifact still exists")
          if len((root / "PYTHON_MODULE_INDEX.md").read_text(encoding="utf-8").splitlines()) > 300:
              raise SystemExit("PYTHON_MODULE_INDEX.md exceeds 300 lines")
          PY

  fast:
    name: Runtime fast tier
    needs: classify
    if: needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Run fast runtime tests
        run: PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json "$RUNNER_TEMP/fast.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-fast
          path: ${{ runner.temp }}/fast.json
          if-no-files-found: warn

  full:
    name: Full runtime shard ${{ matrix.shard }}/2
    needs: classify
    if: needs.classify.outputs.runtime == 'true' && needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Run full runtime shard
        run: PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/2" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: ${{ runner.temp }}/full-${{ matrix.shard }}.json
          if-no-files-found: error

  reconcile-full:
    name: Reconcile full runtime suite
    needs: [classify, full]
    if: >-
      always() && needs.classify.outputs.full == 'true' &&
      (needs.full.result == 'success' || needs.full.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: full-reports
      - name: Reconcile shard evidence
        run: >-
          PYTHONPATH=src python -m tests.runner reconcile
          full-reports/full-1/full-1.json
          full-reports/full-2/full-2.json
          --json "$RUNNER_TEMP/full-reconciled.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-full-reconciled
          path: ${{ runner.temp }}/full-reconciled.json
          if-no-files-found: warn
