name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Run only the dedicated whole-front shard (partial validation)
        required: true
        type: choice
        default: whole-front
        options: [whole-front]
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_ref || github.ref) }}
  cancel-in-progress: true

jobs:
  workflow-deadline:
    name: Enforce 75-minute workflow limit
    # Cover classification, setup and dependency waits independently.
    # Survive normal cancellation long enough to force-cancel stalled jobs.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
    steps:
      - name: Enforce total workflow deadline
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const parameters = () => ({
              ...context.repo,
              run_id: context.runId,
              request: {signal: AbortSignal.timeout(5000)},
            });
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(attempt) || attempt < 1) {
              core.setFailed("Missing workflow attempt identity.");
              return;
            }
            // Metadata retries never grant a new test budget.
            const metadataDeadline = Date.now() + 30_000;
            let deadline;
            let cancellationRequested = false;
            async function currentRun() {
              const {data: run} = await github.rest.actions.getWorkflowRun(parameters());
              if (run.id !== context.runId || run.run_attempt !== attempt) {
                core.setFailed("Workflow attempt changed; the stale guard cannot cancel it.");
                return null;
              }
              if (run.status === "completed") return null;
              const created = Date.parse(run.created_at);
              if (!Number.isFinite(created)) throw new Error("Missing workflow creation time.");
              const runDeadline = created + 75 * 60 * 1000;
              deadline = deadline === undefined ? runDeadline : Math.min(deadline, runDeadline);
              if (Date.now() >= deadline - 30_000) {
                core.setFailed("Workflow guard shutdown margin reached; no safe control window remains.");
                return null;
              }
              return run;
            }
            while (Date.now() < (deadline === undefined ? metadataDeadline : deadline - 30_000)) {
              try {
                if (!await currentRun()) return;
                let complete;
                try {
                  const {data: page} = await github.rest.actions.listJobsForWorkflowRunAttempt({
                    ...parameters(), attempt_number: attempt, per_page: 100,
                  });
                  if (!Number.isSafeInteger(page.total_count) || page.total_count > 100 ||
                      !Array.isArray(page.jobs) || page.total_count !== page.jobs.length) {
                    throw new Error("Cannot establish the complete validation job list.");
                  }
                  // A marker covers downstream jobs absent from an earlier API snapshot.
                  complete = page.jobs.find(job => job.name === "Validation jobs complete");
                } catch (error) {
                  // Job-list failures cannot prevent cancellation at the deadline.
                  core.warning(`Completion lookup failed: ${error.message}`);
                }
                if (Date.now() < deadline && complete?.status === "completed" &&
                    ["success", "failure"].includes(complete.conclusion)) {
                  core.info("All validation jobs finished within the workflow deadline.");
                  return;
                }
                if (Date.now() >= deadline - 330_000) {
                  core.setFailed("Workflow shutdown reserve reached; force-cancelling this run.");
                  if (!await currentRun()) return;
                  await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel", parameters());
                  return;
                }
                if (!cancellationRequested && Date.now() >= deadline - 360_000) {
                  core.setFailed("Workflow shutdown reserve reached; cancelling this run.");
                  if (!await currentRun()) return;
                  await github.rest.actions.cancelWorkflowRun(parameters());
                  cancellationRequested = true;
                }
              } catch (error) {
                core.warning(`Deadline control request failed: ${error.message}`);
              }
              const remaining = (deadline === undefined ? metadataDeadline : deadline - 30_000) - Date.now();
              const poll = deadline !== undefined && deadline - Date.now() > 390_000 ? 30_000 : 5000;
              if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(poll, remaining)));
            }
            core.setFailed("Workflow deadline enforcement could not complete within its bounded window.");

  validation-complete:
    name: Validation jobs complete
    needs: [classify, static, fast, full, whole-front, reconcile-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Mark validation jobs terminal
        timeout-minutes: 1
        env:
          WHOLE_FRONT_ONLY: ${{ needs.classify.outputs.whole_front_only }}
        run: |
          echo "Validation jobs are terminal; their individual results remain authoritative."
          if [[ "$WHOLE_FRONT_ONLY" == "true" ]]; then
            echo "Partial validation: whole-front shard 5/5 only; no complete-suite credit." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  classify:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      whole_front_only: ${{ steps.paths.outputs.whole_front_only }}
      test_run_deadline: ${{ steps.paths.outputs.test_run_deadline }}
      runtime: ${{ steps.paths.outputs.runtime }}
      policy_only: ${{ steps.paths.outputs.policy_only }}
      full: ${{ steps.paths.outputs.full }}
      wall_time_exception: ${{ steps.paths.outputs.wall_time_exception }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      checkout_sha: ${{ steps.paths.outputs.checkout_sha }}
    steps:
      - name: Classify paths and select runtime evidence
        id: paths
        uses: actions/github-script@v7
        timeout-minutes: 2
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId, request: {signal: AbortSignal.timeout(5000)},
            });
            const created = Date.parse(run.created_at);
            if (run.id !== context.runId || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                !Number.isFinite(created)) {
              core.setFailed("Cannot establish this workflow attempt's creation time.");
              return;
            }
            const deadline = Math.floor(created / 1000) + 75 * 60;
            core.setOutput("test_run_deadline", String(deadline));
            if (Date.now() >= deadline * 1000) {
              core.setFailed("Shared workflow deadline exhausted before classification.");
              return;
            }
            const wholeFrontOnly = context.eventName === "workflow_dispatch";
            core.setOutput("whole_front_only", String(wholeFrontOnly));
            if (wholeFrontOnly) {
              if (context.payload.inputs?.validation_scope !== "whole-front" || run.head_sha !== context.sha) {
                core.setFailed("Invalid isolated whole-front selection or source identity.");
                return;
              }
              const defaultBranch = context.payload.repository?.default_branch;
              if (typeof defaultBranch !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(defaultBranch)) {
                core.setFailed("Cannot identify the repository default branch.");
                return;
              }
              const {data: branch} = await github.rest.repos.getBranch({
                owner, repo, branch: defaultBranch,
                request: {signal: AbortSignal.timeout(5000)},
              });
              const base = branch.commit?.sha;
              if (branch.name !== defaultBranch || !/^[0-9a-f]{40}$/.test(base || "") || base === context.sha) {
                core.setFailed("Cannot bind the default-branch commit for static and budget checks.");
                return;
              }
              core.setOutput("runtime", "false");
              core.setOutput("policy_only", "false");
              core.setOutput("full", "false");
              core.setOutput("wall_time_exception", "false");
              core.setOutput("base_sha", base);
              core.setOutput("head_sha", context.sha);
              core.setOutput("checkout_sha", context.sha);
              await core.summary.addHeading("Whole-front-only validation")
                .addRaw("Partial validation: shard 5/5 plus static and policy checks. No complete-suite credit.")
                .write();
              return;
            }
            let files = [];
            let labels = [];
            let baseSha;
            let headSha;
            let truncated = false;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
              labels = pr.labels.map(label => label.name);
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              truncated = files.length >= 3000;
            } else {
              const group = context.payload.merge_group;
              baseSha = group.base_sha;
              headSha = group.head_sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,
              });
              files = comparison.data.files || [];
              // A full page may hide later files. Fail closed rather than infer a partial diff.
              truncated = !Array.isArray(comparison.data.files) || files.length >= 100;
            }

            const paths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean));
            const isRuntime = path =>
              path.startsWith("src/") ||
              path.startsWith("config/") ||
              path === "pyproject.toml" ||
              path === "uv.lock" ||
              path === "MANIFEST.in" ||
              path === ".gitmodules" ||
              path === "vendor/generic-rag" ||
              path === "vendor/jsonl-viewer";
            const runtimePaths = truncated || paths.some(isRuntime);
            const isTest = path => path.startsWith("tests/") ||
              path === ".github/workflows/pr-validation.yml" || path === "TEST_POLICY.md";
            const testPaths = truncated || paths.some(isTest);
            const fullRequested = labels.includes("test:full");
            const wallTimeException = context.eventName === "pull_request" && labels.includes("test:wall-time-exception");
            const runtime = runtimePaths || testPaths || fullRequested;
            const full = runtime;
            core.setOutput("runtime", String(runtime));
            core.setOutput("policy_only", String(!runtimePaths && !testPaths));
            core.setOutput("full", String(full));
            core.setOutput("wall_time_exception", String(wallTimeException));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            // Event SHA is the PR test merge or merge-group commit, pinned across jobs.
            core.setOutput("checkout_sha", context.sha);
            core.summary
              .addHeading("Validation selection")
              .addTable([
                [{data: "Runtime paths", header: true}, String(runtimePaths)],
                [{data: "Policy/config only", header: true}, String(!runtimePaths)],
                [{data: "Run runtime lanes", header: true}, String(runtime)],
                [{data: "Full suite", header: true}, String(full)],
                [{data: "Wall-time exception", header: true}, String(wallTimeException)],
              ])
              .write();

  static:
    name: Static validation
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    steps:
      - name: Check shared deadline before static work
        run: |
          [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
          if (( TEST_RUN_DEADLINE <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before static work."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob("**/*.toml"):
              if ".git" not in path.parts:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
                  if path.parent == pathlib.Path(".codex/agents"):
                      if data.get("name") != path.stem:
                          raise SystemExit(f"{path}: agent name must match filename")
                      for field in ("description", "developer_instructions"):
                          value = data.get(field)
                          if not isinstance(value, str) or not value.strip():
                              raise SystemExit(f"{path}: missing {field}")
          for path in pathlib.Path(".").glob("**/*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in (*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tests").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec", dont_inherit=True)
          PY
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
          ruby -ryaml -ropen3 <<'RB'
          Dir[".agents/skills/*/SKILL.md"].each do |path|
            source = File.read(path)
            match = source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
            abort "#{path}: missing YAML frontmatter" unless match
            data = YAML.safe_load(match[1], aliases: false)
            abort "#{path}: name must match directory and description must be nonempty" unless
              data.is_a?(Hash) && data["name"] == File.basename(File.dirname(path)) &&
              data["description"].is_a?(String) && !data["description"].strip.empty?
          end
          issue_path = ".github/ISSUE_TEMPLATE/work_item.md"
          issue_source = File.read(issue_path)
          issue_match = issue_source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
          abort "#{issue_path}: missing YAML frontmatter" unless issue_match
          issue = YAML.safe_load(issue_match[1], aliases: false)
          abort "#{issue_path}: invalid frontmatter mapping" unless issue.is_a?(Hash)
          %w[name about title labels assignees].each do |field|
            value = issue[field]
            abort "#{issue_path}: missing or non-string #{field}" unless value.is_a?(String)
          end
          %w[name about].each do |field|
            abort "#{issue_path}: empty #{field}" if issue[field].strip.empty?
          end
          Dir[".github/workflows/*.{yml,yaml}"].each do |path|
            document = YAML.safe_load(File.read(path), aliases: false)
            document.fetch("jobs").each do |job_name, job|
              job.fetch("steps", []).each do |step|
                script = step["with"]&.fetch("script", nil)
                next unless script
                _, error, status = Open3.capture3(
                  "node", "--input-type=module", "--check",
                  stdin_data: "async function main() {\n#{script}\n}")
                abort "#{path} #{job_name}: #{error}" unless status.success?
              end
            end
          end
          RB
      - name: Validate runner metadata
        run: |
          python -B - <<'PY'
          from tests import suite_policy

          suite_policy.load_timing_weights()
          ids = suite_policy.FAST_TEST_IDS
          if not ids or len(ids) != len(set(ids)):
              raise SystemExit("fast tier must contain unique test IDs")
          if any(not identifier.rsplit(".", 1)[-1].startswith("test") for identifier in ids):
              raise SystemExit("fast tier contains a non-test method ID")
          PY
      - name: Validate locked vendor pins
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          if Path("MANIFEST.in").read_text(encoding="utf-8") != "prune vendor/jsonl-viewer\n":
              raise SystemExit("MANIFEST.in must exclude vendored jsonl-viewer source")

          with open("uv.lock", "rb") as source:
              packages = {package["name"]: package for package in tomllib.load(source)["package"]}
          for name in ("generic-rag", "jsonl-viewer"):
              pinned = packages[name]["source"]["git"].rsplit("#", 1)[-1]
              gitlink = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:vendor/{name}"], text=True
              ).strip()
              if pinned != gitlink:
                  raise SystemExit(f"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}")
          PY
      - name: Validate policy artifacts
        run: |
          python - <<'PY'
          import pathlib

          root = pathlib.Path.cwd()
          templates = {
              ".github/ISSUE_TEMPLATE/work_item.md": [
                  "## Objective", "## Use cases and expected results",
                  "## Implementation summary", "## Acceptance criteria",
                  "## Boundaries and dependencies",
                  "## Related work and verification plan", "## Implementation plan",
              ],
              ".github/pull_request_template.md": [
                  "## What changed", "## Before and after", "## Implementation",
                  "## Verification", "## Limitations and follow-ups",
                  "## Related Issue",
              ],
              ".github/templates/evidence.md": [
                  "## What this demonstrates", "## Scenario results",
                  "## Reproduction and environment", "## Failures and coverage gaps",
                  "## Technical provenance and artifacts", "## Assessment",
              ],
              ".github/templates/working-status-comment.md": [
                  "## Current status", "## What works now", "## What remains",
                  "## Blocker or decision", "## Next step", "## Evidence links",
              ],
          }
          for relative, expected in templates.items():
              text = (root / relative).read_text(encoding="utf-8")
              actual = [line for line in text.splitlines() if line.startswith("## ")]
              if actual != expected:
                  raise SystemExit(f"{relative}: template headings changed: {actual!r}")

          agents = {path.name for path in (root / ".codex/agents").glob("*.toml")}
          if agents != {"runtime_implementer.toml", "test_engineer.toml"}:
              raise SystemExit(f"unexpected development agents: {sorted(agents)!r}")
          required = [
              root / ".agents/skills/project-workflow/SKILL.md",
              root / ".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md",
          ]
          if any(not path.is_file() for path in required):
              raise SystemExit("required simplified workflow artifact is missing")
          forbidden = [
              root / ".agents/skills/adaptive-verification/SKILL.md",
              root / ".agents/skills/subagent-model-selection/SKILL.md",
              root / "tests/test_repository_agent_policy.py",
          ]
          if any(path.exists() for path in forbidden):
              raise SystemExit("retired policy artifact still exists")
          if len((root / "PYTHON_MODULE_INDEX.md").read_text(encoding="utf-8").splitlines()) > 300:
              raise SystemExit("PYTHON_MODULE_INDEX.md exceeds 300 lines")
          PY

  fast:
    name: Runtime fast tier
    needs: classify
    if: needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TEST_JOB_MINUTES: '60'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-fast.json"
          TEST_HARDWARE_SELECTION: "tier:fast"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Run fast runtime tests
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3150 )); then test_seconds=3150; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/fast-control.json"
          if (( test_seconds <= 0 )); then exit 124; fi
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json "$RUNNER_TEMP/fast.json" 2>&1 | tee "$RUNNER_TEMP/fast.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/fast-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: runtime-fast
          path: |
            ${{ runner.temp }}/fast.json
            ${{ runner.temp }}/fast.log
            ${{ runner.temp }}/fast-control.json
            ${{ runner.temp }}/fast-exit-code.txt
            ${{ runner.temp }}/runner-hardware-fast.json
          if-no-files-found: warn

  full:
    name: ${{ format('Full runtime shard {0}/5', matrix.shard) }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: '75'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    timeout-minutes: 75
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json"
          TEST_HARDWARE_SELECTION: "shard:${{ matrix.shard }}/5"
          TEST_HARDWARE_SHARD: "${{ matrix.shard }}/5"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Run full runtime shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3600 )); then test_seconds=3600; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json"
          if (( test_seconds < 3600 )); then
            printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\n' "$test_seconds" >&2
            printf '124\n' > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
            exit 124
          fi
          test_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ["TEST_JOB_DEADLINE"]),int(os.environ["TEST_RUN_DEADLINE"]))-450; sys.exit("Insufficient remaining time for a full test hour") if w > cutoff else print(w)')
          .venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile="audited-147-v3",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+"\n")' "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json" "$test_work_deadline"
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/5" --hosted-methods audited-147-v3 --hosted-deadline-epoch "$test_work_deadline" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.shard }}.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.shard }}.json
            ${{ runner.temp }}/full-${{ matrix.shard }}.json.methods/
            ${{ runner.temp }}/full-${{ matrix.shard }}.log
            ${{ runner.temp }}/full-${{ matrix.shard }}-control.json
            ${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json
          if-no-files-found: error

  whole-front:
