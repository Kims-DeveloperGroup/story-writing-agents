{
  "name": "PR validation",
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "concurrency": {
    "group": "${{ github.event_name == 'workflow_dispatch' && format('{0}-diagnostic-{1}-{2}-{3}', github.workflow, github.ref, inputs.arch, inputs.scratch) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_ref || github.ref) }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "workflow-deadline": {
      "name": "Enforce 30-minute workflow limit",
      "if": "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "actions": "write"
      },
      "steps": [
        {
          "name": "Enforce total workflow deadline",
          "uses": "actions/github-script@v7",
          "with": {
            "retries": 0,
            "script": "const parameters = () => ({\n  ...context.repo,\n  run_id: context.runId,\n  request: {signal: AbortSignal.timeout(5000)},\n});\nconst attempt = Number(process.env.GITHUB_RUN_ATTEMPT);\nif (!Number.isSafeInteger(attempt) || attempt < 1) {\n  core.setFailed(\"Missing workflow attempt identity.\");\n  return;\n}\n// Metadata retries never grant a new test budget.\nconst metadataDeadline = Date.now() + 30_000;\nlet deadline;\nlet cancellationRequested = false;\nasync function currentRun() {\n  const {data: run} = await github.rest.actions.getWorkflowRun(parameters());\n  if (run.id !== context.runId || run.run_attempt !== attempt) {\n    core.setFailed(\"Workflow attempt changed; the stale guard cannot cancel it.\");\n    return null;\n  }\n  if (run.status === \"completed\") return null;\n  const created = Date.parse(run.created_at);\n  if (!Number.isFinite(created)) throw new Error(\"Missing workflow creation time.\");\n  const runDeadline = created + 30 * 60 * 1000;\n  deadline = deadline === undefined ? runDeadline : Math.min(deadline, runDeadline);\n  if (Date.now() >= deadline - 30_000) {\n    core.setFailed(\"Workflow guard shutdown margin reached; no safe control window remains.\");\n    return null;\n  }\n  return run;\n}\nwhile (Date.now() < (deadline === undefined ? metadataDeadline : deadline - 30_000)) {\n  try {\n    if (!await currentRun()) return;\n    let complete;\n    try {\n      const {data: page} = await github.rest.actions.listJobsForWorkflowRunAttempt({\n        ...parameters(), attempt_number: attempt, per_page: 100,\n      });\n      if (!Number.isSafeInteger(page.total_count) || page.total_count > 100 ||\n          !Array.isArray(page.jobs) || page.total_count !== page.jobs.length) {\n        throw new Error(\"Cannot establish the complete validation job list.\");\n      }\n      // A marker covers downstream jobs absent from an earlier API snapshot.\n      complete = page.jobs.find(job => job.name === \"Validation jobs complete\");\n    } catch (error) {\n      // Job-list failures cannot prevent cancellation at the deadline.\n      core.warning(`Completion lookup failed: ${error.message}`);\n    }\n    if (Date.now() < deadline && complete?.status === \"completed\" &&\n        [\"success\", \"failure\"].includes(complete.conclusion)) {\n      core.info(\"All validation jobs finished within the workflow deadline.\");\n      return;\n    }\n    if (Date.now() >= deadline - 330_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; force-cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.request(\"POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel\", parameters());\n      return;\n    }\n    if (!cancellationRequested && Date.now() >= deadline - 360_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.rest.actions.cancelWorkflowRun(parameters());\n      cancellationRequested = true;\n    }\n  } catch (error) {\n    core.warning(`Deadline control request failed: ${error.message}`);\n  }\n  const remaining = (deadline === undefined ? metadataDeadline : deadline - 30_000) - Date.now();\n  const poll = deadline !== undefined && deadline - Date.now() > 390_000 ? 30_000 : 5000;\n  if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(poll, remaining)));\n}\ncore.setFailed(\"Workflow deadline enforcement could not complete within its bounded window.\");\n"
          }
        }
      ]
    },
    "validation-complete": {
      "name": "Validation jobs complete",
      "needs": [
        "classify",
        "static",
        "fast",
        "full",
        "reconcile-full",
        "diagnose-full-budget"
      ],
      "if": "${{ !cancelled() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {},
      "steps": [
        {
          "name": "Mark validation jobs terminal",
          "timeout-minutes": 1,
          "run": "echo \"Validation jobs are terminal; their individual results remain authoritative.\""
        }
      ]
    },
    "classify": {
      "name": "${{ github.event_name == 'workflow_dispatch' && 'Initialize diagnostic deadline' || 'Classify changed paths' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "pull-requests": "read",
        "actions": "read"
      },
      "outputs": {
        "test_run_deadline": "${{ steps.paths.outputs.test_run_deadline }}",
        "runtime": "${{ steps.paths.outputs.runtime }}",
        "policy_only": "${{ steps.paths.outputs.policy_only }}",
        "full": "${{ steps.paths.outputs.full }}",
        "wall_time_exception": "${{ steps.paths.outputs.wall_time_exception }}",
        "base_sha": "${{ steps.paths.outputs.base_sha }}",
        "head_sha": "${{ steps.paths.outputs.head_sha }}",
        "checkout_sha": "${{ steps.paths.outputs.checkout_sha }}"
      },
      "steps": [
        {
          "name": "Classify paths and select runtime evidence",
          "id": "paths",
          "uses": "actions/github-script@v7",
          "timeout-minutes": 2,
          "with": {
            "script": "const {owner, repo} = context.repo;\nconst {data: run} = await github.rest.actions.getWorkflowRun({\n  owner, repo, run_id: context.runId, request: {signal: AbortSignal.timeout(5000)},\n});\nconst created = Date.parse(run.created_at);\nif (run.id !== context.runId || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||\n    !Number.isFinite(created)) {\n  core.setFailed(\"Cannot establish this workflow attempt's creation time.\");\n  return;\n}\nconst deadline = Math.floor(created / 1000) + 30 * 60;\ncore.setOutput(\"test_run_deadline\", String(deadline));\nif (Date.now() >= deadline * 1000) {\n  core.setFailed(\"Shared workflow deadline exhausted before classification.\");\n  return;\n}\nif (context.eventName === \"workflow_dispatch\") {\n  core.setOutput(\"runtime\", \"false\");\n  core.setOutput(\"policy_only\", \"true\");\n  core.setOutput(\"full\", \"false\");\n  core.setOutput(\"wall_time_exception\", \"false\");\n  for (const name of [\"base_sha\", \"head_sha\", \"checkout_sha\"]) core.setOutput(name, context.sha);\n  return;\n}\nlet files = [];\nlet labels = [];\nlet baseSha;\nlet headSha;\nlet truncated = false;\n\nif (context.eventName === \"pull_request\") {\n  const pr = context.payload.pull_request;\n  baseSha = pr.base.sha;\n  headSha = pr.head.sha;\n  labels = pr.labels.map(label => label.name);\n  files = await github.paginate(github.rest.pulls.listFiles, {\n    owner, repo, pull_number: pr.number, per_page: 100,\n  });\n  truncated = files.length >= 3000;\n} else {\n  const group = context.payload.merge_group;\n  baseSha = group.base_sha;\n  headSha = group.head_sha;\n  const comparison = await github.rest.repos.compareCommitsWithBasehead({\n    owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,\n  });\n  files = comparison.data.files || [];\n  // A full page may hide later files. Fail closed rather than infer a partial diff.\n  truncated = !Array.isArray(comparison.data.files) || files.length >= 100;\n}\n\nconst paths = files.flatMap(file =>\n  [file.filename, file.previous_filename].filter(Boolean));\nconst isRuntime = path =>\n  path.startsWith(\"src/\") ||\n  path.startsWith(\"config/\") ||\n  path === \"pyproject.toml\" ||\n  path === \"uv.lock\" ||\n  path === \"MANIFEST.in\" ||\n  path === \".gitmodules\" ||\n  path === \"vendor/generic-rag\" ||\n  path === \"vendor/jsonl-viewer\";\nconst runtimePaths = truncated || paths.some(isRuntime);\nconst isTest = path => path.startsWith(\"tests/\") ||\n  path === \".github/workflows/pr-validation.yml\" || path === \"TEST_POLICY.md\";\nconst testPaths = truncated || paths.some(isTest);\nconst fullRequested = labels.includes(\"test:full\");\nconst wallTimeException = context.eventName === \"pull_request\" && labels.includes(\"test:wall-time-exception\");\nconst runtime = runtimePaths || testPaths || fullRequested;\nconst full = runtime;\ncore.setOutput(\"runtime\", String(runtime));\ncore.setOutput(\"policy_only\", String(!runtimePaths && !testPaths));\ncore.setOutput(\"full\", String(full));\ncore.setOutput(\"wall_time_exception\", String(wallTimeException));\ncore.setOutput(\"base_sha\", baseSha);\ncore.setOutput(\"head_sha\", headSha);\n// Event SHA is the PR test merge or merge-group commit, pinned across jobs.\ncore.setOutput(\"checkout_sha\", context.sha);\ncore.summary\n  .addHeading(\"Validation selection\")\n  .addTable([\n    [{data: \"Runtime paths\", header: true}, String(runtimePaths)],\n    [{data: \"Policy/config only\", header: true}, String(!runtimePaths)],\n    [{data: \"Run runtime lanes\", header: true}, String(runtime)],\n    [{data: \"Full suite\", header: true}, String(full)],\n    [{data: \"Wall-time exception\", header: true}, String(wallTimeException)],\n  ])\n  .write();\n"
          }
        }
      ]
    },
    "static": {
      "name": "${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - static validation skipped' || 'Static validation' }}",
      "needs": "classify",
      "if": "github.event_name != 'workflow_dispatch'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Check shared deadline before static work",
          "run": "[[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\nif (( TEST_RUN_DEADLINE <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before static work.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Check patch whitespace",
          "env": {
            "BASE_SHA": "${{ needs.classify.outputs.base_sha }}",
            "HEAD_SHA": "${{ needs.classify.outputs.head_sha }}"
          },
          "run": "git diff --check \"$BASE_SHA...$HEAD_SHA\""
        },
        {
          "name": "Parse repository configuration",
          "run": "python - <<'PY'\nimport json\nimport pathlib\nimport tomllib\n\nfor path in pathlib.Path(\".\").glob(\"**/*.toml\"):\n    if \".git\" not in path.parts:\n        data = tomllib.loads(path.read_text(encoding=\"utf-8\"))\n        if path.parent == pathlib.Path(\".codex/agents\"):\n            if data.get(\"name\") != path.stem:\n                raise SystemExit(f\"{path}: agent name must match filename\")\n            for field in (\"description\", \"developer_instructions\"):\n                value = data.get(field)\n                if not isinstance(value, str) or not value.strip():\n                    raise SystemExit(f\"{path}: missing {field}\")\nfor path in pathlib.Path(\".\").glob(\"**/*.json\"):\n    if \".git\" not in path.parts:\n        json.loads(path.read_text(encoding=\"utf-8\"))\nfor path in (*pathlib.Path(\"src\").rglob(\"*.py\"), *pathlib.Path(\"tests\").rglob(\"*.py\")):\n    compile(path.read_text(encoding=\"utf-8\"), str(path), \"exec\", dont_inherit=True)\nPY\nruby -e 'require \"yaml\"; Dir[\".github/workflows/*.{yml,yaml}\"].each { |path| YAML.parse_file(path) }'\nruby -ryaml -ropen3 <<'RB'\nDir[\".agents/skills/*/SKILL.md\"].each do |path|\n  source = File.read(path)\n  match = source.match(/\\A---\\r?\\n(.*?)\\r?\\n---(?:\\r?\\n|\\z)/m)\n  abort \"#{path}: missing YAML frontmatter\" unless match\n  data = YAML.safe_load(match[1], aliases: false)\n  abort \"#{path}: name must match directory and description must be nonempty\" unless\n    data.is_a?(Hash) && data[\"name\"] == File.basename(File.dirname(path)) &&\n    data[\"description\"].is_a?(String) && !data[\"description\"].strip.empty?\nend\nissue_path = \".github/ISSUE_TEMPLATE/work_item.md\"\nissue_source = File.read(issue_path)\nissue_match = issue_source.match(/\\A---\\r?\\n(.*?)\\r?\\n---(?:\\r?\\n|\\z)/m)\nabort \"#{issue_path}: missing YAML frontmatter\" unless issue_match\nissue = YAML.safe_load(issue_match[1], aliases: false)\nabort \"#{issue_path}: invalid frontmatter mapping\" unless issue.is_a?(Hash)\n%w[name about title labels assignees].each do |field|\n  value = issue[field]\n  abort \"#{issue_path}: missing or non-string #{field}\" unless value.is_a?(String)\nend\n%w[name about].each do |field|\n  abort \"#{issue_path}: empty #{field}\" if issue[field].strip.empty?\nend\nDir[\".github/workflows/*.{yml,yaml}\"].each do |path|\n  document = YAML.safe_load(File.read(path), aliases: false)\n  document.fetch(\"jobs\").each do |job_name, job|\n    job.fetch(\"steps\", []).each do |step|\n      script = step[\"with\"]&.fetch(\"script\", nil)\n      next unless script\n      _, error, status = Open3.capture3(\n        \"node\", \"--input-type=module\", \"--check\",\n        stdin_data: \"async function main() {\\n#{script}\\n}\")\n      abort \"#{path} #{job_name}: #{error}\" unless status.success?\n    end\n  end\nend\nRB\n"
        },
        {
          "name": "Validate runner metadata",
          "run": "python -B - <<'PY'\nfrom tests import suite_policy\n\nsuite_policy.load_timing_weights()\nids = suite_policy.FAST_TEST_IDS\nif not ids or len(ids) != len(set(ids)):\n    raise SystemExit(\"fast tier must contain unique test IDs\")\nif any(not identifier.rsplit(\".\", 1)[-1].startswith(\"test\") for identifier in ids):\n    raise SystemExit(\"fast tier contains a non-test method ID\")\nPY\n"
        },
        {
          "name": "Validate locked vendor pins",
          "run": "python - <<'PY'\nimport subprocess\nimport tomllib\nfrom pathlib import Path\n\nif Path(\"MANIFEST.in\").read_text(encoding=\"utf-8\") != \"prune vendor/jsonl-viewer\\n\":\n    raise SystemExit(\"MANIFEST.in must exclude vendored jsonl-viewer source\")\n\nwith open(\"uv.lock\", \"rb\") as source:\n    packages = {package[\"name\"]: package for package in tomllib.load(source)[\"package\"]}\nfor name in (\"generic-rag\", \"jsonl-viewer\"):\n    pinned = packages[name][\"source\"][\"git\"].rsplit(\"#\", 1)[-1]\n    gitlink = subprocess.check_output(\n        [\"git\", \"rev-parse\", f\"HEAD:vendor/{name}\"], text=True\n    ).strip()\n    if pinned != gitlink:\n        raise SystemExit(f\"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}\")\nPY\n"
        },
        {
          "name": "Validate policy artifacts",
          "run": "python - <<'PY'\nimport pathlib\n\nroot = pathlib.Path.cwd()\ntemplates = {\n    \".github/ISSUE_TEMPLATE/work_item.md\": [\n        \"## Objective\", \"## Use cases and expected results\",\n        \"## Implementation summary\", \"## Acceptance criteria\",\n        \"## Boundaries and dependencies\",\n        \"## Related work and verification plan\", \"## Implementation plan\",\n    ],\n    \".github/pull_request_template.md\": [\n        \"## What changed\", \"## Before and after\", \"## Implementation\",\n        \"## Verification\", \"## Limitations and follow-ups\",\n        \"## Related Issue\",\n    ],\n    \".github/templates/evidence.md\": [\n        \"## What this demonstrates\", \"## Scenario results\",\n        \"## Reproduction and environment\", \"## Failures and coverage gaps\",\n        \"## Technical provenance and artifacts\", \"## Assessment\",\n    ],\n    \".github/templates/working-status-comment.md\": [\n        \"## Current status\", \"## What works now\", \"## What remains\",\n        \"## Blocker or decision\", \"## Next step\", \"## Evidence links\",\n    ],\n}\nfor relative, expected in templates.items():\n    text = (root / relative).read_text(encoding=\"utf-8\")\n    actual = [line for line in text.splitlines() if line.startswith(\"## \")]\n    if actual != expected:\n        raise SystemExit(f\"{relative}: template headings changed: {actual!r}\")\n\nagents = {path.name for path in (root / \".codex/agents\").glob(\"*.toml\")}\nif agents != {\"runtime_implementer.toml\", \"test_engineer.toml\"}:\n    raise SystemExit(f\"unexpected development agents: {sorted(agents)!r}\")\nrequired = [\n    root / \".agents/skills/project-workflow/SKILL.md\",\n    root / \".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md\",\n]\nif any(not path.is_file() for path in required):\n    raise SystemExit(\"required simplified workflow artifact is missing\")\nforbidden = [\n    root / \".agents/skills/adaptive-verification/SKILL.md\",\n    root / \".agents/skills/subagent-model-selection/SKILL.md\",\n    root / \"tests/test_repository_agent_policy.py\",\n]\nif any(path.exists() for path in forbidden):\n    raise SystemExit(\"retired policy artifact still exists\")\nif len((root / \"PYTHON_MODULE_INDEX.md\").read_text(encoding=\"utf-8\").splitlines()) > 300:\n    raise SystemExit(\"PYTHON_MODULE_INDEX.md exceeds 300 lines\")\nPY\n"
        }
      ]
    },
    "fast": {
      "name": "${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - fast tier skipped' || 'Runtime fast tier' }}",
      "needs": "classify",
      "if": "needs.classify.outputs.runtime == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "TEST_JOB_MINUTES": "30",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "name": "Install runtime test dependencies",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure deterministic test Git identity",
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n"
        },
        {
          "name": "Run fast runtime tests",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 1350 )); then test_seconds=1350; fi\nprintf '{\"worker_limit_seconds\":%s,\"kill_grace_seconds\":30,\"cleanup_reserve_seconds\":60,\"cancellation_reserve_seconds\":360}\\n' \"$test_seconds\" > \"$RUNNER_TEMP/fast-control.json\"\nif (( test_seconds <= 0 )); then exit 124; fi\nset +e\ntimeout --signal=INT --kill-after=30s \"${test_seconds}s\" env PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json \"$RUNNER_TEMP/fast.json\" 2>&1 | tee \"$RUNNER_TEMP/fast.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\ntest_status=${test_statuses[0]}\nif (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi\nprintf '%s\\n' \"$test_status\" > \"$RUNNER_TEMP/fast-exit-code.txt\"\nexit \"$test_status\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "runtime-fast",
            "path": "${{ runner.temp }}/fast.json\n${{ runner.temp }}/fast.log\n${{ runner.temp }}/fast-control.json\n${{ runner.temp }}/fast-exit-code.txt\n",
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "full": {
      "name": "${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - full suite skipped' || format('Full runtime shard {0}/4', matrix.shard) }}",
      "needs": "classify",
      "if": "needs.classify.outputs.full == 'true'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3,
            4
          ]
        }
      },
      "runs-on": "ubuntu-24.04",
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "TEST_JOB_MINUTES": "30",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "name": "Install runtime test dependencies",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure deterministic test Git identity",
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n"
        },
        {
          "name": "Run full runtime shard",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 1350 )); then test_seconds=1350; fi\nprintf '{\"worker_limit_seconds\":%s,\"kill_grace_seconds\":30,\"cleanup_reserve_seconds\":60,\"cancellation_reserve_seconds\":360}\\n' \"$test_seconds\" > \"$RUNNER_TEMP/full-${{ matrix.shard }}-control.json\"\nif (( test_seconds <= 0 )); then exit 124; fi\nset +e\ntimeout --signal=INT --kill-after=30s \"${test_seconds}s\" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard \"${{ matrix.shard }}/4\" --json \"$RUNNER_TEMP/full-${{ matrix.shard }}.json\" 2>&1 | tee \"$RUNNER_TEMP/full-${{ matrix.shard }}.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\ntest_status=${test_statuses[0]}\nif (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi\nprintf '%s\\n' \"$test_status\" > \"$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt\"\nexit \"$test_status\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "full-${{ matrix.shard }}",
            "path": "${{ runner.temp }}/full-${{ matrix.shard }}.json\n${{ runner.temp }}/full-${{ matrix.shard }}.log\n${{ runner.temp }}/full-${{ matrix.shard }}-control.json\n${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt\n",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "reconcile-full": {
      "name": "${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - reconciliation skipped' || 'Reconcile full runtime suite' }}",
      "needs": [
        "classify",
        "full"
      ],
      "if": "!cancelled() && needs.classify.outputs.full == 'true' && (needs.full.result == 'success' || needs.full.result == 'failure')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "TEST_JOB_MINUTES": "30",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "full-*",
            "path": "full-reports"
          }
        },
        {
          "name": "Reconcile shard evidence",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds <= 0 )); then\n  echo \"Reconciliation deadline exhausted; preserve 30s termination, 60s upload, and 360s cancellation reserve.\"\n  exit 124\nfi\nPYTHONPATH=src timeout --signal=INT --kill-after=30s \"${test_seconds}s\" \\\n  python -m tests.runner reconcile \\\n  full-reports/full-1/full-1.json full-reports/full-2/full-2.json \\\n  full-reports/full-3/full-3.json full-reports/full-4/full-4.json \\\n  --json \"$RUNNER_TEMP/full-reconciled.json\"\n"
        },
        {
          "name": "Enforce frozen suite inventory and wall-time budget",
          "env": {
            "BASE_SHA": "${{ needs.classify.outputs.base_sha }}",
            "WALL_TIME_EXCEPTION": "${{ needs.classify.outputs.wall_time_exception }}"
          },
          "run": "budget_args=(--base-ref \"$BASE_SHA\"\n  --report full-reports/full-1/full-1.json\n  --report full-reports/full-2/full-2.json\n  --report full-reports/full-3/full-3.json\n  --report full-reports/full-4/full-4.json)\nif [[ \"$WALL_TIME_EXCEPTION\" == \"true\" ]]; then\n  echo \"Maintainer-authorized wall-time exception: measured durations remain visible.\"\n  budget_args+=(--allow-wall-time-overage)\nfi\ntest_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds <= 0 )); then\n  echo \"Reconciliation deadline exhausted before inventory and wall-time checks.\"\n  exit 124\nfi\nPYTHONPATH=src timeout --signal=INT --kill-after=30s \"${test_seconds}s\" \\\n  python -m tests.suite_budget \"${budget_args[@]}\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always()",
          "with": {
            "name": "runtime-full-reconciled",
            "path": "${{ runner.temp }}/full-reconciled.json",
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "diagnose-full-budget": {
      "name": "${{ github.event_name == 'workflow_dispatch' && format('Diagnostic only ({0}, {1})', inputs.arch, inputs.scratch) || 'Diagnose full-suite timing failure' }}",
      "needs": [
        "classify",
        "full",
        "reconcile-full"
      ],
      "if": "!cancelled() && (github.event_name == 'workflow_dispatch' || (needs.full.result == 'success' && needs.reconcile-full.result == 'failure'))",
      "runs-on": "${{ github.event_name == 'workflow_dispatch' && inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}",
      "timeout-minutes": 30,
      "env": {
        "TEST_JOB_MINUTES": "30",
        "TEST_RUN_DEADLINE": "${{ needs.classify.outputs.test_run_deadline }}"
      },
      "steps": [
        {
          "name": "Record shared test deadline before setup",
          "run": "test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))\nif [[ -n \"$TEST_RUN_DEADLINE\" ]]; then\n  [[ \"$TEST_RUN_DEADLINE\" =~ ^[0-9]+$ ]] || exit 2\n  if (( TEST_RUN_DEADLINE < test_deadline )); then\n    test_deadline=$TEST_RUN_DEADLINE\n  fi\nelse\n  echo \"Missing shared test-run deadline.\"\n  exit 2\nfi\necho \"TEST_JOB_DEADLINE=$test_deadline\" >> \"$GITHUB_ENV\"\nif (( test_deadline <= $(date +%s) )); then\n  echo \"Shared test-run deadline exhausted before setup.\"\n  exit 124\nfi\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ github.event_name == 'workflow_dispatch' && github.sha || needs.classify.outputs.checkout_sha }}",
            "fetch-depth": 2
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "if": "github.event_name != 'workflow_dispatch'",
          "with": {
            "pattern": "full-*",
            "path": "${{ runner.temp }}/diagnostic-inputs"
          }
        },
        {
          "name": "Select actual timing failures",
          "if": "github.event_name != 'workflow_dispatch'",
          "id": "timing",
          "run": "python - <<'PY'\nimport json, os\nfrom pathlib import Path\nfrom tests.suite_budget import load_budget\nroot = Path(os.environ[\"RUNNER_TEMP\"]) / \"diagnostic-inputs\"\nreports = [json.loads((root / f\"full-{i}\" / f\"full-{i}.json\").read_text()) for i in (1, 2, 3, 4)]\nbudget = load_budget()\nseconds = [report[\"durations\"][\"wall_seconds\"] for report in reports]\nover = sum(seconds) > budget[\"max_sequential_wall_seconds\"] or max(seconds) > budget[\"max_shard_wall_seconds\"]\nselected = over and all(report[\"outcome\"] == \"success\" for report in reports)\nwith open(os.environ[\"GITHUB_OUTPUT\"], \"a\") as output:\n    output.write(f\"selected={str(selected).lower()}\\n\")\nPY\n"
        },
        {
          "name": "Install diagnostic dependencies",
          "if": "github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure diagnostic test Git identity",
          "if": "github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'",
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n"
        },
        {
          "name": "Prepare diagnostic scratch storage",
          "if": "github.event_name == 'workflow_dispatch'",
          "id": "scratch",
          "env": {
            "MEMORY": "${{ inputs.scratch == 'memory' }}"
          },
          "run": "scratch=\"$(mktemp -d \"${TMPDIR:-/tmp}/story-timing.XXXXXXXX\")\"\nif [[ \"$MEMORY\" == \"true\" ]]; then\n  echo \"directory=$scratch\" >> \"$GITHUB_OUTPUT\"\n  sudo mount -t tmpfs -o \"size=2G,mode=0700,uid=$(id -u),gid=$(id -g)\" tmpfs \"$scratch\"\nelse\n  SCRATCH=\"$scratch\" python - <<'PY'\nimport json, os, re, stat\nraw = os.environ[\"SCRATCH\"]\nparent = os.path.realpath(os.path.dirname(os.path.abspath(raw)))\nname = os.path.basename(raw)\npath = os.path.join(parent, name)\nif not re.fullmatch(r\"story-timing\\.[A-Za-z0-9]{8}\", name) or any(c in path for c in \"\\r\\n\"):\n    raise RuntimeError(\"Unexpected diagnostic scratch path\")\nflags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW\nfd = os.open(parent, flags)\ntry:\n    outer = os.fstat(fd)\n    inner = os.stat(name, dir_fd=fd, follow_symlinks=False)\n    if not stat.S_ISDIR(inner.st_mode) or inner.st_uid != os.geteuid() or inner.st_dev != outer.st_dev:\n        raise RuntimeError(\"Diagnostic scratch creation identity is unsafe\")\n    record = {\"path\": path, \"parent\": parent,\n              \"root\": [inner.st_dev, inner.st_ino, inner.st_uid],\n              \"parent_identity\": [outer.st_dev, outer.st_ino, outer.st_uid]}\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(\"directory=\" + path + \"\\n\")\n        output.write(\"identity=\" + json.dumps(record, separators=(\",\", \":\")) + \"\\n\")\n    print(json.dumps({\"diagnostic_scratch_created\": record}, sort_keys=True))\nfinally:\n    os.close(fd)\nPY\nfi\n"
        },
        {
          "name": "Observe GC intervals during unchanged construction, then unchanged invalid lane",
          "if": "github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'",
          "env": {
            "GIT_AUTHOR_NAME": "Story Tests",
            "GIT_AUTHOR_EMAIL": "story-tests@example.invalid",
            "GIT_COMMITTER_NAME": "Story Tests",
            "GIT_COMMITTER_EMAIL": "story-tests@example.invalid",
            "PYTHONPATH": "${{ github.workspace }}:${{ github.workspace }}/src",
