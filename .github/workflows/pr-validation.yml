name: Issue 873 bounded negative-decoder stage attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-stages:
    name: Bounded original negative decoder stages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-control
          persist-credentials: false
      - name: Check out unchanged application source
        uses: actions/checkout@v4
        with:
          ref: a86b5f63742e94381c67650731e922a158f78e81
          submodules: recursive
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install locked test dependencies
        working-directory: source
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic fixture Git identity
        run: |
          git config --global user.name 'Story Tests'
          git config --global user.email 'story-tests@example.invalid'
      - name: Attribute bounded original negative decoding
        working-directory: source
        env:
          PYTHONPATH: src:.
          PROFILE_TIMING_DIR: ${{ runner.temp }}/negative-decode-stages-v48
        run: .venv/bin/python "$GITHUB_WORKSPACE/diagnostic-control/.github/diagnostics/issue873/run-profile.py"
      - name: Upload attribution and cleanup evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: negative-decode-stages-v48
          path: ${{ runner.temp }}/negative-decode-stages-v48/
          if-no-files-found: error
