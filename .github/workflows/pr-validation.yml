name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      arch:
        description: Diagnostic-only standard runner architecture
        type: choice
        options: [x64, arm64]
        default: x64
      scratch:
        description: Diagnostic-only temporary filesystem
        type: choice
        options: [disk, memory]
        default: disk
      profile_mode:
        description: Optional cProfile instrumentation for the exact diagnostic
        type: choice
        options: [cprofile, none]
        default: cprofile
      synthetic_timeout_mode:
        description: Diagnostic-only forced-timeout workload; never canonical test credit
        type: choice
        options: [cooperative, forced-kill]
        default: cooperative
      test_id:
        description: Diagnostic-only exact canonical test ID
        type: string
        default: tests.test_artifact_objectives.ArtifactObjectiveContractTests.test_projection_retains_satisfaction_across_later_apply_commit_cycles

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-diagnostic-{1}-{2}-{3}-{4}', github.workflow, github.ref, inputs.arch, inputs.scratch, inputs.synthetic_timeout_mode || 'cooperative') || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_ref || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - classification skipped' || 'Classify changed paths' }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      policy_only: ${{ steps.paths.outputs.policy_only }}
      full: ${{ steps.paths.outputs.full }}
      wall_time_exception: ${{ steps.paths.outputs.wall_time_exception }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      checkout_sha: ${{ steps.paths.outputs.checkout_sha }}
    steps:
      - name: Classify paths and select runtime evidence
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let files = [];
            let labels = [];
            let baseSha;
            let headSha;
            let truncated = false;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
              labels = pr.labels.map(label => label.name);
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              truncated = files.length >= 3000;
            } else {
              const group = context.payload.merge_group;
              baseSha = group.base_sha;
              headSha = group.head_sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,
              });
              files = comparison.data.files || [];
              // A full page may hide later files. Fail closed rather than infer a partial diff.
              truncated = !Array.isArray(comparison.data.files) || files.length >= 100;
            }

            const paths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean));
            const isRuntime = path =>
              path.startsWith("src/") ||
              path.startsWith("config/") ||
              path === "pyproject.toml" ||
              path === "uv.lock" ||
              path === "MANIFEST.in" ||
              path === ".gitmodules" ||
              path === "vendor/generic-rag" ||
              path === "vendor/jsonl-viewer";
            const runtimePaths = truncated || paths.some(isRuntime);
            const isTest = path => path.startsWith("tests/") ||
              path === ".github/workflows/pr-validation.yml" || path === "TEST_POLICY.md";
            const testPaths = truncated || paths.some(isTest);
            const fullRequested = labels.includes("test:full");
            const wallTimeException = context.eventName === "pull_request" && labels.includes("test:wall-time-exception");
            const runtime = runtimePaths || testPaths || fullRequested;
            const full = runtime;
            core.setOutput("runtime", String(runtime));
            core.setOutput("policy_only", String(!runtimePaths && !testPaths));
            core.setOutput("full", String(full));
            core.setOutput("wall_time_exception", String(wallTimeException));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            // Event SHA is the PR test merge or merge-group commit, pinned across jobs.
            core.setOutput("checkout_sha", context.sha);
            core.summary
              .addHeading("Validation selection")
              .addTable([
                [{data: "Runtime paths", header: true}, String(runtimePaths)],
                [{data: "Policy/config only", header: true}, String(!runtimePaths)],
                [{data: "Run runtime lanes", header: true}, String(runtime)],
                [{data: "Full suite", header: true}, String(full)],
                [{data: "Wall-time exception", header: true}, String(wallTimeException)],
              ])
              .write();

  static:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - static validation skipped' || 'Static validation' }}
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob("**/*.toml"):
              if ".git" not in path.parts:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
                  if path.parent == pathlib.Path(".codex/agents"):
                      if data.get("name") != path.stem:
                          raise SystemExit(f"{path}: agent name must match filename")
                      for field in ("description", "developer_instructions"):
                          value = data.get(field)
                          if not isinstance(value, str) or not value.strip():
                              raise SystemExit(f"{path}: missing {field}")
          for path in pathlib.Path(".").glob("**/*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in (*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tests").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec", dont_inherit=True)
          PY
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
          ruby -ryaml -ropen3 <<'RB'
          Dir[".agents/skills/*/SKILL.md"].each do |path|
            source = File.read(path)
            match = source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
            abort "#{path}: missing YAML frontmatter" unless match
            data = YAML.safe_load(match[1], aliases: false)
            abort "#{path}: name must match directory and description must be nonempty" unless
              data.is_a?(Hash) && data["name"] == File.basename(File.dirname(path)) &&
              data["description"].is_a?(String) && !data["description"].strip.empty?
          end
          issue_path = ".github/ISSUE_TEMPLATE/work_item.md"
          issue_source = File.read(issue_path)
          issue_match = issue_source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
          abort "#{issue_path}: missing YAML frontmatter" unless issue_match
          issue = YAML.safe_load(issue_match[1], aliases: false)
          abort "#{issue_path}: invalid frontmatter mapping" unless issue.is_a?(Hash)
          %w[name about title labels assignees].each do |field|
            value = issue[field]
            abort "#{issue_path}: missing or non-string #{field}" unless value.is_a?(String)
          end
          %w[name about].each do |field|
            abort "#{issue_path}: empty #{field}" if issue[field].strip.empty?
          end
          Dir[".github/workflows/*.{yml,yaml}"].each do |path|
            document = YAML.safe_load(File.read(path), aliases: false)
            document.fetch("jobs").each do |job_name, job|
              job.fetch("steps", []).each do |step|
                script = step["with"]&.fetch("script", nil)
                next unless script
                _, error, status = Open3.capture3(
                  "node", "--input-type=module", "--check",
                  stdin_data: "async function main() {\n#{script}\n}")
                abort "#{path} #{job_name}: #{error}" unless status.success?
              end
            end
          end
          RB
      - name: Validate runner metadata
        run: |
          python -B - <<'PY'
          from tests import suite_policy

          suite_policy.load_timing_weights()
          ids = suite_policy.FAST_TEST_IDS
          if not ids or len(ids) != len(set(ids)):
              raise SystemExit("fast tier must contain unique test IDs")
          if any(not identifier.rsplit(".", 1)[-1].startswith("test") for identifier in ids):
              raise SystemExit("fast tier contains a non-test method ID")
          PY
      - name: Validate locked vendor pins
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          if Path("MANIFEST.in").read_text(encoding="utf-8") != "prune vendor/jsonl-viewer\n":
              raise SystemExit("MANIFEST.in must exclude vendored jsonl-viewer source")

          with open("uv.lock", "rb") as source:
              packages = {package["name"]: package for package in tomllib.load(source)["package"]}
          for name in ("generic-rag", "jsonl-viewer"):
              pinned = packages[name]["source"]["git"].rsplit("#", 1)[-1]
              gitlink = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:vendor/{name}"], text=True
              ).strip()
              if pinned != gitlink:
                  raise SystemExit(f"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}")
          PY
      - name: Validate policy artifacts
        run: |
          python - <<'PY'
          import pathlib

          root = pathlib.Path.cwd()
          templates = {
              ".github/ISSUE_TEMPLATE/work_item.md": [
                  "## Objective", "## Use cases and expected results",
                  "## Implementation summary", "## Acceptance criteria",
                  "## Boundaries and dependencies",
                  "## Related work and verification plan", "## Implementation plan",
              ],
              ".github/pull_request_template.md": [
                  "## What changed", "## Before and after", "## Implementation",
                  "## Verification", "## Limitations and follow-ups",
                  "## Related Issue",
              ],
              ".github/templates/evidence.md": [
                  "## What this demonstrates", "## Scenario results",
                  "## Reproduction and environment", "## Failures and coverage gaps",
                  "## Technical provenance and artifacts", "## Assessment",
              ],
              ".github/templates/working-status-comment.md": [
                  "## Current status", "## What works now", "## What remains",
                  "## Blocker or decision", "## Next step", "## Evidence links",
              ],
          }
          for relative, expected in templates.items():
              text = (root / relative).read_text(encoding="utf-8")
              actual = [line for line in text.splitlines() if line.startswith("## ")]
              if actual != expected:
                  raise SystemExit(f"{relative}: template headings changed: {actual!r}")

          agents = {path.name for path in (root / ".codex/agents").glob("*.toml")}
          if agents != {"runtime_implementer.toml", "test_engineer.toml"}:
              raise SystemExit(f"unexpected development agents: {sorted(agents)!r}")
          required = [
              root / ".agents/skills/project-workflow/SKILL.md",
              root / ".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md",
          ]
          if any(not path.is_file() for path in required):
              raise SystemExit("required simplified workflow artifact is missing")
          forbidden = [
              root / ".agents/skills/adaptive-verification/SKILL.md",
              root / ".agents/skills/subagent-model-selection/SKILL.md",
              root / "tests/test_repository_agent_policy.py",
          ]
          if any(path.exists() for path in forbidden):
              raise SystemExit("retired policy artifact still exists")
          if len((root / "PYTHON_MODULE_INDEX.md").read_text(encoding="utf-8").splitlines()) > 300:
              raise SystemExit("PYTHON_MODULE_INDEX.md exceeds 300 lines")
          PY

  fast:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - fast tier skipped' || 'Runtime fast tier' }}
    needs: classify
    if: needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TEST_JOB_MINUTES: '40'
    steps:
      - name: Record test job deadline before setup
        run: echo "TEST_JOB_DEADLINE=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Run fast runtime tests
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 330 ))
          if (( test_seconds > 2040 )); then test_seconds=2040; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":300}\n' "$test_seconds" > "$RUNNER_TEMP/fast-control.json"
          if (( test_seconds <= 0 )); then exit 124; fi
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json "$RUNNER_TEMP/fast.json" 2>&1 | tee "$RUNNER_TEMP/fast.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/fast-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-fast
          path: |
            ${{ runner.temp }}/fast.json
            ${{ runner.temp }}/fast.log
            ${{ runner.temp }}/fast-control.json
            ${{ runner.temp }}/fast-exit-code.txt
          if-no-files-found: warn

  full:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - full suite skipped' || format('Full runtime shard {0}/4', matrix.shard) }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: ${{ needs.classify.outputs.wall_time_exception == 'true' && '40' || '15' }}
    timeout-minutes: ${{ needs.classify.outputs.wall_time_exception == 'true' && 40 || 15 }}
    steps:
      - name: Record test job deadline before setup
        run: echo "TEST_JOB_DEADLINE=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Run full runtime shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 330 ))
          if (( test_seconds > 2040 )); then test_seconds=2040; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":300}\n' "$test_seconds" > "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json"
          if (( test_seconds <= 0 )); then exit 124; fi
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/4" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.shard }}.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.shard }}.json
            ${{ runner.temp }}/full-${{ matrix.shard }}.log
            ${{ runner.temp }}/full-${{ matrix.shard }}-control.json
            ${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt
          if-no-files-found: error

  reconcile-full:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - reconciliation skipped' || 'Reconcile full runtime suite' }}
    needs: [classify, full]
    if: >-
      always() && needs.classify.outputs.full == 'true' &&
      (needs.full.result == 'success' || needs.full.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: full-reports
      - name: Reconcile shard evidence
        run: >-
          PYTHONPATH=src python -m tests.runner reconcile
          full-reports/full-1/full-1.json
          full-reports/full-2/full-2.json
          full-reports/full-3/full-3.json
          full-reports/full-4/full-4.json
          --json "$RUNNER_TEMP/full-reconciled.json"
      - name: Enforce frozen suite inventory and wall-time budget
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          WALL_TIME_EXCEPTION: ${{ needs.classify.outputs.wall_time_exception }}
        run: |
          budget_args=(--base-ref "$BASE_SHA"
            --report full-reports/full-1/full-1.json
            --report full-reports/full-2/full-2.json
            --report full-reports/full-3/full-3.json
            --report full-reports/full-4/full-4.json)
          if [[ "$WALL_TIME_EXCEPTION" == "true" ]]; then
            echo "Maintainer-authorized wall-time exception: measured durations remain visible."
            budget_args+=(--allow-wall-time-overage)
          fi
          PYTHONPATH=src python -m tests.suite_budget "${budget_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-full-reconciled
          path: ${{ runner.temp }}/full-reconciled.json
          if-no-files-found: warn

  diagnose-full-budget:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Diagnostic only ({0}, {1})', inputs.arch, inputs.scratch) || 'Diagnose full-suite timing failure' }}
    needs: [classify, full, reconcile-full]
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.full.result == 'success' && needs.reconcile-full.result == 'failure'))
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 40 || 10 }}
    env:
      TEST_JOB_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '40' || '10' }}
    steps:
      - name: Record test job deadline before setup
        run: echo "TEST_JOB_DEADLINE=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          pattern: full-*
          path: ${{ runner.temp }}/diagnostic-inputs
      - name: Select actual timing failures
        if: github.event_name != 'workflow_dispatch'
        id: timing
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tests.suite_budget import load_budget
          root = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-inputs"
          reports = [json.loads((root / f"full-{i}" / f"full-{i}.json").read_text()) for i in (1, 2, 3, 4)]
          budget = load_budget()
          seconds = [report["durations"]["wall_seconds"] for report in reports]
          over = sum(seconds) > budget["max_sequential_wall_seconds"] or max(seconds) > budget["max_shard_wall_seconds"]
          selected = over and all(report["outcome"] == "success" for report in reports)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"selected={str(selected).lower()}\n")
          PY
      - name: Install diagnostic dependencies
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure diagnostic test Git identity
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Prepare diagnostic scratch storage
        if: github.event_name == 'workflow_dispatch'
        id: scratch
        env:
          MEMORY: ${{ inputs.scratch == 'memory' }}
        run: |
          scratch="$(mktemp -d "${TMPDIR:-/tmp}/story-timing.XXXXXXXX")"
          echo "directory=$scratch" >> "$GITHUB_OUTPUT"
          if [[ "$MEMORY" == "true" ]]; then
            sudo mount -t tmpfs -o "size=2G,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$scratch"
          fi
      - name: Run one existing canonical scenario with optional profiling
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        env:
          GIT_AUTHOR_NAME: Story Tests
          GIT_AUTHOR_EMAIL: story-tests@example.invalid
          GIT_COMMITTER_NAME: Story Tests
          GIT_COMMITTER_EMAIL: story-tests@example.invalid
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          DIAGNOSTIC_TEST_ID: ${{ inputs.test_id || 'tests.test_artifact_objectives.ArtifactObjectiveContractTests.test_projection_retains_satisfaction_across_later_apply_commit_cycles' }}
          DIAGNOSTIC_PROFILE_MODE: ${{ inputs.profile_mode || 'cprofile' }}
          SYNTHETIC_TIMEOUT_MODE: ${{ inputs.synthetic_timeout_mode || 'cooperative' }}
          TMPDIR: ${{ steps.scratch.outputs.directory || '/tmp' }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/timing-diagnostic"
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 330 ))
          if (( test_seconds > 20 )); then test_seconds=20; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":300}\n' "$test_seconds" > "$RUNNER_TEMP/timing-diagnostic/control.json"
          if (( test_seconds <= 0 )); then exit 124; fi
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" .venv/bin/python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/timing-diagnostic/worker.log"
          import collections, cProfile, functools, hashlib, json, os, platform, pstats, re, resource, subprocess, sys, sysconfig, tempfile, threading, time
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "timing-diagnostic"
          output.mkdir(mode=0o700, exist_ok=True)
          paths = subprocess.check_output(["git", "ls-files", "-z", "src", "tests", "config", "pyproject.toml", "uv.lock"]).decode().split("\0")
          def hashes():
              return {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths if path}
          before = hashes()
          environment = {"platform": platform.platform(), "python": platform.python_version(),
                         "cpu_count": os.cpu_count(), "python_compiler": platform.python_compiler(),
                         "python_enable_optimizations_flag": "--enable-optimizations" in (sysconfig.get_config_var("CONFIG_ARGS") or ""),
                         "git": subprocess.check_output(["git", "--version"], text=True, timeout=10).strip(),
                         "temporary_filesystem": subprocess.check_output(["stat", "-f", "-c", "%T", tempfile.gettempdir()], text=True, timeout=10).strip()}
          prepared = {"diagnostic_only": True, "acceptance_credit": False, "phase": "prepared",
                      "selection": {"requested_canonical_id": os.environ["DIAGNOSTIC_TEST_ID"], "validated_by_runner": False},
                      "profile_mode": os.environ["DIAGNOSTIC_PROFILE_MODE"], "source_before": before,
                      "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True, timeout=10).strip(),
                      "checkout_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True, timeout=10).strip(),
                      "environment": environment, "observer_thread": True}
          (output / "prepared.json").write_text(json.dumps(prepared, indent=2))
          from story_writing_agents.git import process, session_resources
          from tests import runner
          counts = collections.defaultdict(lambda: {"calls": 0, "seconds": 0.0})
          def record(key, elapsed):
              counts[key]["calls"] += 1
              counts[key]["seconds"] += elapsed
          original_git = process.GitProcessRunner.run
          @functools.wraps(original_git)
          def git(self, args, **kwargs):
              started = time.perf_counter()
              try:
                  return original_git(self, args, **kwargs)
              finally:
                  record("git:" + args[0], time.perf_counter() - started)
          process.GitProcessRunner.run = git
          original_refs = session_resources._Repository._loose_ref_output
          samples = []
          @functools.wraps(original_refs)
          def refs(self):
              started = time.perf_counter()
              value = original_refs(self)
              record("loose_refs:" + ("fallback" if value is None else "bytes"), time.perf_counter() - started)
              if len(samples) < 8:
                  with (self.common_git / "config").open("rb") as source:
                      config = source.read(65536)
                  safe = re.findall(rb"(?m)^\s*(?:repositoryformatversion|filemode|bare|logallrefupdates|objectformat|submodulepathconfig|relativeworktrees|worktreeconfig)\s*=\s*(?:true|false|0|1|sha1|sha256)\s*$", config)
                  samples.append({"fallback": value is None, "config_sha256": hashlib.sha256(config).hexdigest(), "format_lines": [line.decode("ascii").strip() for line in safe], "packed_refs": (self.common_git / "packed-refs").exists(), "reftable": (self.common_git / "reftable").exists()})
              return value
          session_resources._Repository._loose_ref_output = refs
          observer_stop = threading.Event()
          observer_errors = []
          main_thread = threading.main_thread().ident
          def observe():
              try:
                  with (output / "progress.jsonl").open("a", buffering=1) as stream:
                      while not observer_stop.is_set():
                          frame = sys._current_frames().get(main_thread)
                          frames, test_frame, depth = [], None, 0
                          while frame is not None and depth < 64:
                              code = frame.f_code
                              location = {"file": code.co_filename, "function": code.co_name, "line": frame.f_lineno}
                              if depth < 12:
                                  frames.append(location)
                              if code.co_name.startswith("test_"):
                                  test_frame = location
                              frame = frame.f_back
                              depth += 1
                          truncated = frame is not None
                          frame = None
                          row = {"diagnostic_only": True, "wall_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                 "elapsed_seconds": time.perf_counter() - started, "process_cpu_seconds": time.process_time(),
                                 "max_rss_kib": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
                                 "main_thread_stack": frames, "test_frame": test_frame, "walk_truncated": truncated}
                          stream.write(json.dumps(row, separators=(",", ":")) + "\n")
                          if observer_stop.wait(60):
                              break
              except Exception as error:
                  observer_errors.append(type(error).__name__)
          profile = cProfile.Profile() if os.environ["DIAGNOSTIC_PROFILE_MODE"] == "cprofile" else None
          started = time.perf_counter()
          observer = threading.Thread(target=observe, name="diagnostic-progress", daemon=True)
          observer_started = False
          code, interrupted, finalization_errors = None, None, []
          try:
              try:
                  observer.start()
                  observer_started = True
              except Exception as error:
                  observer_errors.append(type(error).__name__)
              if profile is not None:
                  profile.enable()
              import signal
              synthetic_mode = os.environ["SYNTHETIC_TIMEOUT_MODE"]
              if synthetic_mode not in {"cooperative", "forced-kill"}:
                  raise ValueError("invalid synthetic timeout mode")
              synthetic_output = output / "synthetic"
              synthetic_output.mkdir(mode=0o700, exist_ok=False)
              synthetic_ready = {"diagnostic_only": True, "acceptance_credit": False, "canonical_test_executed": False,
                                 "mode": synthetic_mode, "pid": os.getpid(), "ppid": os.getppid(), "pgid": os.getpgrp(),
                                 "monotonic_ns": time.monotonic_ns(), "wall_ns": time.time_ns(),
                                 "control_mtime_ns": (output / "control.json").stat().st_mtime_ns,
                                 "proc_stat": Path("/proc/self/stat").read_text()}
              if signal.getsignal(signal.SIGINT) is not signal.default_int_handler:
                  raise RuntimeError("synthetic probe requires the default initial SIGINT handler")
              if synthetic_mode == "cooperative":
                  (synthetic_output / "ready.json").write_text(json.dumps(synthetic_ready, indent=2))
                  while True:
                      time.sleep(1)
              synthetic_fd = os.open(synthetic_output / "parent-events.jsonl", os.O_WRONLY | os.O_CREAT | os.O_APPEND | os.O_CLOEXEC, 0o600)
              def synthetic_emit(event):
                  row = {"event": event, "pid": os.getpid(), "ppid": os.getppid(), "pgid": os.getpgrp(),
                         "monotonic_ns": time.monotonic_ns(), "wall_ns": time.time_ns()}
                  encoded = (json.dumps(row, separators=(",", ":")) + "\n").encode("ascii")
                  if os.write(synthetic_fd, encoded) != len(encoded):
                      raise RuntimeError("incomplete synthetic evidence write")
              def synthetic_interrupt(signum, frame):
                  synthetic_emit("SIGINT")
              signal.signal(signal.SIGINT, synthetic_interrupt)
              synthetic_child = subprocess.Popen([sys.executable, "-c", 'import json, os, signal, sys, time\nfrom pathlib import Path\nsynthetic_output = Path(sys.argv[1])\nsynthetic_fd = os.open(synthetic_output / "child-events.jsonl", os.O_WRONLY | os.O_CREAT | os.O_APPEND | os.O_CLOEXEC, 0o600)\ndef synthetic_emit(event):\n    row = {"event": event, "pid": os.getpid(), "ppid": os.getppid(), "pgid": os.getpgrp(), "monotonic_ns": time.monotonic_ns(), "wall_ns": time.time_ns()}\n    if event == "ready":\n        row["proc_stat"] = Path("/proc/self/stat").read_text()\n    encoded = (json.dumps(row, separators=(",", ":")) + "\\n").encode("ascii")\n    if os.write(synthetic_fd, encoded) != len(encoded):\n        raise RuntimeError("incomplete synthetic evidence write")\ndef synthetic_interrupt(signum, frame):\n    synthetic_emit("SIGINT")\nsignal.signal(signal.SIGINT, synthetic_interrupt)\nsynthetic_emit("ready")\nwhile True:\n    synthetic_emit("heartbeat")\n    time.sleep(1)\n', str(synthetic_output)], stdin=subprocess.DEVNULL)
              synthetic_ready["child_pid"] = synthetic_child.pid
              (synthetic_output / "ready.json").write_text(json.dumps(synthetic_ready, indent=2))
              synthetic_emit("ready")
              while True:
                  synthetic_emit("heartbeat")
                  time.sleep(1)
          except BaseException as error:
              interrupted = type(error).__name__
              raise
          finally:
              if profile is not None:
                  profile.disable()
              observer_stop.set()
              if observer_started:
                  observer.join(timeout=2)
              try:
                  if profile is not None:
                      profile.dump_stats(str(output / "profile.pstats"))
                      with (output / "profile.txt").open("w") as stream:
                          pstats.Stats(profile, stream=stream).strip_dirs().sort_stats("cumulative").print_stats(100)
                  else:
                      (output / "profile.txt").write_text("cProfile disabled by diagnostic input profile_mode=none.\n")
              except Exception as error:
                  finalization_errors.append({"stage": "profile", "error_type": type(error).__name__})
              after = None
              try:
                  after = hashes()
              except Exception as error:
                  finalization_errors.append({"stage": "source", "error_type": type(error).__name__})
              evidence = {"diagnostic_only": True, "acceptance_credit": False,
                          "partial": code not in (0, 1), "runner_exit_code": code, "interruption": interrupted,
                          "source_valid": after is not None and before == after, "source_before": before, "source_after": after,
                          "instrumented_seconds": time.perf_counter() - started, "counts": dict(counts), "fixture_samples": samples,
                          "observer_thread": observer_started, "observer_errors": observer_errors, "finalization_errors": finalization_errors, **environment}
              (output / "counters.json").write_text(json.dumps(evidence, indent=2))
          raise SystemExit(code if before == after and not finalization_errors else 2)
          PY
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/timing-diagnostic/exit-code.txt"
          exit "$test_status"
      - name: Record bounded synthetic timeout process evidence
        if: always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')
        env:
          SYNTHETIC_TIMEOUT_MODE: ${{ inputs.synthetic_timeout_mode || 'cooperative' }}
        run: |
          python - <<'PY'
          """Read-only bounded observation after an expected synthetic worker timeout."""
          import json, os, time
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "timing-diagnostic"
          output.mkdir(mode=0o700, exist_ok=True)
          synthetic = output / "synthetic"
          result = {"diagnostic_only": True, "acceptance_credit": False, "canonical_test_executed": False,
                    "mode": os.environ["SYNTHETIC_TIMEOUT_MODE"], "wall_ns": time.time_ns(),
                    "monotonic_ns": time.monotonic_ns(), "errors": [], "event_logs": {}, "processes": {}}
          def error(stage, exc):
              result["errors"].append({"stage": stage, "type": type(exc).__name__, "detail": str(exc)[:240]})
          def read_bounded(path, limit):
              with path.open("rb") as stream:
                  data = stream.read(limit + 1)
              if len(data) > limit:
                  raise ValueError("evidence file exceeds bound")
              return data
          def proc_identity(raw):
              opening, closing = raw.find("("), raw.rfind(")")
              if opening < 1 or closing < opening:
                  raise ValueError("invalid proc stat framing")
              tail = raw[closing + 1:].split()
              if len(tail) < 20:
                  raise ValueError("incomplete proc stat")
              return {"pid": int(raw[:opening].strip()), "state": tail[0], "ppid": int(tail[1]),
                      "pgid": int(tail[2]), "start_ticks": int(tail[19])}
          def observed(identity):
              pid = identity["pid"]
              if type(pid) is not int or pid <= 0:
                  raise ValueError("invalid observed pid")
              try:
                  current = proc_identity(read_bounded(Path("/proc") / str(pid) / "stat", 16384).decode())
              except FileNotFoundError:
                  return {"status": "absent", "original_running": False}
              if current["start_ticks"] != identity["start_ticks"]:
                  return {"status": "pid_reused", "original_running": False, "current": current}
              terminal = current["state"] in {"Z", "X"}
              return {"status": "terminated_awaiting_reap" if terminal else "present", "original_running": not terminal, "current": current}
          identities = {}
          try:
              ready = json.loads(read_bounded(synthetic / "ready.json", 65536))
              result["ready"] = ready
              parent = proc_identity(ready["proc_stat"])
              if parent["pid"] != ready["pid"] or parent["pgid"] != ready["pgid"]:
                  raise ValueError("parent identity receipt mismatch")
              identities["parent"] = parent
          except Exception as exc:
              error("ready", exc)
          for role in ("parent", "child"):
              path = synthetic / (role + "-events.jsonl")
              if not path.exists():
                  continue
              try:
                  data = read_bounded(path, 262144)
                  lines = data.splitlines(keepends=True)
                  if len(lines) > 256:
                      raise ValueError("event count exceeds bound")
                  events = []
                  truncated_tail = False
                  for index, line in enumerate(lines):
                      try:
                          events.append(json.loads(line))
                      except Exception:
                          if index == len(lines) - 1 and not line.endswith(b"\n"):
                              truncated_tail = True
                          else:
                              raise
                  signals = [row for row in events if row.get("event") == "SIGINT"]
                  hearts = [row for row in events if row.get("event") == "heartbeat"]
                  entry = {"complete_event_count": len(events), "truncated_tail": truncated_tail,
                           "signal_receipts": signals, "last_heartbeat": hearts[-1] if hearts else None}
                  if signals and hearts:
                      entry["post_int_heartbeat_seconds"] = (hearts[-1]["monotonic_ns"] - signals[0]["monotonic_ns"]) / 1e9
                  result["event_logs"][role] = entry
                  if role == "child":
                      child_ready = next(row for row in events if row.get("event") == "ready")
                      child = proc_identity(child_ready["proc_stat"])
                      if child["pid"] != child_ready["pid"] or child["pgid"] != child_ready["pgid"]:
                          raise ValueError("child identity receipt mismatch")
                      if child["pid"] != result.get("ready", {}).get("child_pid") or child["ppid"] != identities.get("parent", {}).get("pid"):
                          raise ValueError("child does not match the parent spawn receipt")
                      identities[role] = child
              except Exception as exc:
                  error(role + "_events", exc)
          deadline = time.monotonic() + 5
          while identities:
              for role, identity in identities.items():
                  try:
                      result["processes"][role] = {"identity": identity, **observed(identity)}
                  except Exception as exc:
                      error(role + "_proc", exc)
                      result["processes"][role] = {"identity": identity, "status": "observation_error", "original_running": None}
              if not any(item["original_running"] is True for item in result["processes"].values()):
                  break
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break
              time.sleep(min(0.1, remaining))
          try:
              result["worker_exit_code"] = int(read_bounded(output / "exit-code.txt", 64).decode().strip())
              result["expected_worker_exit_code"] = {"cooperative": 124, "forced-kill": 137}[result["mode"]]
              result["expected_nonzero_observed"] = result["worker_exit_code"] == result["expected_worker_exit_code"]
          except Exception as exc:
              error("exit_code", exc)
          try:
              result["control"] = json.loads(read_bounded(output / "control.json", 4096))
          except Exception as exc:
              error("control", exc)
          result["files"] = {name: {"present": (output / name).is_file(), "bytes": (output / name).stat().st_size if (output / name).is_file() else None}
                             for name in ("prepared.json", "progress.jsonl", "worker.log", "profile.pstats", "profile.txt", "counters.json", "instrumented-run.json")}
          if (output / "counters.json").exists():
              try:
                  counters = json.loads(read_bounded(output / "counters.json", 2097152))
                  result["counter_summary"] = {key: counters.get(key) for key in ("partial", "acceptance_credit", "runner_exit_code", "interruption", "source_valid", "observer_errors", "finalization_errors")}
              except Exception as exc:
                  error("counters", exc)
          if "parent" in identities and "child" in identities:
              result["same_process_group"] = identities["parent"]["pgid"] == identities["child"]["pgid"]
          required_roles = {"parent"} if result["mode"] == "cooperative" else {"parent", "child"}
          result["required_process_receipts_present"] = required_roles <= set(identities)
          result["required_processes_nonrunning"] = (result["required_process_receipts_present"] and
              all(result["processes"].get(role, {}).get("original_running") is False for role in required_roles))
          result["observation_finished_ns"] = time.monotonic_ns()
          result["limitation"] = "Read-only synthetic process evidence; artifact upload is verified externally. No canonical pass or arbitrary escaped-descendant guarantee."
          (output / "synthetic-post-evidence.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('timing-diagnostic-{0}-{1}-{2}', inputs.arch, inputs.scratch, inputs.synthetic_timeout_mode || 'cooperative') || 'timing-diagnostic-cooperative' }}
          path: ${{ runner.temp }}/timing-diagnostic
          if-no-files-found: error
      - name: Remove diagnostic scratch storage
        if: always() && steps.scratch.outputs.directory != ''
        env:
          SCRATCH: ${{ steps.scratch.outputs.directory }}
          MEMORY: ${{ inputs.scratch == 'memory' }}
        run: |
          if [[ "$MEMORY" == "true" ]] && mountpoint -q "$SCRATCH"; then
            sudo umount "$SCRATCH"
          fi
          rmdir "$SCRATCH"
