es differ from frozen runtime/test source\")\n    REPORT[\"source\"] = {\n        \"checkout\": str(checkout),\n        \"checkout_sha\": subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], cwd=checkout, text=True).strip(),\n        \"checkout_tree\": subprocess.check_output([\"git\", \"rev-parse\", \"HEAD^{tree}\"], cwd=checkout, text=True).strip(),\n        \"verified_dependency_hashes\": observed,\n        \"workflow_only_tag_allowed\": True,\n    }\n    REPORT[\"environment\"] = {\n        \"python\": platform.python_version(), \"implementation\": platform.python_implementation(),\n        \"platform\": platform.platform(), \"machine\": platform.machine(),\n    }\n    sys.path[:0] = [str(checkout / \"src\"), str(checkout)]\n    from tests.test_lead_orchestration import LeadOutcomeAndProposalTests, _live_material, _visible_outcome\n    from tests.provider_wire_fixture import (\n        finite_fixture_selection, lead_fixture_assessment, lead_fixture_response, lead_fixture_scope_record,\n    )\n    from story_writing_agents import orchestrator as orchestrator_module\n    from story_writing_agents import lead_provider_contracts as contract_module\n    from story_writing_agents.antigravity_adapter import AntigravityAdapter\n    from story_writing_agents.conversations import authoring_scope_from_dict\n    from story_writing_agents.structured_output_validation import diagnose_json_text\n\n    finish_stage(\"source_and_imports\", started)\n    case = LeadOutcomeAndProposalTests(\"test_front_schema_is_minimal_closed_and_provider_strict\")\n    try:\n        started = start_stage(\"existing_fixture_setup\")\n        case.setUp()\n        finish_stage(\"existing_fixture_setup\", started)\n        started = start_stage(\"initial_lead_turn\")\n        conversation_id = case.conversation(\"Minimal schema\")\n        case.backend.enqueue(_visible_outcome(\"answer\"))\n        outcome = await case.runtime.lead_turn(\n            case.session_id, conversation_id, \"Expla