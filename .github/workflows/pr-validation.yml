name: Issue 873 production removal verification and comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 602f879060aae80d70c6f4dcb54361d56f42d7c9
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Run affected response checks
        env:
          PYTHONPATH: src
          EVIDENCE: ${{ runner.temp }}/issue873-affected
        run: |
          umask 077
          mkdir "$EVIDENCE"
          timeout --signal=INT --kill-after=30s 600s .venv/bin/python -m tests.runner run \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_diagnose_json_text_reports_all_independent_safe_issues \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_malformed_and_duplicate_json_have_value_free_diagnostics \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_properties_omitted_from_required_remain_optional \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_bounded_chunks_preserve_order_and_over_32k_content \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_union_selects_matching_branch_without_other_branch_noise \
            --id tests.test_agent_context_service.CompactWireDecoderTests.test_valid_search_read_and_natural_result_shapes_decode_exactly \
            --id tests.test_agent_context_service.CompactWireDecoderTests.test_malformed_exact_shape_types_routes_duplicates_and_limits_reject \
            --json "$EVIDENCE/affected.json"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: issue873-affected-v50
          path: ${{ runner.temp }}/issue873-affected/
          if-no-files-found: error
  comparison:
    needs: affected
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a86b5f63742e94381c67650731e922a158f78e81
          submodules: recursive
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 602f879060aae80d70c6f4dcb54361d56f42d7c9
          submodules: recursive
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install the unchanged locked dependencies
        working-directory: baseline
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure fixture Git identity
        run: |
          git config --global user.name 'Story Tests'
          git config --global user.email 'story-tests@example.invalid'
      - name: Measure source pair and optional profile
        env:
          BASELINE_CHECKOUT: ${{ github.workspace }}/baseline
          CANDIDATE_CHECKOUT: ${{ github.workspace }}/candidate
          PROFILE_TIMING_DIR: ${{ runner.temp }}/comparison-${{ matrix.pair }}
          PAIR_INDEX: ${{ matrix.pair }}
        run: baseline/.venv/bin/python control/.github/diagnostics/issue873/run-comparison.py
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: issue873-comparison-v50-pair-${{ matrix.pair }}
          path: ${{ runner.temp }}/comparison-${{ matrix.pair }}/
          if-no-files-found: error
