          import argparse
          import __future__
          import dataclasses
          import enum
          import hashlib
          import importlib
          import inspect
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import types
          import typing

          BEFORE = '751160cb958d39cb1907329942bed11a04ac33ef'
          CURRENT = '2b8028f7930cbeaba5430beb893c98d4492536c1'
          TARGETS = {
              'story_writing_agents.lead_preparation.recommendation_requests': {
                  'functions': ['prepare_recommendation_request_policy', 'recommendation_basis'],
                  'records': ['RecommendationRequestPolicyResult'],
              },
              'story_writing_agents.lead_preparation.recommendation_decisions': {
                  'functions': ['prepare_recommendation_decision', 'build_recommendation_decision_outcome',
                                'match_recommendation_failure', 'terminal_recommendation_failure_is_accounted',
                                'build_recommendation_failure_closure'],
                  'records': ['PreparedRecommendationDecision', 'PreparedRecommendationRevision',
                              'RecommendationDecisionClosure', 'RecommendationFailureMatch'],
              },
          }
          # Filled from immutable git blobs by the proposal builder, never from a measured report.
          SOURCE_PINS = {'before': {'ref': '751160cb958d39cb1907329942bed11a04ac33ef', 'tree': '677081d36d29cddee820d4004533eb6cb6f832f2', 'files': {'src/story_writing_agents/lead_preparation/recommendation_requests.py': '46786761eff27ce943d7d1ba9b725514b37debfd14fe404563d7c3567a6f8b28', 'src/story_writing_agents/lead_preparation/recommendation_decisions.py': '89f55aa29fab9585f3db9524eaeca43b7e68df5af45a344a4bea0a39fc712e4c', 'README.md': 'f98fe5a9e0e4382076e1f89e3ab983135a53c4febc867a8a9b243f47f006fd34', 'pyproject.toml': 'ea190c9f41937c5c1d2a5894b795b37f6342aee1936b21158b4a1aa3f4e2e4b9', 'uv.lock': '4e5bfcdf9815de320c981cae6889cae56746522222dcf1774da1c93404f671b2'}, 'non_workflow_leaf_manifest_sha256': '1c16ca4e4f4c6715cb20a9ef319c460627b5dd0be8c2e06ef6a85719ef55b1e4'}, 'current': {'ref': '2b8028f7930cbeaba5430beb893c98d4492536c1', 'tree': '29f91a5478db60a5471ae93f94c42ee603fcf580', 'files': {'src/story_writing_agents/lead_preparation/recommendation_requests.py': '5423e47bd0f5df0681f63654f74ae4d2eda0c66dd431511a857ca77447c2bbe3', 'src/story_writing_agents/lead_preparation/recommendation_decisions.py': '33b2058d2d8dfed32782529a592bfd7dd8ee7e9d5ec6263bff615342b12ebb5c', 'README.md': 'f98fe5a9e0e4382076e1f89e3ab983135a53c4febc867a8a9b243f47f006fd34', 'pyproject.toml': 'ea190c9f41937c5c1d2a5894b795b37f6342aee1936b21158b4a1aa3f4e2e4b9', 'uv.lock': '4e5bfcdf9815de320c981cae6889cae56746522222dcf1774da1c93404f671b2'}, 'non_workflow_leaf_manifest_sha256': '3dadbf94517e102d8c8e014f0565823ae92d6573ba88c042a59d516b819ac758'}}


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True, allow_nan=False).encode()


          def identity(value):
              module = getattr(value, '__module__', None)
              name = getattr(value, '__qualname__', None) or getattr(value, '_name', None)
              if not module or not name:
                  raise TypeError(f'unsupported type identity: {type(value).__module__}.{type(value).__qualname__}')
              return {'module': module, 'qualname': name}


          def type_descriptor(value):
              if value is Ellipsis:
                  return {'kind': 'ellipsis'}
              if value is None:
                  return {'kind': 'none'}
              if isinstance(value, list):
                  return {'kind': 'callable_arguments', 'items': [type_descriptor(x) for x in value]}
              if isinstance(value, typing.ForwardRef) or isinstance(value, str):
                  raise TypeError('unresolved annotation in resolved default-namespace hints')
              origin = typing.get_origin(value)
              if origin is not None:
                  return {'kind': 'generic', 'origin': identity(origin),
                          'arguments': [type_descriptor(x) for x in typing.get_args(value)]}
              if isinstance(value, type) or value is typing.Any:
                  return {'kind': 'type', **identity(value)}
              raise TypeError(f'unsupported resolved annotation: {type(value).__module__}.{type(value).__qualname__}')


          def value_descriptor(value):
              if value is inspect.Signature.empty:
                  return {'kind': 'signature_empty'}
              if value is dataclasses.MISSING:
                  return {'kind': 'dataclasses_MISSING'}
              if value is Ellipsis:
                  return {'kind': 'ellipsis'}
              if value is None or type(value) in (bool, int, str):
                  return {'kind': type(value).__name__, 'value': value}
              if type(value) is float:
                  return {'kind': 'float', 'hex': value.hex()}
              if type(value) is complex:
                  return {'kind': 'complex', 'real': value.real.hex(), 'imag': value.imag.hex()}
              if type(value) is bytes:
                  return {'kind': 'bytes', 'hex': value.hex()}
              if isinstance(value, enum.Enum):
                  return {'kind': 'enum', 'type': identity(type(value)), 'name': value.name,
                          'value': value_descriptor(value.value)}
              if type(value) in (tuple, list):
                  return {'kind': type(value).__name__, 'items': [value_descriptor(x) for x in value]}
              if type(value) in (dict, types.MappingProxyType):
                  return {'kind': type(value).__name__, 'items': [[value_descriptor(k), value_descriptor(v)] for k, v in value.items()]}
              if type(value) is frozenset:
                  items = [value_descriptor(x) for x in value]
                  return {'kind': 'frozenset', 'items': sorted(items, key=canonical)}
              if isinstance(value, types.CodeType):
                  return {'kind': 'code', 'normalized': code_descriptor(value)}
              if isinstance(value, type):
                  return {'kind': 'class', **identity(value)}
              if inspect.isfunction(value) or inspect.isbuiltin(value):
                  result = {'kind': 'callable_default', **identity(value)}
                  if inspect.isfunction(value):
                      result['normalized_code'] = code_descriptor(value.__code__)
                  return result
              raise TypeError(f'unsupported default/constant: {type(value).__module__}.{type(value).__qualname__}')


          def code_descriptor(code):
              # Only filename, source line numbers, and this one compiler flag are normalized.
              # Column positions, instruction offsets, constants, exception table, and all other flags remain.
              return {
                  'name': code.co_name, 'qualname': code.co_qualname,
                  'argcount': code.co_argcount, 'posonlyargcount': code.co_posonlyargcount,
                  'kwonlyargcount': code.co_kwonlyargcount, 'nlocals': code.co_nlocals,
                  'stacksize': code.co_stacksize,
                  'flags': code.co_flags & ~__future__.annotations.compiler_flag,
                  'code': code.co_code.hex(), 'exceptiontable': code.co_exceptiontable.hex(),
                  'consts': [value_descriptor(x) for x in code.co_consts],
                  'names': list(code.co_names), 'varnames': list(code.co_varnames),
                  'freevars': list(code.co_freevars), 'cellvars': list(code.co_cellvars),
                  'relative_positions': [[None if line is None else line - code.co_firstlineno,
                                          None if endline is None else endline - code.co_firstlineno, col, endcol]
                                         for line, endline, col, endcol in code.co_positions()],
                  'relative_line_ranges': [[start, end, None if line is None else line - code.co_firstlineno]
                                           for start, end, line in code.co_lines()],
              }


          def raw_annotation(value):
              if isinstance(value, str):
                  return {'kind': 'string', 'text': value}
              return {'kind': 'eager', 'descriptor': type_descriptor(value)}


          def function_snapshot(function):
              # No explicit globalns/localns: exercise the actual public default namespace.
              hints = typing.get_type_hints(function, include_extras=True)
              signature = inspect.signature(function)
              parameters = []
              for name, parameter in signature.parameters.items():
                  parameters.append({'name': name, 'kind': parameter.kind.name,
                                     'default': value_descriptor(parameter.default),
                                     'annotation': type_descriptor(hints[name]) if name in hints else {'kind': 'absent'}})
              normalized_code = code_descriptor(function.__code__)
              closure = [value_descriptor(cell.cell_contents) for cell in (function.__closure__ or ())]
              raw_signature = str(signature)
              if ' at 0x' in raw_signature:
                  raise ValueError('address-bearing raw signature')
              return {
                  'semantic': {'identity': identity(function), 'parameters': parameters,
                               'resolved_hints': {k: type_descriptor(v) for k, v in sorted(hints.items())},
                               'normalized_code': normalized_code, 'closure': closure},
                  'raw': {'signature': raw_signature,
                          'annotations': {k: raw_annotation(v) for k, v in function.__annotations__.items()},
                          'code_filename': function.__code__.co_filename,
                          'firstlineno': function.__code__.co_firstlineno,
                          'flags': function.__code__.co_flags},
              }


          def record_snapshot(cls):
              assert dataclasses.is_dataclass(cls)
              hints = typing.get_type_hints(cls, include_extras=True)
              fields = []
              for field in dataclasses.fields(cls):
                  fields.append({'name': field.name, 'resolved_type': type_descriptor(hints[field.name]),
                                 'default': value_descriptor(field.default),
                                 'default_factory': value_descriptor(field.default_factory),
                                 'init': field.init, 'repr': field.repr, 'hash': field.hash,
                                 'compare': field.compare, 'kw_only': field.kw_only,
                                 'metadata': value_descriptor(field.metadata),
                                 'field_type': value_descriptor(field._field_type.name)})
              constructor = function_snapshot(cls.__init__)
              params = cls.__dataclass_params__
              return {
                  'semantic': {'identity': identity(cls), 'slots': value_descriptor(cls.__slots__),
                               'mro': [identity(x) for x in cls.__mro__], 'fields': fields,
                               'resolved_hints': {k: type_descriptor(v) for k, v in sorted(hints.items())},
                               'dataclass_flags': {k: getattr(params, k) for k in ('init', 'repr', 'eq', 'order', 'unsafe_hash', 'frozen')},
                               'match_args': value_descriptor(getattr(cls, '__match_args__', ())),
                               'constructor': constructor['semantic']},
                  'raw': {'annotations': {k: raw_annotation(v) for k, v in cls.__annotations__.items()},
                          'field_types': {field.name: raw_annotation(field.type) for field in dataclasses.fields(cls)},
                          'constructor': constructor['raw']},
              }


          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()


          def collect(args):
              # Read both completed parent sidecars before any target module import.
              phases = {}
              for role in ('before', 'current'):
                  path = Path(args.phase_directory) / f'annotation-pair-{role}-cli-wall.json'
                  record = json.loads(path.read_text())
                  assert record['source_role'] == role and record['returncode'] == 0
                  assert record['mode'] == 'normal-fresh-child-cli-wall'
                  assert record['finished_monotonic_ns'] > record['started_monotonic_ns']
                  assert record['observed_child_cli_wall_seconds'] == (record['finished_monotonic_ns'] - record['started_monotonic_ns']) / 1_000_000_000
                  phases[role] = {'path': str(path), 'sha256': digest(path.read_bytes()), 'record': record}
              root = Path.cwd().resolve()
              actual = git('rev-parse', 'HEAD')
              source = BEFORE if args.role == 'before' else CURRENT
              assert args.source_ref == source
              assert args.actor_ref == os.environ['GITHUB_SHA']
              assert args.actor_tree == git('-C', os.environ['GITHUB_WORKSPACE'], 'rev-parse', 'HEAD^{tree}')
              if args.role == 'before':
                  assert actual == BEFORE
              else:
                  assert actual == args.actor_ref == os.environ['GITHUB_SHA']
                  assert [line[7:] for line in git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0].splitlines() if line.startswith('parent ')] == [CURRENT]
              pins = SOURCE_PINS[args.role]
              leaves = subprocess.check_output(['git', 'ls-tree', '-r', '-z', 'HEAD'])
              rows = [row for row in leaves.split(b'\0') if row and row.split(b'\t', 1)[1] != b'.github/workflows/pr-validation.yml']
              assert digest(b'\0'.join(rows) + b'\0') == pins['non_workflow_leaf_manifest_sha256']
              for path, expected in pins['files'].items():
                  assert digest((root / path).read_bytes()) == expected, path
              functions, records = {}, {}
              for name, selected in TARGETS.items():
                  module = importlib.import_module(name)
                  assert Path(module.__file__).resolve() == root / 'src' / Path(*name.split('.')).with_suffix('.py')
                  for public_name in selected['functions']:
                      functions[f'{name}.{public_name}'] = function_snapshot(getattr(module, public_name))
                  for public_name in selected['records']:
                      records[f'{name}.{public_name}'] = record_snapshot(getattr(module, public_name))
              assert len(functions) == 7 and len(records) == 5
              semantic = {'functions': {k: v['semantic'] for k, v in functions.items()},
                          'records': {k: v['semantic'] for k, v in records.items()}}
              result = {'schema_version': 1, 'kind': 'post_normal_public_metadata',
                        'source_role': args.role, 'source_ref': source, 'source_tree': pins['tree'],
                        'actual_checkout': actual, 'actual_checkout_tree': git('rev-parse', 'HEAD^{tree}'),
                        'workflow_actor_ref': args.actor_ref, 'workflow_actor_tree': args.actor_tree,
                        'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                        'collector_sha256': digest(Path(__file__).read_bytes()),
                        'files': pins['files'], 'normal_phases_already_completed': phases,
                        'python': sys.version, 'semantic': semantic, 'semantic_sha256': digest(canonical(semantic)),
                        'raw_intentional_API_metadata': {'functions': {k: v['raw'] for k, v in functions.items()},
                                                         'records': {k: v['raw'] for k, v in records.items()}},
                        'normalized_only': ['co_filename', 'line numbers', 'FUTURE_ANNOTATIONS flag'],
                        'normal_time_subtraction': False, 'performance_PASS': None}
              with Path(args.output).open('x') as stream:
                  json.dump(result, stream, indent=2, ensure_ascii=True, allow_nan=False)
                  stream.write('\n')


          def compare(args):
              before, current = [json.loads(Path(p).read_text()) for p in args.files]
              assert before['source_role'] == 'before' and before['source_ref'] == BEFORE
              assert current['source_role'] == 'current' and current['source_ref'] == CURRENT
              assert before['workflow_actor_ref'] == current['workflow_actor_ref']
              assert before['semantic'] == current['semantic'], 'resolved public metadata / normalized hot code differs'
              result = {'kind': 'post_normal_metadata_equivalence', 'source_refs': [BEFORE, CURRENT],
                        'resolved_metadata_and_normalized_hot_code_equal': True,
                        'raw_annotations_and_signatures_compared_separately': True,
                        'input_sha256': [digest(Path(p).read_bytes()) for p in args.files],
                        'performance_PASS': None}
              with Path(args.output).open('x') as stream:
                  json.dump(result, stream, indent=2)
                  stream.write('\n')






          def seal_before(args):
              import statistics
              snapshots = []
              for name in args.files:
                  path = Path(name)
                  snapshot = json.loads(path.read_text())
                  assert snapshot['source_role'] == 'before' and snapshot['source_ref'] == BEFORE
                  assert snapshot['source_tree'] == SOURCE_PINS['before']['tree']
                  before = snapshot['normal_phases_already_completed']['before']['record']
                  assert before['returncode'] == 0
                  snapshots.append((snapshot['workflow_run_id'], path, before['observed_child_cli_wall_seconds']))
              assert len(snapshots) == 3 and len({row[0] for row in snapshots}) == 3
              raw = [row[2] for row in snapshots]
              median = statistics.median(raw)
              mad = statistics.median(abs(x - median) for x in raw)
              result = {'kind': 'annotation_pair_before_only_cli_fixed_band', 'source_ref': BEFORE,
                        'raw3_seconds': raw, 'median_seconds': median, 'MAD_seconds': mad,
                        'band_seconds': max(0.005, 0.01 * median, 3 * mad),
                        'formula': 'max(0.005s,0.01*before_median,3*before_MAD)',
                        'inputs': [{'run_id': run, 'path': str(path), 'sha256': digest(path.read_bytes())}
                                   for run, path, _ in snapshots],
                        'after_measurements_used': False, 'performance_PASS': None,
                        'canonical_D34_case_bands_changed': False}
              with Path(args.output).open('x') as stream:
                  json.dump(result, stream, indent=2, allow_nan=False)
                  stream.write('\n')


          def main():
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest='command', required=True)
              capture = commands.add_parser('collect')
              capture.add_argument('--role', choices=['before', 'current'], required=True)
              for option in ('source-ref', 'actor-ref', 'actor-tree', 'phase-directory', 'output'):
                  capture.add_argument('--' + option, required=True)
              capture.set_defaults(action=collect)
              comparison = commands.add_parser('compare')
              comparison.add_argument('files', nargs=2)
              comparison.add_argument('--output', required=True)
              comparison.set_defaults(action=compare)
              seal = commands.add_parser('seal-before')
              seal.add_argument('files', nargs=3)
              seal.add_argument('--output', required=True)
              seal.set_defaults(action=seal_before)
              args = parser.parse_args()
              args.action(args)


          if __name__ == '__main__':
              main()
          PY_ANNOTATION_SNAPSHOT
          timeout --signal=INT --kill-after=30s "${snapshot_seconds}s" bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE/.feedback-baseline"
            PYTHONPATH=src "$GITHUB_WORKSPACE/.venv/bin/python" "$RUNNER_TEMP/annotation-pair-type-metadata-snapshot.py" collect --role before --source-ref 751160cb958d39cb1907329942bed11a04ac33ef --actor-ref "$GITHUB_SHA" --actor-tree "$1" --phase-directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/annotation-pair-before-public-metadata.json"
            cd "$GITHUB_WORKSPACE"
            PYTHONPATH=src .venv/bin/python "$RUNNER_TEMP/annotation-pair-type-metadata-snapshot.py" collect --role current --source-ref 2b8028f7930cbeaba5430beb893c98d4492536c1 --actor-ref "$GITHUB_SHA" --actor-tree "$1" --phase-directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/annotation-pair-current-public-metadata.json"
            .venv/bin/python "$RUNNER_TEMP/annotation-pair-type-metadata-snapshot.py" compare "$RUNNER_TEMP/annotation-pair-before-public-metadata.json" "$RUNNER_TEMP/annotation-pair-current-public-metadata.json" --output "$RUNNER_TEMP/annotation-pair-public-metadata-comparison.json"
          ' annotation-snapshot "$actor_tree"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: ${{ needs.classify.outputs.affected_only == 'true' && 'runtime-affected' || 'runtime-fast' }}
          path: |
            ${{ runner.temp }}/fast.json
            ${{ runner.temp }}/fast.log
            ${{ runner.temp }}/fast-control.json
            ${{ runner.temp }}/annotation-pair-*-cli-wall.json
            ${{ runner.temp }}/annotation-pair-*-public-metadata.json
            ${{ runner.temp }}/annotation-pair-public-metadata-comparison.json
            ${{ runner.temp }}/annotation-pair-type-metadata-snapshot.py
            ${{ runner.temp }}/feedback-probe*
            ${{ runner.temp }}/gc-diagnostic*
            ${{ runner.temp }}/case-profile-*
            ${{ runner.temp }}/fast-exit-code.txt
            ${{ runner.temp }}/fast-selection-argv.txt
            ${{ runner.temp }}/runner-hardware-fast.json
          if-no-files-found: warn

  full:
    name: ${{ needs.classify.outputs.metadata_only == 'true' && 'Metadata-only full-suite notice (not run)' || needs.classify.outputs.development_only == 'true' && 'Development partial full-suite notice (not run)' || needs.classify.outputs.manual_mode == 'true' && 'Manual partial full-suite notice (not run)' || format('Full runtime shard {0}/5', matrix.shard) }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_JOB_MINUTES: '75'
      TEST_RUN_DEADLINE: ${{ needs.classify.outputs.test_run_deadline }}
    timeout-minutes: 75
    steps:
      - name: Record shared test deadline before setup
        run: |
          test_deadline=$(( $(date +%s) + TEST_JOB_MINUTES * 60 ))
          if [[ -n "$TEST_RUN_DEADLINE" ]]; then
            [[ "$TEST_RUN_DEADLINE" =~ ^[0-9]+$ ]] || exit 2
            if (( TEST_RUN_DEADLINE < test_deadline )); then
              test_deadline=$TEST_RUN_DEADLINE
            fi
          else
            echo "Missing shared test-run deadline."
            exit 2
          fi
          echo "TEST_JOB_DEADLINE=$test_deadline" >> "$GITHUB_ENV"
          if (( test_deadline <= $(date +%s) )); then
            echo "Shared test-run deadline exhausted before setup."
            exit 124
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.RUNTIME_TEST_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python "$RUNTIME_TEST_PYTHON_VERSION" --no-progress
      - name: Configure deterministic test Git identity
        env:
          TEST_HARDWARE_ARCH: "arm64"
          TEST_HARDWARE_PATH: "${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json"
          TEST_HARDWARE_SELECTION: "shard:${{ matrix.shard }}/5"
          TEST_HARDWARE_SHARD: "${{ matrix.shard }}/5"
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
          .venv/bin/python - <<'PY_HARDWARE'
          import datetime, gc, hashlib, json, os, platform, sys
          from pathlib import Path

          output = Path(os.environ['TEST_HARDWARE_PATH'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          arch = os.environ['TEST_HARDWARE_ARCH']
          expected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}
          data = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,
                  'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],
                  'selection': os.environ['TEST_HARDWARE_SELECTION'],
                  'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,
                  'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              assert arch in expected, 'unsupported selected runner architecture'
              affinity = sorted(os.sched_getaffinity(0))
              data.update(system=platform.system(), machine=platform.machine(),
                          cpu_count=os.cpu_count(), cpu_affinity=affinity,
                          available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],
                          runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],
                          python_version=platform.python_version(), python_implementation=platform.python_implementation(),
                          python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                          native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
                          native_ref=os.environ['GITHUB_REF'],
                          source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                             for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},
                          hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),
                                               'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})
              assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'
              assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'
              assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'
              assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)
              assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'
              assert data['run_id'].isdigit() and data['run_attempt'] > 0
              assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])
              assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}
              data['status'] = 'passed'
          except BaseException as error:
              data['error'] = {'type': type(error).__name__, 'message': str(error)}
              raise
          finally:
              output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with output.open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(data, indent=2, allow_nan=False) + '\n')
              print(json.dumps(data, sort_keys=True, allow_nan=False))
          PY_HARDWARE
      - name: Run full runtime shard
        run: |
          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3600 )); then test_seconds=3600; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json"
          if (( test_seconds < 3600 )); then
            printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\n' "$test_seconds" >&2
            printf '124\n' > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
            exit 124
          fi
          test_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ["TEST_JOB_DEADLINE"]),int(os.environ["TEST_RUN_DEADLINE"]))-450; sys.exit("Insufficient remaining time for a full test hour") if w > cutoff else print(w)')
          .venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile="audited-163-v9",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+"\n")' "$RUNNER_TEMP/full-${{ matrix.shard }}-control.json" "$test_work_deadline"
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/5" --hosted-methods audited-163-v9 --hosted-deadline-epoch "$test_work_deadline" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.shard }}.log"
          test_statuses=("${PIPESTATUS[@]}")
          test_status=${test_statuses[0]}
          if (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi
          printf '%s\n' "$test_status" > "$RUNNER_TEMP/full-${{ matrix.shard }}-exit-code.txt"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-${{ matrix.shard }}.json
            ${{ runner.temp }}/full-${{ matrix.shard }}.json.methods/
            ${{ runner.temp }}/full-${{ matrix.shard }}.log
            ${{ runner.temp }}/full-${{ matrix.shard }}-control.json
            ${{ runner.temp }}/full-${{ matrix.shard }}-exit-code.txt
            ${{ runner.temp }}/runner-hardware-full-${{ matrix.shard }}.json
          if-no-files-found: error

