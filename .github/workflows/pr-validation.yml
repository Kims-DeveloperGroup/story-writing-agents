name: PR validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired-runtime:
    name: 한 실행기에서 기존 영향 사례 대조
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cba02bf32439a0c14b3af8c5bf92221a233c9353
          path: source0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8f78d0a4c659304f41489985edf7e95ed363ea34
          path: source1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: 같은 의존성과 Git 테스트 설정
        working-directory: source1
        run: |
          uv sync --locked --all-extras --python 3.11.18 --no-progress
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: 같은 실행기에서 전후 순서를 번갈아 실행
        run: |
          source1/.venv/bin/python - <<'PYTHON'
          from pathlib import Path
          import gc
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          root=Path(os.environ["GITHUB_WORKSPACE"])
          destination=root/"paired-artifacts"
          destination.mkdir()
          cases=['tests.test_codex_backend.CodexBackendTestCase.test_a_to_b_to_a_route_generation_never_resumes_old_a_threads_after_restart']
          caps={'tests.test_codex_backend.CodexBackendTestCase.test_a_to_b_to_a_route_generation_never_resumes_old_a_threads_after_restart': 0}
          sources={"before":("source0","cba02bf32439a0c14b3af8c5bf92221a233c9353","bd82f3933298cb047fcbe40ccdd519e147a56337"),"after":("source1","8f78d0a4c659304f41489985edf7e95ed363ea34","640e08312bc37dfe02077b6928596891a622e146")}
          assert platform.python_version()=="3.11.18" and platform.machine()=="aarch64"
          assert gc.isenabled() and sys.getprofile() is None and len(os.sched_getaffinity(0))==4
          runs=[]
          for pair in range(1,8+1):
              order=("before","after") if pair%2 else ("after","before")
              for role in order:
                  work,head,tree=sources[role]
                  folder=root/work
                  dest=destination/f"pair-{pair}-{role}.json"
                  identity=subprocess.check_output(["git","rev-parse","HEAD","HEAD^{tree}"],cwd=folder,text=True).splitlines()
                  assert identity==[head,tree]
                  args=[sys.executable,"-m","tests.runner","run","--json",str(dest)]
                  for cid in cases:
                      args.extend(("--id",cid))
                  with dest.with_suffix(".log").open("wb") as log:
                      result=subprocess.run(args,cwd=folder,env={**os.environ,"PYTHONPATH":"src"},
                                            stdout=log,stderr=subprocess.STDOUT,timeout=780)
                  assert result.returncode==0
                  report=json.loads(dest.read_text())
                  assert report["outcome"]=="success" and not report["unexecuted_ids"] and report["environment_valid"]
                  source=report["source_binding"]
                  assert source["checkout_tree"]==tree and source["checkout_sha"]==head and source["source_valid"]
                  rows={r["canonical_id"]:r for r in report["tests"]}
                  assert rows.keys()==set(cases) and all(r["status"]=="passed" and r["subtest_count"]<=caps[cid] for cid,r in rows.items())
                  runs.append({"pair":pair,"role":role,"report":dest.name,"sha256":hashlib.sha256(dest.read_bytes()).hexdigest()})
          (destination/"provenance.json").write_text(json.dumps({
              "run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"workflow":os.environ["GITHUB_SHA"],
              "runner":platform.machine(),"python":platform.python_version(),"affinity":len(os.sched_getaffinity(0)),
              "gc_thresholds":gc.get_threshold(),"runs":runs},indent=2)+"\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-affected-timing
          path: paired-artifacts
          if-no-files-found: error
