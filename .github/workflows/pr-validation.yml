name: PR validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guard-coherence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provenance-probe:
    name: Diagnostic only - Enum capture coherence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install locked diagnostic dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Probe both public Enum mutation paths
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, platform, subprocess, sys
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'guard-coherence-probe'
          output.mkdir()
          probe = output / 'probe.py'
          probe.write_bytes(base64.b64decode(''))
          def tracked_digest():
              digest = hashlib.sha256()
              paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              for name in sorted(filter(None, paths)):
                  path = pathlib.Path(os.fsdecode(name))
                  if path.is_file():
                      digest.update(name + b'\0' + hashlib.sha256(path.read_bytes()).digest())
              return digest.hexdigest()
          before = tracked_digest()
          env = dict(os.environ, PROBE_OUTPUT=str(output / 'observations.json'), PYTHONPATH=str(pathlib.Path('src').resolve()))
          result = subprocess.run(['uv', 'run', '--no-sync', 'python', str(probe)], env=env, text=True, capture_output=True)
          (output / 'stdout.txt').write_text(result.stdout)
          (output / 'stderr.txt').write_text(result.stderr)
          after = tracked_digest()
          binding = {
              'diagnostic_only': True, 'canonical_acceptance_credit': False,
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkout_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'before_digest': before, 'after_digest': after, 'source_valid': before == after,
              'probe_sha256': hashlib.sha256(probe.read_bytes()).hexdigest(),
              'probe_exit_code': result.returncode, 'python': platform.python_version(),
              'platform': platform.platform(),
          }
          (output / 'source-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          print(json.dumps(binding))
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          sys.exit(result.returncode if before == after else 99)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-coherence-probe
          path: ${{ runner.temp }}/guard-coherence-probe
          if-no-files-found: error
