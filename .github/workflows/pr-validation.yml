name: Issue 872 complete whole-front 40-minute timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-timing:
    name: Complete whole-front with 40-minute cutoff
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - name: Check out diagnostic transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-control
          persist-credentials: false
      - name: Check out unchanged application source
        uses: actions/checkout@v4
        with:
          ref: a86b5f63742e94381c67650731e922a158f78e81
          submodules: recursive
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install locked test dependencies
        working-directory: source
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic fixture Git identity
        run: |
          git config --global user.name 'Story Tests'
          git config --global user.email 'story-tests@example.invalid'
      - name: Measure complete original whole-front test
        working-directory: source
        env:
          PYTHONPATH: src:.
          PROFILE_TIMING_DIR: ${{ runner.temp }}/whole-front-40m-v46
        run: .venv/bin/python "$GITHUB_WORKSPACE/diagnostic-control/.github/diagnostics/issue872/run-profile.py"
      - name: Upload timing and cleanup evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: whole-front-40m-v46
          path: ${{ runner.temp }}/whole-front-40m-v46/
          if-no-files-found: error
