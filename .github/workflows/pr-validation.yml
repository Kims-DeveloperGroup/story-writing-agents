name: PR validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired-runtime:
    name: 한 실행기에서 기존 영향 사례 대조
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a0e6b008a3d78f67e8861fe20941485711c7eb5
          path: source0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f35fb2e20108ab17e654f324f577eeb34ce8a870
          path: source1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: 같은 의존성과 Git 테스트 설정
        working-directory: source1
        run: |
          uv sync --locked --all-extras --python 3.11.18 --no-progress
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: 같은 실행기에서 전후 순서를 번갈아 실행
        run: |
          source1/.venv/bin/python - <<'PYTHON'
          from pathlib import Path
          import gc
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          root=Path(os.environ["GITHUB_WORKSPACE"])
          destination=root/"paired-artifacts"
          destination.mkdir()
