{
  "name": "PR validation",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "issue-848-bound-query-check-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "workflow-deadline": {
      "name": "Enforce 30-minute workflow limit",
      "if": "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "actions": "write"
      },
      "steps": [
        {
          "name": "Enforce total workflow deadline",
          "uses": "actions/github-script@v7",
          "with": {
            "retries": 0,
            "script": "const parameters = () => ({\n  ...context.repo,\n  run_id: context.runId,\n  request: {signal: AbortSignal.timeout(5000)},\n});\nconst attempt = Number(process.env.GITHUB_RUN_ATTEMPT);\nif (!Number.isSafeInteger(attempt) || attempt < 1) {\n  core.setFailed(\"Missing workflow attempt identity.\");\n  return;\n}\n// Metadata retries never grant a new test budget.\nconst metadataDeadline = Date.now() + 30_000;\nlet deadline;\nlet cancellationRequested = false;\nasync function currentRun() {\n  const {data: run} = await github.rest.actions.getWorkflowRun(parameters());\n  if (run.id !== context.runId || run.run_attempt !== attempt) {\n    core.setFailed(\"Workflow attempt changed; the stale guard cannot cancel it.\");\n    return null;\n  }\n  if (run.status === \"completed\") return null;\n  const created = Date.parse(run.created_at);\n  if (!Number.isFinite(created)) throw new Error(\"Missing workflow creation time.\");\n  const runDeadline = created + 30 * 60 * 1000;\n  deadline = deadline === undefined ? runDeadline : Math.min(deadline, runDeadline);\n  return run;\n}\nwhile (Date.now() < (deadline ?? metadataDeadline)) {\n  try {\n    if (!await currentRun()) return;\n    let complete;\n    try {\n      const {data: page} = await github.rest.actions.listJobsForWorkflowRunAttempt({\n        ...parameters(), attempt_number: attempt, per_page: 100,\n      });\n      if (!Number.isSafeInteger(page.total_count) || page.total_count > 100 ||\n          !Array.isArray(page.jobs) || page.total_count !== page.jobs.length) {\n        throw new Error(\"Cannot establish the complete validation job list.\");\n      }\n      // A marker covers downstream jobs absent from an earlier API snapshot.\n      complete = page.jobs.find(job => job.name === \"Validation jobs complete\");\n    } catch (error) {\n      // Job-list failures cannot prevent cancellation at the deadline.\n      core.warning(`Completion lookup failed: ${error.message}`);\n    }\n    if (Date.now() < deadline && complete?.status === \"completed\" &&\n        [\"success\", \"failure\"].includes(complete.conclusion)) {\n      core.info(\"All validation jobs finished within the workflow deadline.\");\n      return;\n    }\n    if (Date.now() >= deadline - 60_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; force-cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.request(\"POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel\", parameters());\n      return;\n    }\n    if (!cancellationRequested && Date.now() >= deadline - 90_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.rest.actions.cancelWorkflowRun(parameters());\n      cancellationRequested = true;\n    }\n  } catch (error) {\n    core.warning(`Deadline control request failed: ${error.message}`);\n  }\n  const remaining = (deadline ?? metadataDeadline) - Date.now();\n  const poll = deadline !== undefined && remaining > 90_000 ? 30_000 : 5000;\n  if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(poll, remaining)));\n}\ncore.setFailed(\"Workflow deadline enforcement could not complete within its bounded window.\");\n"
          }
        }
      ]
    },
    "matched-check": {
      "name": "Measure repeated offer checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "GIT_AUTHOR_NAME": "Story Tests",
        "GIT_AUTHOR_EMAIL": "story-tests@example.invalid",
        "GIT_COMMITTER_NAME": "Story Tests",
        "GIT_COMMITTER_EMAIL": "story-tests@example.invalid",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0"
        },
        {
          "name": "Install locked environment",
          "timeout-minutes": 5,
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Prepare pinned diagnostic",
          "run": "python3 - <<'PY'\nimport base64,os,pathlib\nroot=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"bound-query-check\"\nroot.mkdir()\n(root/\"probe.py\").write_bytes(base64.b64decode(''))\n(root/\"config.json\").write_bytes(base64.b64decode(''))\nPY"
        },
        {
          "name": "Run bounded matched check",
          "timeout-minutes": 11,
          "run": "set -euo pipefail\ntimeout --signal=TERM --kill-after=30s 570s .venv/bin/python \"$RUNNER_TEMP/bound-query-check/probe.py\" --config \"$RUNNER_TEMP/bound-query-check/config.json\" --checkout \"$GITHUB_WORKSPACE\" --output \"$RUNNER_TEMP/bound-query-check/result.json\" 2>&1 | tee \"$RUNNER_TEMP/bound-query-check/probe.log\"\n"
        },
        {
          "name": "Upload bounded diagnostic evidence",
          "if": "always()",
          "timeout-minutes": 1,
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "bound-query-matched-check",
            "path": "${{ runner.temp }}/bound-query-check",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "validation-complete": {
      "name": "Validation jobs complete",
      "needs": [
        "matched-check"
      ],
      "if": "${{ !cancelled() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {},
      "steps": [
        {
          "name": "Mark validation jobs terminal",
          "timeout-minutes": 1,
          "run": "echo \"Validation jobs are terminal; their individual results remain authoritative.\""
        }
      ]
    }
  }
}
