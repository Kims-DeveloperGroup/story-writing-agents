hreshold()),\n                                     'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})\n    assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'\n    assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'\n    assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'\n    assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)\n    assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'\n    assert data['run_id'].isdigit() and data['run_attempt'] > 0\n    assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])\n    assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}\n    data['status'] = 'passed'\nexcept BaseException as error:\n    data['error'] = {'type': type(error).__name__, 'message': str(error)}\n    raise\nfinally:\n    output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n    with output.open('x', encoding='utf-8') as stream:\n        stream.write(json.dumps(data, indent=2, allow_nan=False) + '\\n')\n    print(json.dumps(data, sort_keys=True, allow_nan=False))\nPY_HARDWARE\n"
