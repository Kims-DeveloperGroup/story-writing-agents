3267797825c4690c36eed61f5191d8bcbe190b8495ff2305', 'tests/test_session_recovery_contracts.py': '2d803765e4f68fa3cc2c9268cc2d90cff1e5728cca037a1509cc02077b0f9c6a', 'tests/test_session_recovery_reconciliation.py': '3731a11030b0bebbb98b5704ad862e63c9503b82af824f23fb93c86990db43aa', 'tests/test_session_transition_assessment.py': 'ada1a4a7af4b0be659746b2ba4a4f5d7d3bf3606b11294689186829f58445e85', 'tests/test_smoke_cli.py': '55ac36d51aedfaa0b22b17018522d1bbc18b02909669e067d0d29564b193ac1d', 'tests/test_specialist_orchestration.py': 'b8370b0d4b7ddfdf8201d3ab6ee21864b081c6d54ef52c33a71c7c6f99e0de16', 'tests/test_specialist_routing.py': '69f386922a8bdd456c68480fc6a9e8730864b3b859f2f9bafc4ac1d06814d6d4', 'tests/test_specialist_routing_runtime.py': '002f6947164f84dc4735eed148d9136f15cd1367c51e1d1eb917e04e674d5e13', 'tests/test_sqlite_collaboration_event_store.py': 'a48ef1f81e7b7345cdf853e4620ccd9344909b3c1ad459bd94656f066348484c', 'tests/test_sqlite_conversation_storage.py': '8de09f4b56dc03eba044af20cf50145a5da7f5f3c1a84e6e2c56a0ffe4caeea5', 'tests/test_sqlite_database.py': 'e4a731ea2964aa1006ef2f850af371675e027a833a941d3777963578afe99d3e', 'tests/test_suite_budget.py': 'b1f6098ecdc1477f16c34b4959fd056aa10c5a4aef10e2c4c9e1744cac3593ed', 'tests/test_workspace_and_config.py': 'aa9a7b199d4196ee366f9d0f74905e2983000abd7dcf4702719d33d47b3883a1', 'tests/test_workspace_fixtures.py': '34650d8046a5b82061433f3f63d098901f202918bd2d3039cce8db063159afe8', 'tests/test_workspace_policy_compatibility.py': '3f03748def3d19dc64c204cfa627370dc641c3d51df721910a2f8cdfd75fb5d9', 'tests/test_workspace_session_history.py': '2b969fa9bb497dc6ebb19bc94e3b6ef00d22096cebfaeaf0df22e05767be336c', 'tests/test_workspace_session_resources.py': '1b64cc0fa49ddc884001352d442b8d054f465a1f488430682aa40356fc61f312', 'tests/test_workspace_v2_initialization.py': '07e43f9515377888d94f26cc8b6542eae192ce33b4865ad9b6c64a2164763b9e', 'tests/test_writing_artifacts.py': '445fa4f2f9caf57ee579a7dc097d7f76d083d867138e9d702a55a06bba8360d4', 'uv.lock': 'f8d3ebb4bc7b069d2669907e82d93a5a0d3b55d4056897944a51e32315030b91'}\nimport base64, datetime, hashlib, json, os, pathlib, subprocess, time\noutput = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"timing-diagnostic\"\noutput.mkdir(mode=0o700, parents=True, exist_ok=True)\nroot = pathlib.Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()\nshared = int(os.environ[\"TEST_RUN_DEADLINE\"])\njob = int(os.environ[\"TEST_JOB_DEADLINE\"])\nassert job <= shared and int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) == 1\nhard = min(time.time() + 600, job - 450, shared - 450)\ncontrol = {\"diagnostic_only\": True, \"canonical_pass_credit\": False, \"performance_credit\": False,\n           \"source_candidate\": SOURCE, \"hard_deadline_epoch\": hard, \"maximum_seconds_including_kill\": 600,\n           \"shutdown_reserve_seconds\": 35, \"child_work_alarm_reserve_seconds\": 60,\n           \"kill_grace_seconds\": 30, \"outer_kill_grace_seconds\": 5, \"shared_reserve_seconds\": 450}\n(output / \"control.json\").write_text(json.dumps(control, indent=2) + \"\\n\")\nif hard - time.time() <= 60:\n    raise SystemExit(\"No bounded census work/cleanup window remains\")\nbundle = output / \"bundle\"\nbundle.mkdir(mode=0o700)\nfor name, encoded in PAYLOAD.items():\n    value = base64.b64decode(encoded, validate=True)\n    assert hashlib.sha256(value).hexdigest() == HASHES[name]\n    (bundle / name).write_bytes(value)\ndef git(*arguments):\n    return subprocess.check_output([\"git\", *arguments], cwd=root, text=True, timeout=5).strip()\nhead, tree = git(\"rev-parse\", \"HEAD\"), git(\"rev-parse\", \"HEAD^{tree}\")\nassert head == os.environ[\"GITHUB_SHA\"] and git(\"rev-parse\", \"HEAD^\") == SOURCE\nassert git(\"rev-parse\", SOURCE + \"^{tree}\") == TREE\nassert git(\"diff\", \"--name-only\", SOURCE, \"HEAD\").splitlines() == [\".github/workflows/pr-validation.yml\"]\ncreated = datetime.datetime.fromtimestamp(shared - 1800, datetime.timezone.utc).isoformat()\nconfig = {\"roots\": {\"candidate\": str(root)}, \"sources\": {\"candidate\": SOURCE}, \"pins\": {\"candidate\": PINS},\n          \"probe_sha256\": HASHES[\"probe.py\"], \"census_sha256\": HASHES[\"census.py\"],\n          \"supervisor_sha256\": HASHES[\"supervisor.py\"], \"checkout_sha\": head, \"checkout_tree\": tree,\n          \"run_id\": int(os.environ[\"GITHUB_RUN_ID\"]), \"run_attempt\": int(os.environ[\"GITHUB_RUN_ATTEMPT\"]),\n          \"workflow_created_at\": created, \"deadline_epoch\": shared,\n          \"supervisor\": {\"process_group_hard_deadline\": True, \"worker_budget_seconds\": 600,\n                         \"hard_deadline_epoch\": hard, \"kill_grace_seconds\": 30, \"shared_reserve_seconds\": 450}}\n(output / \"config.json\").write_text(json.dumps(config, indent=2, sort_keys=True) + \"\\n\")\nprepared = {\"diagnostic_only\": True, \"canonical_pass_credit\": False, \"source_candidate\": SOURCE,\n            \"source_tree\": TREE, \"checkout_sha\": head, \"checkout_tree\": tree,\n            \"run_id\": config[\"run_id\"], \"run_attempt\": config[\"run_attempt\"],\n            \"workflow_sha256\": hashlib.sha256((root / \".github/workflows/pr-validation.yml\").read_bytes()).hexdigest(),\n            \"config_sha256\": hashlib.sha256((output / \"config.json\").read_bytes()).hexdigest(),\n            \"tool_hashes\": HASHES, \"source_pin_count\": len(PINS),\n            \"creation_time_source\": \"Exact T classify output from native run.created_at, epoch seconds\"}\n(output / \"prepared.json\").write_text(json.dumps(prepared, indent=2, sort_keys=True) + \"\\n\")\nprint(json.dumps({\"diagnostic_only\": True, \"prepared\": True, \"remaining_seconds\": hard - time.time()}), flush=True)\n\nPY\nouter_seconds=\"$(.venv/bin/python - <<'PY'\nimport json, os, pathlib, time\nconfig = json.loads((pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"timing-diagnostic/config.json\").read_text())\nseconds = config[\"supervisor\"][\"hard_deadline_epoch\"] - time.time() - 5\nif seconds <= 0:\n    raise SystemExit(\"Census outer deadline exhausted before launch\")\nprint(f\"{seconds:.3f}\")\nPY\n)\"\nset +e\ntimeout --signal=TERM --kill-after=5s \"${outer_seconds}s\" .venv/bin/python \\\n  \"$RUNNER_TEMP/timing-diagnostic/bundle/supervisor.py\" \\\n  --config \"$RUNNER_TEMP/timing-diagnostic/config.json\" \\\n  --output \"$RUNNER_TEMP/timing-diagnostic\" 2>&1 | tee \"$RUNNER_TEMP/timing-diagnostic/worker.log\"\npipeline_status=(\"${PIPESTATUS[@]}\")\nset -e\nprintf '%s\\n' \"${pipeline_status[0]}\" > \"$RUNNER_TEMP/timing-diagnostic/exit-code.txt\"\nprintf '{\"worker\":%s,\"tee\":%s}\\n' \"${pipeline_status[0]}\" \"${pipeline_status[1]}\" \\\n  > \"$RUNNER_TEMP/timing-diagnostic/pipeline-status.json\"\nif (( pipeline_status[0] != 0 )); then exit \"${pipeline_status[0]}\"; fi\nif (( pipeline_status[1] != 0 )); then exit \"${pipeline_status[1]}\"; fi\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')",
          "with": {
            "name": "${{ github.event_name == 'workflow_dispatch' && format('timing-diagnostic-{0}-{1}', inputs.arch, inputs.scratch) || 'timing-diagnostic' }}",
            "path": "${{ runner.temp }}/timing-diagnostic",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Remove diagnostic scratch storage",
          "if": "always() && steps.scratch.outputs.directory != ''",
          "env": {
            "SCRATCH": "${{ steps.scratch.outputs.directory }}",
            "SCRATCH_IDENTITY": "${{ steps.scratch.outputs.identity }}",
            "MEMORY": "${{ inputs.scratch == 'memory' }}"
          },
          "run": "if [[ \"$MEMORY\" == \"true\" ]]; then\n  if mountpoint -q \"$SCRATCH\"; then\n    sudo umount \"$SCRATCH\"\n  fi\n  rmdir \"$SCRATCH\"\nelse\n  printf 'Diagnostic scratch cleanup path=%s identity=%s\\n' \"$SCRATCH\" \"$SCRATCH_IDENTITY\"\n  cleanup_seconds=\"$(python - <<'PY'\nimport os, time\nremaining = int(os.environ[\"TEST_JOB_DEADLINE\"]) - 360 - time.time()\nwork_ms = min(28000, int((remaining - 2) * 1000))\nif work_ms <= 0:\n    raise SystemExit(\"No diagnostic scratch cleanup budget remains before cancellation reserve\")\nprint(f\"{work_ms / 1000:.3f}\")\nPY\n  )\"\n  timeout --signal=TERM --kill-after=2s \"${cleanup_seconds}s\" python -u - <<'PY'\nimport json, os, re, shutil, stat, time\nrecord = json.loads(os.environ[\"SCRATCH_IDENTITY\"])\npath = os.environ[\"SCRATCH\"]\nparent = record[\"parent\"]\nname = os.path.basename(path)\nstop = int(os.environ[\"TEST_JOB_DEADLINE\"]) - 360\nif time.time() >= stop - 2:\n    raise RuntimeError(\"Diagnostic scratch cleanup window expired\")\nif (not os.path.isabs(path) or path != record[\"path\"]\n        or os.path.dirname(path) != parent or os.path.realpath(parent) != parent\n        or not re.fullmatch(r\"story-timing\\.[A-Za-z0-9]{8}\", name)):\n    raise RuntimeError(\"Diagnostic scratch path identity changed\")\nif not shutil.rmtree.avoids_symlink_attacks:\n    raise RuntimeError(\"Symlink-resistant diagnostic cleanup is unavailable\")\nfd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\ntry:\n    outer = os.fstat(fd)\n    if [outer.st_dev, outer.st_ino, outer.st_uid] != record[\"parent_identity\"]:\n        raise RuntimeError(\"Diagnostic scratch parent identity changed\")\n    inner = os.stat(name, dir_fd=fd, follow_symlinks=False)\n    if (not stat.S_ISDIR(inner.st_mode) or inner.st_uid != os.geteuid()\n            or inner.st_dev != outer.st_dev\n            or [inner.st_dev, inner.st_ino, inner.st_uid] != record[\"root\"]):\n        raise RuntimeError(\"Diagnostic scratch directory identity changed\")\n    with open(\"/proc/self/mountinfo\", encoding=\"utf-8\") as mounts:\n        for line in mounts:\n            mount = line.split()[4]\n            for escaped, decoded in ((r\"\\040\", \" \"), (r\"\\011\", \"\\t\"), (r\"\\012\", \"\\n\"), (r\"\\134\", chr(92))):\n                mount = mount.replace(escaped, decoded)\n            if mount == path or mount.startswith(path + os.sep):\n                raise RuntimeError(\"Mounted diagnostic scratch storage cannot be recursively removed\")\n    current = os.stat(name, dir_fd=fd, follow_symlinks=False)\n    if ([current.st_dev, current.st_ino, current.st_uid] != record[\"root\"]\n            or not stat.S_ISDIR(current.st_mode) or time.time() >= stop - 2):\n        raise RuntimeError(\"Diagnostic scratch identity or cleanup window changed\")\n    shutil.rmtree(name, dir_fd=fd)\n    try:\n        os.stat(name, dir_fd=fd, follow_symlinks=False)\n    except FileNotFoundError:\n        print(json.dumps({\"diagnostic_scratch_removed\": record}, sort_keys=True), flush=True)\n    else:\n        raise RuntimeError(\"Diagnostic scratch path remains after cleanup\")\nfinally:\n    os.close(fd)\nPY\nfi\n"
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "arch": {
          "description": "Diagnostic-only standard runner architecture",
          "type": "choice",
          "options": [
            "x64"
          ],
          "default": "x64"
        },
        "scratch": {
          "description": "Diagnostic-only temporary filesystem",
