          test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))
          if (( test_seconds > 3150 )); then test_seconds=3150; fi
          printf '{"worker_limit_seconds":%s,"kill_grace_seconds":30,"cleanup_reserve_seconds":60,"cancellation_reserve_seconds":360}\n' "$test_seconds" > "$RUNNER_TEMP/fast-control.json"
          if (( test_seconds <= 0 )); then exit 124; fi
          runner=(.venv/bin/python -m tests.runner run "${selector[@]}" --json "$RUNNER_TEMP/fast.json")
          if [[ "$OBSERVE_GC" == "true" ]]; then
            runner=(.venv/bin/python -m tests.runner.gc_diagnostic --observation-json "$RUNNER_TEMP/gc-diagnostic.json" -- run "${selector[@]}" --json "$RUNNER_TEMP/gc-diagnostic-run.json")
          fi
          if [[ "$PROFILE_SELECTION" == "true" ]]; then
            runner=(.venv/bin/python -m cProfile -o "$RUNNER_TEMP/case-profile-current.prof" -m tests.runner run "${selector[@]}" --json "$RUNNER_TEMP/case-profile-current.json")
          fi
          set +e
          timeout --signal=INT --kill-after=30s "${test_seconds}s" env PYTHONPATH=src .venv/bin/python "$RUNNER_TEMP/annotation-pair-cli-wall-parent.py" "$RUNNER_TEMP/annotation-pair-current-cli-wall.json" current "${runner[@]}" 2>&1 | tee "$RUNNER_TEMP/fast.log"
