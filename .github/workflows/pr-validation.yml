name: Issue 873 baseline response oracles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-oracles:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a86b5f63742e94381c67650731e922a158f78e81
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Verify baseline and runner
        env:
          EVIDENCE: ${{ runner.temp }}/baseline-oracles
        run: |
          umask 077
          mkdir "$EVIDENCE"
          .venv/bin/python - <<'PY'
          import gc,json,os,platform,subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data={'sha':sha,'system':platform.system(),'machine':platform.machine(),'cpus':os.cpu_count(),'affinity':sorted(os.sched_getaffinity(0)),'python':platform.python_version(),'gc_enabled':gc.isenabled(),'thresholds':gc.get_threshold(),'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          assert sha=='a86b5f63742e94381c67650731e922a158f78e81'
          assert data['system']=='Linux' and data['machine']=='aarch64' and data['cpus']==len(data['affinity'])==4
          assert data['python']=='3.11.17' and data['gc_enabled'] and data['thresholds']==(700,10,10)
          Path(os.environ['EVIDENCE'],'hardware.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Run four independent response oracles
        env:
          PYTHONPATH: src
          EVIDENCE: ${{ runner.temp }}/baseline-oracles
        run: |
          timeout --signal=INT --kill-after=30s 120s .venv/bin/python -m tests.runner run \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_diagnose_json_text_reports_all_independent_safe_issues \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_malformed_and_duplicate_json_have_value_free_diagnostics \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_properties_omitted_from_required_remain_optional \
            --id tests.test_agent_context_service.StructuredOutputValidationTests.test_bounded_chunks_preserve_order_and_over_32k_content \
            --json "$EVIDENCE/baseline.json"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: issue873-baseline-oracles-v50
          path: ${{ runner.temp }}/baseline-oracles/
          if-no-files-found: error
