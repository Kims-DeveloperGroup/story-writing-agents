name: PR validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired-runtime:
    name: 한 실행기에서 기존 영향 사례 대조
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8fb4161052f93f3fc15cf51273990da43fb959ae
          path: source0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: af90e4c0953e1191b56ce6a64b5004ce5b95b19c
          path: source1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: 같은 의존성과 Git 테스트 설정
        working-directory: source1
        run: |
          uv sync --locked --all-extras --python 3.11.18 --no-progress
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: 같은 실행기에서 전후 순서를 번갈아 실행
        run: |
          source1/.venv/bin/python - <<'PYTHON'
          from pathlib import Path
          import gc
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          root=Path(os.environ["GITHUB_WORKSPACE"])
          destination=root/"paired-artifacts"
          destination.mkdir()
          cases=['tests.test_artifact_application_contracts.ArtifactApplicationBoundaryTests.test_module_graph_matches_accepted_delta', 'tests.test_artifact_application_store_recovery.ArtifactApplicationBoundaryTests.test_store_is_sole_persistence_interpreter_and_matches_boundary', 'tests.test_artifact_relationship_policy.ArtifactRelationshipBoundaryTests.test_ast_graph_counts_and_cycles_match_accepted_brief', 'tests.test_git_external_operation_inspection.GitExternalOperationInspectionTests.test_contract_adapter_exports_and_dependencies_are_exact', 'tests.test_interactive_controller.ControllerContractTests.test_direct_import_is_clean_and_package_graph_is_acyclic', 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_inventory_edges_cycles_and_sole_dual_importer_match_the_brief', 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_supported_module_surfaces_do_not_expand_the_root_facade', 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_clean_base_wheel_editable_and_compatibility_extra_installs', 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_temporary_base_and_optional_artifacts_exclude_vendored_source', 'tests.test_session_lifecycle.SessionLifecycleContractTests.test_lifecycle_module_is_leaf_and_clean_imports_work', 'tests.test_session_recovery_contracts.SessionRecoveryBoundaryTests.test_clean_import_and_exact_dependencies_match_accepted_delta', 'tests.test_suite_budget.SuiteBudgetTests.test_new_id_increased_subtests_and_relaxed_time_are_rejected', 'tests.test_workspace_session_history.WorkspaceSessionHistoryCompositionTests.test_internal_wrapper_uses_main_root_manifest_and_noncreating_snapshot']
          caps={'tests.test_artifact_application_contracts.ArtifactApplicationBoundaryTests.test_module_graph_matches_accepted_delta': 0, 'tests.test_artifact_application_store_recovery.ArtifactApplicationBoundaryTests.test_store_is_sole_persistence_interpreter_and_matches_boundary': 0, 'tests.test_artifact_relationship_policy.ArtifactRelationshipBoundaryTests.test_ast_graph_counts_and_cycles_match_accepted_brief': 0, 'tests.test_git_external_operation_inspection.GitExternalOperationInspectionTests.test_contract_adapter_exports_and_dependencies_are_exact': 0, 'tests.test_interactive_controller.ControllerContractTests.test_direct_import_is_clean_and_package_graph_is_acyclic': 0, 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_inventory_edges_cycles_and_sole_dual_importer_match_the_brief': 22, 'tests.test_rag_module_and_packaging_boundary.RagModuleBoundaryTests.test_supported_module_surfaces_do_not_expand_the_root_facade': 0, 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_clean_base_wheel_editable_and_compatibility_extra_installs': 0, 'tests.test_rag_module_and_packaging_boundary.RagPackagingBoundaryTests.test_temporary_base_and_optional_artifacts_exclude_vendored_source': 0, 'tests.test_session_lifecycle.SessionLifecycleContractTests.test_lifecycle_module_is_leaf_and_clean_imports_work': 0, 'tests.test_session_recovery_contracts.SessionRecoveryBoundaryTests.test_clean_import_and_exact_dependencies_match_accepted_delta': 0, 'tests.test_suite_budget.SuiteBudgetTests.test_new_id_increased_subtests_and_relaxed_time_are_rejected': 4, 'tests.test_workspace_session_history.WorkspaceSessionHistoryCompositionTests.test_internal_wrapper_uses_main_root_manifest_and_noncreating_snapshot': 0}
          sources={"before":("source0","8fb4161052f93f3fc15cf51273990da43fb959ae","8dd6cf839eb8dde8fd65fc7ac046eaa8da4e09b1"),"after":("source1","af90e4c0953e1191b56ce6a64b5004ce5b95b19c","ec7037a47839458652f821b19f032d20a60a3b79")}
          assert platform.python_version()=="3.11.18" and platform.machine()=="aarch64"
          assert gc.isenabled() and sys.getprofile() is None and len(os.sched_getaffinity(0))==4
          runs=[]
          for pair in range(1,3+1):
              order=("before","after") if pair%2 else ("after","before")
              for role in order:
                  work,head,tree=sources[role]
                  folder=root/work
                  dest=destination/f"pair-{pair}-{role}.json"
                  identity=subprocess.check_output(["git","rev-parse","HEAD","HEAD^{tree}"],cwd=folder,text=True).splitlines()
                  assert identity==[head,tree]
                  args=[sys.executable,"-m","tests.runner","run","--json",str(dest)]
                  for cid in cases:
                      args.extend(("--id",cid))
                  with dest.with_suffix(".log").open("wb") as log:
                      result=subprocess.run(args,cwd=folder,env={**os.environ,"PYTHONPATH":"src"},
                                            stdout=log,stderr=subprocess.STDOUT,timeout=780)
                  assert result.returncode==0
                  report=json.loads(dest.read_text())
                  assert report["outcome"]=="success" and not report["unexecuted_ids"] and report["environment_valid"]
                  source=report["source_binding"]
                  assert source["checkout_tree"]==tree and source["checkout_sha"]==head and source["source_valid"]
                  rows={r["canonical_id"]:r for r in report["tests"]}
                  assert rows.keys()==set(cases) and all(r["status"]=="passed" and r["subtest_count"]<=caps[cid] for cid,r in rows.items())
                  runs.append({"pair":pair,"role":role,"report":dest.name,"sha256":hashlib.sha256(dest.read_bytes()).hexdigest()})
          (destination/"provenance.json").write_text(json.dumps({
              "run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"workflow":os.environ["GITHUB_SHA"],
              "runner":platform.machine(),"python":platform.python_version(),"affinity":len(os.sched_getaffinity(0)),
              "gc_thresholds":gc.get_threshold(),"runs":runs},indent=2)+"\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-affected-timing
          path: paired-artifacts
          if-no-files-found: error
