        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "submodules": "recursive",
            "ref": "${{ needs.classify.outputs.checkout_sha }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0",
          "with": {
            "version": "0.12.17"
          }
        },
        {
          "name": "Install runtime test dependencies",
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Configure deterministic test Git identity",
          "env": {
            "TEST_HARDWARE_ARCH": "arm64",
            "TEST_HARDWARE_PATH": "${{ runner.temp }}/runner-hardware-full-5.json",
            "TEST_HARDWARE_SELECTION": "shard:5/5",
            "TEST_HARDWARE_SHARD": "5/5"
          },
          "run": "git config --global user.name \"Story Tests\"\ngit config --global user.email \"story-tests@example.invalid\"\n.venv/bin/python - <<'PY_HARDWARE'\nimport datetime, gc, hashlib, json, os, platform, sys\nfrom pathlib import Path\n\noutput = Path(os.environ['TEST_HARDWARE_PATH'])\nroot = Path(os.environ['GITHUB_WORKSPACE'])\narch = os.environ['TEST_HARDWARE_ARCH']\nexpected = {'arm64': ('aarch64', 'ARM64'), 'x64': ('x86_64', 'X64')}\ndata = {'schema_version': 1, 'status': 'failed', 'expected_arch': arch,\n        'expected_available_cpu_count': 4, 'job': os.environ['GITHUB_JOB'],\n        'selection': os.environ['TEST_HARDWARE_SELECTION'],\n        'shard': os.environ.get('TEST_HARDWARE_SHARD') or None,\n        'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}\ntry:\n    assert arch in expected, 'unsupported selected runner architecture'\n    affinity = sorted(os.sched_getaffinity(0))\n    data.update(system=platform.system(), machine=platform.machine(),\n                cpu_count=os.cpu_count(), cpu_affinity=affinity,\n                available_cpu_count=len(affinity), runner_os=os.environ['RUNNER_OS'],\n                runner_arch=os.environ['RUNNER_ARCH'], runner_name=os.environ['RUNNER_NAME'],\n                python_version=platform.python_version(), python_implementation=platform.python_implementation(),\n                python_executable=sys.executable, run_id=os.environ['GITHUB_RUN_ID'],\n                run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),\n                native_workflow_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],\n                native_ref=os.environ['GITHUB_REF'],\n                source_file_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest()\n                                   for name in ('.github/workflows/pr-validation.yml', 'pyproject.toml', 'uv.lock')},\n                hardware_process_gc={'enabled': gc.isenabled(), 'thresholds': list(gc.get_threshold()),\n                                     'callback_count': len(gc.callbacks), 'profiler_none': sys.getprofile() is None})\n    assert data['system'] == data['runner_os'] == 'Linux', 'Linux runner required'\n    assert (data['machine'], data['runner_arch']) == expected[arch], 'runner architecture mismatch'\n    assert data['cpu_count'] == data['available_cpu_count'] == 4, 'four available CPUs required'\n    assert all(type(cpu) is int and cpu >= 0 for cpu in affinity)\n    assert sys.version_info[:2] == (3, 11) and data['python_implementation'] == 'CPython'\n    assert data['run_id'].isdigit() and data['run_attempt'] > 0\n    assert len(data['native_workflow_sha']) == 40 and all(c in '0123456789abcdef' for c in data['native_workflow_sha'])\n    assert data['hardware_process_gc'] == {'enabled': True, 'thresholds': [700, 10, 10], 'callback_count': 0, 'profiler_none': True}\n    data['status'] = 'passed'\nexcept BaseException as error:\n    data['error'] = {'type': type(error).__name__, 'message': str(error)}\n    raise\nfinally:\n    output.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n    with output.open('x', encoding='utf-8') as stream:\n        stream.write(json.dumps(data, indent=2, allow_nan=False) + '\\n')\n    print(json.dumps(data, sort_keys=True, allow_nan=False))\nPY_HARDWARE\n"
        },
        {
          "name": "Verify five-shard policy before the whole-front window",
          "timeout-minutes": 3,
          "run": "policy_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 - 3600 ))\nif (( policy_seconds > 120 )); then policy_seconds=120; fi\nif (( policy_seconds <= 0 )); then\n  echo \"Insufficient shared time for policy checks and the complete whole-front hour.\" >&2\n  exit 124\nfi\ntimeout --signal=INT --kill-after=30s \"${policy_seconds}s\" env PYTHONPATH=src .venv/bin/python -m tests.runner run --module tests.test_suite_budget --json \"$RUNNER_TEMP/whole-front-policy.json\" 2>&1 | tee \"$RUNNER_TEMP/whole-front-policy.log\"\npolicy_statuses=(\"${PIPESTATUS[@]}\")\npolicy_status=${policy_statuses[0]}\nif (( policy_status == 0 && policy_statuses[1] != 0 )); then policy_status=${policy_statuses[1]}; fi\nprintf '%s\\n' \"$policy_status\" > \"$RUNNER_TEMP/whole-front-policy-exit-code.txt\"\nexit \"$policy_status\"\n"
        },
        {
          "name": "Prepare and smoke-test external observer; verify unchanged source",
          "timeout-minutes": 3,
          "run": "uv venv \"$RUNNER_TEMP/whole-front-observer-env\" --python 3.11\nuv pip install --python \"$RUNNER_TEMP/whole-front-observer-env/bin/python\" \"py-spy==0.4.2\"\n\"$RUNNER_TEMP/whole-front-observer-env/bin/py-spy\" --version\n\"$RUNNER_TEMP/whole-front-observer-env/bin/py-spy\" record --help > \"$RUNNER_TEMP/whole-front-py-spy-help.txt\"\n.venv/bin/python - <<'PY_DIAGNOSTIC'\nimport base64,hashlib,json,os,subprocess,sys\nfrom pathlib import Path\nroot=Path(os.environ['GITHUB_WORKSPACE'])\ndiagnostic=Path(os.environ['RUNNER_TEMP'])/'whole-front-v52'\ndiagnostic.mkdir(parents=True,exist_ok=True)\n(diagnostic/'observe-run.py').write_bytes(base64.b64decode(''))\n(diagnostic/'expected-source.json').write_bytes(base64.b64decode(''))\n(diagnostic/'phase-map.json').write_bytes(base64.b64decode(''))\nexpected=json.loads((diagnostic/'expected-source.json').read_text())\nbad=[name for name,digest in expected['files'].items() if hashlib.sha256((root/name).read_bytes()).hexdigest()!=digest]\nassert not bad,bad\n(diagnostic/'verified-source.json').write_text(json.dumps({'source':expected['source'],'tree':expected['tree'],'files_verified':len(expected['files']),'status':'passed'})+'\\n')\nspy=Path(os.environ['RUNNER_TEMP'])/'whole-front-observer-env/bin/py-spy'\nassert subprocess.check_output([str(spy),'--version'],text=True).strip()=='py-spy 0.4.2'\nchild=subprocess.Popen([sys.executable,'-c','import time; time.sleep(10)'])\ntry:\n    result=subprocess.run(['sudo','-n',str(spy),'record','--pid',str(child.pid),'--rate','4','--duration','1','--idle','--threads','--format','speedscope','--output',str(diagnostic/'observer-smoke.json')],capture_output=True,text=True,timeout=8)\n    (diagnostic/'observer-smoke.log').write_text(result.stdout+result.stderr)\n    assert result.returncode==0,(result.returncode,result.stderr)\n    profile=json.loads((diagnostic/'observer-smoke.json').read_text())\n    assert profile['profiles'] and profile['shared']['frames']\nfinally:\n    child.terminate();child.wait(timeout=3)\nprint('External observer smoke passed; unchanged source verified:',expected['source'])\nPY_DIAGNOSTIC\n"
        },
        {
          "name": "Run complete whole-front with external observer, maximum 3600 seconds",
          "run": "test_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 3600 )); then test_seconds=3600; fi\nprintf '{\"worker_limit_seconds\":%s,\"kill_grace_seconds\":30,\"cleanup_reserve_seconds\":60,\"cancellation_reserve_seconds\":360}\\n' \"$test_seconds\" > \"$RUNNER_TEMP/full-5-control.json\"\nif (( test_seconds < 3600 )); then\n  printf 'Full shard requires 3600 seconds of execution plus shutdown reserve; available: %s seconds\\n' \"$test_seconds\" >&2\n  printf '124\\n' > \"$RUNNER_TEMP/full-5-exit-code.txt\"\n  exit 124\nfi\ntest_work_deadline=$(.venv/bin/python -c 'import os,sys,time; w=time.time()+3600; cutoff=min(int(os.environ[\"TEST_JOB_DEADLINE\"]),int(os.environ[\"TEST_RUN_DEADLINE\"]))-450; sys.exit(\"Insufficient remaining time for a full test hour\") if w > cutoff else print(w)')\n.venv/bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); w=float(sys.argv[2]); d.update(work_deadline_epoch=w,hard_cleanup_deadline_epoch=w+30,execution_profile=\"audited-147-v3\",maximum_method_workers=4); p.write_text(json.dumps(d,allow_nan=False)+\"\\n\")' \"$RUNNER_TEMP/full-5-control.json\" \"$test_work_deadline\"\nset +e\ntimeout --signal=INT --kill-after=30s \"$((test_seconds + 60))s\" env WF_EXTERNAL_OUT=\"$RUNNER_TEMP/whole-front-v52/measurement\" WF_PY_SPY=\"$RUNNER_TEMP/whole-front-observer-env/bin/py-spy\" PYTHONPATH=src .venv/bin/python \"$RUNNER_TEMP/whole-front-v52/observe-run.py\" .venv/bin/python -m tests.runner run --shard \"5/5\" --hosted-methods audited-147-v3 --hosted-deadline-epoch \"$test_work_deadline\" --json \"$RUNNER_TEMP/full-5.json\" 2>&1 | tee \"$RUNNER_TEMP/full-5.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\ntest_status=${test_statuses[0]}\nif (( test_status == 0 && test_statuses[1] != 0 )); then test_status=${test_statuses[1]}; fi\nprintf '%s\\n' \"$test_status\" > \"$RUNNER_TEMP/full-5-exit-code.txt\"\nexit \"$test_status\"\n"
