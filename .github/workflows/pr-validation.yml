21910a2f8cdfd75fb5d9\",\n  \"tests/test_workspace_session_history.py\": \"2b969fa9bb497dc6ebb19bc94e3b6ef00d22096cebfaeaf0df22e05767be336c\",\n  \"tests/test_workspace_session_resources.py\": \"1b64cc0fa49ddc884001352d442b8d054f465a1f488430682aa40356fc61f312\",\n  \"tests/test_workspace_v2_initialization.py\": \"07e43f9515377888d94f26cc8b6542eae192ce33b4865ad9b6c64a2164763b9e\",\n  \"tests/test_writing_artifacts.py\": \"445fa4f2f9caf57ee579a7dc097d7f76d083d867138e9d702a55a06bba8360d4\",\n  \"uv.lock\": \"f8d3ebb4bc7b069d2669907e82d93a5a0d3b55d4056897944a51e32315030b91\"\n}\nPINS\ncat > \"$out/control.py\" <<'CONTROL'\n\"\"\"Stdlib-only hosted timeout fixture; never imports application or test code.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport signal\nimport stat\nimport subprocess\nimport sys\nimport time\n\nSOURCE = \"7336624213e3148ea300124ea9fd0cbd9c5bcbb8\"\nSOURCE_TREE = \"f385df178e1c63b72356dbd64de5c0ebdd12f86e\"\nOUTPUT = Path(os.environ[\"RUNNER_TEMP\"]) / \"timing-diagnostic\"\nPAYLOAD = b\"owned scratch survives worker interruption\\n\" * 128\nSENTINEL = b\"external sentinel must remain outside the owned scratch\\n\"\n\n\ndef write_json(name, value):\n    (OUTPUT / name).write_text(json.dumps(value, indent=2) + \"\\n\")\n\n\ndef git(*args):\n    return subprocess.check_output([\"git\", *args], text=True, timeout=5).strip()\n\n\ndef source_hashes():\n    expected = json.loads((OUTPUT / \"source-pins.json\").read_text())\n    return {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()\n            for name in expected}\n\n\ndef proc_identity(raw):\n    opening, closing = raw.find(\"(\"), raw.rfind(\")\")\n    if opening < 1 or closing < opening:\n        raise ValueError(\"invalid proc stat framing\")\n    tail = raw[closing + 1:].split()\n    if len(tail) < 20:\n        raise ValueError(\"incomplete proc stat\")\n    return {\"pid\": int(raw[:opening].strip()), \"state\": tail[0],\n            \"ppid\": int(tail[1]), \"pgid\": int(tail[2]),\n            \"start_ticks\": int(tail[19])}\n\n\ndef read_proc(pid):\n    with (Path(\"/proc\") / str(pid) / \"stat\").open() as handle:\n        return proc_identity(handle.read(16385))\n\n\ndef scratch_fd():\n    identity = json.loads(os.environ[\"SCRATCH_IDENTITY\"])\n    path = os.environ[\"TMPDIR\"]\n    if path != identity[\"path\"]:\n        raise ValueError(\"scratch path differs from preparation\")\n    parent = os.open(identity[\"parent\"], os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n    try:\n        current = os.fstat(parent)\n        if [current.st_dev, current.st_ino, current.st_uid] != identity[\"parent_identity\"]:\n            raise ValueError(\"scratch parent identity changed\")\n        root = os.open(os.path.basename(path), os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,\n                       dir_fd=parent)\n    finally:\n        os.close(parent)\n    current = os.fstat(root)\n    if ([current.st_dev, current.st_ino, current.st_uid] != identity[\"root\"]\n            or current.st_uid != os.geteuid() or not stat.S_ISDIR(current.st_mode)):\n        os.close(root)\n        raise ValueError(\"scratch root identity changed\")\n    return root, identity\n\n\ndef prepare():\n    expected = json.loads((OUTPUT / \"source-pins.json\").read_text())\n    before = source_hashes()\n    if before != expected or len(before) != 412:\n        raise ValueError(\"O source pins differ\")\n    head, tree, parent = git(\"rev-parse\", \"HEAD\"), git(\"rev-parse\", \"HEAD^{tree}\"), git(\"rev-parse\", \"HEAD^\")\n    if (head != os.environ[\"GITHUB_SHA\"] or parent != SOURCE\n            or git(\"rev-parse\", SOURCE + \"^{tree}\") != SOURCE_TREE\n            or git(\"diff\", \"--name-only\", SOURCE, \"HEAD\") != \".github/workflows/pr-validation.yml\"\n            or git(\"status\", \"--porcelain\")):\n        raise ValueError(\"workflow-only O child binding differs\")\n    sentinel = OUTPUT / \"outside-sentinel.txt\"\n    sentinel.write_bytes(SENTINEL)\n    root, identity = scratch_fd()\n    try:\n        os.mkdir(\"nested\", mode=0o700, dir_fd=root)\n        nested = os.open(\"nested\", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=root)\n        try:\n            fd = os.open(\"payload.bin\", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,\n                         0o600, dir_fd=nested)\n            with os.fdopen(fd, \"wb\") as handle:\n                handle.write(PAYLOAD)\n            os.symlink(str(sentinel), \"external-link\", dir_fd=nested)\n        finally:\n            os.close(nested)\n    finally:\n        os.close(root)\n    write_json(\"prepared.json\", {\"control_only\": True, \"canonical_credit\": False,\n               \"application_executed\": False, \"source_sha\": SOURCE, \"source_tree\": SOURCE_TREE,\n               \"checkout_sha\": head, \"checkout_tree\": tree, \"parent\": parent,\n               \"workflow_sha256\": hashlib.sha256(Path(\".github/workflows/pr-validation.yml\").read_bytes()).hexdigest(),\n               \"run_id\": int(os.environ[\"GITHUB_RUN_ID\"]),\n               \"run_attempt\": int(os.environ[\"GITHUB_RUN_ATTEMPT\"]),\n               \"event_name\": os.environ[\"GITHUB_EVENT_NAME\"],\n               \"shared_deadline\": int(os.environ[\"TEST_JOB_DEADLINE\"]),\n               \"source_hashes_before\": before, \"scratch_identity\": identity,\n               \"payload_bytes\": len(PAYLOAD), \"payload_sha256\": hashlib.sha256(PAYLOAD).hexdigest(),\n               \"external_sentinel\": str(sentinel),\n               \"sentinel_sha256\": hashlib.sha256(SENTINEL).hexdigest(),\n               \"python\": platform.python_version(), \"platform\": platform.platform(),\n               \"prepared_epoch\": time.time()})\n\n\ndef worker(role):\n    fd = os.open(OUTPUT / (role + \"-events.jsonl\"), os.O_WRONLY | os.O_CREAT | os.O_APPEND | os.O_CLOEXEC, 0o600)\n    def emit(event):\n        row = {\"event\": event, \"role\": role, \"monotonic_ns\": time.monotonic_ns(),\n               \"epoch_ns\": time.time_ns(), \"identity\": read_proc(os.getpid())}\n        data = (json.dumps(row, separators=(\",\", \":\")) + \"\\n\").encode()\n        if os.write(fd, data) != len(data):\n            raise RuntimeError(\"incomplete event write\")\n    signal.signal(signal.SIGINT, lambda _signal, _frame: emit(\"SIGINT\"))\n    if role == \"parent\":\n        child = subprocess.Popen([sys.executable, \"-u\", __file__, \"child\"], stdin=subprocess.DEVNULL)\n        ready = time.monotonic() + 5\n        while not (OUTPUT / \"child-events.jsonl\").exists():\n            if child.poll() is not None or time.monotonic() >= ready:\n                raise RuntimeError(\"child did not become ready\")\n            time.sleep(0.01)\n    emit(\"ready\")\n    while True:\n        emit(\"heartbeat\")\n        time.sleep(1)\n\n\ndef observe(worker_status, tee_status):\n    result = {\"control_only\": True, \"canonical_credit\": False,\n              \"worker_exit\": worker_status, \"tee_exit\": tee_status, \"errors\": []}\n    try:\n        identities, grace = {}, {}\n        for role in (\"parent\", \"child\"):\n            data = (OUTPUT / (role + \"-events.jsonl\")).read_bytes()\n            if len(data) > 65536:\n                raise ValueError(\"event evidence exceeds bound\")\n            events = [json.loads(line) for line in data.splitlines()]\n            ready = [row for row in events if row[\"event\"] == \"ready\"]\n            signals = [row for row in events if row[\"event\"] == \"SIGINT\"]\n            hearts = [row for row in events if row[\"event\"] == \"heartbeat\"]\n            if len(ready) != 1 or not signals or not hearts:\n                raise ValueError(\"missing readiness, INT, or heartbeat evidence\")\n            identity = ready[0][\"identity\"]\n            for row in events:\n                if any(row[\"identity\"][key] != identity[key] for key in (\"pid\", \"pgid\", \"start_ticks\")):\n                    raise ValueError(\"process identity changed within event stream\")\n            identities[role] = identity\n            grace[role] = (hearts[-1][\"monotonic_ns\"] - signals[0][\"monotonic_ns\"]) / 1e9\n        if (identities[\"parent\"][\"pgid\"] != identities[\"child\"][\"pgid\"]\n                or identities[\"parent\"][\"pid\"] != identities[\"child\"][\"ppid\"]\n                or any(value < 28 for value in grace.values())):\n            raise ValueError(\"same-group parent/child INT grace is not proved\")\n        stop = min(time.monotonic() + 5,\n                   time.monotonic() + int(os.environ[\"TEST_JOB_DEADLINE\"]) - 360 - time.time())\n        remaining = []\n        while True:\n            remaining = []\n            for item in Path(\"/proc\").iterdir():\n                if not item.name.isdecimal():\n                    continue\n                try:\n                    current = read_proc(int(item.name))\n                except FileNotFoundError:\n                    continue\n                if current[\"pgid\"] == identities[\"parent\"][\"pgid\"]:\n                    remaining.append(current)\n            if not remaining or time.monotonic() >= stop:\n                break\n            time.sleep(0.1)\n        result.update(process_identities=identities, post_int_heartbeat_seconds=grace,\n                      remaining_group_members=remaining)\n        if remaining:\n            raise ValueError(\"worker process group remains present\")\n        root, identity = scratch_fd()\n        try:\n            nested = os.open(\"nested\", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=root)\n            try:\n                fd = os.open(\"payload.bin\", os.O_RDONLY | os.O_NOFOLLOW, dir_fd=nested)\n                with os.fdopen(fd, \"rb\") as handle:\n                    if handle.read(len(PAYLOAD) + 1) != PAYLOAD:\n                        raise ValueError(\"nonempty payload changed\")\n                if os.readlink(\"external-link\", dir_fd=nested) != str(OUTPUT / \"outside-sentinel.txt\"):\n                    raise ValueError(\"internal symlink changed\")\n            finally:\n                os.close(nested)\n        finally:\n            os.close(root)\n        if (OUTPUT / \"outside-sentinel.txt\").read_bytes() != SENTINEL:\n            raise ValueError(\"external sentinel changed\")\n        after = source_hashes()\n        if after != json.loads((OUTPUT / \"source-pins.json\").read_text()):\n            raise ValueError(\"source pins changed\")\n        result.update(scratch_identity=identity, scratch_nonempty_after_worker=True,\n                      sentinel_sha256=hashlib.sha256(SENTINEL).hexdigest(),\n                      source_hashes_after=after, source_valid=True,\n                      observed_epoch=time.time())\n        if worker_status != 137 or tee_status != 0:\n            raise ValueError(\"expected forced timeout 137 with successful tee\")\n    except Exception as exc:\n        result[\"errors\"].append({\"type\": type(exc).__name__, \"message\": str(exc)})\n    write_json(\"pre-cleanup.json\", result)\n    if result[\"errors\"]:\n        raise SystemExit(1)\n\n\nif __name__ == \"__main__\":\n    mode = sys.argv[1]\n    if mode == \"prepare\":\n        prepare()\n    elif mode in (\"parent\", \"child\"):\n        worker(mode)\n    elif mode == \"observe\":\n        observe(int(sys.argv[2]), int(sys.argv[3]))\n    else:\n        raise ValueError(\"unsupported control phase\")\nCONTROL\ntest_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds > 1350 )); then test_seconds=1350; fi\nprintf '{\"available_worker_seconds\":%s,\"worker_limit_seconds\":10,\"kill_grace_seconds\":30,\"shared_reserve_seconds\":450,\"post_observation_limit_seconds\":8,\"post_observation_kill_grace_seconds\":1}\n' \"$test_seconds\" > \"$out/control.json\"\nif (( test_seconds < 10 )); then exit 124; fi\nif [[ \"$GITHUB_EVENT_NAME\" != \"workflow_dispatch\" || \"$DIAGNOSTIC_PROFILE_MODE\" != \"none\" || \"$CONTROL_ARCH\" != \"arm64\" || \"$CONTROL_SCRATCH\" != \"disk\" ]]; then exit 2; fi\nprepare_seconds=$(( test_seconds - 1 ))\nif (( prepare_seconds > 29 )); then prepare_seconds=29; fi\ntimeout --signal=TERM --kill-after=1s \"${prepare_seconds}s\" .venv/bin/python -u \"$out/control.py\" prepare\ntest_seconds=$(( TEST_JOB_DEADLINE - $(date +%s) - 450 ))\nif (( test_seconds < 10 )); then exit 124; fi\nset +e\ntimeout --signal=INT --kill-after=30s 10s .venv/bin/python -u \"$out/control.py\" parent 2>&1 | tee \"$out/worker.log\"\ntest_statuses=(\"${PIPESTATUS[@]}\")\nworker_status=${test_statuses[0]}\ntee_status=${test_statuses[1]}\nprintf '%s\n' \"$worker_status\" > \"$out/worker-exit-code.txt\"\nprintf '%s\n' \"$tee_status\" > \"$out/tee-exit-code.txt\"\ntimeout --signal=TERM --kill-after=1s 8s .venv/bin/python -u \"$out/control.py\" observe \"$worker_status\" \"$tee_status\"\nobserve_status=$?\nprintf '%s\n' \"$observe_status\" > \"$out/observe-exit-code.txt\"\ntest_status=$worker_status\nif (( tee_status != 0 )); then test_status=$tee_status; fi\nif (( observe_status != 0 )); then test_status=$observe_status; fi\nprintf '%s\n' \"$test_status\" > \"$out/exit-code.txt\"\nexit \"$test_status\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "if": "always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')",
          "with": {
            "name": "${{ github.event_name == 'workflow_dispatch' && format('timing-diagnostic-{0}-{1}', inputs.arch, inputs.scratch) || 'timing-diagnostic' }}",
            "path": "${{ runner.temp }}/timing-diagnostic",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Remove diagnostic scratch storage",
          "if": "always() && steps.scratch.outputs.directory != ''",
          "env": {
            "SCRATCH": "${{ steps.scratch.outputs.directory }}",
            "SCRATCH_IDENTITY": "${{ steps.scratch.outputs.identity }}",
            "MEMORY": "${{ inputs.scratch == 'memory' }}"
          },
          "run": "if [[ \"$MEMORY\" == \"true\" ]]; then\n  if mountpoint -q \"$SCRATCH\"; then\n    sudo umount \"$SCRATCH\"\n  fi\n  rmdir \"$SCRATCH\"\nelse\n  printf 'Diagnostic scratch cleanup path=%s identity=%s\\n' \"$SCRATCH\" \"$SCRATCH_IDENTITY\"\n  cleanup_seconds=\"$(python - <<'PY'\nimport os, time\nremaining = int(os.environ[\"TEST_JOB_DEADLINE\"]) - 360 - time.time()\nwork_ms = min(28000, int((remaining - 2) * 1000))\nif work_ms <= 0:\n    raise SystemExit(\"No diagnostic scratch cleanup budget remains before cancellation reserve\")\nprint(f\"{work_ms / 1000:.3f}\")\nPY\n  )\"\n  timeout --signal=TERM --kill-after=2s \"${cleanup_seconds}s\" python -u - <<'PY'\nimport json, os, re, shutil, stat, time\nrecord = json.loads(os.environ[\"SCRATCH_IDENTITY\"])\npath = os.environ[\"SCRATCH\"]\nparent = record[\"parent\"]\nname = os.path.basename(path)\nstop = int(os.environ[\"TEST_JOB_DEADLINE\"]) - 360\nif time.time() >= stop - 2:\n    raise RuntimeError(\"Diagnostic scratch cleanup window expired\")\nif (not os.path.isabs(path) or path != record[\"path\"]\n        or os.path.dirname(path) != parent or os.path.realpath(parent) != parent\n        or not re.fullmatch(r\"story-timing\\.[A-Za-z0-9]{8}\", name)):\n    raise RuntimeError(\"Diagnostic scratch path identity changed\")\nif not shutil.rmtree.avoids_symlink_attacks:\n    raise RuntimeError(\"Symlink-resistant diagnostic cleanup is unavailable\")\nfd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\ntry:\n    outer = os.fstat(fd)\n    if [outer.st_dev, outer.st_ino, outer.st_uid] != record[\"parent_identity\"]:\n        raise RuntimeError(\"Diagnostic scratch parent identity changed\")\n    inner = os.stat(name, dir_fd=fd, follow_symlinks=False)\n    if (not stat.S_ISDIR(inner.st_mode) or inner.st_uid != os.geteuid()\n            or inner.st_dev != outer.st_dev\n            or [inner.st_dev, inner.st_ino, inner.st_uid] != record[\"root\"]):\n        raise RuntimeError(\"Diagnostic scratch directory identity changed\")\n    with open(\"/proc/self/mountinfo\", encoding=\"utf-8\") as mounts:\n        for line in mounts:\n            mount = line.split()[4]\n            for escaped, decoded in ((r\"\\040\", \" \"), (r\"\\011\", \"\\t\"), (r\"\\012\", \"\\n\"), (r\"\\134\", chr(92))):\n                mount = mount.replace(escaped, decoded)\n            if mount == path or mount.startswith(path + os.sep):\n                raise RuntimeError(\"Mounted diagnostic scratch storage cannot be recursively removed\")\n    current = os.stat(name, dir_fd=fd, follow_symlinks=False)\n    if ([current.st_dev, current.st_ino, current.st_uid] != record[\"root\"]\n            or not stat.S_ISDIR(current.st_mode) or time.time() >= stop - 2):\n        raise RuntimeError(\"Diagnostic scratch identity or cleanup window changed\")\n    shutil.rmtree(name, dir_fd=fd)\n    try:\n        os.stat(name, dir_fd=fd, follow_symlinks=False)\n    except FileNotFoundError:\n        print(json.dumps({\"diagnostic_scratch_removed\": record}, sort_keys=True), flush=True)\n    else:\n        raise RuntimeError(\"Diagnostic scratch path remains after cleanup\")\nfinally:\n    os.close(fd)\nPY\nfi\n"
        }
