name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      arch:
        description: Diagnostic-only standard runner architecture
        type: choice
        options: [x64, arm64]
        default: x64
      scratch:
        description: Diagnostic-only temporary filesystem
        type: choice
        options: [disk, memory]
        default: disk

      test_id:
        description: Diagnostic-only exact canonical test ID
        type: string
        default: tests.test_artifact_objectives.ArtifactObjectiveContractTests.test_projection_retains_satisfaction_across_later_apply_commit_cycles

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-diagnostic-{1}-{2}-{3}', github.workflow, github.ref, inputs.arch, inputs.scratch) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_ref || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - classification skipped' || 'Classify changed paths' }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      policy_only: ${{ steps.paths.outputs.policy_only }}
      full: ${{ steps.paths.outputs.full }}
      wall_time_exception: ${{ steps.paths.outputs.wall_time_exception }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      checkout_sha: ${{ steps.paths.outputs.checkout_sha }}
    steps:
      - name: Classify paths and select runtime evidence
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let files = [];
            let labels = [];
            let baseSha;
            let headSha;
            let truncated = false;

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
              labels = pr.labels.map(label => label.name);
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              truncated = files.length >= 3000;
            } else {
              const group = context.payload.merge_group;
              baseSha = group.base_sha;
              headSha = group.head_sha;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${headSha}`, per_page: 100,
              });
              files = comparison.data.files || [];
              // A full page may hide later files. Fail closed rather than infer a partial diff.
              truncated = !Array.isArray(comparison.data.files) || files.length >= 100;
            }

            const paths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean));
            const isRuntime = path =>
              path.startsWith("src/") ||
              path.startsWith("config/") ||
              path === "pyproject.toml" ||
              path === "uv.lock" ||
              path === "MANIFEST.in" ||
              path === ".gitmodules" ||
              path === "vendor/generic-rag" ||
              path === "vendor/jsonl-viewer";
            const runtimePaths = truncated || paths.some(isRuntime);
            const isTest = path => path.startsWith("tests/") ||
              path === ".github/workflows/pr-validation.yml" || path === "TEST_POLICY.md";
            const testPaths = truncated || paths.some(isTest);
            const fullRequested = labels.includes("test:full");
            const wallTimeException = context.eventName === "pull_request" && labels.includes("test:wall-time-exception");
            const runtime = runtimePaths || testPaths || fullRequested;
            const full = runtime;
            core.setOutput("runtime", String(runtime));
            core.setOutput("policy_only", String(!runtimePaths && !testPaths));
            core.setOutput("full", String(full));
            core.setOutput("wall_time_exception", String(wallTimeException));
            core.setOutput("base_sha", baseSha);
            core.setOutput("head_sha", headSha);
            // Event SHA is the PR test merge or merge-group commit, pinned across jobs.
            core.setOutput("checkout_sha", context.sha);
            core.summary
              .addHeading("Validation selection")
              .addTable([
                [{data: "Runtime paths", header: true}, String(runtimePaths)],
                [{data: "Policy/config only", header: true}, String(!runtimePaths)],
                [{data: "Run runtime lanes", header: true}, String(runtime)],
                [{data: "Full suite", header: true}, String(full)],
                [{data: "Wall-time exception", header: true}, String(wallTimeException)],
              ])
              .write();

  static:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - static validation skipped' || 'Static validation' }}
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Parse repository configuration
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob("**/*.toml"):
              if ".git" not in path.parts:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
                  if path.parent == pathlib.Path(".codex/agents"):
                      if data.get("name") != path.stem:
                          raise SystemExit(f"{path}: agent name must match filename")
                      for field in ("description", "developer_instructions"):
                          value = data.get(field)
                          if not isinstance(value, str) or not value.strip():
                              raise SystemExit(f"{path}: missing {field}")
          for path in pathlib.Path(".").glob("**/*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in (*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tests").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec", dont_inherit=True)
          PY
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
          ruby -ryaml -ropen3 <<'RB'
          Dir[".agents/skills/*/SKILL.md"].each do |path|
            source = File.read(path)
            match = source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
            abort "#{path}: missing YAML frontmatter" unless match
            data = YAML.safe_load(match[1], aliases: false)
            abort "#{path}: name must match directory and description must be nonempty" unless
              data.is_a?(Hash) && data["name"] == File.basename(File.dirname(path)) &&
              data["description"].is_a?(String) && !data["description"].strip.empty?
          end
          issue_path = ".github/ISSUE_TEMPLATE/work_item.md"
          issue_source = File.read(issue_path)
          issue_match = issue_source.match(/\A---\r?\n(.*?)\r?\n---(?:\r?\n|\z)/m)
          abort "#{issue_path}: missing YAML frontmatter" unless issue_match
          issue = YAML.safe_load(issue_match[1], aliases: false)
          abort "#{issue_path}: invalid frontmatter mapping" unless issue.is_a?(Hash)
          %w[name about title labels assignees].each do |field|
            value = issue[field]
            abort "#{issue_path}: missing or non-string #{field}" unless value.is_a?(String)
          end
          %w[name about].each do |field|
            abort "#{issue_path}: empty #{field}" if issue[field].strip.empty?
          end
          Dir[".github/workflows/*.{yml,yaml}"].each do |path|
            document = YAML.safe_load(File.read(path), aliases: false)
            document.fetch("jobs").each do |job_name, job|
              job.fetch("steps", []).each do |step|
                script = step["with"]&.fetch("script", nil)
                next unless script
                _, error, status = Open3.capture3(
                  "node", "--input-type=module", "--check",
                  stdin_data: "async function main() {\n#{script}\n}")
                abort "#{path} #{job_name}: #{error}" unless status.success?
              end
            end
          end
          RB
      - name: Validate runner metadata
        run: |
          python -B - <<'PY'
          from tests import suite_policy

          suite_policy.load_timing_weights()
          ids = suite_policy.FAST_TEST_IDS
          if not ids or len(ids) != len(set(ids)):
              raise SystemExit("fast tier must contain unique test IDs")
          if any(not identifier.rsplit(".", 1)[-1].startswith("test") for identifier in ids):
              raise SystemExit("fast tier contains a non-test method ID")
          PY
      - name: Validate locked vendor pins
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          if Path("MANIFEST.in").read_text(encoding="utf-8") != "prune vendor/jsonl-viewer\n":
              raise SystemExit("MANIFEST.in must exclude vendored jsonl-viewer source")

          with open("uv.lock", "rb") as source:
              packages = {package["name"]: package for package in tomllib.load(source)["package"]}
          for name in ("generic-rag", "jsonl-viewer"):
              pinned = packages[name]["source"]["git"].rsplit("#", 1)[-1]
              gitlink = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:vendor/{name}"], text=True
              ).strip()
              if pinned != gitlink:
                  raise SystemExit(f"{name}: uv.lock pin {pinned} differs from gitlink {gitlink}")
          PY
      - name: Validate policy artifacts
        run: |
          python - <<'PY'
          import pathlib

          root = pathlib.Path.cwd()
          templates = {
              ".github/ISSUE_TEMPLATE/work_item.md": [
                  "## Objective", "## Use cases and expected results",
                  "## Implementation summary", "## Acceptance criteria",
                  "## Boundaries and dependencies",
                  "## Related work and verification plan", "## Implementation plan",
              ],
              ".github/pull_request_template.md": [
                  "## What changed", "## Before and after", "## Implementation",
                  "## Verification", "## Limitations and follow-ups",
                  "## Related Issue",
              ],
              ".github/templates/evidence.md": [
                  "## What this demonstrates", "## Scenario results",
                  "## Reproduction and environment", "## Failures and coverage gaps",
                  "## Technical provenance and artifacts", "## Assessment",
              ],
              ".github/templates/working-status-comment.md": [
                  "## Current status", "## What works now", "## What remains",
                  "## Blocker or decision", "## Next step", "## Evidence links",
              ],
          }
          for relative, expected in templates.items():
              text = (root / relative).read_text(encoding="utf-8")
              actual = [line for line in text.splitlines() if line.startswith("## ")]
              if actual != expected:
                  raise SystemExit(f"{relative}: template headings changed: {actual!r}")

          agents = {path.name for path in (root / ".codex/agents").glob("*.toml")}
          if agents != {"runtime_implementer.toml", "test_engineer.toml"}:
              raise SystemExit(f"unexpected development agents: {sorted(agents)!r}")
          required = [
              root / ".agents/skills/project-workflow/SKILL.md",
              root / ".codex/agents/runtime_implementer/PYTHON_MODULARITY_POLICY.md",
          ]
          if any(not path.is_file() for path in required):
              raise SystemExit("required simplified workflow artifact is missing")
          forbidden = [
              root / ".agents/skills/adaptive-verification/SKILL.md",
              root / ".agents/skills/subagent-model-selection/SKILL.md",
              root / "tests/test_repository_agent_policy.py",
          ]
          if any(path.exists() for path in forbidden):
              raise SystemExit("retired policy artifact still exists")
          if len((root / "PYTHON_MODULE_INDEX.md").read_text(encoding="utf-8").splitlines()) > 300:
              raise SystemExit("PYTHON_MODULE_INDEX.md exceeds 300 lines")
          PY

  fast:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - fast tier skipped' || 'Runtime fast tier' }}
    needs: classify
    if: needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Run fast runtime tests
        run: PYTHONPATH=src .venv/bin/python -m tests.runner run --tier fast --json "$RUNNER_TEMP/fast.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-fast
          path: ${{ runner.temp }}/fast.json
          if-no-files-found: warn

  full:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - full suite skipped' || format('Full runtime shard {0}/4', matrix.shard) }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: ${{ needs.classify.outputs.wall_time_exception == 'true' && 60 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - name: Install runtime test dependencies
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure deterministic test Git identity
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Run full runtime shard
        run: PYTHONPATH=src .venv/bin/python -m tests.runner run --shard "${{ matrix.shard }}/4" --json "$RUNNER_TEMP/full-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: ${{ runner.temp }}/full-${{ matrix.shard }}.json
          if-no-files-found: error

  reconcile-full:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Diagnostic only - reconciliation skipped' || 'Reconcile full runtime suite' }}
    needs: [classify, full]
    if: >-
      always() && needs.classify.outputs.full == 'true' &&
      (needs.full.result == 'success' || needs.full.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.classify.outputs.checkout_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: full-reports
      - name: Reconcile shard evidence
        run: >-
          PYTHONPATH=src python -m tests.runner reconcile
          full-reports/full-1/full-1.json
          full-reports/full-2/full-2.json
          full-reports/full-3/full-3.json
          full-reports/full-4/full-4.json
          --json "$RUNNER_TEMP/full-reconciled.json"
      - name: Enforce frozen suite inventory and wall-time budget
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          WALL_TIME_EXCEPTION: ${{ needs.classify.outputs.wall_time_exception }}
        run: |
          budget_args=(--base-ref "$BASE_SHA"
            --report full-reports/full-1/full-1.json
            --report full-reports/full-2/full-2.json
            --report full-reports/full-3/full-3.json
            --report full-reports/full-4/full-4.json)
          if [[ "$WALL_TIME_EXCEPTION" == "true" ]]; then
            echo "Maintainer-authorized wall-time exception: measured durations remain visible."
            budget_args+=(--allow-wall-time-overage)
          fi
          PYTHONPATH=src python -m tests.suite_budget "${budget_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-full-reconciled
          path: ${{ runner.temp }}/full-reconciled.json
          if-no-files-found: warn

  diagnose-full-budget:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Diagnostic only ({0}, {1})', inputs.arch, inputs.scratch) || 'Diagnose full-suite timing failure' }}
    needs: [classify, full, reconcile-full]
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.full.result == 'success' && needs.reconcile-full.result == 'failure'))
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.classify.outputs.checkout_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          pattern: full-*
          path: ${{ runner.temp }}/diagnostic-inputs
      - name: Select actual timing failures
        if: github.event_name != 'workflow_dispatch'
        id: timing
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tests.suite_budget import load_budget
          root = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-inputs"
          reports = [json.loads((root / f"full-{i}" / f"full-{i}.json").read_text()) for i in (1, 2, 3, 4)]
          budget = load_budget()
          seconds = [report["durations"]["wall_seconds"] for report in reports]
          over = sum(seconds) > budget["max_sequential_wall_seconds"] or max(seconds) > budget["max_shard_wall_seconds"]
          selected = over and all(report["outcome"] == "success" for report in reports)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"selected={str(selected).lower()}\n")
          PY
      - name: Install diagnostic dependencies
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        run: uv sync --locked --all-extras --python 3.11 --no-progress
      - name: Configure diagnostic test Git identity
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        run: |
          git config --global user.name "Story Tests"
          git config --global user.email "story-tests@example.invalid"
      - name: Prepare diagnostic scratch storage
        if: github.event_name == 'workflow_dispatch'
        id: scratch
        env:
          MEMORY: ${{ inputs.scratch == 'memory' }}
        run: |
          scratch="$(mktemp -d "${TMPDIR:-/tmp}/story-timing.XXXXXXXX")"
          echo "directory=$scratch" >> "$GITHUB_OUTPUT"
          if [[ "$MEMORY" == "true" ]]; then
            sudo mount -t tmpfs -o "size=2G,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$scratch"
          fi
      - name: Profile one existing canonical scenario
        if: github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true'
        env:
          GIT_AUTHOR_NAME: Story Tests
          GIT_AUTHOR_EMAIL: story-tests@example.invalid
          GIT_COMMITTER_NAME: Story Tests
          GIT_COMMITTER_EMAIL: story-tests@example.invalid
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          DIAGNOSTIC_TEST_ID: ${{ inputs.test_id || 'tests.test_artifact_objectives.ArtifactObjectiveContractTests.test_projection_retains_satisfaction_across_later_apply_commit_cycles' }}
          TMPDIR: ${{ steps.scratch.outputs.directory || '/tmp' }}
        run: |
          .venv/bin/python - <<'PY'
          import collections, cProfile, functools, hashlib, json, os, platform, pstats, re, subprocess, sysconfig, tempfile, time
          from pathlib import Path
          from story_writing_agents.git import process, session_resources
          from tests import runner

          """Private passive observation of one existing budget test's failed subTests.

          Inert until Root supplies its already-imported runner result class to install().
          No project imports, test/helper/owner calls, trace/profile hooks, or launch code.
          """
          from enum import Enum
          from pathlib import Path
          import hashlib
          import json


          CANONICAL_ID = (
              'tests.test_lead_orchestration.LeadBudgetFinalizationTests.'
              'test_budget_notice_preserves_maximum_utf8_synthesis'
          )
          EXPECTED_HEAD = '84184eec04de21b80dde26f0ab18d5c0eac7140e'
          EXPECTED_MANIFEST = 'ecfd70cc36ddef51f00a97cc1675e74f1d0ff3ef843d79367c17eb2f4b7cbcfc'
          SOURCE_PINS = {
              'tests/runner.py': (
                  '018a8534d83420ece7d3dea6f1368b4408445f59ae6fc248775ac43a3eda1e76'
              ),
              'tests/test_lead_orchestration.py': (
                  '1fbe2f44423f6481cce77037a965710776d87eb76d5331e2cce054e099c4f98b'
              ),
              'src/story_writing_agents/conversations/context.py': (
                  'c178f16d88700bd177ca0ef8cecb2a4e552f329c9f37cefc6c54596fbbae2882'
              ),
              'src/story_writing_agents/conversations/events.py': (
                  'dd4d4f43560c9203af059db4eafcf14fa5dd5b067477426897943d7eebc79f71'
              ),
              'src/story_writing_agents/conversations/__init__.py': (
                  'd4d7c3447a2e16a4ae1263cb656b07abb952da370272c109452f848b452a196a'
              ),
          }
          FRAME_QUALNAME = 'LeadBudgetFinalizationTests._budget_consultation'
          FRAME_FIRST_LINE = 5230
          ASSERT_LINE = 5328
          MAX_RECORDS = 3
          MAX_HISTORY = 32
          MAX_DETAILS = 16
          MAX_DETAIL_CHARS = 4096
          MAX_OUTPUT_BYTES = 65536
          AGENTS = ('lead_orchestrator', 'plot_architect', 'character_custodian', 'execution_specialist')
          CONVERSATIONS = 'story_writing_agents.conversations'


          def _get(value, name):
              return object.__getattribute__(value, name)


          def _typed(value, name, module=CONVERSATIONS):
              actual = type(value)
              return actual.__module__ == module and actual.__qualname__ == name


          def _token(value, maximum=128):
              if type(value) is not str or not value or len(value) > maximum or not value.isascii():
                  raise ValueError('metadata_type')
              if not all(c.isalnum() or c in '_.:@/-' for c in value):
                  raise ValueError('metadata_alphabet')
              return value


          def _enum(value):
              if value is None:
                  return None
              if not isinstance(value, Enum):
                  raise TypeError('metadata_enum')
              return _token(value.value, 96)


          def _integer(value, maximum=1000000):
              if type(value) is not int or not 0 <= value <= maximum:
                  raise TypeError('metadata_integer')
              return value


          def _optional_id(value):
              return None if value is None else _token(value)


          def _details(value):
              if type(value) is not tuple or any(type(v) is not str for v in value):
                  raise TypeError('validation_details_type')
              kept, used = [], 0
              for item in value[:MAX_DETAILS]:
                  remaining = MAX_DETAIL_CHARS - used
                  if remaining <= 0:
                      break
                  kept.append(item[:remaining])
                  used += len(kept[-1])
              return {'items': kept, 'count': len(value),
                      'truncated': len(kept) != len(value) or sum(map(len, value)) != used}


          def _unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate_notice_member')
                  result[key] = value
              return result


          def _reject_constant(_value):
              raise ValueError('nonfinite_notice_value')


          def _notice(message, origin):
              """Copy only a strict, bounded, runtime-authored structured notice whitelist."""
              if type(message) is not str:
                  raise TypeError('message_type')
              size = len(message.encode('utf-8'))
              omitted = {'utf8_bytes': size, 'structured_notice': None}
              if origin != 'runtime_fallback' or size > 4096:
                  return omitted
              try:
                  value = json.loads(message, object_pairs_hook=_unique_object,
                                     parse_constant=_reject_constant)
                  allowed = {'code', 'language', 'state', 'paths', 'task_revisions'}
                  if type(value) is not dict or not value.keys() <= allowed or 'code' not in value:
                      return omitted
                  result = {'code': _token(value['code'], 96)}
                  for key in ('language', 'state'):
                      if key in value:
                          result[key] = None if value[key] is None else _token(value[key], 96)
                  if 'paths' in value:
                      paths = value['paths']
                      if type(paths) is not list or len(paths) > 16:
                          return omitted
                      if any(type(v) is not str or not v.startswith('$') or len(v) > 256
                             or not v.isascii() or any(ord(c) < 32 for c in v) for v in paths):
                          return omitted
                      result['paths'] = paths
                  if 'task_revisions' in value:
                      rows = value['task_revisions']
                      if type(rows) is not list or len(rows) > 8:
                          return omitted
                      result['task_revisions'] = []
                      for row in rows:
                          if type(row) is not dict or set(row) != {'task_id', 'task_revision'}:
                              return omitted
                          result['task_revisions'].append({
                              'task_id': _token(row['task_id']),
                              'task_revision': _integer(row['task_revision'], 65535)})
                  return {'utf8_bytes': size, 'structured_notice': result}
              except (TypeError, ValueError, UnicodeError, RecursionError):
                  return omitted


          def _turn(value):
              if not _typed(value, 'LeadTurnResult'):
                  raise TypeError('turn_type')
              trace = _get(value, 'trace')
              if trace is not None and not _typed(trace, 'ReplyTrace', 'story_writing_agents.reply_trace'):
                  raise TypeError('trace_type')
              origin = None if trace is None else _enum(_get(trace, 'origin'))
              result = {key: _optional_id(_get(value, key)) for key in (
                  'session_id', 'conversation_id', 'turn_id', 'step_id', 'provider_invocation_id')}
              result.update(kind=_enum(_get(value, 'kind')), state=_enum(_get(value, 'state')),
                            next_action=_enum(_get(value, 'next_action')), trace_origin=origin,
                            validation_details=_details(_get(value, 'validation_details')),
                            runtime_notice=_notice(_get(value, 'message'), origin))
              result['presence'] = {key: _get(value, key) is not None for key in (
                  'proposal', 'confirmation_request_id', 'artifact_proposal',
                  'artifact_application_request', 'story_commit_request', 'recommendation_request')}
              return result


          def _history(events):
              if type(events) is not tuple:
                  raise TypeError('history_type')
              rows = []
              for event in events[-MAX_HISTORY:]:
                  if not _typed(event, 'CollaborationEvent'):
                      raise TypeError('event_type')
                  payload = _get(event, 'payload')
                  row = {'kind': _enum(_get(event, 'kind'))}
                  if _typed(payload, 'CollaborationProviderCallPayload'):
                      row.update(category='provider_call',
                                 invocation_id=_token(_get(payload, 'invocation_id')),
                                 call_id=_token(_get(payload, 'call_id')),
                                 ordinal=_integer(_get(payload, 'ordinal')),
                                 role=_token(_get(payload, 'role')),
                                 invocation_kind=_enum(_get(payload, 'invocation_kind')),
                                 call_kind=_enum(_get(payload, 'call_kind')),
                                 state=_enum(_get(payload, 'state')))
                  elif _typed(payload, 'CollaborationStepStatePayload'):
                      row.update(category='step_state', state=_enum(_get(payload, 'state')))
                  elif _typed(payload, 'CollaborationExecutionResult'):
                      outcomes = _get(payload, 'assignment_outcomes')
                      if type(outcomes) is not tuple or len(outcomes) > 3:
                          raise TypeError('outcome_type')
                      safe = []
                      for outcome in outcomes:
                          if not _typed(outcome, 'CollaborationAssignmentOutcome'):
                              raise TypeError('assignment_outcome_type')
                          safe.append({'assignment_id': _token(_get(outcome, 'assignment_id')),
                                       'outcome': _enum(_get(outcome, 'outcome')),
                                       'submitted_physical_calls': _integer(
                                           _get(outcome, 'submitted_physical_calls'))})
                      row.update(category='execution_result', assignment_outcomes=safe,
                                 synthesis_outcome=_enum(_get(payload, 'synthesis_outcome')),
                                 synthesis_submitted_physical_calls=_integer(
                                     _get(payload, 'synthesis_submitted_physical_calls')),
                                 overall_outcome=_enum(_get(payload, 'overall_outcome')))
                  rows.append(row)
              return {'event_count': len(events), 'tail': rows, 'tail_truncated': len(events) > MAX_HISTORY}


          def _queues(test):
              backend = _get(test, 'backend')
              if not _typed(backend, '_LeadBackend', 'tests.test_lead_orchestration'):
                  raise TypeError('backend_type')
              groups = _get(backend, 'scripts_by_agent')
              if type(groups) is not dict:
                  raise TypeError('queue_type')
              sizes = {}
              for agent in AGENTS:
                  remaining = groups.get(agent, [])
                  if type(remaining) is not list:
                      raise TypeError('actor_queue_type')
                  sizes[agent] = len(remaining)
              calls, references = _get(backend, 'calls'), _get(backend, 'reference_calls')
              if type(calls) is not list or type(references) is not list:
                  raise TypeError('call_list_type')
              return {'remaining_actor_group_counts': sizes, 'backend_call_count': len(calls),
                      'reference_call_count': len(references)}


          class BudgetSubtestObserver:
              """Root-owned install/finalize lifecycle; no execution or hooks at import."""

              def __init__(self, checkout_root, output_path, runner_argv):
                  self.root = Path(checkout_root)
                  self.output_path = Path(output_path)
                  self.argv = tuple(runner_argv)
                  self.valid = True
                  self.errors = []
                  self.records = []
                  self.nonmatching_failed_subtests = 0
                  self._result_class = None
                  self._original = None
                  self._wrapper = None
                  self._helper_filename = None
                  self._installed = False
                  self._finalized = False
                  self._runner_returned = False

              def _invalidate(self, code):
                  self.valid = False
                  if code not in self.errors and len(self.errors) < 8:
                      self.errors.append(code)

              def _write(self):
                  try:
                      value = {'schema_version': 1, 'canonical_id': CANONICAL_ID,
                               'pinned_source_base_head': EXPECTED_HEAD,
                               'pinned_source_base_manifest_sha256': EXPECTED_MANIFEST,
                               'valid': self.valid, 'errors': list(self.errors),
                               'incomplete': not (self._finalized and self._runner_returned),
                               'finalized': self._finalized, 'runner_returned': self._runner_returned,
                               'completion_meaning': (
                                   'observer lifecycle only; canonical report owns test outcome'),
                               'nonmatching_failed_subtests': self.nonmatching_failed_subtests,
                               'record_count': len(self.records), 'records': self.records}
                      encoded = json.dumps(value, sort_keys=True, ensure_ascii=True).encode('utf-8')
                      if len(encoded) > MAX_OUTPUT_BYTES:
                          self._invalidate('output_size')
                          value.update(valid=False, errors=list(self.errors), records=[],
                                       records_omitted_for_size=True)
                          encoded = json.dumps(value, sort_keys=True).encode('utf-8')
                      temporary = self.output_path.with_suffix(self.output_path.suffix + '.tmp')
                      temporary.write_bytes(encoded)
                      temporary.replace(self.output_path)
                  except BaseException:
                      self._invalidate('output_io')

              def install(self, result_class):
                  try:
                      self.root = self.root.resolve(strict=True)
                      self.output_path = self.output_path.resolve()
                      if self.root in self.output_path.parents or not self.output_path.parent.is_dir():
                          raise ValueError('output_location')
                      if (len(self.argv) != 5 or self.argv[:3] != ('run', '--id', CANONICAL_ID)
                              or self.argv[3] != '--json'
                              or Path(self.argv[4]).name != 'instrumented-run.json'):
                          raise ValueError('argv')
                      for relative, expected in SOURCE_PINS.items():
                          if hashlib.sha256((self.root / relative).read_bytes()).hexdigest() != expected:
                              raise ValueError('source_pin')
                      original = result_class.__dict__['addSubTest']
                      code = original.__code__
                      if (result_class.__module__ != 'tests.runner'
                              or result_class.__qualname__ != 'TimedTextTestResult'
                              or code.co_qualname != 'TimedTextTestResult.addSubTest'
                              or code.co_filename != str(self.root / 'tests/runner.py')
                              or code.co_firstlineno != 308 or code.co_argcount != 4):
                          raise ValueError('result_seam')
                      self._helper_filename = str(self.root / 'tests/test_lead_orchestration.py')
                      self._result_class, self._original = result_class, original

                      def observed(result, test, subtest, err):
                          returned = original(result, test, subtest, err)
                          try:
                              self._capture(test, err)
                          except BaseException:
                              try:
                                  self._invalidate('capture_error')
                                  self._write()
                              except BaseException:
                                  pass
                          return returned

                      self._wrapper = observed
                      result_class.addSubTest = observed
                      self._installed = True
                  except BaseException:
                      self._invalidate('install_guard')
                  self._write()
                  return self._installed

              def _capture(self, test, err):
                  if err is None:
                      return
                  test_type = type(test)
                  identifier = (test_type.__module__ + '.' + test_type.__qualname__ + '.'
                                + _get(test, '_testMethodName'))
                  if identifier != CANONICAL_ID:
                      return
                  if type(err) is not tuple or len(err) != 3:
                      raise TypeError('error_tuple')
                  current, found, depth = err[2], None, 0
                  while current is not None and depth < 64:
                      code = current.tb_frame.f_code
                      if (code.co_filename == self._helper_filename
                              and code.co_qualname == FRAME_QUALNAME
                              and code.co_firstlineno == FRAME_FIRST_LINE
                              and current.tb_lineno == ASSERT_LINE):
                          if found is not None:
                              raise ValueError('ambiguous_target_frame')
                          found = current.tb_frame
                      current, depth = current.tb_next, depth + 1
                  if current is not None:
                      raise ValueError('traceback_bound')
                  if found is None:
                      self.nonmatching_failed_subtests += 1
                      return
                  if len(self.records) >= MAX_RECORDS:
                      self._invalidate('record_limit')
                      self._write()
                      return
                  values = found.f_locals
                  if values.get('self') is not test:
                      raise ValueError('test_frame_identity')
                  decision = values['decision_result']
                  if not _typed(decision, 'LeadDecisionResult'):
                      raise TypeError('decision_type')
                  record = {'assertion_line': ASSERT_LINE,
                            'synthesis_utf8_bytes': len(values['message'].encode('utf-8')),
                            'decision': _enum(_get(decision, 'decision')),
                            'step_id': _token(_get(decision, 'step_id')),
                            'turn': _turn(_get(decision, 'turn')),
                            'history': _history(values['history']),
                            'fixture_counts': _queues(test)}
                  if len(json.dumps(record, ensure_ascii=True).encode('utf-8')) > 20000:
                      raise ValueError('record_size')
                  self.records.append(record)
                  self._write()

              def finalize(self, *, runner_returned):
                  try:
                      if self._installed:
                          if self._result_class.__dict__.get('addSubTest') is self._wrapper:
                              self._result_class.addSubTest = self._original
                          else:
                              self._invalidate('restore_conflict')
                  except BaseException:
                      self._invalidate('restore_error')
                  finally:
                      self._installed = False
                      self._runner_returned = runner_returned is True
                      self._finalized = True
                      self._write()

          output = Path(os.environ["RUNNER_TEMP"]) / "timing-diagnostic"
          output.mkdir(mode=0o700)
          paths = subprocess.check_output(["git", "ls-files", "-z", "src", "tests", "config", "pyproject.toml", "uv.lock"]).decode().split("\0")
          def hashes():
              return {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths if path}
          before = hashes()
          counts = collections.defaultdict(lambda: {"calls": 0, "seconds": 0.0})
          def record(key, elapsed):
              counts[key]["calls"] += 1
              counts[key]["seconds"] += elapsed
          original_git = process.GitProcessRunner.run
          @functools.wraps(original_git)
          def git(self, args, **kwargs):
              started = time.perf_counter()
              try:
                  return original_git(self, args, **kwargs)
              finally:
                  record("git:" + args[0], time.perf_counter() - started)
          process.GitProcessRunner.run = git
          original_refs = session_resources._Repository._loose_ref_output
          samples = []
          @functools.wraps(original_refs)
          def refs(self):
              started = time.perf_counter()
              value = original_refs(self)
              record("loose_refs:" + ("fallback" if value is None else "bytes"), time.perf_counter() - started)
              if len(samples) < 8:
                  with (self.common_git / "config").open("rb") as source:
                      config = source.read(65536)
                  safe = re.findall(rb"(?m)^\s*(?:repositoryformatversion|filemode|bare|logallrefupdates|objectformat|submodulepathconfig|relativeworktrees|worktreeconfig)\s*=\s*(?:true|false|0|1|sha1|sha256)\s*$", config)
                  samples.append({"fallback": value is None, "config_sha256": hashlib.sha256(config).hexdigest(), "format_lines": [line.decode("ascii").strip() for line in safe], "packed_refs": (self.common_git / "packed-refs").exists(), "reftable": (self.common_git / "reftable").exists()})
              return value
          session_resources._Repository._loose_ref_output = refs
          profile = cProfile.Profile()
          started = time.perf_counter()
          profile.enable()
          try:
              run_argv = ["run", "--id", os.environ["DIAGNOSTIC_TEST_ID"], "--json", str(output / "instrumented-run.json")]
              budget_observer = None
              runner_returned = False
              try:
                  if os.environ["DIAGNOSTIC_TEST_ID"] == CANONICAL_ID:
                      try:
                          budget_observer = BudgetSubtestObserver(
                              Path.cwd(), output / "budget-subtest-observation.private.json", run_argv)
                          budget_observer.install(runner.TimedTextTestResult)
                      except BaseException:
                          pass
                  code = runner.main(run_argv)
                  runner_returned = True
              finally:
                  if budget_observer is not None:
                      try:
                          budget_observer.finalize(runner_returned=runner_returned)
                      except BaseException:
                          pass
          finally:
              profile.disable()
              profile.dump_stats(str(output / "profile.pstats"))
              with (output / "profile.txt").open("w") as stream:
                  pstats.Stats(profile, stream=stream).strip_dirs().sort_stats("cumulative").print_stats(100)
              after = hashes()
              evidence = {"diagnostic_only": True, "source_valid": before == after, "source_before": before, "source_after": after, "instrumented_seconds": time.perf_counter() - started, "counts": dict(counts), "fixture_samples": samples, "platform": platform.platform(), "python": platform.python_version(), "cpu_count": os.cpu_count(), "git": subprocess.check_output(["git", "--version"], text=True).strip()}
              evidence.update(python_compiler=platform.python_compiler(), python_enable_optimizations_flag="--enable-optimizations" in (sysconfig.get_config_var("CONFIG_ARGS") or ""), temporary_filesystem=subprocess.check_output(["stat", "-f", "-c", "%T", tempfile.gettempdir()], text=True).strip())
              evidence.update(capture_checkout_head=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), github_event_sha=os.environ.get("GITHUB_SHA"), diagnostic_workflow_sha256=hashlib.sha256(Path(".github/workflows/pr-validation.yml").read_bytes()).hexdigest())
              observation_path = output / "budget-subtest-observation.private.json"
              if observation_path.is_file():
                  evidence["budget_subtest_observation_sha256"] = hashlib.sha256(observation_path.read_bytes()).hexdigest()
              (output / "counters.json").write_text(json.dumps(evidence, indent=2))
          raise SystemExit(code if before == after else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || steps.timing.outputs.selected == 'true')
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('timing-diagnostic-{0}-{1}', inputs.arch, inputs.scratch) || 'timing-diagnostic' }}
          path: ${{ runner.temp }}/timing-diagnostic
          if-no-files-found: error
      - name: Remove diagnostic scratch storage
        if: always() && steps.scratch.outputs.directory != ''
        env:
          SCRATCH: ${{ steps.scratch.outputs.directory }}
          MEMORY: ${{ inputs.scratch == 'memory' }}
        run: |
          if [[ "$MEMORY" == "true" ]] && mountpoint -q "$SCRATCH"; then
            sudo umount "$SCRATCH"
          fi
          rmdir "$SCRATCH"
