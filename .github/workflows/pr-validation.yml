{
  "name": "PR validation",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "issue-872-diagnosis-admission-split-profile-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "workflow-deadline": {
      "name": "Enforce 30-minute workflow limit",
      "if": "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "actions": "write"
      },
      "steps": [
        {
          "name": "Enforce total workflow deadline",
          "uses": "actions/github-script@v7",
          "with": {
            "retries": 0,
            "script": "const parameters = () => ({\n  ...context.repo,\n  run_id: context.runId,\n  request: {signal: AbortSignal.timeout(5000)},\n});\nconst attempt = Number(process.env.GITHUB_RUN_ATTEMPT);\nif (!Number.isSafeInteger(attempt) || attempt < 1) {\n  core.setFailed(\"Missing workflow attempt identity.\");\n  return;\n}\n// Metadata retries never grant a new test budget.\nconst metadataDeadline = Date.now() + 30_000;\nlet deadline;\nlet cancellationRequested = false;\nasync function currentRun() {\n  const {data: run} = await github.rest.actions.getWorkflowRun(parameters());\n  if (run.id !== context.runId || run.run_attempt !== attempt) {\n    core.setFailed(\"Workflow attempt changed; the stale guard cannot cancel it.\");\n    return null;\n  }\n  if (run.status === \"completed\") return null;\n  const created = Date.parse(run.created_at);\n  if (!Number.isFinite(created)) throw new Error(\"Missing workflow creation time.\");\n  const runDeadline = created + 30 * 60 * 1000;\n  deadline = deadline === undefined ? runDeadline : Math.min(deadline, runDeadline);\n  return run;\n}\nwhile (Date.now() < (deadline ?? metadataDeadline)) {\n  try {\n    if (!await currentRun()) return;\n    let complete;\n    try {\n      const {data: page} = await github.rest.actions.listJobsForWorkflowRunAttempt({\n        ...parameters(), attempt_number: attempt, per_page: 100,\n      });\n      if (!Number.isSafeInteger(page.total_count) || page.total_count > 100 ||\n          !Array.isArray(page.jobs) || page.total_count !== page.jobs.length) {\n        throw new Error(\"Cannot establish the complete validation job list.\");\n      }\n      // A marker covers downstream jobs absent from an earlier API snapshot.\n      complete = page.jobs.find(job => job.name === \"Validation jobs complete\");\n    } catch (error) {\n      // Job-list failures cannot prevent cancellation at the deadline.\n      core.warning(`Completion lookup failed: ${error.message}`);\n    }\n    if (Date.now() < deadline && complete?.status === \"completed\" &&\n        [\"success\", \"failure\"].includes(complete.conclusion)) {\n      core.info(\"All validation jobs finished within the workflow deadline.\");\n      return;\n    }\n    if (Date.now() >= deadline - 60_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; force-cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.request(\"POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel\", parameters());\n      return;\n    }\n    if (!cancellationRequested && Date.now() >= deadline - 90_000) {\n      core.setFailed(\"Workflow shutdown reserve reached; cancelling this run.\");\n      if (!await currentRun()) return;\n      await github.rest.actions.cancelWorkflowRun(parameters());\n      cancellationRequested = true;\n    }\n  } catch (error) {\n    core.warning(`Deadline control request failed: ${error.message}`);\n  }\n  const remaining = (deadline ?? metadataDeadline) - Date.now();\n  const poll = deadline !== undefined && remaining > 90_000 ? 30_000 : 5000;\n  if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(poll, remaining)));\n}\ncore.setFailed(\"Workflow deadline enforcement could not complete within its bounded window.\");\n"
          }
        }
      ]
    },
    "validation-complete": {
      "name": "Validation jobs complete",
      "needs": [
        "diagnosis-admission-split-profile"
      ],
      "if": "${{ !cancelled() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {},
      "steps": [
        {
          "name": "Mark validation jobs terminal",
          "timeout-minutes": 1,
          "run": "echo \"Validation jobs are terminal; their individual results remain authoritative.\""
        }
      ]
    },
    "diagnosis-admission-split-profile": {
      "name": "Compare repeated diagnostic validation",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "env": {
        "GIT_AUTHOR_NAME": "Story Tests",
        "GIT_AUTHOR_EMAIL": "story-tests@example.invalid",
        "GIT_COMMITTER_NAME": "Story Tests",
        "GIT_COMMITTER_EMAIL": "story-tests@example.invalid",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 4
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.2.0"
        },
        {
          "name": "Install locked environment",
          "timeout-minutes": 5,
          "run": "uv sync --locked --all-extras --python 3.11 --no-progress"
        },
        {
          "name": "Prepare source-pinned matched body benchmark",
          "timeout-minutes": 3,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\npython3 - <<'PY'\nimport base64,datetime,hashlib,json,os,pathlib,subprocess\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'diagnosis-admission-split-profile'\nout.mkdir()\nprobe=base64.b64decode('')\nassert hashlib.sha256(probe).hexdigest()=='466b50345c588ce790a07549b2dc812a11e68e07d77abe959be1bf40ed32f84d'\n(out/'probe.py').write_bytes(probe)\nconfig=json.loads(base64.b64decode(''))\nconfig['roots']={'reference':str(pathlib.Path(os.environ['RUNNER_TEMP'])/'factor-construction-reference'),'candidate':os.environ['GITHUB_WORKSPACE']}\nsubprocess.run(['git','worktree','add','--detach',config['roots']['reference'],config['sources']['reference']],check=True)\ncheckout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\nassert checkout==os.environ['GITHUB_SHA']\nparent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()\nassert parent==config['sources']['candidate']\nrequest=subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']],text=True,timeout=20)\nrun=json.loads(request)\nassert run['head_sha']==checkout and run['run_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])\ncreated=datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))\ndeadline=int(created.timestamp())+1800\nassert deadline-int(datetime.datetime.now(datetime.timezone.utc).timestamp())>330\nconfig['run_id']=run['id']; config['run_attempt']=run['run_attempt']; config['workflow_created_at']=run['created_at']; config['deadline_epoch']=deadline\nconfig['checkout_sha']=checkout\nconfig['checkout_root']=os.environ['GITHUB_WORKSPACE']\nconfig['checkout_tree']=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()\n(out/'config.json').write_text(json.dumps(config,indent=2,sort_keys=True)+'\\n')\n(out/'prepared.json').write_text(json.dumps({k:v for k,v in config.items() if k not in ['pins','roots']},indent=2)+'\\n')\nwith open(os.environ['GITHUB_ENV'],'a') as env:\n env.write('BENCHMARK_DEADLINE_EPOCH='+str(deadline)+'\\n')\n\nPY\n"
        },
        {
          "name": "Run one separate candidate profile",
          "timeout-minutes": 12,
          "run": "set -euo pipefail\ntest_seconds=$(( BENCHMARK_DEADLINE_EPOCH - $(date +%s) - 330 ))\nif (( test_seconds > 600 )); then test_seconds=600; fi\nif (( test_seconds <= 0 )); then echo \"No shared workflow budget remains\" >&2; exit 1; fi\nprintf '%s\n' \"$test_seconds\" > \"$RUNNER_TEMP/diagnosis-admission-split-profile/worker-budget-seconds.txt\"\nexport BENCHMARK_WORKER_SECONDS=\"$test_seconds\"\nset +e\ntimeout --signal=TERM --kill-after=30s \"${test_seconds}s\" .venv/bin/python \"$RUNNER_TEMP/diagnosis-admission-split-profile/probe.py\" --config \"$RUNNER_TEMP/diagnosis-admission-split-profile/config.json\" --output \"$RUNNER_TEMP/diagnosis-admission-split-profile/report.json\" 2>&1 | tee \"$RUNNER_TEMP/diagnosis-admission-split-profile/worker.log\"\nstatuses=(\"${PIPESTATUS[@]}\")\nstatus=${statuses[0]}\nif (( status == 0 && statuses[1] != 0 )); then status=${statuses[1]}; fi\nprintf '%s\n' \"$status\" > \"$RUNNER_TEMP/diagnosis-admission-split-profile/exit-code.txt\"\nexit \"$status\"\n"
        },
        {
          "name": "Upload matched body benchmark evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "with": {
            "name": "issue-872-diagnosis-admission-split-profile",
            "path": "${{ runner.temp }}/diagnosis-admission-split-profile",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
