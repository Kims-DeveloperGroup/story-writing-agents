030b91\"\n}\nOUTPUT = Path(os.environ.get(\"PROBE_OUTPUT\", \"front-neighbor-probe.json\")).resolve()\nPROFILE_DIR = Path(os.environ.get(\"PROBE_PROFILE_DIRECTORY\", str(OUTPUT.parent / \"front-neighbor-profiles\")))\nSTART = time.perf_counter()\nREPORT = {\n    \"diagnostic_only\": True,\n    \"kind\": \"front-neighbor-validation-probe\",\n    \"reference_source\": REFERENCE_SOURCE,\n    \"canonical_test_executed\": False,\n    \"canonical_pass_credit\": False,\n    \"target_seconds\": 600,\n    \"independent_parent_deadline_seconds\": 900,\n    \"parent_kill_grace_seconds\": 30,\n    \"job_maximum_seconds\": 2400,\n    \"complete\": False,\n    \"outcome\": \"running\",\n    \"setup\": [],\n    \"lanes\": [],\n    \"limitations\": [\n        \"A dependency-closed fixture slice, not the canonical front method or a full-suite run.\",\n        \"cProfile is enabled separately around validation operations only; measured times include its overhead.\",\n        \"No whole-front, whole-class, six-hour or forty-minute fit claim.\",\n        \"Parent deadline, termination handling and partial-artifact retention are external requirements.\",\n    ],\n}\n\n\ndef flush():\n    OUTPUT.parent.mkdir(parents=True, exist_ok=True)\n    temporary = OUTPUT.with_name(OUTPUT.name + \".partial\")\n    with temporary.open(\"w\", encoding=\"utf-8\") as stream:\n        json.dump(REPORT, stream, indent=2, ensure_ascii=True, allow_nan=False)\n        stream.write(\"\\n\")\n        stream.flush()\n        os.fsync(stream.fileno())\n    os.replace(temporary, OUTPUT)\n    print(json.dumps({\"diagnostic_only\": True, \"active_stage\": REPORT.get(\"active_stage\", \"not_started\"),\n                      \"elapsed_seconds\": time.perf_counter() - START, \"lanes_recorded\": len(REPORT[\"lanes\"])}),\n          flush=True)\n\n\ndef start_stage(name):\n    REPORT[\"active_stage\"] = name\n    started = time.perf_counter()\n    REPORT[\"setup\"].append({\"name\": name, \"state\": \"started\", \"since_start_seconds\": started - START})\n    flush()\n    return started\n\n\ndef finish_stage(name, started, **details):\n    REPORT[\"setup\"].append({\n        \"name\": name, \"state\": \"completed\", \"seconds\": time.perf_counter() - started, **details\n    })\n    flush()\n\n\ndef describe_error(error):\n    return {\n        \"type\": type(error).__name__,\n        \"message\": str(error)[:1600],\n        \"frames\": [\n            {\"file\": item.filename, \"line\": item.lineno, \"function\": item.name}\n            for item in traceback.extract_tb(error.__traceback__)[-4:]\n        ],\n    }\n\n\ndef run_lane(lane, input_name, operation):\n    row = {\"lane\": lane, \"input\": input_name, \"state\": \"started\"}\n    REPORT[\"lanes\"].append(row)\n    REPORT[\"active_stage\"] = lane + \":\" + input_name\n    flush()\n    profiler = cProfile.Profile()\n    wall_started, cpu_started = time.perf_counter(), time.process_time()\n    result = None\n    try:\n        profiler.enable()\n        result = operation()\n        row.update(state=\"completed\", outcome=\"expected\")\n    except Exception as error:\n        row.update(state=\"completed\", outcome=\"unexpected\", error=describe_error(error))\n    finally:\n        profiler.disable()\n        row[\"wall_seconds\"] = time.perf_counter() - wall_started\n        row[\"cpu_seconds\"] = time.process_time() - cpu_started\n        PROFILE_DIR.mkdir(parents=True, exist_ok=True)\n        stem = lane + \"-\" + input_name\n        binary = PROFILE_DIR / (stem + \".pstats\")\n        text = PROFILE_DIR / (stem + \".txt\")\n        profiler.dump_stats(str(binary))\n        stream = io.StringIO()\n        stats = pstats.Stats(profiler, stream=stream).sort_stats(\"cumulative\")\n        stats.print_stats(60)\n        text.write_text(stream.getvalue(), encoding=\"utf-8\")\n        row[\"profile\"] = {\"pstats\": str(binary), \"text\": str(text), \"total_calls\": stats.total_calls,\n                          \"primitive_calls\": stats.prim_calls, \"total_internal_seconds\": stats.total_tt}\n        if result is not None:\n            row[\"observation\"] = result\n        flush()\n    return row[\"outcome\"] == \"expected\"\n\n\n_CONSTRUCTION_CAPS = {\n    'retained_key_bytes_per_offer': 33554432, 'distinct_keys_per_offer': 100000,\n    'offers': 64, 'compilers': 2048, 'queries': 200000, 'active_frames': 128,\n    'ancestor_depth': 256, 'observer_seconds': 600, 'examples': 8,\n    'output_bytes': 2097152,\n}\n\n\nclass _ConstructionCostObservation:\n    \"\"\"Observe completed private compiler products; never evaluate a graph or replace a helper.\"\"\"\n\n    def __init__(self, module):\n        import threading\n        import types\n        self.module = module\n        self.thread_id = threading.get_ident()\n        self.thread_get_ident = threading.get_ident\n        self.functions = {\n            'offer': module.LeadProviderConstraints.current_wire_variants,\n            'compiler': module._compile_closed_choices,\n            'factor': module.factor_rule_schema,\n            'project': module.project_lead_scope_schema,\n        }\n        if any(type(value) is not types.FunctionType for value in self.functions.values()):\n            raise RuntimeError('construction observation requires exact function objects')\n        self.codes = {name: value.__code__ for name, value in self.functions.items()}\n        candidates = [value for value in self.codes['compiler'].co_consts\n                      if type(value) is types.CodeType and value.co_name == 'final_cost']\n        if len(candidates) != 1 or candidates[0].co_qualname != '_compile_closed_choices.<locals>.final_cost':\n            raise RuntimeError('construction observation could not pin unique final_cost code')\n        if candidates[0].co_firstlineno != 727:\n            raise RuntimeError('construction observation final_cost source location changed')\n        self.codes['query'] = candidates[0]\n        self.offer = self.compiler = self.query = None\n        self.pipeline_frames = {}\n        self.next_offer = self.next_compiler = self.next_query = 0\n        self.started = None\n        self.previous_profile = None\n        self.installed = False\n        self.failed = False\n        self.callback_seconds = 0.0\n        self.payload = {\n            'diagnostic_only': True, 'complete': False, 'scope': 'existing free-owner for_offer only',\n            'caps': dict(_CONSTRUCTION_CAPS), 'offers': [], 'compilers': [], 'incomplete_reason': None,\n            'counts': {'offer_calls': 0, 'compiler_calls': 0, 'query_calls': 0, 'completed_queries': 0,\n                       'eligible_returns': 0, 'local_hits': 0, 'computed_returns': 0,\n                       'first_query_cross_compiler_equal_cost_misses': 0, 'same_key_cost_conflicts': 0,\n                       'unsupported_key_none': 0, 'exceptional_or_unknown_returns': 0,\n                       'factor_pipeline_calls': 0, 'project_pipeline_calls': 0,\n                       'factor_pipeline_returns': 0, 'project_pipeline_returns': 0,\n                       'out_of_query_factor_calls': 0, 'out_of_query_project_calls': 0},\n            'examples': [], 'initial_lead_attribution': 'out_of_scope',\n            'limits': [\n                'Exact completed-key overlap within one current_wire_variants invocation only.',\n                'No schema recomputation, helper replacement, exception caching or cross-offer key retention.',\n                'Observer timing includes profile-dispatch overhead and is not ordinary runtime timing.',\n                'Nested inclusive intervals overlap and must not be summed as independent work.',\n                'Key equality proves only observed complete serialized equality, never production memo safety.',\n                'No canonical test pass or forty-minute full-test/class/job fit follows.',\n            ],\n        }\n        REPORT['construction_cost_observation'] = self.payload\n\n    def _require(self, condition, reason):\n        if not condition:\n            raise RuntimeError(reason)\n\n    def _pin_check(self):\n        current = {'offer': self.module.LeadProviderConstraints.current_wire_variants,\n                   'compiler': self.module._compile_closed_choices,\n                   'factor': self.module.factor_rule_schema,\n                   'project': self.module.project_lead_scope_schema}\n        self._require(all(current[name] is value and value.__code__ is self.codes[name]\n                          for name, value in self.functions.items()), 'pinned implementation reference changed')\n        self._require(any(value is self.codes['query'] for value in self.codes['compiler'].co_consts),\n                      'pinned final_cost code no longer belongs to compiler')\n\n    def _under(self, frame, ancestor):\n        current = frame.f_back\n        for _ in range(_CONSTRUCTION_CAPS['ancestor_depth']):\n            if current is ancestor:\n                return True\n            if current is None:\n                return False\n            current = current.f_back\n        raise RuntimeError('ancestor frame budget exceeded')\n\n    def _active_frame_count(self):\n        return int(self.offer is not None) + int(self.compiler is not None) + int(self.query is not None) + len(self.pipeline_frames)\n\n    def _progress(self, boundary='started'):\n        self.payload['handled_callback_seconds_so_far'] = self.callback_seconds\n        self.payload['handled_callback_time_limit'] = 'Excludes ignored dispatch events and current progress-write time.'\n        self.payload['elapsed_observed_for_offer_seconds'] = time.perf_counter() - self.started\n        self._require(len(json.dumps(self.payload, separators=(',', ':')).encode('utf-8')) <= _CONSTRUCTION_CAPS['output_bytes'],\n                      'observation output budget exceeded')\n        progress = {\n            'diagnostic_only': True, 'boundary': boundary,\n            'elapsed_seconds': self.payload['elapsed_observed_for_offer_seconds'],\n            'counts': dict(self.payload['counts']),\n        }\n        if boundary == 'compiler_return':\n            progress['completed_compiler'] = self.payload['compilers'][-1]\n        if boundary == 'offer_return':\n            progress['completed_offer'] = self.payload['offers'][-1]\n        progress_path = OUTPUT.with_name(OUTPUT.stem + '.construction-progress.jsonl')\n        self.payload['progress_jsonl'] = str(progress_path)\n        with progress_path.open('a', encoding='utf-8') as stream:\n            stream.write(json.dumps(progress, separators=(',', ':')) + '\\n')\n            stream.flush()\n        print(json.dumps({'construction_boundary': boundary,\n                          'compilers_completed': len(self.payload['compilers']),\n                          'queries_completed': self.payload['counts']['completed_queries']}), flush=True)\n        if boundary in ('started', 'offer_return'):\n            flush()\n\n    def _fail(self, reason):\n        self.failed = True\n        self.payload['complete'] = False\n        self.payload['incomplete_reason'] = reason[:700]\n        self.payload['active_at_stop'] = {\n            'offer_ordinal': None if self.offer is None else self.offer['ordinal'],\n            'compiler_ordinal': None if self.compiler is None else self.compiler['ordinal'],\n            'query_ordinal': None if self.query is None else self.query['ordinal'],\n        }\n        if self.offer is not None:\n            self.payload['active_offer_counts_at_stop'] = dict(self.offer['summary'])\n            self.offer['keys'].clear()\n        if self.compiler is not None:\n            self.payload['active_compiler_counts_at_stop'] = dict(self.compiler['summary'])\n        self.offer = self.compiler = self.query = None\n        self.pipeline_frames.clear()\n        self.payload['retained_live_frames_after_failure'] = 0\n        self.payload['retained_exact_keys_after_failure'] = 0\n        # Do not let an observation error replace application behavior.\n        try:\n            if len(json.dumps(self.payload, separators=(',', ':')).encode('utf-8')) > _CONSTRUCTION_CAPS['output_bytes']:\n                self.payload['details_omitted_due_output_cap'] = True\n                self.payload['offers'] = []\n                self.payload['compilers'] = []\n            flush()\n        except Exception:\n            pass\n\n    def __enter__(self):\n        self.started = time.perf_counter()\n        self.previous_profile = sys.getprofile()\n        try:\n            self._require(self.previous_profile is None, 'profiling slot already occupied')\n            self._pin_check()\n            self._progress()\n            self.installed = True\n            sys.setprofile(self._observe)\n        except Exception as error:\n            self._fail(type(error).__name__ + ': ' + str(error))\n        return self\n\n    def __exit__(self, error_type, error, traceback_value):\n        elapsed = time.perf_counter() - self.started\n        try:\n            self._pin_check()\n            self._require(error_type is None, 'observed for_offer raised an exception')\n            self._require(not self.failed, self.payload['incomplete_reason'] or 'observation stopped')\n            self._require(self._active_frame_count() == 0, 'unclosed observed frames')\n            self._require(self.payload['counts']['offer_calls'] > 0 and self.payload['counts']['compiler_calls'] > 0,\n                          'required offer/compiler scope was not observed')\n            self._require(self.payload['counts']['query_calls'] > 0, 'no final_cost query was observed')\n            self._require(self.payload['counts']['completed_queries'] == self.payload['counts']['query_calls'],\n                          'query completion census is incomplete')\n            self.payload['complete'] = True\n        except Exception as observation_error:\n            if not self.failed:\n                self._fail(type(observation_error).__name__ + ': ' + str(observation_error))\n        finally:\n            if self.installed:\n                sys.setprofile(self.previous_profile)\n                self.installed = False\n            self.payload['observed_for_offer_seconds'] = elapsed\n            self.payload['handled_callback_seconds'] = self.callback_seconds\n            # Release every live frame and exact-key table, including incomplete scopes.\n            self.offer = self.compiler = self.query = None\n            self.pipeline_frames.clear()\n            self.payload['retained_live_frames_after_cleanup'] = 0\n            self.payload['retained_exact_keys_after_cleanup'] = 0\n            flush()\n        return False\n\n    def _observe(self, frame, event, returned):\n        if self.failed or event not in ('call', 'return'):\n            return\n        code = frame.f_code\n        kind = ('offer' if code is self.codes['offer'] else 'compiler' if code is self.codes['compiler']\n                else 'query' if code is self.codes['query'] else 'factor' if code is self.codes['factor']\n                else 'project' if code is self.codes['project'] else None)\n        if kind is None:\n            return\n        entered = time.perf_counter()\n        try:\n            self._require(self.thread_get_ident() == self.thread_id, 'cross-thread observation')\n            self._require(entered - self.started <= _CONSTRUCTION_CAPS['observer_seconds'], 'observation time cap')\n            self._require(self._active_frame_count() < _CONSTRUCTION_CAPS['active_frames'], 'active frame cap')\n            if kind == 'offer':\n                self._offer_event(frame, event, returned, entered)\n            elif kind == 'compiler':\n                self._compiler_event(frame, event, returned, entered)\n            elif kind == 'query':\n                self._query_event(frame, event, returned, entered)\n            else:\n                self._pipeline_event(kind, frame, event, returned, entered)\n        except Exception as error:\n            self._fail(type(error).__name__ + ': ' + str(error))\n        finally:\n            self.callback_seconds += time.perf_counter() - entered\n\n    def _offer_event(self, frame, event, returned, now):\n        if event == 'call':\n            self._require(self.offer is None, 'reentrant current_wire_variants scope')\n            self._require(self.next_offer < _CONSTRUCTION_CAPS['offers'], 'offer cap')\n            ordinal = self.next_offer\n            self.next_offer += 1\n            self.offer = {'frame': frame, 'ordinal': ordinal, 'started': now, 'keys': {}, 'key_bytes': 0,\n                          'summary': {'ordinal': ordinal, 'compiler_calls': 0, 'completed_queries': 0,\n                                      'distinct_exact_keys': 0, 'local_hits': 0, 'computed_returns': 0,\n                                      'first_query_cross_compiler_equal_cost_misses': 0,\n                                      'same_key_cost_conflicts': 0, 'retained_key_bytes_peak': 0}}\n            self.payload['counts']['offer_calls'] += 1\n        else:\n            self._require(self.offer is not None and self.offer['frame'] is frame, 'unmatched offer return')\n            self._require(type(returned) is tuple and self.compiler is None and self.query is None,\n                          'exceptional or unclosed offer return')\n            row = self.offer['summary']\n            row['inclusive_seconds'] = now - self.offer['started']\n            self.payload['offers'].append(row)\n            self.offer['keys'].clear()\n            self.offer = None\n            self._progress('offer_return')\n\n    def _compiler_event(self, frame, event, returned, now):\n        if event == 'call':\n            self._require(self.offer is not None and self._under(frame, self.offer['frame']), 'compiler outside exact offer scope')\n            self._require(self.compiler is None, 'reentrant compiler')\n            self._require(self.next_compiler < 