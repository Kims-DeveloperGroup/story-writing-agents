[project]
name = "story-writing-agents"
version = "0.1.0"
description = "A provider-neutral multi-agent runtime for long-form story writing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rag = [
    "generic-rag @ git+https://github.com/Kims-DeveloperGroup/generic-rag.git@c77456321c614518e420e45c033e3f71dc5363b8",
]
viewer = [
    "jsonl-viewer @ git+https://github.com/Kims-DeveloperGroup/jsonl-viewer.git@5d3047aa86212810d867d5b40cb1df3262f1810f",
]

[project.scripts]
story-writing-agents = "story_writing_agents.cli:main"
story = "story_writing_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
