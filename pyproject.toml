[project]
name = "story-writing-agents"
version = "0.1.0"
description = "A provider-neutral multi-agent runtime for long-form story writing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=4.2,<5",
    "jsonl-viewer @ git+https://github.com/Kims-DeveloperGroup/jsonl-viewer.git@a38a975eda4123df11c1fa4f796fd49ab88efcee",
]

[project.optional-dependencies]
rag = [
    "generic-rag @ git+https://github.com/Kims-DeveloperGroup/generic-rag.git@c77456321c614518e420e45c033e3f71dc5363b8",
]
viewer = []

[project.scripts]
story-writing-agents = "story_writing_agents.cli:main"
story = "story_writing_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[dependency-groups]

test = ["setuptools>=84.2.1,<85"]


[tool.uv]

default-groups = ["test"]
